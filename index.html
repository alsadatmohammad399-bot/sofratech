<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablia OS 2030 | المنصة السحابية المتكاملة للمطاعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(0, 0, 0, 0.06); }
    </style>
</head>
<body class="antialiased min-h-screen pb-28 selection:bg-red-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        const PLATFORM_OWNER = { walletNumber: '01015861991', monthlyPrice: 600, adminPass: '357159' };

        let globalDB = { restaurants: {} };
        try {
            const raw = localStorage.getItem('tablia_multitenant_2030_v22');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        if (!globalDB || !globalDB.restaurants || typeof globalDB.restaurants !== 'object') {
            globalDB = {
                restaurants: {
                    "rest_demo": {
                        id: "rest_demo", ownerName: "محمد الحاتي", name: "دليكاتسي وريستو", phone: "01015861991", pass: "1234",
                        template_id: "foodera-modern", layout: "foodera", theme: { primary: "#dc2626", bg: "#f8fafc" }, tablesCount: 20,
                        address: "الإسكندرية، ميامي", wifiName: "Delicacy_Free", wifiPass: "20302030",
                        subscription: { isActive: true, expiresAt: Date.now() + 30*24*60*60*1000 },
                        categories: [
                            { id: 'cat_1', name: 'فطار وسندوتشات', icon: '🍳' },
                            { id: 'cat_2', name: 'المشويات', icon: '🥩' },
                            { id: 'cat_3', name: 'المقبلات', icon: '🥗' }
                        ],
                        menu_items: [
                            { id: 'itm_1', category_id: 'cat_1', name: 'طبق تورينو المميز', description: 'بيض أو فول بالخلطة، فلافل، جبنة قريش، زبدة فلاحي', price: 125, image: 'https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=500', is_available: true, discount: '20%' },
                            { id: 'itm_2', category_id: 'cat_2', name: 'كيلو كباب وكفتة', description: 'لحم بلدي مشوي عالفحم على طريقتنا الخاصة', price: 680, image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500', is_available: true, discount: '' }
                        ],
                        orders: []
                    }
                }
            };
        }

        const TEMPLATES_CATALOG = [
            { id: 'foodera-modern', name: 'استايل دليكاتسي الفخم (Delicacy)', layout: 'foodera', desc: 'تصميم احترافي ببانر علوي، قائمة جانبية، وأقسام دائرية', preview: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500', themeBg: '#f8fafc', primary: '#dc2626' }
        ];

        function syncCloud() {
            try {
                localStorage.setItem('tablia_multitenant_2030_v22', JSON.stringify(globalDB));
                if (cloudDB) {
                    cloudDB.ref('tablia_multitenant_enterprise_2030_v22').set(globalDB).catch(() => {});
                }
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_multitenant_enterprise_2030_v22').on('value', (snap) => {
                const data = snap.val();
                if (data && data.restaurants) {
                    globalDB = data;
                    try {
                        localStorage.setItem('tablia_multitenant_2030_v22', JSON.stringify(globalDB));
                    } catch(e){}
                    playBell();
                    render();
                }
            });
        }

        function playBell(){
            try {
                const a = document.getElementById('cloud-bell');
                if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
                if('vibrate' in navigator) navigator.vibrate([400, 200, 400]);
            } catch(e){}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isCustomerMode = urlParams.get('view') === 'menu';
        const targetRestSlug = urlParams.get('rest');
        
        let currentRestId = localStorage.getItem('tablia_logged_rest_id') || null;
        if (currentRestId && (!globalDB.restaurants || !globalDB.restaurants[currentRestId])) {
            localStorage.removeItem('tablia_logged_rest_id');
            currentRestId = null;
        }

        const appState = { 
            page: isCustomerMode ? 'storefront' : (currentRestId ? 'builder' : 'auth'), 
            authTab: 'login', 
            builderStep: 1, 
            activeCat: 'all', 
            search: '', 
            cart: [], 
            cartOpen: false, 
            tableNumber: urlParams.get('t')||null, 
            activeOrderId: localStorage.getItem('tablia_active_order_id')||null, 
            trackerOpen: false, 
            adminUnlocked: false,
            editingItemId: null,
            drawerOpen: false,
            modalType: null,
            gpsLocation: null
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isCustomerMode) {
                    content = renderStorefront();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) {
                        currentRestId = null;
                        localStorage.removeItem('tablia_logged_rest_id');
                        appState.page = 'auth';
                        content = renderAuthScreen();
                    } else if(appState.page === 'builder') {
                        content = renderBuilder();
                    } else if(appState.page === 'cashier') {
                        content = renderCashier();
                    } else if(appState.page === 'dashboard') {
                        content = renderDashboard();
                    } else if(appState.page === 'qr_print') {
                        content = renderQRPrint();
                    } else {
                        content = renderBuilder();
                    }
                }
                
                const bottomBar = (isCustomerMode || !currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) ? '' : renderBottomNav();
                root.innerHTML = content + bottomBar;
            } catch(err) {
                console.error("Render error:", err);
                root.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6 text-center bg-slate-950 text-white"><div class="glass p-6 rounded-3xl space-y-4 max-w-sm"><h2 class="text-amber-400 font-black text-base">إعادة تشغيل النظام</h2><p class="text-xs text-slate-400">تم تحديث النظام ليعمل بكفاءة عالية وبدون أي أخطاء.</p><button onclick="localStorage.clear(); location.reload();" class="w-full bg-red-600 text-white font-black py-3 rounded-xl text-xs">تحديث وتشغيل فوري</button></div></div>`;
            }
        }

        function renderNav(){
            const rest = (currentRestId && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null;
            return `<nav class="sticky top-0 z-50 bg-white shadow-sm border-b border-slate-200 px-4 py-3"><div class="max-w-4xl mx-auto flex justify-between items-center"><div class="flex gap-2 items-center cursor-pointer" onclick="setPage(currentRestId?'builder':'auth')"><div class="w-10 h-10 rounded-2xl bg-red-600 text-white flex items-center justify-center font-black shadow-md">ط</div><div><span class="font-black text-slate-900 text-sm">Tablia <span class="text-red-600">OS</span></span></div></div>${rest?`<button onclick="currentRestId=null; localStorage.removeItem('tablia_logged_rest_id'); setPage('auth');" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-100 transition">خروج</button>`:''}</div></nav>`;
        }

        function renderBottomNav(){
            if(!currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) return '';
            return `<div class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-slate-200 px-2 py-2 shadow-lg"><div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center"><button onclick="setPage('builder')" class="flex flex-col items-center py-1.5 rounded-xl transition ${appState.page==='builder'?'text-red-600 font-black bg-red-50':'text-slate-500 hover:text-slate-900'}"><i class="fa-solid fa-wand-magic-sparkles text-sm mb-0.5"></i><span class="text-[10px]">المنشئ</span></button><button onclick="setPage('cashier')" class="flex flex-col items-center py-1.5 rounded-xl transition ${appState.page==='cashier'?'text-red-600 font-black bg-red-50':'text-slate-500 hover:text-slate-900'}"><i class="fa-solid fa-cash-register text-sm mb-0.5"></i><span class="text-[10px]">الكاشير</span></button><button onclick="setPage('dashboard')" class="flex flex-col items-center py-1.5 rounded-xl transition ${appState.page==='dashboard'?'text-red-600 font-black bg-red-50':'text-slate-500 hover:text-slate-900'}"><i class="fa-solid fa-chart-line text-sm mb-0.5"></i><span class="text-[10px]">الباقات</span></button><button onclick="setPage('qr_print')" class="flex flex-col items-center py-1.5 rounded-xl transition ${appState.page==='qr_print'?'text-red-600 font-black bg-red-50':'text-slate-500 hover:text-slate-900'}"><i class="fa-solid fa-qrcode text-sm mb-0.5"></i><span class="text-[10px]">QR</span></button></div></div>`;
        }

        function renderAuthScreen(){
            return `${renderNav()}
            <div class="max-w-md mx-auto px-4 py-12 space-y-6">
                <div class="text-center space-y-2">
                    <h1 class="text-2xl font-black text-slate-900">منصة مطاعم المستقبل</h1>
                    <p class="text-xs text-slate-500">أنشئ منيو مطعمك باحترافية كاملة وتتبع دقيق للـ GPS</p>
                </div>
                <div class="flex bg-slate-100 p-1.5 rounded-2xl text-xs border border-slate-200">
                    <button onclick="appState.authTab='login'; render();" class="flex-1 py-3 rounded-xl font-bold transition ${appState.authTab==='login'?'bg-red-600 text-white font-black shadow':'text-slate-500 hover:text-slate-900'}">تسجيل دخول</button>
                    <button onclick="appState.authTab='register'; render();" class="flex-1 py-3 rounded-xl font-bold transition ${appState.authTab==='register'?'bg-red-600 text-white font-black shadow':'text-slate-500 hover:text-slate-900'}">مطعم جديد</button>
                </div>
                ${appState.authTab==='login' ? `
                    <div class="bg-white p-6 rounded-3xl space-y-4 text-xs border border-slate-200 shadow-xl">
                        <div>
                            <label class="block text-slate-600 mb-1 font-bold">رقم الموبايل</label>
                            <input id="log_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-bold">كلمة السر</label>
                            <input id="log_pass" type="password" placeholder="••••" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                        <button onclick="handleLogin()" class="w-full bg-red-600 text-white font-black py-3.5 rounded-xl shadow-lg hover:bg-red-700 transition">دخول لوحة التحكم</button>
                    </div>
                ` : `
                    <div class="bg-white p-6 rounded-3xl space-y-4 text-xs border border-slate-200 shadow-xl">
                        <div>
                            <label class="block text-slate-600 mb-1 font-bold">اسمك الكريم</label>
                            <input id="reg_owner" placeholder="محمد علي" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-bold">اسم المطعم</label>
                            <input id="reg_name" placeholder="مطعم البرنس" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-bold">رقم الموبايل</label>
                            <input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-bold">كلمة السر</label>
                            <input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                        <button onclick="handleRegister()" class="w-full bg-red-600 text-white font-black py-3.5 rounded-xl shadow-lg hover:bg-red-700 transition">إنشاء المطعم الآن</button>
                    </div>
                `}
            </div>`;
        }

        function handleLogin(){
            const phone = document.getElementById('log_phone').value.trim(); 
            const pass = document.getElementById('log_pass').value.trim();
            if(!phone || !pass) { alert('يرجى إدخال رقم الموبايل وكلمة السر'); return; }

            if(cloudDB) {
                cloudDB.ref('tablia_multitenant_enterprise_2030_v22').once('value').then(snap => {
                    const data = snap.val();
                    if(data && data.restaurants) {
                        globalDB = data;
                        localStorage.setItem('tablia_multitenant_2030_v22', JSON.stringify(globalDB));
                    }
                    verifyLoginData(phone, pass);
                }).catch(() => { verifyLoginData(phone, pass); });
            } else {
                verifyLoginData(phone, pass);
            }
        }

        function verifyLoginData(phone, pass) {
            let found = false;
            if(globalDB && globalDB.restaurants) {
                for(let id in globalDB.restaurants){ 
                    if(globalDB.restaurants[id].phone === phone && globalDB.restaurants[id].pass === pass){ 
                        currentRestId = id; 
                        localStorage.setItem('tablia_logged_rest_id', id); 
                        found = true;
                        setPage('builder'); 
                        break;
                    } 
                }
            }
            if(!found) {
                alert('بيانات الدخول غير صحيحة. تأكد من رقم الموبايل وكلمة السر.');
            }
        }

        function handleRegister(){
            const owner = document.getElementById('reg_owner').value.trim(); 
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            if(!owner || !name || !phone || !pass){ alert('يرجى استكمال البيانات'); return; }
            const restId = 'rest_' + Date.now();
            if(!globalDB.restaurants) globalDB.restaurants = {};
            globalDB.restaurants[restId] = { 
                id: restId, ownerName: owner, name: name, phone: phone, pass: pass, 
                template_id: 'foodera-modern', layout: 'foodera', theme: { primary: '#dc2626', bg: '#f8fafc' }, tablesCount: 20, 
                address: 'الإسكندرية، ميامي', wifiName: name + '_Free', wifiPass: '20302030',
                subscription: { isActive: true, expiresAt: Date.now() + 30*24*60*60*1000 }, 
                categories: [
                    { id: 'cat_1', name: 'الرئيسية', icon: '🍔' },
                    { id: 'cat_2', name: 'المشويات', icon: '🥩' }
                ], 
                menu_items: [], 
                orders: [] 
            };
            syncCloud(); 
            currentRestId = restId; 
            localStorage.setItem('tablia_logged_rest_id', restId); 
            setPage('builder');
        }

        function renderBuilder(){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null;
            if(!rest){ setPage('auth'); return ''; }
            const selectedTpl = TEMPLATES_CATALOG.find(t => t.id === rest.template_id) || TEMPLATES_CATALOG[0];
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-5">
                    <div class="flex gap-1.5 bg-white p-1.5 rounded-2xl text-xs border border-slate-200 shadow-sm">
                        <button onclick="appState.builderStep=1; render();" class="flex-1 py-2.5 rounded-xl transition ${appState.builderStep===1?'bg-red-600 text-white font-black shadow':'text-slate-600 hover:text-slate-900'}">1. بيانات وقالب المطعم</button>
                        <button onclick="appState.builderStep=2; render();" class="flex-1 py-2.5 rounded-xl transition ${appState.builderStep===2?'bg-red-600 text-white font-black shadow':'text-slate-600 hover:text-slate-900'}">2. الأقسام والوجبات</button>
                        <button onclick="appState.builderStep=4; render();" class="flex-1 py-2.5 rounded-xl transition ${appState.builderStep===4?'bg-red-600 text-white font-black shadow':'text-slate-600 hover:text-slate-900'}">3. المعاينة ونشر اللينك</button>
                    </div>
                    ${appState.builderStep===1 ? renderStep1(rest, selectedTpl) : (appState.builderStep===2 ? renderStep2(rest) : renderStep4(rest))}
                </div>
            `;
        }

        function renderStep1(rest, selectedTpl){
            return `
                <div class="bg-white p-6 rounded-3xl space-y-5 text-xs border border-slate-200 shadow-xl">
                    <h2 class="font-black text-slate-900 text-sm">الخطوة 1: تخصيص اسم المطعم، العنوان، الواي فاي، وكلمة السر</h2>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-600 font-bold mb-1.5">اسم المطعم</label>
                            <input id="r_name" value="${rest.name || ''}" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-600 font-bold mb-1.5">العنوان (المدينة، المنطقة)</label>
                            <input id="r_address" value="${rest.address || 'الإسكندرية، ميامي'}" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-600 font-bold mb-1.5">اسم شبكة الواي فاي</label>
                            <input id="r_wifi" value="${rest.wifiName || 'Free_WiFi'}" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-600 font-bold mb-1.5">كلمة مرور الواي فاي</label>
                            <input id="r_wifipass" value="${rest.wifiPass || '12345678'}" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-slate-600 font-bold mb-1.5">كلمة السر الجديدة لدخول لوحة التحكم</label>
                            <input id="r_new_pass" type="password" placeholder="أدخل كلمة السر الجديدة" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                        </div>
                    </div>

                    <button onclick="saveStep1()" class="bg-red-600 text-white font-black px-5 py-3.5 rounded-xl w-full text-xs shadow-lg hover:bg-red-700 transition">حفظ والانتقال للمنيو ➔</button>
                </div>
            `;
        }

        function saveStep1(){ 
            const nameInput = document.getElementById('r_name');
            const addrInput = document.getElementById('r_address');
            const wifiInput = document.getElementById('r_wifi');
            const wifipassInput = document.getElementById('r_wifipass');
            const passInput = document.getElementById('r_new_pass');

            const r = globalDB.restaurants[currentRestId];
            if(nameInput) r.name = nameInput.value.trim();
            if(addrInput) r.address = addrInput.value.trim();
            if(wifiInput) r.wifiName = wifiInput.value.trim();
            if(wifipassInput) r.wifiPass = wifipassInput.value.trim();
            if(passInput && passInput.value.trim() !== '') {
                r.pass = passInput.value.trim();
                alert('تم تحديث كلمة السر بنجاح!');
            }
            syncCloud(); 
            appState.builderStep = 2; 
            render(); 
        }

        function renderStep2(rest){
            if(!rest.menu_items) rest.menu_items = [];
            if(!rest.categories) rest.categories = [{id:'cat_1', name:'الرئيسية', icon:'🍔'}];

            return `
                <div class="bg-white p-6 rounded-3xl space-y-5 text-xs border border-slate-200 shadow-xl">
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-slate-900 text-sm">إدارة الأقسام والوجبات</h3>
                            <button onclick="addCategoryPrompt()" class="bg-red-50 text-red-600 font-black px-3 py-1.5 rounded-xl hover:bg-red-100 transition">+ إضافة قسم جديد</button>
                        </div>
                        <div class="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">
                            ${rest.categories.map(c=>`
                                <div class="bg-slate-50 border border-slate-200 px-3.5 py-2 rounded-xl flex items-center gap-2 shrink-0 shadow-sm">
                                    <span>${c.icon || '🍽️'}</span>
                                    <span class="font-bold text-slate-900">${c.name}</span>
                                    <button onclick="deleteCategory('${c.id}')" class="text-red-500 hover:text-red-700 ml-1"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-red-50 border border-red-200 p-4 rounded-2xl space-y-3">

            const rest = globalDB.restaurants[currentRestId];

            text.split(/,|\n/).forEach(line => {

                const price = Number(m[0]); 
                const name = line.replace(m[0],'').replace(/ج/g,'').replace(/جنيه/g,'').trim();
                if(name) {

                                        </div>
                                        <div class="flex justify-between items-center pt-1 border-t border-slate-100">
                                            <span class="text-red-600 font-black text-xs">${item.price} ج.م</span>
                                            <button onclick="addToCart('${item.id}')" class="px-3.5 py-2 text-xs font-black text-white rounded-xl shadow hover:bg-red-700 transition bg-red-600">+ أضف</button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${cartCount > 0 ? `
                        <div class="fixed bottom-5 left-4 right-4 max-w-md mx-auto z-40">
                            <button onclick="appState.cartOpen=true; render();" class="w-full py-3.5 px-5 rounded-2xl bg-slate-900 text-white font-black flex justify-between text-xs shadow-2xl items-center">
                                <span>🛒 إتمام الطلب (${cartCount} وجبات)</span>
                                <span class="text-sm font-black text-amber-400">${cartTotal} ج.م</span>
                            </button>
                        </div>
                    ` : ''}

                    ${appState.cartOpen ? renderCheckoutModal(rest) : ''}
                    ${appState.trackerOpen ? renderLiveOrderTracker(rest) : ''}
                </div>
            `;
        }

        function addToCart(id){
            const restId = targetRestSlug || currentRestId || (globalDB && globalDB.restaurants ? Object.keys(globalDB.restaurants)[0] : null);
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[restId] : null;
            if(!rest || !rest.menu_items) return;
            const item = rest.menu_items.find(i => i.id === id);
            if(!item) return;
            const f = appState.cart.find(c => c.id === id);
            if(f) f.qty++; else appState.cart.push({...item, qty:1}); 
            render();
        }

        function getGPSLocation(){
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    appState.gpsLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    alert('تم تحديد موقعك بدقة عبر الـ GPS بنجاح! 📍');
                }, () => {
                    alert('تعذر تحديد الموقع. تأكد من السماح للبرنامج بالوصول للـ GPS.');
                });
            } else {
                alert('متصفحك لا يدعم خاصية الـ GPS.');
            }
        }

        function renderCheckoutModal(rest){
            return `
                <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 text-xs">
                    <div class="bg-white p-6 rounded-3xl max-w-sm w-full space-y-4 border border-slate-200 shadow-2xl">
                        <h3 class="font-black text-slate-900 text-sm text-center">تأكيد الطلب وتتبع الـ GPS</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-slate-600 mb-1 font-bold">اسمك الكريم</label>
                                <input id="cust_name" placeholder="محمد علي" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                            </div>
                            <div>
                                <label class="block text-slate-600 mb-1 font-bold">رقم الموبايل</label>
                                <input id="cust_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                            </div>
                            <div>
                                <label class="block text-slate-600 mb-1 font-bold">العنوان التفصيلي</label>
                                <input id="cust_address" placeholder="الشارع، رقم العمارة، الدور" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-slate-900 font-bold outline-none focus:border-red-600">
                            </div>
                            <div>
                                <button onclick="getGPSLocation()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-2.5 rounded-xl flex items-center justify-center gap-2 shadow transition">
                                    <i class="fa-solid fa-location-crosshairs"></i> تحديد موقعي الحالي بالـ GPS 📍
                                </button>
                                ${appState.gpsLocation ? `<p class="text-[10px] text-emerald-600 font-bold text-center mt-1">✓ تم التقاط إحداثيات الـ GPS بنجاح</p>` : ''}
                            </div>
                        </div>
                        <button onclick="submitOrder()" class="w-full bg-red-600 text-white font-black py-3.5 rounded-xl shadow-lg hover:bg-red-700 transition">إرسال الطلب الآن ➔</button>
                        <button onclick="appState.cartOpen=false; render();" class="w-full bg-slate-100 text-slate-700 py-2.5 rounded-xl hover:bg-slate-200 transition">إلغاء</button>
                    </div>
                </div>
            `;
        }

        function submitOrder(){
            const restId = targetRestSlug || currentRestId || (globalDB && globalDB.restaurants ? Object.keys(globalDB.restaurants)[0] : null);
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[restId] : null;
            if(!rest) return;
            const nameEl = document.getElementById('cust_name');
            const phoneEl = document.getElementById('cust_phone');
            const addressEl = document.getElementById('cust_address');
            
            const name = nameEl ? nameEl.value.trim() : ''; 
            const phone = phoneEl ? phoneEl.value.trim() : '';
            const address = addressEl ? addressEl.value.trim() : 'دليفري عادي';
            
            if(!name || !phone){ alert('أدخل الاسم ورقم الهاتف!'); return; }
            
            if(!rest.orders) rest.orders = [];
            const total = appState.cart.reduce((s,i)=>s+(i.price*i.qty),0);
            
            rest.orders.unshift({ 
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000), 
                customer_name: name, 
                phone, 
                address,
                gps: appState.gpsLocation ? `https://maps.google.com/?q=${appState.gpsLocation.lat},${appState.gpsLocation.lng}` : null,
                items_json: JSON.parse(JSON.stringify(appState.cart)), 
                total, 
                status: 'new', 
                table_number: appState.tableNumber || 'دليفري', 
                created_at: new Date().toLocaleTimeString('ar-EG') 
            });
            
            appState.activeOrderId = rest.orders[0].id; 
            localStorage.setItem('tablia_active_order_id', appState.activeOrderId); 
            appState.cart = []; 
            appState.cartOpen = false; 
            appState.gpsLocation = null;
            appState.trackerOpen = true; 
            syncCloud(); 
            render(); 
            playBell();
        }

        function renderLiveOrderTracker(rest){
            if(!rest || !rest.orders) return '';
            const ord = rest.orders.find(o => o.id === appState.activeOrderId); 
            if(!ord) return '';
            
            let statusText = 'قيد المراجعة والتحضير 🔥';
            if(ord.status === 'preparing') statusText = 'جاري تحضير الوجبات بالمنتجات الطازجة 👨‍🍳';
            if(ord.status === 'delivering') statusText = 'الطلب في الطريق إليك مع الدليفري 🛵';
            if(ord.status === 'done') statusText = 'تم تسليم الطلب بنجاح، بالهناء والشفاء! ✅';

            return `
                <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 text-xs">
                    <div class="bg-white p-6 rounded-3xl max-w-sm w-full text-center space-y-4 border border-slate-200 shadow-2xl">
                        <div class="w-14 h-14 rounded-full bg-red-50 text-red-600 mx-auto flex items-center justify-center text-xl font-black shadow">📦</div>
                        <h3 class="font-black text-slate-900 text-sm">متابعة الطلب #${ord.id}</h3>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2 text-right">
                            <p class="text-red-600 font-bold text-xs text-center">${statusText}</p>
                            <p class="text-slate-600 text-[11px]">📍 العنوان: ${ord.address}</p>
                            ${ord.gps ? `<a href="${ord.gps}" target="_blank" class="block text-sky-600 font-bold text-[11px] underline text-center">عرض موقع الـ GPS على الخريطة 🗺️</a>` : ''}
                            <p class="text-slate-900 font-black text-sm text-center pt-1">${ord.total} ج.م</p>
                        </div>
                        <button onclick="appState.trackerOpen=false; render();" class="w-full bg-slate-100 text-slate-800 py-3 rounded-xl hover:bg-slate-200 transition font-bold">إغلاق وتصفح المنيو</button>
                    </div>
                </div>
            `;
        }

        function renderCashier(){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null; 
            if(!rest){ setPage('auth'); return ''; }
            if(!rest.orders) rest.orders = [];

            return `
                ${renderNav()}
                <div class="max-w-4xl mx-auto px-4 py-6 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <h1 class="font-black text-slate-900 text-sm">شاشة الكاشير والتنبيهات الصوتية - ${rest.name}</h1>
                        <span class="bg-red-50 text-red-600 font-bold px-3 py-1 rounded-full text-[11px]">الطلبات النشطة: ${rest.orders.length}</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${rest.orders.length === 0 ? `<div class="col-span-2 bg-white p-12 text-center text-slate-400 rounded-3xl border border-slate-200 shadow-sm">لا توجد طلبات جديدة حالياً.. تنتظر طلبات العملاء 🚀</div>` : rest.orders.map((ord, i) => `
                            <div class="bg-white p-4 rounded-3xl space-y-3 border ${ord.status==='new'?'border-red-500 animate-pulse bg-red-50/20':'border-slate-200'} shadow-md">
                                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                                    <div>
                                        <span class="font-black text-slate-900 text-sm">${ord.customer_name}</span>
                                        <span class="text-slate-500 text-[10px] block">${ord.phone} | ${ord.table_number}</span>
                                    </div>
                                    <span class="text-red-600 font-black text-sm">${ord.total} ج.م</span>
                                </div>
                                <div class="text-slate-700 text-[11px] bg-slate-50 p-2.5 rounded-xl border border-slate-100 space-y-1">
                                    <p class="font-bold text-red-600">📍 العنوان: ${ord.address || 'بدون عنوان'}</p>
                                    ${ord.gps ? `<a href="${ord.gps}" target="_blank" class="text-sky-600 font-bold underline block">فتح موقع الـ GPS للعميل 🗺️</a>` : ''}
                                    <div class="pt-1">${ord.items_json ? ord.items_json.map(x => `• ${x.qty}x ${x.name}`).join('<br>') : ''}</div>
                                </div>
                                <div class="grid grid-cols-4 gap-1.5 pt-1">
                                    <button onclick="updateOrderStatus(${i}, 'preparing')" class="bg-sky-600 hover:bg-sky-500 text-white py-2 rounded-xl font-bold transition">تحضير</button>
                                    <button onclick="updateOrderStatus(${i}, 'delivering')" class="bg-amber-600 hover:bg-amber-500 text-white py-2 rounded-xl font-bold transition">دليفري 🛵</button>
                                    <button onclick="updateOrderStatus(${i}, 'done')" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl font-bold transition">تم</button>
                                    <button onclick="deleteOrder(${i})" class="bg-red-50 text-red-600 hover:bg-red-100 py-2 rounded-xl transition"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function updateOrderStatus(index, status) {
            const rest = globalDB.restaurants[currentRestId];
            if(rest && rest.orders && rest.orders[index]) {
                rest.orders[index].status = status;
                syncCloud();
                render();
            }
        }

        function deleteOrder(index) {
            const rest = globalDB.restaurants[currentRestId];
            if(rest && rest.orders) {
                rest.orders.splice(index, 1);
                syncCloud();
                render();
            }
        }

        function renderDashboard(){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null; 
            if(!rest){ setPage('auth'); return ''; }
            if(!appState.adminUnlocked) return `${renderNav()}<div class="max-w-md mx-auto py-12 px-4 text-center space-y-4 text-xs"><div class="bg-white p-6 rounded-3xl space-y-3 border border-slate-200 shadow-xl"><h2 class="font-black text-slate-900 text-sm">لوحة الإدارة (تفعيل الباقات - 600 ج)</h2><input id="admin_pin" type="password" placeholder="الرمز السري 357159" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-center text-slate-900 outline-none focus:border-red-600"><button onclick="if(document.getElementById('admin_pin').value==='${PLATFORM_OWNER.adminPass}'){appState.adminUnlocked=true;render();}else{alert('الرمز غلط')}" class="w-full bg-red-600 text-white font-black py-3.5 rounded-xl shadow">دخول الإدارة</button></div></div>`;
            
            return `
                ${renderNav()}
                <div class="max-w-4xl mx-auto px-4 py-6 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <h1 class="font-black text-slate-900 text-sm">إدارة كافة مطاعم المنصة (الاشتراكات الشهرية)</h1>
                        <button onclick="appState.adminUnlocked=false; render();" class="text-red-600 font-bold hover:underline">قفل الإدارة</button>
                    </div>
                    <div class="space-y-3">
                        ${Object.values(globalDB.restaurants).map(r => `
                            <div class="bg-white p-4 rounded-2xl flex justify-between items-center border ${r.subscription?.isActive?'border-emerald-500/40':'border-amber-500/40'} shadow-sm">
                                <div>
                                    <h3 class="font-black text-slate-900 text-xs">${r.name}</h3>
                                    <p class="text-slate-500 text-[11px] mt-0.5">المالك: ${r.ownerName} (${r.phone}) - الحالة: ${r.subscription?.isActive ? 'نشط ومفعل ✅' : 'غير مفعل ⏸️'}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="globalDB.restaurants['${r.id}'].subscription={isActive:true, expiresAt:Date.now()+2592000000}; syncCloud(); render();" class="bg-emerald-600 text-white px-3 py-2 rounded-xl font-bold hover:bg-emerald-500 transition">تفعيل شهر</button>
                                    <button onclick="globalDB.restaurants['${r.id}'].subscription={isActive:false}; syncCloud(); render();" class="bg-red-50 text-red-600 px-3 py-2 rounded-xl hover:bg-red-100 transition">إيقاف</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderQRPrint(){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null; 
            if(!rest){ setPage('auth'); return ''; }
            const base = location.origin + location.pathname + `?view=menu&rest=${rest.id}&t=`;
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <h1 class="font-black text-slate-900 text-sm">QR Code الطاولات والدليفري - ${rest.name}</h1>
                        <button onclick="window.print()" class="bg-red-600 text-white px-4 py-2.5 rounded-xl font-black shadow hover:bg-red-700 transition">طباعة الـ QR</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        ${Array.from({length: rest.tablesCount || 20}, (_, i) => i + 1).map(n => `
                            <div class="bg-white p-3 rounded-2xl text-center shadow-md space-y-2 border border-slate-100">
                                <div class="font-black text-xs text-slate-900">طاولة رقم ${n}</div>
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(base + n)}" class="w-24 h-24 mx-auto rounded-lg">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        render();
    </script>
</body>
</html>
