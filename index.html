<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablia OS 2030 | المنصة السحابية المتكاملة للمطاعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="antialiased min-h-screen bg-[#0b0f19] text-slate-100 selection:bg-red-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        const PLATFORM_OWNER = { walletNumber: '01015861991', monthlyPrice: 600, adminPass: '357159' };

        let globalDB = { restaurants: {} };
        try {
            const raw = localStorage.getItem('tablia_multitenant_2030_v46');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        if (!globalDB || !globalDB.restaurants || typeof globalDB.restaurants !== 'object') {
            globalDB = {
                restaurants: {
                    "rest_demo": {
                        id: "rest_demo", ownerName: "محمد علي", name: "حواوشي الرفاعي", phone: "01015861991", pass: "1234",
                        tablesCount: 20, deliveryFee: 37, deliveryTime: "30 دقيقة", taxPercent: 0, serviceFee: 0,
                        address: "30 شارع أحمد حشمت، الزمالك، القاهرة", wifiName: "Elrefaeey_Free", wifiPass: "357159357",
                        coverImage: "https://images.unsplash.com/photo-1544025162-d76694265947?w=800",
                        logoImage: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300",
                        social: { facebook: "https://facebook.com", instagram: "https://instagram.com" },
                        popupBanner: { enabled: true, image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=600", title: "مهرجان الحواوشي والمشويات 🔥", subtitle: "عروض مينفعش تفوتك!" },
                        theme: { mode: 'light', primary: '#163882', accent: '#dc2626', cardStyle: 'rounded' },
                        services: { waiterCall: true, wifiService: true, branchLocation: true, deliveryService: true },
                        subscription: { isActive: true, expiresAt: Date.now() + 30*24*60*60*1000 },
                        categories: [
                            { id: 'cat_offers', name: 'خصومات', icon: '🔥' },
                            { id: 'cat_hawawshi', name: 'حواوشي اللحوم', icon: '🥙' }
                        ],
                        menu_items: [
                            { id: 'itm_1', category_id: 'cat_offers', name: 'عرض الخضراوات', description: 'حواوشي خضراوات + مخلل + ماكس كولا', price: 99, old_price: 155, image: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400', is_featured: true, stock: 50, is_available: true }
                        ],
                        gallery: [
                            { id: 'gal_1', title: 'وجبة المشاوي الملكية', image: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600' },
                            { id: 'gal_2', title: 'حواوشي إسكندراني طازج', image: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600' }
                        ],
                        orders: [], employees: []
                    }
                }
            };
        }

        const COLOR_PRESETS = [
            { name: 'الأزرق الملكي', primary: '#163882', accent: '#dc2626' },
            { name: 'الأحمر الناري', primary: '#b91c1c', accent: '#f59e0b' },
            { name: 'الأسود والذهبي', primary: '#111827', accent: '#d97706' },
            { name: 'الأخضر الزمردي', primary: '#065f46', accent: '#ea580c' }
        ];

        function checkSubscription(rest) {
            if (!rest || !rest.subscription) return false;
            if (rest.subscription.expiresAt && Date.now() > rest.subscription.expiresAt) rest.subscription.isActive = false;
            return rest.subscription.isActive;
        }

        function syncCloud() {
            try {
                localStorage.setItem('tablia_multitenant_2030_v46', JSON.stringify(globalDB));
                if (cloudDB) cloudDB.ref('tablia_multitenant_enterprise_2030_v46').set(globalDB).catch(() => {});
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_multitenant_enterprise_2030_v46').on('value', (snap) => {
                const data = snap.val();
                if (data && data.restaurants) {
                    globalDB = data;
                    try { localStorage.setItem('tablia_multitenant_2030_v46', JSON.stringify(globalDB)); } catch(e){}
                    render();
                }
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isSuperAdminMode = urlParams.get('view') === 'superadmin';
        const isCustomerMode = urlParams.get('view') === 'menu';
        const targetRestSlug = urlParams.get('rest');
        
        let currentRestId = localStorage.getItem('tablia_logged_rest_id') || null;

        const appState = { 
            page: isSuperAdminMode ? 'superadmin' : (isCustomerMode ? 'storefront' : (currentRestId ? 'builder' : 'auth')), 
            authTab: 'login', 
            builderStep: 1, 
            activeCat: 'all', 
            search: '',
            searchOpen: false,
            viewLayout: 'list',
            cart: [], 
            customerView: 'menu', 
            orderType: urlParams.get('t') ? 'dine-in' : 'delivery',
            tableNumber: urlParams.get('t') || 'طاولة 1', 
            superAdminUnlocked: false,
            drawerOpen: false,
            modalType: null,
            promoPopupShown: false,
            addressModalOpen: false,
            appliedDiscount: 0,
            paymentMethod: 'cash',
            transferRefInput: '',
            customerDetails: { name: '', phone: '', gpsLocation: '', area: '', street: '', building: '', floor: '', apt: '', landmark: '' }
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isSuperAdminMode || appState.page === 'superadmin') content = renderSuperAdminView();
                else if(isCustomerMode) content = renderStorefront();
                else if(appState.page === 'auth') content = renderAuthScreen();
                else {
                    if(!currentRestId || !globalDB.restaurants?.[currentRestId]) { currentRestId = null; appState.page = 'auth'; content = renderAuthScreen(); }
                    else if(appState.page === 'builder') content = renderBuilder();
                    else if(appState.page === 'cashier') content = renderCashier();
                    else if(appState.page === 'inventory') content = renderInventory();
                    else if(appState.page === 'attendance') content = renderAttendance();
                    else if(appState.page === 'dashboard') content = renderDashboard();
                    else if(appState.page === 'qr_print') content = renderQRPrint();
                    else content = renderBuilder();
                }
                const bottomBar = (isCustomerMode || isSuperAdminMode || appState.page==='superadmin' || !currentRestId) ? '' : renderBottomNav();
                root.innerHTML = content + bottomBar;
            } catch(err) { console.error(err); }
        }

        function renderSuperAdminView(){
            return `<div class="max-w-4xl mx-auto px-4 py-10 space-y-5 text-xs text-slate-100"><div class="bg-slate-900 p-4 rounded-2xl flex justify-between"><h1>لوحة الإدارة</h1><a href="?" class="bg-slate-800 px-3 py-2 rounded-xl">خروج</a></div></div>`;
        }

        function renderNav(){
            const rest = currentRestId ? globalDB.restaurants[currentRestId] : null;
            return `<nav class="sticky top-0 z-40 bg-slate-900/95 border-b border-slate-800 px-4 py-3"><div class="max-w-4xl mx-auto flex justify-between items-center"><div class="flex gap-2 items-center cursor-pointer" onclick="setPage(currentRestId?'builder':'auth')"><div class="w-9 h-9 rounded-xl bg-red-600 text-white flex items-center justify-center font-black">ط</div><span class="font-black text-white text-sm">Tablia OS</span></div>${rest?`<button onclick="currentRestId=null; localStorage.removeItem('tablia_logged_rest_id'); setPage('auth');" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-xl text-xs font-bold">خروج</button>`:''}</div></nav>`;
        }

        function renderBottomNav(){
            return `<div class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900 border-t border-slate-800 px-1 py-2"><div class="max-w-md mx-auto grid grid-cols-6 gap-0.5 text-center text-slate-400"><button onclick="setPage('builder')" class="flex flex-col items-center py-1"><i class="fa-solid fa-wand-magic-sparkles text-xs mb-0.5"></i><span class="text-[9px]">المنشئ</span></button><button onclick="setPage('cashier')" class="flex flex-col items-center py-1"><i class="fa-solid fa-bell text-xs mb-0.5 text-amber-400"></i><span class="text-[9px]">الطلبات</span></button><button onclick="setPage('inventory')" class="flex flex-col items-center py-1"><i class="fa-solid fa-boxes-stacked text-xs mb-0.5"></i><span class="text-[9px]">المخزن</span></button><button onclick="setPage('attendance')" class="flex flex-col items-center py-1"><i class="fa-solid fa-users-gear text-xs mb-0.5"></i><span class="text-[9px]">الموظفين</span></button><button onclick="setPage('dashboard')" class="flex flex-col items-center py-1"><i class="fa-solid fa-chart-line text-xs mb-0.5"></i><span class="text-[9px]">الباقات</span></button><button onclick="setPage('qr_print')" class="flex flex-col items-center py-1"><i class="fa-solid fa-qrcode text-xs mb-0.5"></i><span class="text-[9px]">QR</span></button></div></div>`;
        }

        function renderAuthScreen(){
            return `${renderNav()}
            <div class="max-w-md mx-auto px-4 py-12 space-y-6">
                <div class="text-center space-y-2"><h1 class="text-2xl font-black text-white">منصة طبلية | Tablia OS</h1><p class="text-xs text-slate-400">فترة تجريبية مجانية لمدة يومين 🎁</p></div>
                <div class="bg-slate-900 p-6 rounded-3xl space-y-4 text-xs shadow-xl">
                    <div><label class="block text-slate-300 mb-1 font-bold">اسم المطعم</label><input id="reg_name" placeholder="مطعم البرنس" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold"></div>
                    <div><label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label><input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold"></div>
                    <div><label class="block text-slate-300 mb-1 font-bold">كلمة السر</label><input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold"></div>
                    <button onclick="handleRegister()" class="w-full bg-red-600 text-white font-black py-3.5 rounded-xl shadow">ابدأ التجربة المجانية 🚀</button>
                </div>
            </div>`;
        }

        function handleRegister(){
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            if(!name || !phone || !pass){ alert('يرجى استكمال البيانات'); return; }
            const restId = 'rest_' + Date.now();
            globalDB.restaurants[restId] = { 
                id: restId, name, phone, pass, tablesCount: 20, deliveryFee: 30, deliveryTime: "30 دقيقة",
                address: 'القاهرة، مصر', wifiName: name+'_Free', wifiPass: '357159',
                coverImage: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=800',
                logoImage: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300',
                social: { facebook: '', instagram: '' },
                popupBanner: { enabled: false, image: '', title: '', subtitle: '' },
                theme: { mode: 'light', primary: '#163882', accent: '#dc2626', cardStyle: 'rounded' },
                services: { waiterCall: true, wifiService: true, branchLocation: true, deliveryService: true },
                subscription: { isActive: true, expiresAt: Date.now() + (2*24*60*60*1000) }, 
                categories: [{ id: 'cat_1', name: 'الأصناف الرئيسية', icon: '🍽️' }], 
                menu_items: [], gallery: [], orders: [], employees: []
            };
            syncCloud(); currentRestId = restId; localStorage.setItem('tablia_logged_rest_id', restId); setPage('builder');
        }

        // ================= BUILDER WITH GALLERY SECTION =================
        function renderBuilder(){
            const rest = globalDB.restaurants[currentRestId];
            if(!rest){ setPage('auth'); return ''; }
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 pb-24 space-y-5">
                    <div class="flex gap-1.5 bg-slate-900 p-1.5 rounded-2xl text-xs border border-slate-800">
                        <button onclick="appState.builderStep=1; render();" class="flex-1 py-2.5 rounded-xl ${appState.builderStep===1?'bg-red-600 text-white font-black':'text-slate-400'}">1. الهوية والألوان</button>
                        <button onclick="appState.builderStep=2; render();" class="flex-1 py-2.5 rounded-xl ${appState.builderStep===2?'bg-red-600 text-white font-black':'text-slate-400'}">2. الأصناف والصور</button>
                        <button onclick="appState.builderStep=3; render();" class="flex-1 py-2.5 rounded-xl ${appState.builderStep===3?'bg-red-600 text-white font-black':'text-slate-400'}">3. نشر اللينك والـ QR</button>
                    </div>
                    ${appState.builderStep===1 ? renderStep1(rest) : (appState.builderStep===2 ? renderStep2(rest) : renderStep3(rest))}
                </div>
            `;
        }

        function renderStep1(rest){
            if(!rest.theme) rest.theme = { mode: 'light', primary: '#163882', accent: '#dc2626', cardStyle: 'rounded' };
            return `
                <div class="bg-slate-900 p-6 rounded-3xl space-y-4 text-xs border border-slate-800">
                    <h2 class="font-black text-white text-sm">🎨 الهوية البصرية والألوان</h2>
                    <div class="grid grid-cols-2 gap-2">
                        ${COLOR_PRESETS.map(p => `<button onclick="globalDB.restaurants['${currentRestId}'].theme.primary='${p.primary}'; globalDB.restaurants['${currentRestId}'].theme.accent='${p.accent}'; syncCloud(); render();" class="p-3 rounded-xl border border-slate-700 bg-slate-950 flex items-center gap-2"><span class="w-4 h-4 rounded-full" style="background:${p.primary}"></span><b class="text-white">${p.name}</b></button>`).join('')}
                    </div>
                    <div><label class="block text-slate-300 mb-1 font-bold">اسم المطعم</label><input id="r_name" value="${rest.name}" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-bold"></div>
                    <div><label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label><input id="r_phone" value="${rest.phone}" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-bold"></div>
                    <button onclick="rest.name=document.getElementById('r_name').value; rest.phone=document.getElementById('r_phone').value; syncCloud(); appState.builderStep=2; render();" class="bg-amber-500 text-slate-950 font-black px-5 py-3.5 rounded-xl w-full">حفظ والانتقال للأصناف والصور ➔</button>
                </div>
            `;
        }

        function renderStep2(rest){
            if(!rest.gallery) rest.gallery = [];
            return `
                <div class="bg-slate-900 p-6 rounded-3xl space-y-6 text-xs border border-slate-800">
                    <!-- Categories & Items -->
                    <div class="space-y-3">
                        <div class="flex justify-between items-center"><h3 class="font-black text-white text-sm">الأصناف</h3><button onclick="const c=prompt('اسم القسم:'); if(c) {rest.categories.push({id:'cat_'+Date.now(), name:c, icon:'🍽️'}); syncCloud(); render();}" class="bg-amber-500/20 text-amber-400 px-3 py-1.5 rounded-xl">+ قسم</button></div>
                        <div class="bg-slate-950 p-4 rounded-2xl space-y-2">
                            <input id="itm_name" placeholder="اسم الوجبة (مثال: حواوشي لحم)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold">
                            <input id="itm_price" type="number" placeholder="السعر" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold">
                            <input id="itm_img" placeholder="رابط صورة الوجبة (URL) أو اتركها افتراضية" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold">
                            <button onclick="const n=document.getElementById('itm_name').value; const p=document.getElementById('itm_price').value; const img=document.getElementById('itm_img').value; if(n&&p){ rest.menu_items.push({id:'itm_'+Date.now(), category_id:rest.categories[0].id, name:n, price:Number(p), description:'معد بعناية فائقة', image:img||'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400', is_available:true}); syncCloud(); render(); }" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl">إضافة صنف ✓</button>
                        </div>
                    </div>

                    <!-- GALLERY / PHOTO SECTION (New Requirement) -->
                    <div class="space-y-3 pt-4 border-t border-slate-800">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-black text-amber-400 text-sm">🖼️ قسم معرض الصور (Gallery)</h3>
                                <p class="text-[10px] text-slate-400">أضف صور الأطباق والجو العام، وستظهر مرتبة في آخر المنيو!</p>
                            </div>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-2xl space-y-2">
                            <input id="gal_title" placeholder="عنوان الصورة (مثال: وجبة المشاوي الملكية)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold">
                            <input id="gal_url" placeholder="رابط الصورة (URL)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold">
                            <button onclick="const t=document.getElementById('gal_title').value; const u=document.getElementById('gal_url').value; if(t&&u){ rest.gallery.push({id:'gal_'+Date.now(), title:t, image:u}); syncCloud(); render(); }" class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl">إضافة الصورة لمعرض الصور ➔</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            ${rest.gallery.map((g, i) => `
                                <div class="bg-slate-950 p-2 rounded-xl flex items-center justify-between border border-slate-800">
                                    <div class="flex items-center gap-2">
                                        <img src="${g.image}" class="w-10 h-10 rounded-lg object-cover">
                                        <span class="font-bold text-[11px] line-clamp-1">${g.title}</span>
                                    </div>
                                    <button onclick="rest.gallery.splice(${i},1); syncCloud(); render();" class="text-red-400 p-1"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="appState.builderStep=3; render();" class="bg-amber-500 text-slate-950 font-black px-4 py-3.5 rounded-xl w-full">التالي: نشر اللينك ➔</button>
                </div>
            `;
        }

        function renderStep3(rest){
            const url = location.origin + location.pathname + `?view=menu&rest=${rest.id}`;
            return `
                <div class="bg-slate-900 p-6 rounded-3xl space-y-4 text-xs border border-slate-800 text-center">
                    <h2 class="font-black text-white text-sm">🎉 منيو مطعمك جاهز بكل الأصناف ومعرض الصور!</h2>
                    <input readonly value="${url}" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white text-center select-all">
                    <a href="${url}" target="_blank" class="block w-full bg-emerald-600 text-white font-black py-3.5 rounded-xl">فتح المنيو الآن ومعاينة الصور المرتبة ➔</a>
                </div>
            `;
        }

        // ================= CUSTOMER STOREFRONT WITH GALLERY AT THE END =================
        function renderStorefront(){
            const restId = targetRestSlug || Object.keys(globalDB.restaurants)[0];
            const rest = globalDB.restaurants[restId];
            if(!rest) return `<div class="min-h-screen flex items-center justify-center text-white">المطعم غير موجود</div>`;

            const theme = rest.theme || { mode: 'light', primary: '#163882', accent: '#dc2626' };
            const isLight = theme.mode === 'light';
            const bgMain = isLight ? 'bg-[#f4f6f9] text-slate-900' : 'bg-[#0b0f19] text-slate-100';
            const cardBg = isLight ? 'bg-white border-slate-200' : 'bg-slate-900 border-slate-800';

            return `
                <div class="min-h-screen ${bgMain} pb-28">
                    <!-- Hero Banner -->
                    <div class="relative h-48 w-full overflow-hidden">
                        <img src="${rest.coverImage}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center text-white p-4 text-center">
                            <img src="${rest.logoImage}" class="w-16 h-16 rounded-full object-cover border-2 border-white mb-1">
                            <h1 class="font-black text-lg">${rest.name}</h1>
                            <p class="text-[10px] text-slate-200">${rest.address}</p>
                        </div>
                    </div>

                    <div class="max-w-2xl mx-auto px-3 pt-4 space-y-6">
                        <!-- Menu Items -->
                        <div class="space-y-4">
                            <h2 class="font-black text-sm px-1">قائمة الطعام</h2>
                            <div class="space-y-3">
                                ${(rest.menu_items || []).map(item => `
                                    <div class="${cardBg} border rounded-2xl p-3 flex items-center justify-between gap-3 shadow-sm">
                                        <div class="flex-1">
                                            <h3 class="font-black text-sm">${item.name}</h3>
                                            <p class="text-[11px] text-slate-500">${item.description}</p>
                                            <span class="font-black text-xs block mt-1" style="color:${theme.primary}">${item.price} جنيه</span>
                                        </div>
                                        <img src="${item.image}" class="w-20 h-20 rounded-xl object-cover">
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- GALLERY SECTION AT THE VERY END (As Requested) -->
                        ${rest.gallery && rest.gallery.length > 0 ? `
                            <div class="space-y-3 pt-6 border-t border-slate-300 dark:border-slate-800">
                                <div class="text-center space-y-1">
                                    <h2 class="font-black text-base uppercase tracking-wider" style="color:${theme.primary}">معرض الصور والأطباق</h2>
                                    <p class="text-[11px] text-slate-500">لقطات حية من أطباقنا المميزة</p>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    ${rest.gallery.map(g => `
                                        <div class="${cardBg} border rounded-2xl overflow-hidden shadow-md">
                                            <img src="${g.image}" class="w-full h-36 object-cover hover:scale-105 transition duration-300">
                                            <div class="p-2 text-center">
                                                <span class="font-black text-xs block truncate">${g.title}</span>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Basic Cashier/Dashboard stubs for platform completeness
        function renderCashier(){ return `${renderNav()}<div class="p-6 text-center text-xs">شاشة الكاشير</div>`; }
        function renderInventory(){ return `${renderNav()}<div class="p-6 text-center text-xs">المخزن</div>`; }
        function renderAttendance(){ return `${renderNav()}<div class="p-6 text-center text-xs">الموظفين</div>`; }
        function renderDashboard(){ return `${renderNav()}<div class="p-6 text-center text-xs">الباقات</div>`; }
        function renderQRPrint(){ return `${renderNav()}<div class="p-6 text-center text-xs">QR</div>`; }

        render();
    </script>
</body>
</html>
