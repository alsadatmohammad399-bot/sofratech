<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablia OS | المنصة السحابية المتكاملة للمطاعم والكاشير</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة Firebase السحابية للربط الحقيقي عبر الإنترنت -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #090d16; color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="antialiased min-h-screen selection:bg-amber-500 selection:text-slate-950">

    <!-- جرس التنبيه السحابي للطلبات -->
    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div id="app"></div>

    <script>
        // ================= 1. اتصال السحاب الحقيقي (Cloud Database) =================
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };

        let cloudDB = null;
        try {
            firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {
            console.error("Cloud connection error:", e);
        }

        const CLOUD_SCHEMA = {
            restaurant: {
                name: 'إمبر آند جريل السحابي',
                slug: 'ember-grill',
                phone: '201015861991',
                logo: '🔥',
                layout: 'foodera',
                theme: { primary: '#f59e0b', bg: '#090d16' },
                tablesCount: 20,
                pin: '1234'
            },
            categories: [
                { id: 'cat_1', name: 'البرجر الفاخر' },
                { id: 'cat_2', name: 'المشويات' },
                { id: 'cat_3', name: 'مشروبات' }
            ],
            menu_items: [
                { id: 'itm_1', category_id: 'cat_1', name: 'ترافل أنجوس برجر', description: 'لحم أنجوس مع صوص الترافل وجبنة سويسرية', price: 180, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=60', is_available: true, tags: ['الأكثر مبيعاً'] },
                { id: 'itm_2', category_id: 'cat_2', name: 'ريب آي ستيك مشوي', description: 'قطعة ريب آي مع الزبدة والأعشاب', price: 350, image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&q=60', is_available: true, tags: ['اختيار الشيف'] },
                { id: 'itm_3', category_id: 'cat_3', name: 'عصير مانجو فريش', description: 'عصير مانجو طبيعي مثلج', price: 45, image: 'https://images.unsplash.com/photo-1544145945-f90425340c7e?w=500&q=60', is_available: true, tags: ['طازج'] }
            ],
            orders: []
        };

        let store = JSON.parse(localStorage.getItem('tablia_cloud_cache')) || CLOUD_SCHEMA;

        function saveToCloud() {
            localStorage.setItem('tablia_cloud_cache', JSON.stringify(store));
            if (cloudDB) {
                cloudDB.ref('tablia_enterprise_db').set(store);
            }
        }

        // الاستماع الفوري للتحديثات السحابية (Realtime Cloud Listener)
        if (cloudDB) {
            cloudDB.ref('tablia_enterprise_db').on('value', (snapshot) => {
                const remoteData = snapshot.val();
                if (remoteData) {
                    // التحقق مما إذا كان هناك طلب جديد وصل عبر السحاب لتنبيه الكاشير
                    if (remoteData.orders && store.orders) {
                        if (remoteData.orders.length > store.orders.length) {
                            playCloudAlert();
                        }
                    }
                    store = remoteData;
                    if (!store.orders) store.orders = [];
                    render();
                } else {
                    // إذا كانت القاعدة فارغة، قم برفع البيانات الافتراضية
                    saveToCloud();
                }
            });
        }

        function playCloudAlert() {
            const audio = document.getElementById('cloud-bell');
            if (audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
            if ('vibrate' in navigator) navigator.vibrate([400, 200, 400]);
        }

        // ================= 2. التطبيق والراوتر =================
        const appState = {
            page: 'landing', // 'landing' | 'menu' | 'cashier' | 'admin'
            activeCat: 'all',
            search: '',
            cart: [],
            cartOpen: false,
            tableNumber: new URLSearchParams(window.location.search).get('t') || null,
            customerName: '',
            customerPhone: '',
            cashierUnlocked: false
        };

        function setPage(p) {
            appState.page = p;
            render();
            window.scrollTo(0, 0);
        }

        function render() {
            const root = document.getElementById('app');
            if (appState.page === 'menu') root.innerHTML = renderCustomerMenu();
            else if (appState.page === 'cashier') root.innerHTML = renderCashierDashboard();
            else if (appState.page === 'admin') root.innerHTML = renderAdminPanel();
            else root.innerHTML = renderLandingPage();
        }

        // ================= 3. شاشة البداية (Landing Page) =================
        function renderLandingPage() {
            const currentUrl = window.location.origin + window.location.pathname;
            return `
                <div class="min-h-screen bg-[#090d16] flex flex-col justify-between">
                    <header class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/10">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-2xl gold-gradient text-slate-950 flex items-center justify-center text-xl font-black shadow-lg">⚡</div>
                            <span class="text-xl font-black tracking-wider">Tablia <span class="text-amber-500">OS (Cloud)</span></span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="setPage('admin')" class="glass px-4 py-2 rounded-xl text-xs font-bold text-amber-400">⚙️ الإدارة</button>
                            <button onclick="setPage('cashier')" class="bg-red-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-black shadow-lg">🖥️ شاشة الكاشير السحابية</button>
                        </div>
                    </header>

                    <main class="container mx-auto px-6 py-16 text-center max-w-4xl my-auto space-y-8">
                        <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-4 py-2 rounded-full text-amber-400 text-xs font-bold">
                            <i class="fa-solid fa-cloud"></i> متصل بالسحاب 100% عبر Realtime Database
                        </div>
                        <h1 class="text-4xl md:text-6xl font-black leading-tight">منصة <span class="text-amber-500">${store.restaurant.name}</span> السحابية المباشرة</h1>
                        <p class="text-slate-400 text-base max-w-xl mx-auto">الطلب من منيو الزبون يصل فوراً لشاشة الكاشير والمطبخ عبر الإنترنت وبدون تأخير.</p>

                        <div class="flex flex-wrap justify-center gap-4 pt-4">
                            <button onclick="setPage('menu')" class="gold-gradient hover:opacity-95 text-slate-950 font-black px-8 py-4 rounded-2xl text-sm shadow-xl transition">
                                📱 فتح رابط منيو الزبون
                            </button>
                            <button onclick="setPage('cashier')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-8 py-4 rounded-2xl text-sm border border-white/10 transition">
                                🖥️ فتح شاشة الكاشير والمطبخ
                            </button>
                        </div>

                        <div class="glass p-5 rounded-3xl text-right max-w-xl mx-auto space-y-2 border border-white/10 text-xs">
                            <span class="text-slate-400 font-bold block">🔗 رابط المنيو المباشر (انسخه وافتحه من أي هاتف):</span>
                            <div class="bg-slate-950 p-3 rounded-xl border border-white/5 flex justify-between items-center" dir="ltr">
                                <code class="text-amber-400 font-bold">${currentUrl}?view=menu</code>
                                <button onclick="navigator.clipboard.writeText('${currentUrl}?view=menu'); alert('✅ تم النسخ!');" class="bg-white/10 px-3 py-1 rounded font-bold">نسخ</button>
                            </div>
                        </div>
                    </main>

                    <footer class="text-center py-6 text-slate-500 text-xs border-t border-white/5">
                        جميع الحقوق محفوظة © Tablia OS 2026
                    </footer>
                </div>
            `;
        }

        // ================= 4. منيو الزبون السحابي (/r/[slug]?t=5) =================
        function renderCustomerMenu() {
            const filtered = store.menu_items.filter(item => {
                if (!item.is_available) return false;
                const matchCat = appState.activeCat === 'all' || item.category_id === appState.activeCat;
                const matchQ = item.name.toLowerCase().includes(appState.search.toLowerCase());
                return matchCat && matchQ;
            });

            const cartCount = appState.cart.reduce((s, i) => s + i.qty, 0);
            const cartTotal = appState.cart.reduce((s, i) => s + (i.price * i.qty), 0);

            return `
                <div class="min-h-screen bg-[#090d16] text-white pb-32">
                    <header class="glass sticky top-0 z-40 px-4 py-3 border-b border-white/10">
                        <div class="max-w-2xl mx-auto flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="w-10 h-10 rounded-2xl gold-gradient text-slate-950 flex items-center justify-center text-xl font-black">${store.restaurant.logo}</span>
                                <div>
                                    <h1 class="font-black text-sm">${store.restaurant.name}</h1>
                                    <p class="text-[10px] text-emerald-400 font-bold">● متصل بالسحاب ومفتوح</p>
                                </div>
                            </div>
                            <button onclick="setPage('landing')" class="glass px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300">الرئيسية</button>
                        </div>
                    </header>

                    ${appState.tableNumber ? `
                        <div class="bg-amber-500 text-slate-950 px-4 py-2 font-black text-xs text-center">
                            📍 أنت تطلب الآن على <span class="underline">طاولة رقم ${appState.tableNumber}</span>
                        </div>
                    ` : ''}

                    <div class="max-w-2xl mx-auto px-4 pt-4 space-y-5">
                        <div class="relative">
                            <input type="text" value="${appState.search}" oninput="appState.search=this.value; render();" placeholder="ابحث في الأطباق والأسعار..." class="w-full bg-slate-900 border border-white/10 rounded-2xl py-3.5 pr-11 pl-4 text-xs text-white outline-none focus:border-amber-500">
                            <i class="fa-solid fa-magnifying-glass absolute right-4 top-4 text-slate-400 text-xs"></i>
                        </div>

                        <!-- الأقسام -->
                        <div class="flex gap-2 overflow-x-auto hide-scrollbar py-1">
                            <button onclick="appState.activeCat='all'; render();" class="px-4 py-2 rounded-2xl text-xs font-black transition ${appState.activeCat==='all'?'gold-gradient text-slate-950':'glass text-slate-300'}">الكل</button>
                            ${store.categories.map(c => `
                                <button onclick="appState.activeCat='${c.id}'; render();" class="px-4 py-2 rounded-2xl text-xs font-black whitespace-nowrap transition ${appState.activeCat===c.id?'gold-gradient text-slate-950':'glass text-slate-300'}">${c.name}</button>
                            `).join('')}
                        </div>

                        <!-- شبكة الأصناف -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            ${filtered.map(item => `
                                <div class="glass border border-white/10 p-4 rounded-3xl flex flex-col justify-between shadow-xl">
                                    <div class="w-full h-36 rounded-2xl overflow-hidden mb-3 relative bg-slate-950">
                                        <img src="${item.image}" class="w-full h-full object-cover">
                                        ${item.tags && item.tags[0] ? `<span class="absolute top-2 right-2 gold-gradient text-slate-950 text-[9px] font-black px-2.5 py-0.5 rounded-full">${item.tags[0]}</span>` : ''}
                                    </div>
                                    <div>
                                        <h3 class="font-black text-base text-white">${item.name}</h3>
                                        <p class="text-xs text-slate-400 line-clamp-1 mt-0.5">${item.description}</p>
                                    </div>
                                    <div class="flex justify-between items-center mt-4 pt-3 border-t border-white/5">
                                        <span class="font-black text-amber-400 text-sm">${item.price} ج.م</span>
                                        <button onclick="addToCart('${item.id}')" class="w-9 h-9 rounded-xl gold-gradient text-slate-950 font-black flex items-center justify-center text-sm shadow hover:scale-105 transition">+</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${cartCount > 0 ? `
                        <div class="fixed bottom-6 left-4 right-4 max-w-lg mx-auto z-50">
                            <button onclick="appState.cartOpen=true; render();" class="w-full py-4 px-6 rounded-2xl gold-gradient text-slate-950 font-black shadow-2xl flex justify-between items-center text-sm border border-white/20">
                                <span>عرض السلة وإرسال الطلب للسحاب (${cartCount})</span>
                                <span>${cartTotal} ج.م 🚀</span>
                            </button>
                        </div>
                    ` : ''}

                    <!-- مودال تأكيد الطلب -->
                    ${appState.cartOpen ? `
                        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
                            <div class="bg-slate-900 border border-white/15 text-white w-full max-w-md rounded-3xl p-6 space-y-4 animate-fade-up">
                                <div class="flex justify-between items-center pb-3 border-b border-white/10">
                                    <h3 class="font-black text-base">تأكيد إرسال الطلب ${appState.tableNumber ? '(طاولة رقم '+appState.tableNumber+')' : ''}</h3>
                                    <button onclick="appState.cartOpen=false; render();" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
                                </div>

                                <div class="space-y-3 text-xs">
                                    <input type="text" value="${appState.customerName}" oninput="appState.customerName=this.value" placeholder="اسمك الكريم *" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white font-bold outline-none">
                                    <input type="tel" value="${appState.customerPhone}" oninput="appState.customerPhone=this.value" placeholder="رقم الهاتف *" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white font-bold outline-none">
                                </div>

                                <div class="flex justify-between items-center pt-2 border-t border-white/10 font-black text-sm">
                                    <span>الإجمالي</span>
                                    <span class="text-amber-400">${cartTotal} ج.م</span>
                                </div>

                                <button onclick="submitCloudOrder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-2xl text-xs shadow-xl flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-cloud-arrow-up text-base"></i> إرسال الطلب سحابياً للكاشير والمطبخ
                                </button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addToCart(id) {
            const item = store.menu_items.find(m => m.id === id);
            const found = appState.cart.find(c => c.id === id);
            if (found) found.qty++;
            else appState.cart.push({ ...item, qty: 1 });
            render();
        }

        function submitCloudOrder() {
            if (!appState.customerName.trim() || !appState.customerPhone.trim()) {
                alert('⚠️ يرجى إدخال الاسم ورقم الهاتف.');
                return;
            }
            const total = appState.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const orderObj = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                table_number: appState.tableNumber ? Number(appState.tableNumber) : null,
                customer_name: appState.customerName.trim(),
                phone: appState.customerPhone.trim(),
                items_json: JSON.parse(JSON.stringify(appState.cart)),
                total: total,
                status: 'new',
                created_at: 'الآن'
            };

            if (!store.orders) store.orders = [];
            store.orders.unshift(orderObj);
            saveToCloud(); // رفع الطلب فوراً للسحاب ليظهر عند الكاشير

            appState.cart = [];
            appState.cartOpen = false;
            render();
            alert(`✅ تم إرسال طلبك سحابياً بنجاح! ${appState.tableNumber ? '(طاولة رقم ' + appState.tableNumber + ')' : ''}`);
        }

        // ================= 5. شاشة الكاشير السحابية الحية (POS & KDS) =================
        function renderCashierDashboard() {
            if (!appState.cashierUnlocked) {
                return `
                    <div class="min-h-screen bg-[#090d16] text-white p-6 flex items-center justify-center">
                        <div class="glass p-6 rounded-3xl max-w-xs w-full text-center space-y-4 border border-white/10 shadow-2xl">
                            <h2 class="font-black text-sm text-amber-400">شاشة الكاشير السحابية</h2>
                            <p class="text-[11px] text-slate-400">أدخل رمز PIN (الافتراضي: 1234)</p>
                            <input type="password" id="c_pin" placeholder="••••" class="w-full bg-slate-950 border border-white/10 p-3.5 rounded-xl text-center text-white tracking-widest font-black text-lg outline-none">
                            <button onclick="unlockCashier()" class="w-full gold-gradient text-slate-950 font-black py-3 rounded-xl text-xs">دخول الكاشير</button>
                            <button onclick="setPage('landing')" class="text-xs text-slate-500 underline block mx-auto">الرئيسية</button>
                        </div>
                    </div>
                `;
            }

            const orders = store.orders || [];

            return `
                <div class="min-h-screen bg-[#090d16] text-white p-4 max-w-6xl mx-auto space-y-6 pb-32">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-3xl border border-white/10">
                        <div class="flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></span>
                            <h1 class="font-black text-base text-white">🖥️ شاشة المطبخ والكاشير السحابية (Realtime Cloud POS)</h1>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="setPage('landing')" class="glass px-3 py-1.5 rounded-xl text-xs font-bold">الرئيسية</button>
                            <button onclick="appState.cashierUnlocked=false; render();" class="text-xs text-red-400 glass px-3 py-1.5 rounded-xl">قفل</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${orders.length === 0 ? `<div class="col-span-3 glass p-16 rounded-3xl text-center text-slate-400 text-xs">لا توجد طلبات واردة حالياً. ستظهر فوراً عند إرسالها من أي هاتف عبر السحاب!</div>` : ''}
                        ${orders.map((ord, idx) => `
                            <div class="glass p-5 rounded-3xl space-y-4 border ${ord.status==='new'?'border-amber-500 shadow-xl shadow-amber-500/10':(ord.status==='preparing'?'border-sky-500':'border-white/10')}">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <span class="bg-amber-500 text-slate-950 font-black text-xs px-2.5 py-0.5 rounded-full">طاولة رقم ${ord.table_number || 'دليفري'}</span>
                                        <h3 class="font-black text-base text-white mt-2">${ord.customer_name}</h3>
                                        <p class="text-xs text-slate-400">📞 ${ord.phone}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="font-black text-amber-400 text-sm">${ord.total} ج.م</span>
                                        <span class="block text-[10px] text-slate-400 uppercase mt-0.5">${ord.status}</span>
                                    </div>
                                </div>

                                <div class="bg-slate-950 p-3 rounded-2xl space-y-1 text-xs">
                                    ${ord.items_json.map(i => `
                                        <div class="flex justify-between items-center text-slate-300">
                                            <span>• ${i.qty}x ${i.name}</span>
                                            <span class="font-bold text-amber-400">${i.price * i.qty} ج</span>
                                        </div>
                                    `).join('')}
                                </div>

                                <div class="grid grid-cols-3 gap-1.5 pt-2 border-t border-white/10 text-[11px]">
                                    <button onclick="updateOrderStatus(${idx}, 'preparing')" class="py-2 rounded-xl font-bold ${ord.status==='preparing'?'bg-sky-600 text-white':'bg-slate-800 text-slate-300'}">تحضير 👨‍🍳</button>
                                    <button onclick="updateOrderStatus(${idx}, 'ready')" class="py-2 rounded-xl font-bold ${ord.status==='ready'?'bg-emerald-600 text-white':'bg-slate-800 text-slate-300'}">جاهز ✅</button>
                                    <button onclick="updateOrderStatus(${idx}, 'done')" class="py-2 rounded-xl font-bold ${ord.status==='done'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}">تسليم ✨</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function unlockCashier() {
            const pin = document.getElementById('c_pin').value.trim();
            if (pin === store.restaurant.pin) {
                appState.cashierUnlocked = true;
                render();
            } else {
                alert('❌ الرمز غير صحيح! (الافتراضي: 1234)');
            }
        }

        function updateOrderStatus(idx, newStatus) {
            store.orders[idx].status = newStatus;
            saveToCloud();
            render();
        }

        // ================= 6. لوحة الإدارة (Admin Panel) =================
        function renderAdminPanel() {
            return `
                <div class="min-h-screen bg-[#090d16] text-white p-6 max-w-xl mx-auto space-y-6 pb-32">
                    <div class="flex justify-between items-center pb-4 border-b border-white/10">
                        <button onclick="setPage('landing')" class="glass px-3 py-1.5 rounded-xl text-xs font-bold">الرئيسية</button>
                        <h1 class="font-black text-sm text-amber-400">⚙️ إعدادات المطعم السحابي</h1>
                        <button onclick="setPage('menu')" class="glass px-3 py-1.5 rounded-xl text-xs font-bold text-emerald-400">المنيو</button>
                    </div>

                    <div class="glass p-5 rounded-3xl space-y-3 text-xs border border-white/10">
                        <h3 class="font-black text-amber-400 text-sm">بيانات المطعم السحابي</h3>
                        <label class="block text-slate-400">اسم المطعم</label>
                        <input type="text" id="adm_name" value="${store.restaurant.name}" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white font-bold outline-none">

                        <label class="block text-slate-400">رقم واتساب الطلبات</label>
                        <input type="text" id="adm_wa" value="${store.restaurant.phone}" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white font-bold outline-none">

                        <label class="block text-emerald-400 font-bold">PIN الكاشير</label>
                        <input type="text" id="adm_pin" value="${store.restaurant.pin}" class="w-full bg-slate-950 border border-emerald-500/50 p-3 rounded-xl text-emerald-400 font-black text-center text-lg outline-none">

                        <button onclick="saveAdminSettings()" class="w-full gold-gradient text-slate-950 font-black py-3.5 rounded-xl">حفظ التعديلات سحابياً 🚀</button>
                    </div>
                </div>
            `;
        }

        function saveAdminSettings() {
            store.restaurant.name = document.getElementById('adm_name').value.trim();
            store.restaurant.phone = document.getElementById('adm_wa').value.trim();
            store.restaurant.pin = document.getElementById('adm_pin').value.trim() || '1234';
            saveToCloud();
            alert('✅ تم حفظ البيانات وربطها سحابياً بنجاح!');
            setPage('landing');
        }

        // فحص الروابط والـ Query Params عند التحميل
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('view') === 'menu') {
            appState.page = 'menu';
        }

        render();
    </script>
</body>
</html>
