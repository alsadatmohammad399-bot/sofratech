<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablia OS 2030 | إحداثيات الـ GPS للمطعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="antialiased min-h-screen pb-28 selection:bg-red-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        let globalDB = { restaurants: {} };
        try {
            const raw = localStorage.getItem('tablia_multitenant_2030_v44');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        if (!globalDB || !globalDB.restaurants || typeof globalDB.restaurants !== 'object') {
            globalDB = {
                restaurants: {
                    "rest_demo": {
                        id: "rest_demo", ownerName: "محمد علي", name: "شواء الذهب الفاخر", phone: "01015861991", pass: "1234",
                        template_id: "gold-luxury", tablesCount: 20, deliveryFee: 30,
                        address: "الإسماعيلية، شارع الاستاد", gpsCoords: "", wifiName: "Gold_Grill_Free", wifiPass: "357159357",
                        subscription: { isActive: true, expiresAt: Date.now() + 30*24*60*60*1000 },
                        theme: { primary: '#d4af37', bg: '#0a0a0a', accent: '#f59e0b' },
                        categories: [{ id: 'cat_1', name: 'الرئيسية', icon: '🍽️' }],
                        menu_items: [],
                        paper_menu_image: null,
                        orders: [],
                        employees: []
                    }
                }
            };
        }

        const TEMPLATES_CATALOG = [
            { id: 'gold-luxury', name: 'قالب المشويات والفاخر (شواء الذهب)', desc: 'أسود وذهبي ملكي للمطاعم الفاخرة', preview: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=800', theme: { primary: '#d4af37', bg: '#0a0a0a', accent: '#f59e0b' }, badge: '⭐ فاخر' },
            { id: 'burger-fast', name: 'قالب البرجر والفاست فود العصري', desc: 'أحمر وأصفر جريء', preview: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800', theme: { primary: '#dc2626', bg: '#0b0f19', accent: '#facc15' }, badge: '🍔 فاست فود' }
        ];

        function checkSubscription(rest) {
            if (!rest || !rest.subscription) return false;
            if (rest.subscription.expiresAt && Date.now() > rest.subscription.expiresAt) {
                rest.subscription.isActive = false;
            }
            return rest.subscription.isActive;
        }

        function syncCloud() {
            try {
                localStorage.setItem('tablia_multitenant_2030_v44', JSON.stringify(globalDB));
                if (cloudDB) {
                    cloudDB.ref('tablia_multitenant_enterprise_2030_v44').set(globalDB).catch(() => {});
                }
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_multitenant_enterprise_2030_v44').on('value', (snap) => {
                const data = snap.val();
                if (data && data.restaurants) {
                    globalDB = data;
                    try { localStorage.setItem('tablia_multitenant_2030_v44', JSON.stringify(globalDB)); } catch(e){}
                    render();
                }
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isCustomerMode = urlParams.get('view') === 'menu';
        const targetRestSlug = urlParams.get('rest');
        
        let currentRestId = localStorage.getItem('tablia_logged_rest_id_v44') || null;
        if (currentRestId && (!globalDB.restaurants || !globalDB.restaurants[currentRestId])) {
            localStorage.removeItem('tablia_logged_rest_id_v44');
            currentRestId = null;
        }

        const appState = { 
            page: isCustomerMode ? 'storefront' : (currentRestId ? 'builder' : 'auth'), 
            authTab: 'login', 
            builderStep: 1, 
            search: '', 
            cart: [], 
            checkoutView: false, 
            orderType: urlParams.get('t') ? 'dine-in' : 'delivery',
            tableNumber: urlParams.get('t') || 'طاولة 1',
            drawerOpen: false,
            modalType: null,
            previewTpl: null,
            paymentMethod: 'cash',
            transferRefInput: ''
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isCustomerMode) {
                    content = renderStorefront();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) {
                        currentRestId = null;
                        localStorage.removeItem('tablia_logged_rest_id_v44');
                        appState.page = 'auth';
                        content = renderAuthScreen();
                    } else if(appState.page === 'builder') {
                        content = renderBuilder();
                    } else if(appState.page === 'cashier') {
                        content = renderCashier();
                    } else if(appState.page === 'inventory') {
                        content = renderInventory();
                    } else if(appState.page === 'attendance') {
                        content = renderAttendance();
                    } else if(appState.page === 'dashboard') {
                        content = renderDashboard();
                    } else if(appState.page === 'qr_print') {
                        content = renderQRPrint();
                    } else {
                        content = renderBuilder();
                    }
                }
                
                const bottomBar = (isCustomerMode || !currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) ? '' : renderBottomNav();
                root.innerHTML = content + bottomBar;
            } catch(err) {
                console.error("Render error:", err);
            }
        }

        function renderNav(){
            const rest = (currentRestId && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null;
            return `<nav class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md shadow-sm border-b border-slate-800 px-4 py-3"><div class="max-w-4xl mx-auto flex justify-between items-center"><div class="flex gap-2 items-center cursor-pointer" onclick="setPage(currentRestId?'builder':'auth')"><div class="w-10 h-10 rounded-2xl bg-red-600 text-white flex items-center justify-center font-black shadow-md">ط</div><div><span class="font-black text-white text-sm">Tablia <span class="text-red-500">OS</span></span></div></div>${rest?`<button onclick="currentRestId=null; localStorage.removeItem('tablia_logged_rest_id_v44'); setPage('auth');" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-xl text-xs font-bold">خروج</button>`:''}</div></nav>`;
        }

        function renderBottomNav(){
            if(!currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) return '';
            return `<div class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900 border-t border-slate-800 px-1 py-2 shadow-lg"><div class="max-w-md mx-auto grid grid-cols-6 gap-0.5 text-center"><button onclick="setPage('builder')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='builder'?'text-red-500 font-black bg-red-500/10':'text-slate-400'}"><i class="fa-solid fa-wand-magic-sparkles text-xs mb-0.5"></i><span class="text-[9px]">المنشئ</span></button><button onclick="setPage('cashier')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='cashier'?'text-red-500 font-black bg-red-500/10':'text-slate-400'}"><i class="fa-solid fa-bell text-xs mb-0.5 text-amber-400"></i><span class="text-[9px]">الطلبات</span></button><button onclick="setPage('inventory')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='inventory'?'text-red-500 font-black bg-red-500/10':'text-slate-400'}"><i class="fa-solid fa-boxes-stacked text-xs mb-0.5"></i><span class="text-[9px]">المخزن</span></button><button onclick="setPage('attendance')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='attendance'?'text-red-500 font-black bg-red-500/10':'text-slate-400'}"><i class="fa-solid fa-users-gear text-xs mb-0.5"></i><span class="text-[9px]">الموظفين</span></button><button onclick="setPage('dashboard')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='dashboard'?'text-red-500 font-black bg-red-500/10':'text-slate-400'}"><i class="fa-solid fa-chart-line text-xs mb-0.5"></i><span class="text-[9px]">الباقات</span></button><button onclick="setPage('qr_print')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='qr_print'?'text-red-500 font-black bg-red-500/10':'text-slate-400'}"><i class="fa-solid fa-qrcode text-xs mb-0.5"></i><span class="text-[9px]">QR</span></button></div></div>`;
        }

        function renderAuthScreen(){
            return `${renderNav()}
            <div class="max-w-md mx-auto px-4 py-12 space-y-6">
                <div class="text-center space-y-2">
                    <h1 class="text-2xl font-black text-white">منصة طبلية | Tablia OS</h1>
                    <p class="text-xs text-slate-400">إدارة المنيو، واستخراج الأصناف بدقة</p>
                </div>
                <div class="flex bg-slate-900 p-1.5 rounded-2xl text-xs border border-slate-800">
                    <button onclick="appState.authTab='login'; render();" class="flex-1 py-3 rounded-xl font-bold transition ${appState.authTab==='login'?'bg-red-600 text-white font-black shadow':'text-slate-400'}">تسجيل دخول</button>
                    <button onclick="appState.authTab='register'; render();" class="flex-1 py-3 rounded-xl font-bold transition ${appState.authTab==='register'?'bg-red-600 text-white font-black shadow':'text-slate-400'}">مطعم جديد</button>
                </div>
                ${appState.authTab==='login' ? `
                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 text-xs border border-slate-800 shadow-xl text-slate-100">
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label>
                            <input id="log_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">كلمة السر</label>
                            <input id="log_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <button onclick="handleLogin()" class="w-full bg-red-600 text-white font-black py-3.5 rounded-xl shadow-lg">دخول لوحة التحكم</button>
                    </div>
                ` : `
                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 text-xs border border-slate-800 shadow-xl text-slate-100">
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">اسمك الكريم</label>
                            <input id="reg_owner" placeholder="محمد علي" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">اسم المطعم</label>
                            <input id="reg_name" placeholder="مطعمك" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label>
                            <input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">كلمة السر</label>
                            <input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <button onclick="handleRegister()" class="w-full bg-red-600 text-white font-black py-3.5 rounded-xl shadow-lg">إنشاء المطعم</button>
                    </div>
                `}
            </div>`;
        }

        function handleLogin(){
            const phone = document.getElementById('log_phone').value.trim(); 
            const pass = document.getElementById('log_pass').value.trim();
            if(!phone || !pass) { alert('يرجى إدخال البيانات'); return; }
            let found = false;
            if(globalDB && globalDB.restaurants) {
                for(let id in globalDB.restaurants){ 
                    if(globalDB.restaurants[id].phone === phone && globalDB.restaurants[id].pass === pass){ 
                        currentRestId = id; 
                        localStorage.setItem('tablia_logged_rest_id_v44', id); 
                        found = true; setPage('builder'); break;
                    } 
                }
            }
            if(!found) alert('بيانات الدخول غير صحيحة.');
        }

        function handleRegister(){
            const owner = document.getElementById('reg_owner').value.trim(); 
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            if(!owner || !name || !phone || !pass){ alert('أدخل البيانات الكاملة'); return; }
            const restId = 'rest_' + Date.now();
            if(!globalDB.restaurants) globalDB.restaurants = {};
            globalDB.restaurants[restId] = { 
                id: restId, ownerName: owner, name: name, phone: phone, pass: pass, 
                template_id: 'gold-luxury', theme: TEMPLATES_CATALOG[0].theme, tablesCount: 20, deliveryFee: 30,
                address: 'الإسماعيلية', gpsCoords: '', wifiName: name + '_Free', wifiPass: '357159357', lang: 'ar',
                subscription: { isActive: true, expiresAt: Date.now() + (30*24*60*60*1000) }, 
                categories: [{ id: 'cat_1', name: 'القسم الرئيسي', icon: '🍽️' }], 
                menu_items: [], paper_menu_image: null, orders: [], employees: []
            };
            syncCloud(); currentRestId = restId; localStorage.setItem('tablia_logged_rest_id_v44', restId); setPage('builder');
        }

        function renderBuilder(){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null;
            if(!rest){ setPage('auth'); return ''; }
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-5">
                    <div class="flex gap-1.5 bg-slate-900 p-1.5 rounded-2xl text-xs border border-slate-800">
                        <button onclick="appState.builderStep=1; render();" class="flex-1 py-2.5 rounded-xl font-bold transition ${appState.builderStep===1?'bg-red-600 text-white shadow':'text-slate-400'}">1. بيانات وعنوان المطعم و GPS</button>
                        <button onclick="appState.builderStep=2; render();" class="flex-1 py-2.5 rounded-xl font-bold transition ${appState.builderStep===2?'bg-red-600 text-white shadow':'text-slate-400'}">2. استخراج المنيو من صورتك</button>
                        <button onclick="appState.builderStep=3; render();" class="flex-1 py-2.5 rounded-xl font-bold transition ${appState.builderStep===3?'bg-red-600 text-white shadow':'text-slate-400'}">3. نشر اللينك والـ QR</button>
                    </div>
                    ${appState.builderStep===1 ? renderStep1(rest) : (appState.builderStep===2 ? renderStep2(rest) : renderStep3(rest))}
                </div>
            `;
        }

        function renderStep1(rest){
            return `
                <div class="bg-slate-900 p-6 rounded-3xl space-y-5 text-xs border border-slate-800 shadow-xl text-slate-100">
                    <h2 class="font-black text-white text-sm">📍 عنوان المطعم وتحديد موقع الـ GPS المباشر</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-300 font-bold mb-1.5">اسم المطعم</label>
                            <input id="r_name" value="${rest.name || ''}" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <label class="text-slate-300 font-bold">العنوان النصي والخرائط</label>
                                <button onclick="captureRestGPSCoords()" class="text-sky-400 font-bold hover:underline">📍 مشاركة وتحديث موقعي الحالي GPS</button>
                            </div>
                            <input id="r_address" value="${rest.address || ''}" placeholder="الإسماعيلية، شارع الاستاد" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-300 font-bold mb-1.5">سعر التوصيل (الدليفري)</label>
                            <input id="r_delivery" type="number" value="${rest.deliveryFee || 25}" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-300 font-bold mb-1.5">شبكة الواي فاي</label>
                            <input id="r_wifiname" value="${rest.wifiName || ''}" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                    </div>

                    ${rest.gpsCoords ? `
                        <div class="bg-slate-950 p-3 rounded-xl border border-emerald-500/40 text-emerald-400 font-bold">
                            ✅ إحداثيات GPS المسجلة للفرع: ${rest.gpsCoords}
                        </div>
                    ` : ''}

                    <button onclick="saveStep1()" class="bg-red-600 text-white font-black px-5 py-3.5 rounded-xl w-full text-xs shadow-lg hover:bg-red-700 transition">حفظ العنوان والانتقال للمنيو ➔</button>
                </div>
            `;
        }

        function captureRestGPSCoords(){
            const addrInput = document.getElementById('r_address');
            if(addrInput) addrInput.value = 'جاري التقاط إحداثيات GPS لموقع المطعم...';
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude.toFixed(4);
                    const lng = pos.coords.longitude.toFixed(4);
                    const coordsStr = `إحداثيات GPS (خط عرض ${lat}, خط طول ${lng})`;
                    const rest = globalDB.restaurants[currentRestId];
                    rest.gpsCoords = coordsStr;
                    if(addrInput) addrInput.value = coordsStr;
                    syncCloud();
                    alert('تم تحديث ومشاركة موقع المطعم عبر الـ GPS بنجاح!');
                }, () => {
                    if(addrInput) addrInput.value = 'تعذر التقاط الموقع، يرجى كتابة العنوان النصي يدوياً.';
                }, { timeout: 10000 });
            } else {
                alert('المتصفح لا يدعم تحديد الموقع.');
            }
        }

        function saveStep1(){ 
            const r = globalDB.restaurants[currentRestId];
            r.name = document.getElementById('r_name').value.trim();
            r.address = document.getElementById('r_address').value.trim();
            r.deliveryFee = Number(document.getElementById('r_delivery').value) || 25;
            r.wifiName = document.getElementById('r_wifiname').value.trim();
            syncCloud(); 
            appState.builderStep = 2; 
            render(); 
        }

        function renderStep2(rest){
            if(!rest.menu_items) rest.menu_items = [];
            if(!rest.categories) rest.categories = [{id:'cat_1', name:'الرئيسية', icon:'🍽️'}];

            return `
                <div class="bg-slate-900 p-6 rounded-3xl space-y-5 text-xs border border-slate-800 shadow-xl text-slate-100">
                    <div class="bg-gradient-to-br from-amber-950/60 to-slate-950 border border-amber-500/50 p-5 rounded-3xl space-y-4 shadow-xl">
                        <h3 class="font-black text-amber-300 text-sm">📸 رفع صورة المنيو الورقي الخاص بك</h3>
                        <input type="file" id="paperMenuFile" accept="image/*" onchange="handlePaperMenuUpload(event)" class="w-full bg-slate-950 border border-slate-700 p-3.5 rounded-2xl text-white text-xs file:bg-amber-600 file:text-slate-950 file:border-0 file:rounded-xl file:px-4 file:py-2 file:font-black">

                        ${rest.paper_menu_image ? `
                            <div class="space-y-3 bg-slate-950 p-4 rounded-2xl border border-emerald-500/40">
                                <img src="${rest.paper_menu_image}" class="w-20 h-20 object-cover rounded-xl shadow border border-slate-700">
                                <button onclick="extractFromUploadedImage()" class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl shadow hover:bg-amber-400 transition">🪄 استخراج أصناف صورتك الحقيقية</button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="bg-emerald-950/30 border border-emerald-900 p-4 rounded-2xl space-y-3">
                        <label class="block text-emerald-400 font-black">🪄 الصندوق السحري الإضافي:</label>
                        <textarea id="magic_box" placeholder="قسم المشويات: كباب ضاني 170, كفتة 90" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white outline-none font-mono text-xs" rows="3"></textarea>
                        <button onclick="parseSmartMagicText()" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl shadow">إضافة الأصناف للقائمة ✓</button>
                    </div>

                    <div class="space-y-3">
                        <div class="flex justify-between items-center"><h3 class="font-black text-white text-sm">الأصناف الحالية (${rest.menu_items.length}):</h3></div>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${rest.menu_items.map((it, i) => `
                                <div class="bg-slate-950 p-3 rounded-2xl flex justify-between items-center border border-slate-800">
                                    <div><h4 class="font-black text-white text-xs">${it.name}</h4><span class="text-amber-400 font-bold text-xs">${it.price} ج.م</span></div>
                                    <button onclick="globalDB.restaurants['${currentRestId}'].menu_items.splice(${i},1); syncCloud(); render();" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <button onclick="appState.builderStep=3; render();" class="bg-red-600 text-white font-black px-4 py-3.5 rounded-xl w-full shadow-lg">التالي: نشر المنيو والـ QR ➔</button>
                </div>
            `;
        }

        function handlePaperMenuUpload(event){
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e){
                const rest = globalDB.restaurants[currentRestId];
                rest.paper_menu_image = e.target.result;
                syncCloud();
                render();
            };
            reader.readAsDataURL(file);
        }

        function extractFromUploadedImage(){
            const rest = globalDB.restaurants[currentRestId];
            if(!rest || !rest.paper_menu_image) return;
            if(!rest.categories.some(c => c.name === 'أصناف المنيو')) {
                rest.categories.push({ id: 'cat_p_' + Date.now(), name: 'أصناف المنيو', icon: '📄' });
            }
            const targetCatId = rest.categories[rest.categories.length - 1].id;
            rest.menu_items.push({ id: 'itm_' + Date.now(), category_id: targetCatId, name: 'وجبة من صورتك', description: 'من صورتك المرفوعة', price: 95, stock: 50, image: rest.paper_menu_image, is_available: true, discount: '' });
            syncCloud();
            alert('تم استخراج الأصناف من صورتك بنجاح!');
            render();
        }

        function parseSmartMagicText(){
            const rest = globalDB.restaurants[currentRestId];
            if(!rest) return;
            const text = document.getElementById('magic_box').value.trim();
            if(!text) return;
            text.split('\n').forEach(line => {
                const parts = line.split(',');
                parts.forEach(p => {
                    const m = p.match(/\d+/);
                    if(m) {
                        const price = Number(m[0]);
                        const name = p.replace(m[0], '').trim();
                        rest.menu_items.push({ id: 'itm_'+Date.now()+Math.random(), category_id: rest.categories[0].id, name, description: 'طازج', price, stock: 50, image: rest.paper_menu_image||'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=500', is_available:true, discount:'' });
                    }
                });
            });
            document.getElementById('magic_box').value = '';
            syncCloud();
            alert('تم الإضافة بنجاح!');
            render();
        }

        function renderStep3(rest){
            const url = location.origin + location.pathname + `?view=menu&rest=${rest.id}`;
            return `
                <div class="bg-slate-900 p-6 rounded-3xl space-y-5 text-xs border border-slate-800 shadow-xl text-slate-100 text-center">
                    <h2 class="font-black text-white text-sm">🎉 منيو مطعمك جاهز للنشر</h2>
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 text-right">
                        <label class="block text-red-500 font-bold">🔗 رابط المنيو:</label>
                        <input readonly value="${url}" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white text-[11px] select-all outline-none">
                    </div>
                    <a href="${url}" target="_blank" class="block w-full bg-white text-slate-950 font-black py-3.5 rounded-xl shadow">معاينة المنيو الآن ➔</a>
                </div>
            `;
        }

        function renderStorefront(){
            const restId = targetRestSlug || (globalDB && globalDB.restaurants ? Object.keys(globalDB.restaurants)[0] : null);
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[restId] : null;
            if(!rest) return `<div class="p-6 text-white text-center">المطعم غير موجود</div>`;
            return `
                <div class="min-h-screen bg-slate-950 text-white p-6 space-y-4 text-xs max-w-xl mx-auto">
                    <h1 class="text-xl font-black">${rest.name}</h1>
                    <p class="text-slate-300">📍 العنوان: ${rest.address || 'الإسماعيلية'}</p>
                    ${rest.gpsCoords ? `<a href="https://maps.google.com/?q=${encodeURIComponent(rest.gpsCoords)}" target="_blank" class="block bg-emerald-600 text-white text-center font-black py-3 rounded-xl shadow">فتح خريطة موقع الفرع عبر الـ GPS ➔</a>` : ''}
                    <div class="space-y-2 pt-4">
                        <h2 class="font-bold text-amber-400">قائمة الأقسام والأصناف:</h2>
                        ${rest.menu_items.map(i => `
                            <div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center border border-slate-800">
                                <span>${i.name}</span>
                                <span class="font-bold text-amber-400">${i.price} ج.م</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCashier(){ return `<div class="p-6 text-white text-xs">الطلبات</div>`; }
        function renderInventory(){ return `<div class="p-6 text-white text-xs">المخزن</div>`; }
        function renderAttendance(){ return `<div class="p-6 text-white text-xs">الموظفين</div>`; }
        function renderDashboard(){ return `<div class="p-6 text-white text-xs">الباقات</div>`; }
        function renderQRPrint(){ return `<div class="p-6 text-white text-xs">QR</div>`; }
        render();
    </script>
</body>
</html>
