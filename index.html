<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرتك | Sofrtek - منيو إلكتروني QR Code ونظام كاشير سحابي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased min-h-screen selection:bg-brand-500 selection:text-white">

    <div id="app"></div>

    <script>
        // ضع مفتاح Gemini API الصحيح هنا (الذي يبدأ بـ AIzaSy)
        const GEMINI_API_KEY = "AQ.Ab8RN6JMav64oN075AW6pa9kHXjeBKW7j5pPKL_rFkvNTZlNeA";

        let globalDB = { shops: {} };
        try {
            const raw = localStorage.getItem('sofrtek_ultimate_db_2026');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        function syncDB() {
            try { localStorage.setItem('sofrtek_ultimate_db_2026', JSON.stringify(globalDB)); } catch(e) {}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isStore = urlParams.get('view') === 'store';
        const targetShop = urlParams.get('shop');
        let currentShopId = localStorage.getItem('sofrtek_logged_shop_id') || null;

        const appState = {
            page: isStore ? 'store' : (currentShopId ? 'dashboard' : 'landing'),
            cart: {}
        };

        function navigate(p) {
            appState.page = p;
            render();
            window.scrollTo(0,0);
        }

        function render() {
            const root = document.getElementById('app');
            if(!root) return;

            if (isStore || targetShop) {
                root.innerHTML = renderStorefront();
            } else if (appState.page === 'signup') {
                root.innerHTML = renderSignup();
            } else if (appState.page === 'dashboard' && currentShopId) {
                root.innerHTML = renderDashboard();
            } else {
                root.innerHTML = renderLanding();
            }
        }

        function renderLanding() {
            return `
                <div class="min-h-screen bg-white text-slate-900 font-cairo">
                    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-3">
                        <div class="max-w-6xl mx-auto flex justify-between items-center">
                            <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('landing')">
                                <div class="w-10 h-10 bg-brand-500 rounded-2xl flex items-center justify-center text-white font-black text-lg shadow-md">س</div>
                                <div>
                                    <h1 class="font-black text-slate-900 text-sm leading-tight">سفرتك</h1>
                                    <span class="text-[10px] text-slate-400 font-bold">Sofrtek OS</span>
                                </div>
                            </div>
                            <button onclick="navigate('signup')" class="bg-brand-500 text-white font-black px-5 py-2.5 rounded-2xl text-xs shadow-md">أنشئ مطعمك مجاناً</button>
                        </div>
                    </header>

                    <section class="max-w-6xl mx-auto px-4 py-16 md:py-24 grid grid-cols-1 md:grid-cols-2 gap-10 items-center">
                        <div class="space-y-6 text-center md:text-right">
                            <span class="bg-brand-50 text-brand-700 font-bold px-4 py-1.5 rounded-full text-xs inline-block border border-brand-100">مدعوم بالذكاء الاصطناعي Gemini</span>
                            <h1 class="text-3xl md:text-5xl font-black text-slate-900 leading-tight">
                                حسّن مطعمك ونقله للمستوي الرقمي بكل سهولة! 🚀📱
                            </h1>
                            <p class="text-slate-600 text-sm md:text-base leading-relaxed">
                                عايز تحول منيو مطعمك الورقي إلى "منيو إلكتروني QR Code" احترافي في ثواني وبـ مجاناً؟ مع <b>سفرتك (Sofrtek)</b> الموضوع بقت أسهل بكتير؛ كل اللي عليك تعملة تصوّر المنيو بكاميرا تليفونك أو ترفع صورة المنيو الحالي، وهيتحول أوتوماتيك لمنيو ديجيتال شيك وجاهز لاستقبال طلبات الزباين! 💡
                            </p>
                            
                            <div class="bg-slate-50 border border-slate-200 p-5 rounded-3xl space-y-3 text-right">
                                <h3 class="font-black text-slate-900 text-xs">خطوات بسيطة جداً:</h3>
                                <div class="space-y-2 text-xs font-bold text-slate-700">
                                    <div class="flex items-center gap-2"><span>1️⃣</span> سجل بحسابك أو ببريدك الإلكتروني.</div>
                                    <div class="flex items-center gap-2"><span>2️⃣</span> صور المنيو وهتلاقي الأصناف جاهزة قدامك.</div>
                                    <div class="flex items-center gap-2"><span>3️⃣</span> اطبع الـ QR واعرضه على الطاولات واستقبل الطلبات فوراً!</div>
                                </div>
                            </div>

                            <button onclick="navigate('signup')" class="bg-brand-500 hover:bg-brand-600 text-white font-black px-8 py-4 rounded-2xl shadow-lg text-sm transition">ابدأ مجانًا وزود مبيعاتك ➔</button>
                        </div>

                        <div class="bg-brand-50 border border-brand-100 p-8 rounded-3xl flex items-center justify-center shadow-inner">
                            <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100 text-center space-y-4 max-w-xs w-full">
                                <div class="w-24 h-24 bg-brand-100 rounded-2xl mx-auto flex items-center justify-center text-brand-600 text-3xl font-black shadow"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                                <h3 class="font-black text-slate-900 text-sm">قراءة المنيو بـ Gemini AI</h3>
                                <p class="text-[11px] text-slate-400">ارفع صورة المنيو الورقي لاستخراج الأصناف والأسعار بالذكاء الاصطناعي</p>
                            </div>
                        </div>
                    </section>
                </div>
            `;
        }

        function renderSignup() {
            return `
                <div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 font-cairo">
                    <div class="bg-white max-w-md w-full p-8 rounded-3xl shadow-xl border border-slate-200 space-y-6">
                        <div class="text-center space-y-2">
                            <div class="w-12 h-12 bg-brand-500 rounded-2xl mx-auto flex items-center justify-center text-white font-black text-xl">س</div>
                            <h1 class="text-xl font-black text-slate-900">أنشئ حسابك وابدأ مجاناً</h1>
                        </div>
                        <div class="space-y-3 text-xs">
                            <div><label class="block font-bold text-slate-700 mb-1">اسم المطعم</label><input id="shop_name" placeholder="مطعم البرنس" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl font-bold outline-none"></div>
                            <div><label class="block font-bold text-slate-700 mb-1">رقم الموبايل</label><input id="shop_phone" placeholder="01015861991" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl font-bold outline-none"></div>
                        </div>
                        <button onclick="createShop()" class="w-full bg-brand-500 text-white font-black py-4 rounded-2xl shadow-lg text-xs">إنشاء المنيو ➔</button>
                    </div>
                </div>
            `;
        }

        function createShop() {
            const name = document.getElementById('shop_name').value.trim();
            const phone = document.getElementById('shop_phone').value.trim();
            if(!name || !phone) { alert('أدخل اسم المطعم ورقم الموبايل!'); return; }
            
            const slug = name.replace(/\s+/g, '-').replace(/[^\w\u0600-\u06FF\-]/g, '') + '-' + Math.floor(100 + Math.random() * 900);
            globalDB.shops[slug] = { id: slug, name, phone, products: [], orders: [] };
            syncDB();
            currentShopId = slug;
            localStorage.setItem('sofrtek_logged_shop_id', slug);
            navigate('dashboard');
        }

        function renderDashboard() {
            const shop = globalDB.shops[currentShopId];
            if(!shop) return renderLanding();
            const link = location.origin + location.pathname + `?view=store&shop=${shop.id}`;
            const productsCount = (shop.products || []).length;

            return `
                <div class="min-h-screen bg-slate-50 p-6 max-w-xl mx-auto space-y-6 font-cairo text-xs">
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4 text-center">
                        <h1 class="font-black text-slate-900 text-base">أهلاً بيك في ${shop.name} 🚀</h1>
                        <p class="text-slate-500">الأصناف المسجلة حالياً: <b class="text-brand-600">${productsCount} صنف</b></p>
                        
                        <!-- زر رفع صورة المنيو الحقيقي لـ Gemini API -->
                        <div class="bg-brand-50 border border-brand-200 p-5 rounded-3xl space-y-3">
                            <h3 class="font-black text-brand-900 text-sm"><i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i> ارفع صورة المنيو (Gemini AI الحقيقي)</h3>
                            <p class="text-[11px] text-slate-600">صور المنيو الورقي أو ارفع صورته، وسيقوم جيميناي بتحليله واستخراج الأصناف فوراً</p>
                            <label class="bg-brand-500 hover:bg-brand-600 text-white font-black py-3 px-6 rounded-2xl shadow cursor-pointer inline-block transition">
                                <span>اختر صورة المنيو للتحليل</span>
                                <input type="file" accept="image/*" onchange="realGeminiOCR(event, '${shop.id}')" class="hidden">
                            </label>
                        </div>

                        <input readonly value="${link}" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-center font-mono text-brand-700 select-all">
                        <div class="grid grid-cols-2 gap-2">
                            <a href="${link}" target="_blank" class="bg-brand-500 text-white font-black py-3 rounded-xl text-center">معاينة المنيو ➔</a>
                            <button onclick="currentShopId=null; localStorage.removeItem('sofrtek_logged_shop_id'); navigate('landing');" class="bg-slate-100 text-slate-700 font-bold py-3 rounded-xl">تسجيل الخروج</button>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-3 shadow-xs">
                        <h3 class="font-black text-slate-900 text-sm">أصناف المنيو المستخرجة (${productsCount})</h3>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${productsCount === 0 ? `<p class="text-center text-slate-400 py-4">لم يتم إضافة أصناف بعد. ارفع صورة المنيو بالأعلى!</p>` : (shop.products || []).map((p, i) => `
                                <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center border border-slate-200">
                                    <div><span class="font-black text-slate-900">${p.name} (${p.cat})</span><span class="text-brand-600 block">${p.price} ج.م</span></div>
                                    <button onclick="shop.products.splice(${i},1); syncDB(); render();" class="text-red-500 font-bold p-2">حذف</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // الاتصال الفعلي والحقيقي بـ Gemini Vision API
        async function realGeminiOCR(event, shopId) {
            const file = event.target.files[0];
            if (!file) return;

            alert("⏳ جاري رفع الصورة وتحليلها عبر Gemini AI...");

            try {
                const base64Image = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "اقرأ صورة المنيو هذه بدقة، واستخرج جميع الأطباق والأصناف والأسعار. أرجع النتيجة فقط بصيغة مصفوفة JSON تحتوي على كائنات بالشكل التالي: [{\"cat\": \"اسم القسم مثل مشويات\", \"name\": \"اسم الصنف\", \"price\": 100}] بدون أي نصوص إضافية." },
                                { inline_data: { mime_type: file.type, data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || "فشل الاتصال بـ Gemini");

                const textResult = data.candidates[0].content.parts[0].text;
                const cleanJson = textResult.replace(/```json/g, '').replace(/```/g, '').trim();
                const items = JSON.parse(cleanJson);

                if (!globalDB.shops[shopId].products) globalDB.shops[shopId].products = [];

                items.forEach((item, index) => {
                    globalDB.shops[shopId].products.push({
                        id: 'ai_' + Date.now() + '_' + index,
                        cat: item.cat || 'أصناف عامة',
                        name: item.name,
                        price: Number(item.price) || 0
                    });
                });

                syncDB();
                alert(`🎉 نجح الذكاء الاصطناعي في قراءة المنيو وإضافة ${items.length} صنفاً بنجاح!`);
                render();

            } catch (err) {
                console.error(err);
                alert("❌ حدث خطأ أثناء قراءة المنيو: " + err.message);
            }
        }

        function renderStorefront() {
            const shopId = targetShopSlug || Object.keys(globalDB.shops)[0];
            const shop = globalDB.shops[shopId];
            if(!shop) return `<div class="p-8 text-center font-bold">المنيو غير موجود.</div>`;
            const products = shop.products || [];

            return `
                <div class="min-h-screen pb-28 bg-slate-50 font-cairo text-slate-900">
                    <header class="bg-white sticky top-0 z-30 border-b border-slate-200 px-4 py-3">
                        <div class="max-w-xl mx-auto flex justify-between items-center">
                            <h1 class="font-black text-sm">${shop.name}</h1>
                            <span class="bg-brand-50 text-brand-700 text-xs px-3 py-1 rounded-full font-bold">مفتوح الآن</span>
                        </div>
                    </header>
                    <div class="max-w-xl mx-auto px-4 pt-4">
                        <div class="grid grid-cols-2 gap-3">
                            ${products.length === 0 ? `<div class="col-span-2 text-center py-10 text-slate-400 font-bold">لا توجد أصناف متاحة حالياً</div>` : products.map(p => `
                                <div class="bg-white border border-slate-200 rounded-3xl p-3 shadow-xs space-y-2">
                                    <div class="h-24 bg-brand-50 rounded-2xl flex items-center justify-center text-brand-600 font-bold"><i class="fa-solid fa-utensils"></i></div>
                                    <h3 class="font-black text-xs text-slate-900">${p.name}</h3>
                                    <div class="flex justify-between items-center"><span class="font-black text-xs text-brand-600">${p.price} ج.م</span></div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
