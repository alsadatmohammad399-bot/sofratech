        if (!globalDB || !globalDB.restaurants || typeof globalDB.restaurants !== 'object') {
            globalDB = {
                restaurants: {

                        template_id: "luxury-text", tablesCount: 20, deliveryFee: 30,
                        address: "الرياض، المملكة العربية السعودية", wifiName: "Gold_Grill_Free", wifiPass: "357159357", lang: "ar",

                        services: { waiterCall: true, wifiService: true, branchLocation: true, deliveryService: true },

                        ],

                        ],
                        menu_items: [
                            { id: 'itm_1', category_id: 'cat_1', name: 'كيلو كباب ضاني', description: 'معد بعناية فائقة من أجود المكونات الطازجة', price: 1100, stock: 50, is_available: true, discount: '' },
                            { id: 'itm_2', category_id: 'cat_1', name: 'كيلو ريش ضاني', description: 'معد بعناية فائقة من أجود المكونات الطازجة', price: 1000, stock: 40, is_available: true, discount: '' }
                        ],
                        uploaded_gallery: [],
                        paper_menu_image: null,
                        orders: [],
                        employees: []
                    }
                }
            };
        }

        const TEMPLATES_CATALOG = [
            { id: 'luxury-text', name: '👑 القالب الفاخر بدون صور (الملكي الراقي)', desc: 'تصميم نصي فخم وأنيق للمطاعم الكلاسيكية والفاخرة بدون صور', preview: 'https://images.unsplash.com/photo-1514933651103-005eec06c04b?w=800', theme: { primary: '#d4af37', bg: '#080808', accent: '#f59e0b' }, badge: '👑 الأكثر فخامة' },
            { id: 'gold-luxury', name: 'قالب المشويات والفاخر (شواء الذهب)', desc: 'أسود وذهبي ملكي للمطاعم الفاخرة والأنيقة', preview: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=800', theme: { primary: '#d4af37', bg: '#0a0a0a', accent: '#f59e0b' }, badge: '⭐ فاخر' },
            { id: 'burger-fast', name: 'قالب البرجر والفاست فود العصري', desc: 'أحمر وأصفر جريء مع بانر عروض طازجة', preview: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800', theme: { primary: '#dc2626', bg: '#0b0f19', accent: '#facc15' }, badge: '🍔 فاست فود' },
            { id: 'cafe-warm', name: 'قالب الكافيه والمخبوزات (قهوة دفء)', desc: 'درجات البني الدافئ والبيج الراقي', preview: 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=800', theme: { primary: '#78350f', bg: '#fdf8f6', accent: '#d97706' }, badge: '☕ كافيهات' }
        ];

        function checkSubscription(rest) {
            if (!rest || !rest.subscription) return false;
            if (rest.subscription.expiresAt && Date.now() > rest.subscription.expiresAt) {
                rest.subscription.isActive = false;
            }
            return rest.subscription.isActive;
        }

        function syncCloud() {
            try {
                localStorage.setItem('tablia_multitenant_2030_v43', JSON.stringify(globalDB));
                if (cloudDB) {
                    cloudDB.ref('tablia_multitenant_enterprise_2030_v43').set(globalDB).catch(() => {});
                }
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_multitenant_enterprise_2030_v43').on('value', (snap) => {
                const data = snap.val();
                if (data && data.restaurants) {
                    if (currentRestId && data.restaurants[currentRestId]) {
                        const oldRest = globalDB.restaurants[currentRestId];
                        const newRest = data.restaurants[currentRestId];
                        const oldOrdersCount = oldRest && oldRest.orders ? oldRest.orders.length : 0;
                        const newOrdersCount = newRest && newRest.orders ? newRest.orders.length : 0;
                        if (newOrdersCount > oldOrdersCount) {
                            playBell();
                        }
                    }
                    globalDB = data;
                    try {
                        localStorage.setItem('tablia_multitenant_2030_v43', JSON.stringify(globalDB));
                    } catch(e){}
                    render();
                }
            });
        }

        function playBell(){
            try {
                const a = document.getElementById('cloud-bell');
                if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
                if('vibrate' in navigator) navigator.vibrate([400, 200, 400, 200, 400]);
            } catch(e){}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isSuperAdminMode = urlParams.get('view') === 'superadmin';
        const isCustomerMode = urlParams.get('view') === 'menu';
        const targetRestSlug = urlParams.get('rest');
        
        let currentRestId = localStorage.getItem('tablia_logged_rest_id') || null;
        if (currentRestId && (!globalDB.restaurants || !globalDB.restaurants[currentRestId])) {
            localStorage.removeItem('tablia_logged_rest_id');
            currentRestId = null;
        }

        const appState = { 
            page: isSuperAdminMode ? 'superadmin' : (isCustomerMode ? 'storefront' : (currentRestId ? 'builder' : 'auth')), 
            authTab: 'login', 
            builderStep: 1, 
            activeCat: 'all', 
            search: '', 
            cart: [], 
            checkoutView: false, 
            orderType: urlParams.get('t') ? 'dine-in' : 'delivery',
            tableNumber: urlParams.get('t') || 'طاولة 1', 
            activeOrderId: localStorage.getItem('tablia_active_order_id')||null, 
            trackerOpen: false, 
            superAdminUnlocked: false,
            drawerOpen: false,
            modalType: null,
            previewTpl: null,
            paymentMethod: 'cash',
            transferRefInput: ''
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isSuperAdminMode || appState.page === 'superadmin') {
                    content = renderSuperAdminView();
                } else if(isCustomerMode) {
                    content = renderStorefront();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) {
                        currentRestId = null;
                        localStorage.removeItem('tablia_logged_rest_id');
                        appState.page = 'auth';
                        content = renderAuthScreen();
                    } else if(appState.page === 'builder') {
                        content = renderBuilder();
                    } else if(appState.page === 'cashier') {
                        content = renderCashier();
                    } else if(appState.page === 'inventory') {
                        content = renderInventory();
                    } else if(appState.page === 'attendance') {
                        content = renderAttendance();
                    } else if(appState.page === 'dashboard') {
                        content = renderDashboard();
                    } else if(appState.page === 'qr_print') {
                        content = renderQRPrint();
                    } else {
                        content = renderBuilder();
                    }
                }
                
                const bottomBar = (isCustomerMode || isSuperAdminMode || appState.page==='superadmin' || !currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) ? '' : renderBottomNav();
                root.innerHTML = content + bottomBar + (appState.previewTpl ? renderPreviewModal() : '');
            } catch(err) {
                console.error("Render error:", err);
                root.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6 text-center bg-slate-950 text-white"><div class="glass p-6 rounded-3xl space-y-4 max-w-sm"><h2 class="text-amber-400 font-black text-base">إعادة تشغيل النظام</h2><p class="text-xs text-slate-400">تم تحديث النظام ليعمل بكفاءة عالية.</p><button onclick="localStorage.clear(); location.reload();" class="w-full bg-red-600 text-white font-black py-3 rounded-xl text-xs">تحديث وتشغيل فوري</button></div></div>`;
            }
        }

        function renderSuperAdminView(){
            if(!appState.superAdminUnlocked) {
                return `
                    <div class="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-white">
                        <div class="glass p-6 rounded-3xl max-w-sm w-full space-y-4 text-xs text-slate-900">
                            <div class="text-center space-y-1">
                                <div class="w-12 h-12 rounded-2xl bg-red-600 text-white mx-auto flex items-center justify-center font-black text-lg">ط</div>
                                <h2 class="font-black text-sm text-white">لوحة الإدارة العليا (الأدمن فقط)</h2>
                                <p class="text-[10px] text-slate-400">أدخل كلمة السر لتفعيل حسابات المطاعم</p>
                            </div>
                            <input id="super_pin" type="password" placeholder="كلمة السر السرية" class="w-full bg-slate-900 border border-slate-700 text-white p-3.5 rounded-xl text-center outline-none focus:border-red-600 font-bold">
                            <button onclick="if(document.getElementById('super_pin').value==='${PLATFORM_OWNER.adminPass}'){appState.superAdminUnlocked=true;render();}else{alert('كلمة السر غير صحيحة!')}" class="w-full bg-red-600 text-white font-black py-3.5 rounded-xl shadow">دخول لوحة التحكم العامة</button>
                            <a href="?" class="block text-center text-slate-400 text-[10px] hover:underline pt-2">العودة للرئيسية</a>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="max-w-4xl mx-auto px-4 py-10 space-y-5 text-xs text-slate-100">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm">
                        <div class="flex items-center gap-2">
                            <div class="w-9 h-9 rounded-xl bg-red-600 text-white flex items-center justify-center font-black">ط</div>
                            <h1 class="font-black text-sm">إدارة وتفعيل مطاعم المنصة (اشتراك شهر 30 يوم)</h1>
                        </div>
                        <a href="?" class="bg-slate-800 text-slate-300 font-bold px-3 py-2 rounded-xl">خروج</a>
                    </div>

                    <div class="space-y-3">
                        ${Object.values(globalDB.restaurants).map(r => {
                            const active = checkSubscription(r);
                            const daysLeft = r.subscription?.expiresAt ? Math.ceil((r.subscription.expiresAt - Date.now()) / (1000*60*60*24)) : 0;
                            return `
                                <div class="bg-slate-900 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border ${active?'border-emerald-500/40':'border-amber-500/40'} shadow-sm">
                                    <div>
                                        <h3 class="font-black text-sm">${r.name}</h3>
                                        <p class="text-slate-400 text-[11px] mt-0.5">المالك: ${r.ownerName} (${r.phone}) | سعر الدليفري: ${r.deliveryFee||25} ج.م</p>
                                        <span class="inline-block mt-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold ${active?'bg-emerald-500/20 text-emerald-400':'bg-amber-500/20 text-amber-400'}">
                                            ${active ? `مفعل ونشط (متبقي ${daysLeft} يوم) ✅` : 'الحساب منتهي أو غير مفعل (معاينة فقط) ⏸️'}
                                        </span>
                                    </div>
                                    <div class="flex gap-2 w-full sm:w-auto">
                                        <button onclick="globalDB.restaurants['${r.id}'].subscription={isActive:true, expiresAt:Date.now()+(30*24*60*60*1000)}; syncCloud(); render();" class="flex-1 sm:flex-none bg-emerald-600 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-emerald-500 transition">تفعيل شهر ✓</button>
                                        <button onclick="globalDB.restaurants['${r.id}'].subscription={isActive:false, expiresAt:Date.now()}; syncCloud(); render();" class="flex-1 sm:flex-none bg-red-950 text-red-400 px-4 py-2.5 rounded-xl font-bold hover:bg-red-900 transition">إيقاف ✕</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderNav(){
            const rest = (currentRestId && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null;
            return `<nav class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md shadow-sm border-b border-slate-800 px-4 py-3"><div class="max-w-4xl mx-auto flex justify-between items-center"><div class="flex gap-2 items-center cursor-pointer" onclick="setPage(currentRestId?'builder':'auth')"><div class="w-10 h-10 rounded-2xl bg-red-600 text-white flex items-center justify-center font-black shadow-md">ط</div><div><span class="font-black text-white text-sm">Tablia <span class="text-red-500">OS</span></span></div></div>${rest?`<button onclick="currentRestId=null; localStorage.removeItem('tablia_logged_rest_id'); setPage('auth');" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-500/20 transition">خروج</button>`:''}</div></nav>`;
        }

        function renderBottomNav(){
            if(!currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) return '';
            return `<div class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900 border-t border-slate-800 px-1 py-2 shadow-lg"><div class="max-w-md mx-auto grid grid-cols-6 gap-0.5 text-center"><button onclick="setPage('builder')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='builder'?'text-red-500 font-black bg-red-500/10':'text-slate-400 hover:text-white'}"><i class="fa-solid fa-wand-magic-sparkles text-xs mb-0.5"></i><span class="text-[9px]">المنشئ</span></button><button onclick="setPage('cashier')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='cashier'?'text-red-500 font-black bg-red-500/10':'text-slate-400 hover:text-white'}"><i class="fa-solid fa-bell text-xs mb-0.5 text-amber-400"></i><span class="text-[9px]">الطلبات</span></button><button onclick="setPage('inventory')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='inventory'?'text-red-500 font-black bg-red-500/10':'text-slate-400 hover:text-white'}"><i class="fa-solid fa-boxes-stacked text-xs mb-0.5"></i><span class="text-[9px]">المخزن</span></button><button onclick="setPage('attendance')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='attendance'?'text-red-500 font-black bg-red-500/10':'text-slate-400 hover:text-white'}"><i class="fa-solid fa-users-gear text-xs mb-0.5"></i><span class="text-[9px]">الموظفين</span></button><button onclick="setPage('dashboard')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='dashboard'?'text-red-500 font-black bg-red-500/10':'text-slate-400 hover:text-white'}"><i class="fa-solid fa-chart-line text-xs mb-0.5"></i><span class="text-[9px]">الباقات</span></button><button onclick="setPage('qr_print')" class="flex flex-col items-center py-1 rounded-xl transition ${appState.page==='qr_print'?'text-red-500 font-black bg-red-500/10':'text-slate-400 hover:text-white'}"><i class="fa-solid fa-qrcode text-xs mb-0.5"></i><span class="text-[9px]">QR</span></button></div></div>`;
        }

        function renderAuthScreen(){
            return `${renderNav()}
            <div class="max-w-md mx-auto px-4 py-12 space-y-6">
                <div class="text-center space-y-2">
                    <h1 class="text-2xl font-black text-white">منصة طبلية | Tablia OS</h1>
                    <p class="text-xs text-slate-400">صالة، دليفري، واتساب، ومكالمات مباشرة لكل مطعم</p>
                </div>
                <div class="flex bg-slate-900 p-1.5 rounded-2xl text-xs border border-slate-800">
                    <button onclick="appState.authTab='login'; render();" class="flex-1 py-3 rounded-xl font-bold transition ${appState.authTab==='login'?'bg-red-600 text-white font-black shadow':'text-slate-400 hover:text-white'}">تسجيل دخول</button>
                    <button onclick="appState.authTab='register'; render();" class="flex-1 py-3 rounded-xl font-bold transition ${appState.authTab==='register'?'bg-red-600 text-white font-black shadow':'text-slate-400 hover:text-white'}">مطعم جديد</button>
                </div>
                ${appState.authTab==='login' ? `
                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 text-xs border border-slate-800 shadow-xl text-slate-100">
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label>
                            <input id="log_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">كلمة السر</label>
                            <input id="log_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <button onclick="handleLogin()" class="w-full bg-red-600 text-white font-black py-3.5 rounded-xl shadow-lg hover:bg-red-700 transition">دخول لوحة التحكم</button>
                    </div>
                ` : `
                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 text-xs border border-slate-800 shadow-xl text-slate-100">
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">اسمك الكريم</label>
                            <input id="reg_owner" placeholder="محمد علي" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">اسم المطعم</label>
                            <input id="reg_name" placeholder="مطعم البرنس" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">رقم الموبايل (للطلب والواتساب)</label>
                            <input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">كلمة السر</label>
                            <input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <button onclick="handleRegister()" class="w-full bg-red-600 text-white font-black py-3.5 rounded-xl shadow-lg hover:bg-red-700 transition">إنشاء المطعم الآن</button>
                    </div>
                `}
            </div>`;
        }

        function handleLogin(){
            const phone = document.getElementById('log_phone').value.trim(); 
            const pass = document.getElementById('log_pass').value.trim();
            if(!phone || !pass) { alert('يرجى إدخال رقم الموبايل وكلمة السر'); return; }

            if(cloudDB) {
                cloudDB.ref('tablia_multitenant_enterprise_2030_v43').once('value').then(snap => {
                    const data = snap.val();
                    if(data && data.restaurants) {
                        globalDB = data;
                        localStorage.setItem('tablia_multitenant_2030_v43', JSON.stringify(globalDB));
                    }
                    verifyLoginData(phone, pass);
                }).catch(() => { verifyLoginData(phone, pass); });
            } else {
                verifyLoginData(phone, pass);
            }
        }

        function verifyLoginData(phone, pass) {
            let found = false;
            if(globalDB && globalDB.restaurants) {
                for(let id in globalDB.restaurants){ 
                    if(globalDB.restaurants[id].phone === phone && globalDB.restaurants[id].pass === pass){ 
                        currentRestId = id; 
                        localStorage.setItem('tablia_logged_rest_id', id); 
                        found = true;
                        setPage('builder'); 
                        break;
                    } 
                }
            }
            if(!found) {

                rest.coverImage = e.target.result;

                syncCloud();
                render();
            };
            reader.readAsDataURL(file);

            const text = document.getElementById('magic_box').value.trim(); 
            if(!text) return;

            let currentCatId = rest.categories.length > 0 ? rest.categories[0].id : 'cat_1';

            text.split('\n').forEach(line => {
                line = line.trim();
                if(!line) return;
                line.split(',').forEach(itemStr => {
                    parseAndAddItemTextOnly(rest, currentCatId, itemStr);

            });

            document.getElementById('magic_box').value = '';
            syncCloud();
            render();

        function addOfferToCart(offerId){

                alert('عذراً، المطعم غير مفعل حالياً من الإدارة.');
                return;

            const offer = rest.offers.find(o => o.id === offerId);
            if(!offer) return;
            const f = appState.cart.find(c => c.id === offerId);
            if(f) f.qty++; else appState.cart.push({ id: offer.id, name: '🔥 عرض: ' + offer.name, price: offer.price, qty: 1 });
            render();
        }

                                        <span>${item.qty}x ${item.name}</span>

                                <div class="flex justify-between text-white text-sm font-black pt-1 border-t border-slate-800"><span>الإجمالي النهائي:</span><span class="text-amber-400">${grandTotal} ج.م</span></div>
                            </div>
                        </div>

                        <div class="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-3">

        function sendOrderViaWhatsApp(restPhone){
            const name = document.getElementById('co_name') ? document.getElementById('co_name').value.trim() : '';
            const phone = document.getElementById('co_phone') ? document.getElementById('co_phone').value.trim() : '';
            const address = document.getElementById('co_addr') ? document.getElementById('co_addr').value.trim() : '';
            
            let cartText = appState.cart.map(i => `• ${i.qty}x ${i.name} (${i.price * i.qty} ج.م)`).join('\n');
            let total = appState.cart.reduce((s,i)=>s+(i.price*i.qty),0);

            let msg = `🛒 طلب جديد عبر الواتساب:\n`;
            msg += `👤 الاسم: ${name || 'غير محدد'}\n`;
            msg += `📞 الموبايل: ${phone || 'غير محدد'}\n`;
            msg += `📍 العنوان/الطاولة: ${address || 'غير محدد'}\n\n`;
            msg += `الأصناف:\n${cartText}\n\n`;
            msg += `💰 الإجمالي: ${total} ج.م`;

            window.open(`https://wa.me/2${restPhone}?text=` + encodeURIComponent(msg), '_blank');
        }

        function captureCheckoutGPS(){
            const addrInput = document.getElementById('co_addr');
            if(addrInput) addrInput.value = 'جاري التقاط إحداثيات الـ GPS...';
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude.toFixed(4);
                    const lng = pos.coords.longitude.toFixed(4);
                    if(addrInput) addrInput.value = `موقع GPS: (خط عرض ${lat}, خط طول ${lng}) - تم التقاطه بنجاح`;
                }, () => {
                    if(addrInput) addrInput.value = 'تعذر التقاط الموقع تلقائياً، يرجى كتابة العنوان بالتفصيل.';
                }, { timeout: 10000 });
            } else {
                if(addrInput) addrInput.value = 'المتصفح لا يدعم تحديد الموقع.';
            }
        }

        function addToCart(id){
            const restId = targetRestSlug || currentRestId || (globalDB && globalDB.restaurants ? Object.keys(globalDB.restaurants)[0] : null);
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[restId] : null;
            if(!rest || !rest.menu_items) return;
            const isSub = checkSubscription(rest);
            if(!isSub) {
                alert('عذراً، المطعم غير مفعل حالياً من الإدارة.');
                return;
            }
            const item = rest.menu_items.find(i => i.id === id);
            if(!item) return;
            const f = appState.cart.find(c => c.id === id);
            if(f) f.qty++; else appState.cart.push({...item, qty:1}); 
            render();
        }

        function submitOrderFromPage(restId, deliveryFee){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[restId] : null;
            if(!rest) return;
            const name = document.getElementById('co_name').value.trim();
            const phone = document.getElementById('co_phone').value.trim();
            const address = document.getElementById('co_addr').value.trim();
            const transferRef = document.getElementById('transfer_ref') ? document.getElementById('transfer_ref').value.trim() : '';

            if(!name || !phone) { alert('يرجى كتابة الاسم ورقم الموبايل!'); return; }
            if(appState.paymentMethod !== 'cash' && !transferRef) {
                alert('يرجى إدخال رقم المحفظة أو رقم عملية التحويل لتأكيد الدفع.');
                return;
            }

            if(!rest.orders) rest.orders = [];
            const itemsTotal = appState.cart.reduce((s,i)=>s+(i.price*i.qty),0);
            const isDelivery = appState.orderType === 'delivery';
            const total = itemsTotal + (isDelivery ? deliveryFee : 0);

            let orderTypeLabel = '🍽️ صالة المطعم';
            if(appState.orderType==='delivery') orderTypeLabel = '🛵 دليفري';
            if(appState.orderType==='pickup') orderTypeLabel = '🏪 استلام فرع';

            let paymentDisplay = '💵 كاش عند الاستلام';
            if(appState.paymentMethod==='vodafone') paymentDisplay = `📱 فودافون كاش (رقم المحول: ${transferRef})`;
            if(appState.paymentMethod==='instapay') paymentDisplay = `💳 InstaPay (رقم العملية: ${transferRef})`;

            appState.cart.forEach(cartItem => {
                const menuItem = rest.menu_items.find(m => m.id === cartItem.id);
                if(menuItem) {
                    menuItem.stock = Math.max(0, (menuItem.stock || 0) - cartItem.qty);
                }
            });
            
            rest.orders.unshift({
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customer_name: name,
                phone,
                order_type_label: orderTypeLabel,
                address: address || orderTypeLabel,
                items_json: JSON.parse(JSON.stringify(appState.cart)),
                items_total: itemsTotal,
                delivery_fee: isDelivery ? deliveryFee : 0,
                total,
                status: 'new',
                payment_method: appState.paymentMethod,
                payment_display: paymentDisplay,
                created_at: new Date().toLocaleTimeString('ar-EG')
            });

            appState.activeOrderId = rest.orders[0].id;
            localStorage.setItem('tablia_active_order_id', appState.activeOrderId);
            appState.cart = [];
            appState.checkoutView = false;
            appState.transferRefInput = '';
            syncCloud();
            playBell();
            alert('تم إرسال طلبك بنجاح ورن هاتف الويتر والمطعم فوراً!');
            render();
        }

        function renderDashboard(){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null; 
            if(!rest){ setPage('auth'); return ''; }
            const active = checkSubscription(rest);
            const daysLeft = rest.subscription?.expiresAt ? Math.max(0, Math.ceil((rest.subscription.expiresAt - Date.now()) / (1000*60*60*24))) : 0;
            
            return `
                ${renderNav()}
                <div class="max-w-md mx-auto px-4 py-12 text-center space-y-4 text-xs text-slate-100">
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-3">
                        <div class="w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 mx-auto flex items-center justify-center text-lg"><i class="fa-solid fa-store"></i></div>
                        <h2 class="font-black text-white text-sm">حالة اشتراك مطعمك (${rest.name})</h2>
                        <p class="text-slate-300 font-bold">${active ? `حسابك مفعل ونشط بالكامل ويستقبل طلبات الـ QR ✅ (متبقي ${daysLeft} يوم)` : 'حسابك غير مفعل حالياً أو انتهت مدة الشهر..'}</p>
                        <a href="https://wa.me/2${PLATFORM_OWNER.walletNumber}?text=${encodeURIComponent('تجديد وتفعيل مطعم '+rest.name+' لمدة شهر')}" target="_blank" class="block w-full bg-emerald-600 text-white font-black py-3 rounded-xl shadow">تفعيل أو تجديد الاشتراك عبر واتساب الإدارة</a>
                    </div>
                </div>
            `;
        }

        function renderQRPrint(){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null; 
            if(!rest){ setPage('auth'); return ''; }
            const base = location.origin + location.pathname + `?view=menu&rest=${rest.id}&t=`;
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-4 text-xs text-slate-100">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm">
                        <h1 class="font-black text-sm text-amber-400">QR Code الطاولات - ${rest.name}</h1>
                        <button onclick="window.print()" class="bg-amber-500 text-slate-950 px-4 py-2.5 rounded-xl font-black shadow">طباعة الكل 🖨️</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        ${Array.from({length: rest.tablesCount || 20}, (_, i) => i + 1).map(n => `
                            <div class="bg-slate-900 p-4 rounded-2xl text-center shadow-md space-y-2 border border-slate-800 text-white">
                                <div class="font-black text-xs text-amber-400">${rest.name}</div>
                                <div class="font-bold text-xs">طاولة رقم ${n}</div>
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(base + 'طاولة ' + n)}" class="w-28 h-28 mx-auto rounded-lg bg-white p-1">
                                <p class="text-[9px] text-slate-400">امسح الكود واطلب فوراً</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        render();
    </script>
</body>
</html>
