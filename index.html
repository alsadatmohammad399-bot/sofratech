<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرتك | Tablia OS - المنصة التجارية الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased min-h-screen bg-[#0b0f19] text-slate-100 selection:bg-red-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        let globalDB = { shops: {} };
        try {
            const raw = localStorage.getItem('tablia_saas_v1000');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        function syncCloud() {
            try {
                localStorage.setItem('tablia_saas_v1000', JSON.stringify(globalDB));
                if (cloudDB) cloudDB.ref('tablia_saas_enterprise_v1000').set(globalDB).catch(() => {});
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_saas_enterprise_v1000').on('value', (snap) => {
                const data = snap.val();
                if (data && data.shops) {
                    globalDB = data;
                    try { localStorage.setItem('tablia_saas_v1000', JSON.stringify(globalDB)); } catch(e){}
                    checkExpirations();
                    render();
                }
            });
        }

        // فحص انتهاء الاشتراك التلقائي (30 يوم)
        function checkExpirations() {
            let changed = false;
            const now = Date.now();
            Object.keys(globalDB.shops || {}).forEach(id => {
                const s = globalDB.shops[id];
                if (s.status === 'active' && s.expiresAt && now > s.expiresAt) {
                    s.status = 'expired';
                    changed = true;
                }
            });
            if(changed) syncCloud();
        }
        checkExpirations();

        function playBell(){
            try {
                const a = document.getElementById('cloud-bell');
                if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
                if('vibrate' in navigator) navigator.vibrate([400, 200, 400]);
            } catch(e){}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isAdminMode = urlParams.get('admin') === 'true'; 
        const isCustomerMode = urlParams.get('view') === 'store'; 
        const targetShopSlug = urlParams.get('shop');
        
        let currentShopId = localStorage.getItem('tablia_logged_shop_id') || null;

        const appState = { 
            page: isAdminMode ? 'admin_panel' : (isCustomerMode ? 'storefront' : (currentShopId ? 'builder' : 'auth')), 
            cart: [],
            selectedSize: 'M',
            checkoutStep: 'cart'
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isAdminMode) {
                    content = renderAdminDashboard();
                } else if(isCustomerMode) {
                    content = renderStorefront();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentShopId || !globalDB.shops?.[currentShopId]) { 
                        currentShopId = null; 
                        localStorage.removeItem('tablia_logged_shop_id');
                        appState.page = 'auth'; 
                        content = renderAuthScreen(); 
                    } else {
                        const shop = globalDB.shops[currentShopId];
                        if(shop.status === 'pending' || shop.status === 'expired') {
                            content = renderPendingScreen(shop);
                        } else if(appState.page === 'builder') {
                            content = renderBuilder();
                        } else if(appState.page === 'orders') {
                            content = renderOrders();
                        } else if(appState.page === 'design') {
                            content = renderDesignCustomizer();
                        } else if(appState.page === 'qr_print') {
                            content = renderQRPrint();
                        } else {
                            content = renderBuilder();
                        }
                    }
                }
                const bottomNav = (isAdminMode || isCustomerMode || !currentShopId || globalDB.shops[currentShopId]?.status !== 'active') ? '' : renderBottomNav();
                root.innerHTML = content + bottomNav;
            } catch(err) { console.error("Render Error:", err); }
        }

        function renderBottomNav(){
            return `
                <div class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900 border-t border-slate-800 px-1 py-2">
                    <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center text-slate-400">
                        <button onclick="setPage('builder')" class="flex flex-col items-center py-1 ${appState.page==='builder'?'text-red-500 font-black':''}"><i class="fa-solid fa-wand-magic-sparkles text-xs mb-0.5"></i><span class="text-[10px]">المنتجات</span></button>
                        <button onclick="setPage('design')" class="flex flex-col items-center py-1 ${appState.page==='design'?'text-red-500 font-black':''}"><i class="fa-solid fa-palette text-xs mb-0.5 text-sky-400"></i><span class="text-[10px]">المظهر</span></button>
                        <button onclick="setPage('orders')" class="flex flex-col items-center py-1 ${appState.page==='orders'?'text-red-500 font-black':''}"><i class="fa-solid fa-bell text-xs mb-0.5 text-amber-400"></i><span class="text-[10px]">الطلبات</span></button>
                        <button onclick="setPage('qr_print')" class="flex flex-col items-center py-1 ${appState.page==='qr_print'?'text-red-500 font-black':''}"><i class="fa-solid fa-qrcode text-xs mb-0.5"></i><span class="text-[10px]">QR</span></button>
                    </div>
                </div>
            `;
        }

        // ================= 1. لوحة تحكم الأدمن الآمنة =================
        function renderAdminDashboard(){
            const isAuth = sessionStorage.getItem('tablia_admin_auth') === 'true';
            if(!isAuth) {
                return `
                    <div class="max-w-md mx-auto px-4 py-20 space-y-6 text-xs text-center">
                        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-4">
                            <h1 class="text-xl font-black text-white">🔐 لوحة تحكم الإدارة (المالك)</h1>
                            <p class="text-slate-400">أدخل كلمة السر الخاصة بإدارة المنصة:</p>
                            <input id="admin_pass_box" type="password" placeholder="••••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold text-center outline-none">
                            <button onclick="loginAdmin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-xl shadow">دخول للإدارة ✓</button>
                        </div>
                    </div>
                `;
            }

            const shops = globalDB.shops || {};
            const shopIds = Object.keys(shops);

            return `
                <div class="max-w-4xl mx-auto px-4 py-8 space-y-6 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-5 rounded-3xl border border-slate-800">
                        <div>
                            <h1 class="font-black text-white text-base">👑 لوحة التحكم العامة (المالك)</h1>
                            <p class="text-slate-400">موافقة وتفعيل اشتراكات المحلات (600 ج/شهر لمدة 30 يوم)</p>
                        </div>
                        <button onclick="sessionStorage.removeItem('tablia_admin_auth'); window.location.href = location.pathname;" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl font-bold">خروج</button>
                    </div>

                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 border border-slate-800">
                        <h2 class="font-black text-white text-sm">المتاجر المسجلة (${shopIds.length})</h2>
                        <div class="space-y-3">
                            ${shopIds.length === 0 ? '<div class="text-slate-500 text-center py-6">لا توجد متاجر مسجلة بعد..</div>' : shopIds.map(id => {
                                const s = shops[id];
                                const expireDate = s.expiresAt ? new Date(s.expiresAt).toLocaleDateString('ar-EG') : 'غير مفعل';
                                return `
                                    <div class="bg-slate-950 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border border-slate-800">
                                        <div>
                                            <span class="font-black text-white text-sm">${s.name}</span>
                                            <span class="text-slate-400 block text-[10px]">${s.phone} | النشاط: ${s.type === 'restaurant' ? 'مطعم' : (s.type === 'clothes' ? 'ملابس' : 'أحذية')}</span>
                                            <span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold ${s.status==='active'?'bg-emerald-500/20 text-emerald-400':'bg-amber-500/20 text-amber-400'}">الحالة: ${s.status} (ينتهي في: ${expireDate})</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <button onclick="adminActivateShop('${id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl font-black">تفعيل شهر (30 يوم) ✅</button>
                                            <button onclick="adminSuspendShop('${id}')" class="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded-xl font-black">إيقاف ✕</button>
                                            <a href="?view=store&shop=${id}" target="_blank" class="bg-sky-600 text-white px-3 py-2 rounded-xl font-black">معاينة ➔</a>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function loginAdmin(){
            const p = document.getElementById('admin_pass_box').value;
            // باسورد الأدمن المشفر داخلياً بعيداً عن أعين المتصفح
            if(p === '357159'){
                sessionStorage.setItem('tablia_admin_auth', 'true');
                render();
            } else {
                alert('كلمة السر غير صحيحة!');
            }
        }

        // تفعيل شهر كامل (30 يوم بالمللي ثانية)
        function adminActivateShop(shopId){
            if(globalDB.shops[shopId]){
                globalDB.shops[shopId].status = 'active';
                globalDB.shops[shopId].expiresAt = Date.now() + (30 * 24 * 60 * 60 * 1000); // 30 يوماً بالضبط
                syncCloud();
                alert('✨ تم تفعيل المتجر لمدة 30 يوم بنجاح!');
                render();
            }
        }

        function adminSuspendShop(shopId){
            if(globalDB.shops[shopId]){
                globalDB.shops[shopId].status = 'pending';
                globalDB.shops[shopId].expiresAt = null;
                syncCloud();
                alert('⚠️ تم تعليق المتجر.');
                render();
            }
        }

        // ================= 2. تسجيل التاجر برقم الموبايل وباسورد مباشر (بدون OTP وهمي) =================
        function renderAuthScreen(){
            return `
                <div class="max-w-md mx-auto px-4 py-10 space-y-6 text-xs">
                    <div class="text-center space-y-2">
                        <h1 class="text-2xl font-black text-white">سفرتك | أنشئ متجرك الإلكتروني 🛒</h1>
                        <p class="text-slate-400">صمم متجرك أو منيو مطعمك بنفسك في ثوانٍ معدودة!</p>
                    </div>

                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 shadow-xl border border-slate-800">
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">نوع نشاطك التجاري</label>
                            <select id="reg_type" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                                <option value="restaurant">🍽️ مطعم / كافيه</option>
                                <option value="clothes">👕 محل ملابس وموضة</option>
                                <option value="shoes">👟 محل أحذية وكوتشيات</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">اسم المحل أو المتجر</label>
                            <input id="reg_name" placeholder="مثال: بوتيك الأريج / مطعم الشيف" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label>
                            <input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">كلمة السر</label>
                            <input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <button onclick="registerNewShop()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-xl shadow transition flex items-center justify-center gap-2">
                            إنشاء المتجر الآن ➔
                        </button>
                    </div>
                </div>
            `;
        }

        function registerNewShop(){
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            const type = document.getElementById('reg_type').value;
            
            if(!name || !phone || !pass){ alert('يرجى استكمال جميع البيانات!'); return; }
            
            // حل مشكلة الـ Slug العربي بإنشاء معرف نظيف وآمن برقم الموبايل
            let slug = 'shop-' + phone.replace(/[^0-9]/g, '') + '-' + Math.floor(10 + Math.random() * 90);

            let defaultProducts = [];
            let coverImg = 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800';

            if(type === 'restaurant') {
                coverImg = 'https://images.unsplash.com/photo-1544025162-d76694265947?w=800';
                defaultProducts = [
                    { id: 'p1', name: 'وجبة كبدة وسجق ساخنة', price: 65, image: 'https://images.unsplash.com/photo-1550547660-d9450f859349?w=400' },
                    { id: 'p2', name: 'حواوشي بلدي بالفلفل', price: 45, image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400' }
                ];
            } else if(type === 'clothes') {
                coverImg = 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800';
                defaultProducts = [
                    { id: 'p1', name: 'تيشرت قطن كاجوال شيك', price: 220, image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400' },
                    { id: 'p2', name: 'بنطلون جينز كلاسيك مودرن', price: 380, image: 'https://images.unsplash.com/photo-1542272604-787c3835535d?w=400' }
                ];
            } else {
                coverImg = 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800';
                defaultProducts = [
                    { id: 'p1', name: 'كوتشي رياضي مريح للجري', price: 450, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400' },
                    { id: 'p2', name: 'حذاء كلاسيك جلد طبيعي', price: 600, image: 'https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=400' }
                ];
            }

            globalDB.shops[slug] = { 
                id: slug, name, phone, pass, type,
                status: 'pending', // معلق لحين دفع الاشتراك (600 ج)
                expiresAt: null,
                address: 'مصر',
                coverImage: coverImg,
                logoImage: 'https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=300',
                theme: { bg: '#ffffff', primary: '#0f172a', accent: '#dc2626' },
                products: defaultProducts, orders: []
            };
            syncCloud(); 
            currentShopId = slug; 
            localStorage.setItem('tablia_logged_shop_id', slug); 
            render();
        }

        // شاشة الدفع المعلق (600 جنيه)
        function renderPendingScreen(shop){
            return `
                <div class="max-w-md mx-auto px-4 py-16 space-y-6 text-xs text-center">
                    <div class="bg-slate-900 p-8 rounded-3xl border border-amber-500/40 shadow-2xl space-y-5">
                        <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                            <i class="fa-solid fa-hourglass-half"></i>
                        </div>
                        <h1 class="text-xl font-black text-white">حسابك في انتظار تفعيل الاشتراك ⏳</h1>
                        <p class="text-slate-300 leading-relaxed">
                            تم تسجيل متجرك بنجاح يا <span class="text-amber-400 font-bold">${shop.name}</span>.<br>
                            لتفعيل متجرك لمدة 30 يوم كاملة، يرجى تحويل مبلغ <b>600 جنيه</b> على محفظة فودافون كاش:
                        </p>
                        
                        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 select-all font-mono text-amber-400 font-black text-base">
                            01015861991
                        </div>

                        <p class="text-[11px] text-slate-400">
                            ثم أرسل سكرين شوت التحويل عبر الواتساب لتفعيل حسابك فوراً!
                        </p>

                        <div class="grid grid-cols-2 gap-2 pt-2">
                            <a href="https://wa.me/201015861991?text=${encodeURIComponent('مرحباً، لقد قامت بتحويل 600 جنيه اشتراك متجر: ' + shop.name)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl flex items-center justify-center gap-1">
                                <i class="fa-brands fa-whatsapp"></i> إرسال التحويل
                            </a>
                            <button onclick="currentShopId=null; localStorage.removeItem('tablia_logged_shop_id'); render();" class="bg-slate-800 text-slate-300 font-bold py-3 rounded-xl">خروج</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 3. لوحة تحكم التاجر + رفع الصور للمنتجات + الصندوق السحري =================
        function renderBuilder(){
            const shop = globalDB.shops[currentShopId];
            if(!shop){ setPage('auth'); return ''; }
            const customLink = location.origin + location.pathname + `?view=store&shop=${shop.id}`;
            return `
                <div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-5 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                        <div>
                            <h1 class="font-black text-white text-sm">إدارة متجر: ${shop.name}</h1>
                            <span class="text-emerald-400 font-bold text-[10px]">النشاط: ${shop.type === 'restaurant' ? 'مطعم' : (shop.type === 'clothes' ? 'ملابس' : 'أحذية')} | مفعل ونشط ✓</span>
                        </div>
                        <button onclick="currentShopId=null; localStorage.removeItem('tablia_logged_shop_id'); setPage('auth');" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-xl font-bold">خروج</button>
                    </div>

                    <!-- إضافة منتج فردي مع رفع/لصق رابط الصورة -->
                    <div class="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3 shadow-xl">
                        <h2 class="font-black text-white text-sm">➕ إضافة منتج جديد (بالصورة والسعر)</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <input id="new_p_name" placeholder="اسم المنتج (مثال: تيشرت أسود)" class="bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-bold outline-none">
                            <input id="new_p_price" type="number" placeholder="السعر (بالجنيه)" class="bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-bold outline-none">
                            <input id="new_p_img" placeholder="رابط صورة المنتج (URL)" class="bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-bold outline-none">
                        </div>
                        <button onclick="addNewSingleProduct('${shop.id}')" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-3 rounded-xl shadow">إضافة المنتج للقائمة ✓</button>
                    </div>

                    <!-- الصندوق السحري -->
                    <div class="bg-slate-900 p-5 rounded-3xl border border-amber-500/30 space-y-3 shadow-xl">
                        <div class="flex items-center gap-2">
                            <span class="text-amber-400 text-base">🪄</span>
                            <h2 class="font-black text-amber-400 text-sm">الصندوق السحري (إضافة المنتجات باللصق السريع)</h2>
                        </div>
                        <p class="text-slate-400 text-[11px]">اكتب أو الصق المنتجات بالسعر تحت بعضها:</p>
                        <textarea id="magic_input" placeholder="تيشرت كاجوال 200&#10;بنطلون جينز 350" class="w-full h-24 bg-slate-950 border border-slate-800 p-3 rounded-2xl text-white font-mono text-xs outline-none focus:border-amber-500"></textarea>
                        <button onclick="parseMagicBox('${shop.id}')" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl shadow transition">توليد وإضافة المنتجات بالسحر ✨</button>
                    </div>

                    <!-- قائمة المنتجات الحالية مع زر الحذف -->
                    <div class="bg-slate-900 p-5 rounded-3xl space-y-4 border border-slate-800">
                        <h2 class="font-black text-white text-sm">📦 المنتجات المتاحة (${(shop.products||[]).length})</h2>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${(shop.products||[]).length === 0 ? '<div class="text-slate-500 text-center py-4">لا توجد منتجات مضافة بعد..</div>' : (shop.products||[]).map((item, idx) => `
                                <div class="bg-slate-950 p-3 rounded-xl flex justify-between items-center border border-slate-800">
                                    <div class="flex items-center gap-3">
                                        <img src="${item.image}" class="w-10 h-10 rounded-lg object-cover">
                                        <div>
                                            <span class="font-black text-white">${item.name}</span>
                                            <span class="text-amber-400 block">${item.price} جنيه</span>
                                        </div>
                                    </div>
                                    <button onclick="deleteProduct('${shop.id}', ${idx})" class="text-red-400 p-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- رابط المتجر -->
                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 border border-emerald-500/40 text-center shadow-2xl">
                        <h2 class="font-black text-emerald-400 text-sm">🎉 رابط متجرك (ابعته للزبائن)</h2>
                        <input readonly value="${customLink}" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-amber-400 font-mono text-center text-xs select-all">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="navigator.clipboard.writeText('${customLink}'); alert('تم نسخ اللينك!');" class="bg-amber-500 text-slate-950 font-black py-3 rounded-xl">نسخ اللينك</button>
                            <a href="?view=store&shop=${shop.id}" target="_blank" class="bg-emerald-600 text-white font-black py-3 rounded-xl flex items-center justify-center gap-1">معاينة المتجر ➔</a>
                        </div>
                    </div>
                </div>
            `;
        }

        function addNewSingleProduct(shopId){
            const shop = globalDB.shops[shopId];
            const name = document.getElementById('new_p_name').value.trim();
            const price = Number(document.getElementById('new_p_price').value);
            let img = document.getElementById('new_p_img').value.trim();

            if(!name || !price) { alert('يرجى كتابة اسم المنتج والسعر!'); return; }
            if(!img) {
                img = shop.type === 'restaurant' ? 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400' : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400';
            }

            if(!shop.products) shop.products = [];
            shop.products.push({ id: 'p_' + Date.now(), name, price, image: img });
            
            syncCloud();
            alert('✅ تم إضافة المنتج بنجاح!');
            render();
        }

        function parseMagicBox(shopId){
            const shop = globalDB.shops[shopId];
            const rawText = document.getElementById('magic_input').value.trim();
            if(!rawText) { alert('يرجى كتابة المنتجات في الصندوق السحري أولاً!'); return; }

            if(!shop.products) shop.products = [];

            let defaultImg = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400';
            if(shop.type === 'restaurant') defaultImg = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400';

            rawText.split('\n').forEach(line => {
                line = line.trim();
                if(!line) return;
                const matchPrice = line.match(/\d+/);
                if(matchPrice) {
                    const price = Number(matchPrice[0]);
                    const name = line.replace(matchPrice[0], '').replace(/جنيه|جنيهاً|ج/g, '').trim();
                    shop.products.push({
                        id: 'prod_' + Date.now() + Math.random(),
                        name: name || 'منتج مميز',
                        price: price,
                        image: defaultImg
                    });
                }
            });

            document.getElementById('magic_input').value = '';
            syncCloud();
            alert('✨ تم توليد وإضافة المنتجات بنجاح!');
            render();
        }

        function deleteProduct(shopId, idx){
            globalDB.shops[shopId].products.splice(idx, 1);
            syncCloud();
            render();
        }

        function renderOrders(){
            const shop = globalDB.shops[currentShopId];
            if(!shop) return '';
            if(!shop.orders) shop.orders = [];
            return `
                <div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                        <h1 class="font-black text-white text-sm">🔔 طلبات العملاء</h1>
                        <span class="bg-amber-500/20 text-amber-400 font-bold px-3 py-1 rounded-full">الطلبات: ${shop.orders.length}</span>
                    </div>
                    <div class="space-y-3">
                        ${shop.orders.length === 0 ? `<div class="bg-slate-900 p-12 text-center text-slate-500 rounded-3xl border border-slate-800">لا توجد طلبات جديدة..</div>` : shop.orders.map((ord, i) => `
                            <div class="bg-slate-900 p-4 rounded-3xl space-y-3 border border-slate-800">
                                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <div>
                                        <span class="font-black text-white text-sm">${ord.customer_name}</span>
                                        <span class="text-amber-400 font-bold block text-[11px]"><i class="fa-solid fa-phone"></i> ${ord.phone}</span>
                                        <span class="text-slate-300 block text-[10px]"><i class="fa-solid fa-location-dot"></i> ${ord.address} ${ord.meta && ord.meta.size ? '| المقاس: ' + ord.meta.size : ''}</span>
                                    </div>
                                    <div class="text-left"><span class="text-amber-400 font-black text-sm">${ord.total} جنيه</span></div>
                                </div>
                                <div class="text-slate-300 text-[11px] bg-slate-950 p-2.5 rounded-xl">
                                    <div>${(ord.items||[]).map(x => `• ${x.qty}x ${x.name} (${x.price * x.qty} ج)`).join('<br>')}</div>
                                </div>
                                <button onclick="globalDB.shops['${currentShopId}'].orders.splice(${i},1); syncCloud(); render();" class="w-full bg-red-500/20 text-red-400 py-2 rounded-xl font-bold">حذف الطلب</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderQRPrint(){ 
            const shop = globalDB.shops[currentShopId];
            const base = location.origin + location.pathname + `?view=store&shop=${shop.id}&t=`;
            return `<div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-4 text-xs"><h1 class="font-black text-amber-400 bg-slate-900 p-4 rounded-2xl">طباعة أكواد QR للطاولات</h1><div class="grid grid-cols-2 gap-3">${Array.from({length:10},(_,i)=>i+1).map(n=>`<div class="bg-slate-900 p-4 rounded-2xl text-center space-y-2"><div class="font-bold">طاولة ${n}</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(base+'طاولة '+n)}" class="mx-auto rounded bg-white p-1"></div>`).join('')}</div></div>`; 
        }

        function renderDesignCustomizer(){
            const shop = globalDB.shops[currentShopId];
            if(!shop) return '';
            if(!shop.theme) shop.theme = { bg: '#ffffff', primary: '#0f172a', accent: '#dc2626' };

            return `
                <div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-5 text-xs">
                    <div class="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-4">
                        <h1 class="font-black text-white text-sm">🎨 تخصيص مظهر المتجر</h1>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-slate-300 mb-1 font-bold">لون الخلفية</label>
                                <input type="color" id="theme_bg" value="${shop.theme.bg || '#ffffff'}" class="w-full h-12 bg-slate-950 rounded-xl cursor-pointer">
                            </div>
                            <div>
                                <label class="block text-slate-300 mb-1 font-bold">لون العناوين والأزرار</label>
                                <input type="color" id="theme_primary" value="${shop.theme.primary || '#0f172a'}" class="w-full h-12 bg-slate-950 rounded-xl cursor-pointer">
                            </div>
                        </div>
                        <button onclick="saveTheme('${shop.id}')" class="w-full bg-sky-600 text-white font-black py-3.5 rounded-xl shadow">حفظ الألوان ✓</button>
                    </div>
                </div>
            `;
        }

        function saveTheme(shopId){
            const shop = globalDB.shops[shopId];
            shop.theme = { bg: document.getElementById('theme_bg').value, primary: document.getElementById('theme_primary').value, accent: '#dc2626' };
            syncCloud();
            alert('🎨 تم تحديث الألوان!');
            render();
        }

        // ================= 4. واجهة المتجر للعملاء مع السلة وصفحة التوصيل =================
        function renderStorefront(){
            const shopId = targetShopSlug || Object.keys(globalDB.shops)[0];
            const shop = globalDB.shops[shopId];
            if(!shop) return `<div class="min-h-screen flex items-center justify-center text-white">المتجر غير موجود</div>`;

            if(shop.status !== 'active') {
                return `<div class="min-h-screen flex items-center justify-center text-white px-4 text-center">عذراً، هذا المتجر موقوف أو انتهى اشتراكه الشهري. يرجى تجديد الاشتراك.</div>`;
            }

            const theme = shop.theme || { bg: '#f8fafc', primary: '#0f172a', accent: '#dc2626' };
            const cartCount = appState.cart.reduce((s,i)=>s+i.qty, 0);
            const cartTotal = appState.cart.reduce((s,i)=>s+(i.price*i.qty), 0);

            if(appState.checkoutStep === 'details') {
                return `
                    <div class="min-h-screen p-4 flex items-center justify-center" style="background-color: ${theme.bg}; color: ${theme.primary};">
                        <div class="max-w-md w-full bg-white p-6 rounded-3xl shadow-xl border border-slate-200 space-y-4 text-xs">
                            <div class="text-center space-y-1">
                                <h1 class="text-lg font-black text-slate-900">📝 بيانات التوصيل</h1>
                                <p class="text-slate-500">أدخل اسمك ورقمك وعنوانك لتأكيد الطلب لدى ${shop.name}</p>
                            </div>

                            <div class="space-y-3">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">الاسم بالكامل</label>
                                    <input id="cust_name" placeholder="اكتب اسمك هنا..." class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold outline-none text-slate-900">
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">رقم الموبايل</label>
                                    <input id="cust_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold outline-none text-slate-900">
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">العنوان بالتفصيل (الشارع / رقم العمارة)</label>
                                    <textarea id="cust_address" placeholder="اسم الشارع، رقم العمارة، الدور..." class="w-full h-20 bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold outline-none text-slate-900"></textarea>
                                </div>
                            </div>

                            <div class="bg-slate-50 p-3 rounded-xl flex justify-between font-black text-slate-900">
                                <span>إجمالي الطلب:</span>
                                <span class="text-red-600">${cartTotal} جنيه</span>
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="appState.checkoutStep='drawer'; render();" class="bg-slate-200 text-slate-700 font-bold py-3 rounded-xl">رجوع للسلة</button>
                                <button onclick="confirmAndSendOrder('${shop.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl shadow">إرسال الطلب الآن ➔</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            if(appState.checkoutStep === 'drawer') {
                return `
                    <div class="min-h-screen p-4 pb-28 max-w-xl mx-auto space-y-4 text-xs" style="background-color: ${theme.bg}; color: ${theme.primary};">
                        <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                            <h1 class="font-black text-sm text-slate-900"><i class="fa-solid fa-basket-shopping text-red-600"></i> سلة مقتنياتك (${cartCount})</h1>
                            <button onclick="appState.checkoutStep='cart'; render();" class="text-slate-500 font-bold hover:text-slate-900">إغلاق ✕</button>
                        </div>

                        <div class="space-y-3">
                            ${appState.cart.length === 0 ? `<div class="bg-white p-12 text-center text-slate-400 rounded-3xl border border-slate-200">سلة التسوق فارغة حالياً..</div>` : appState.cart.map((item, idx) => `
                                <div class="bg-white p-3.5 rounded-2xl flex justify-between items-center border border-slate-200 shadow-xs">
                                    <div class="flex items-center gap-3">
                                        <img src="${item.image}" class="w-12 h-12 rounded-xl object-cover bg-slate-100">
                                        <div>
                                            <h3 class="font-black text-slate-900">${item.name}</h3>
                                            <span class="text-red-600 font-bold">${item.price * item.qty} جنيه</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-xl font-bold">
                                        <button onclick="updateCartQty(${idx}, -1)" class="w-6 h-6 bg-white rounded-lg shadow-xs">-</button>
                                        <span class="w-5 text-center text-slate-900">${item.qty}</span>
                                        <button onclick="updateCartQty(${idx}, 1)" class="w-6 h-6 bg-white rounded-lg shadow-xs">+</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        ${appState.cart.length > 0 ? `
                            <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-3 shadow-xs">
                                <div class="flex justify-between font-black text-sm text-slate-900">
                                    <span>الإجمالي الكلي:</span>
                                    <span class="text-red-600">${cartTotal} جنيه</span>
                                </div>
                                <button onclick="appState.checkoutStep='details'; render();" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl shadow">متابعة لإدخال بيانات التوصيل ➔</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            return `
                <div class="min-h-screen pb-28" style="background-color: ${theme.bg}; color: ${theme.primary};">
                    <header class="bg-white sticky top-0 z-50 border-b border-slate-200 px-4 py-3 shadow-xs">
                        <div class="max-w-xl mx-auto flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <img src="${shop.logoImage}" class="w-9 h-9 rounded-full object-cover border">
                                <span class="font-black text-sm" style="color: ${theme.primary};">${shop.name}</span>
                            </div>
                            <button onclick="appState.checkoutStep='drawer'; render();" class="relative bg-slate-100 hover:bg-slate-200 text-slate-800 px-3.5 py-1.5 rounded-xl font-bold flex items-center gap-1.5 text-xs">
                                <i class="fa-solid fa-cart-shopping text-red-600"></i>
                                <span>السلة</span>
                                ${cartCount > 0 ? `<span class="bg-red-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black">${cartCount}</span>` : ''}
                            </button>
                        </div>
                    </header>

                    <div class="relative h-44 w-full bg-slate-900 overflow-hidden">
                        <img src="${shop.coverImage}" class="w-full h-full object-cover opacity-80">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent flex items-end p-4">
                            <div class="text-white">
                                <h1 class="font-black text-lg">${shop.name}</h1>
                                <p class="text-[11px] text-slate-200"><i class="fa-solid fa-location-dot text-amber-400"></i> ${shop.address}</p>
                            </div>
                        </div>
                    </div>

                    ${shop.type === 'clothes' || shop.type === 'shoes' ? `
                        <div class="max-w-xl mx-auto px-3 pt-4">
                            <div class="bg-white border border-slate-200 p-3 rounded-2xl shadow-xs space-y-2 text-xs">
                                <div class="flex items-center justify-between">
                                    <span class="font-bold text-slate-700">اختر المقاس:</span>
                                    <div class="flex gap-1.5">
                                        ${['S', 'M', 'L', 'XL', 'XXL'].map(sz => `
                                            <button onclick="appState.selectedSize='${sz}'; render();" class="px-2.5 py-1 rounded-lg font-black border ${appState.selectedSize===sz?'bg-slate-900 text-white':'bg-slate-100 text-slate-700'}">${sz}</button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="max-w-xl mx-auto px-3 pt-6 space-y-4">
                        <h2 class="font-black text-sm px-1">المنتجات المعروضة</h2>
                        <div class="grid grid-cols-2 gap-3">
                            ${(shop.products||[]).map(prod => `
                                <div onclick="addToCart('${prod.id}')" class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-xs cursor-pointer active:scale-95 transition flex flex-col justify-between">
                                    <img src="${prod.image}" class="w-full h-36 object-cover bg-slate-100">
                                    <div class="p-3 space-y-1">
                                        <h3 class="font-black text-xs text-slate-900 truncate">${prod.name}</h3>
                                        <div class="flex justify-between items-center">
                                            <span class="font-black text-xs text-red-600">${prod.price} جنيه</span>
                                            <span class="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded">إضافة +</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${cartCount > 0 ? `
                        <div class="fixed bottom-3 left-3 right-3 max-w-xl mx-auto z-50">
                            <button onclick="appState.checkoutStep='drawer'; render();" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 px-5 rounded-2xl shadow-xl flex items-center justify-between font-black text-xs transition">
                                <div class="flex items-center gap-2">
                                    <span class="bg-white/20 px-2 py-0.5 rounded-lg text-xs">${cartCount}</span>
                                    <span>عرض السلة وإتمام الطلب (${cartTotal} جنيه)</span>
                                </div>
                                <span class="flex items-center gap-1">افتح السلة <i class="fa-solid fa-arrow-left"></i></span>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addToCart(prodId){
            const shop = globalDB.shops[targetShopSlug || Object.keys(globalDB.shops)[0]];
            const prod = shop.products.find(p => p.id === prodId);
            if(!prod) return;
            const found = appState.cart.find(c => c.id === prodId);
            if(found) found.qty++; else appState.cart.push({...prod, qty: 1});
            render();
        }

        function updateCartQty(idx, change){
            appState.cart[idx].qty += change;
            if(appState.cart[idx].qty <= 0) {
                appState.cart.splice(idx, 1);
            }
            render();
        }

        function confirmAndSendOrder(shopId){
            const name = document.getElementById('cust_name').value.trim();
            const phone = document.getElementById('cust_phone').value.trim();
            const address = document.getElementById('cust_address').value.trim();

            if(!name || !phone || !address){
                alert('يرجى استكمال الاسم ورقم الموبايل والعنوان بالتفصيل!');
                return;
            }

            const shop = globalDB.shops[shopId];
            if(!shop.orders) shop.orders = [];
            const total = appState.cart.reduce((s,i)=>s+(i.price*i.qty), 0);

            shop.orders.unshift({
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customer_name: name,
                phone: phone,
                address: address,
                meta: { size: appState.selectedSize },
                items: JSON.parse(JSON.stringify(appState.cart)),
                total: total,
                created_at: new Date().toLocaleTimeString('ar-EG')
            });

            appState.cart = [];
            appState.checkoutStep = 'cart';
            syncCloud();
            playBell();
            alert('🎉 تم إرسال طلبك بنجاح للمتجر وسيتم التواصل معك قريباً!');
            render();
        }

        render();
    </script>
</body>
</html>
