<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرتك | Tablia OS - المنصة التجارية المتكاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased min-h-screen selection:bg-emerald-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        let globalDB = { shops: {} };
        try {
            const raw = localStorage.getItem('tablia_saas_v1040');
            if (raw) {
                globalDB = JSON.parse(raw);
            } else {
                // بيانات افتراضية للمطعم لو أول مرة يفتح عشان مفيش شاشة بيضاء تحصل أبداً
                globalDB = {
                    shops: {
                        'البرنس-123': {
                            id: 'البرنس-123',
                            name: 'البرنس',
                            phone: '01015861991',
                            createdAt: Date.now(),
                            paidUntil: null,
                            products: [
                                { id: 'p1', cat: 'مشويات', name: 'كيلو كباب ضاني', price: 1100 },
                                { id: 'p2', cat: 'مشويات', name: 'كيلو ريش طاجي', price: 1000 },
                                { id: 'p3', cat: 'وجبات', name: 'وجبة كبدة مشوية', price: 120 },
                                { id: 'p4', cat: 'ساندوتشات', name: 'ساندوتش سجق', price: 40 },
                                { id: 'p5', cat: 'طواجن', name: 'طبق سجق بلدي', price: 100 }
                            ],
                            orders: []
                        }
                    }
                };
                localStorage.setItem('tablia_saas_v1040', JSON.stringify(globalDB));
            }
        } catch(e) {
            globalDB = { shops: {} };
        }

        function saveDB() {
            try {
                localStorage.setItem('tablia_saas_v1040', JSON.stringify(globalDB));
            } catch(e) {}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isCustomerMode = urlParams.get('view') === 'store'; 
        const targetShopSlug = urlParams.get('shop');
        let currentShopId = localStorage.getItem('tablia_logged_shop_id') || null;

        const appState = { 
            page: isCustomerMode ? 'storefront' : (currentShopId ? 'builder' : 'auth'), 
            cart: {},
            favorites: [],
            selectedCategory: 'مشويات',
            searchQuery: '',
            checkoutStep: 'none',
            orderType: 'توصيل',
            paymentMethod: 'نقداً',
            aiStep: 1,
            uploadedFileName: ''
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function getShopSubscriptionStatus(shop) {
            if (!shop) return { active: false };
            const now = Date.now();
            const createdAt = shop.createdAt || now;
            const trialExpires = createdAt + (7 * 24 * 60 * 60 * 1000);

            if (now <= trialExpires) {
                const remainingDays = Math.ceil((trialExpires - now) / (1000 * 60 * 60 * 24));
                return { type: 'trial', active: true, message: `تجربة مجانية متبقي (${remainingDays} أيام)` };
            }

            if (shop.paidUntil && now <= shop.paidUntil) {
                return { type: 'paid', active: true, message: 'اشتراك نشط' };
            }

            return { type: 'expired', active: false, message: 'انتهت الفترة التجريبية (600 ج)' };
        }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isCustomerMode || targetShopSlug) {
                    content = renderStorefront();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentShopId || !globalDB.shops?.[currentShopId]) { 
                        currentShopId = null; 
                        localStorage.removeItem('tablia_logged_shop_id');
                        appState.page = 'auth'; 
                        content = renderAuthScreen(); 
                    } else {
                        const shop = globalDB.shops[currentShopId];
                        const sub = getShopSubscriptionStatus(shop);

                        if (!sub.active) {
                            content = renderSubscriptionExpiredScreen(shop);
                        } else {
                            if(appState.page === 'builder') content = renderBuilder();
                            else if(appState.page === 'ai_menu') content = renderAIMenuWizard();
                            else if(appState.page === 'orders') content = renderOrders();
                            else if(appState.page === 'qr_print') content = renderQRPrint();
                            else content = renderBuilder();
                        }
                    }
                }
                const shopActive = currentShopId && globalDB.shops[currentShopId] ? getShopSubscriptionStatus(globalDB.shops[currentShopId]).active : true;
                const bottomNav = (isCustomerMode || !currentShopId || !shopActive) ? '' : renderBottomNav();
                root.innerHTML = content + bottomNav;
            } catch(err) {
                root.innerHTML = `<div class="p-8 text-center text-red-600 font-bold">حدث خطأ في العرض: ${err.message}</div>`;
            }
        }

        function renderBottomNav(){
            return `
                <div class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900 border-t border-slate-800 px-1 py-2">
                    <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center text-slate-400">
                        <button onclick="setPage('builder')" class="flex flex-col items-center py-1 ${appState.page==='builder'?'text-emerald-400 font-black':''}"><i class="fa-solid fa-list text-xs mb-0.5"></i><span class="text-[10px]">المنتجات</span></button>
                        <button onclick="setPage('ai_menu')" class="flex flex-col items-center py-1 ${appState.page==='ai_menu'?'text-emerald-400 font-black':''}"><i class="fa-solid fa-wand-magic-sparkles text-xs mb-0.5 text-amber-400"></i><span class="text-[10px]">المنيو الذكي</span></button>
                        <button onclick="setPage('orders')" class="flex flex-col items-center py-1 ${appState.page==='orders'?'text-emerald-400 font-black':''}"><i class="fa-solid fa-bell text-xs mb-0.5 text-emerald-400"></i><span class="text-[10px]">الطلبات</span></button>
                        <button onclick="setPage('qr_print')" class="flex flex-col items-center py-1 ${appState.page==='qr_print'?'text-emerald-400 font-black':''}"><i class="fa-solid fa-qrcode text-xs mb-0.5"></i><span class="text-[10px]">QR</span></button>
                    </div>
                </div>
            `;
        }

        function renderSubscriptionExpiredScreen(shop){
            return `
                <div class="max-w-md mx-auto px-4 py-16 space-y-6 text-xs text-center">
                    <div class="bg-white p-8 rounded-3xl border border-red-200 shadow-2xl space-y-5">
                        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-2xl animate-bounce">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <h1 class="text-xl font-black text-slate-900">⚠️ تنبيه: انتهت نسختك التجريبية!</h1>
                        <p class="text-slate-600 leading-relaxed">
                            عذراً يا <span class="text-slate-900 font-bold">${shop.name}</span>، انتهت الـ 7 أيام التجريبية.<br>
                            لتجديد الاشتراك الشهري (<b>600 جنيه</b>) حوّل على فودافون كاش:
                        </p>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 select-all font-mono text-emerald-600 font-black text-base">
                            01015861991
                        </div>
                        <a href="https://wa.me/201015861991?text=${encodeURIComponent('تجديد اشتراك مطعم: ' + shop.name)}" target="_blank" class="block bg-emerald-600 text-white font-black py-3.5 rounded-xl shadow">تواصل واتساب للتجديد</a>
                        <button onclick="currentShopId=null; localStorage.removeItem('tablia_logged_shop_id'); render();" class="text-slate-500 font-bold">تسجيل الخروج</button>
                    </div>
                </div>
            `;
        }

        function renderAuthScreen(){
            return `
                <div class="max-w-md mx-auto px-4 py-12 space-y-6 text-xs">
                    <div class="text-center space-y-2">
                        <h1 class="text-2xl font-black text-slate-900">سفرتك | أنشئ متجرك مجاناً 🛒</h1>
                        <p class="text-slate-500">رابط مميز باسم مطعمك و 7 أيام تجربة مجانية!</p>
                    </div>
                    <div class="bg-white p-6 rounded-3xl space-y-4 shadow-xl border border-slate-200">
                        <div>
                            <label class="block text-slate-700 mb-1 font-bold">اسم المطعم</label>
                            <input id="reg_name" placeholder="البرنس" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl font-bold outline-none text-slate-900">
                        </div>
                        <div>
                            <label class="block text-slate-700 mb-1 font-bold">رقم الموبايل</label>
                            <input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl font-bold outline-none text-slate-900">
                        </div>
                        <div>
                            <label class="block text-slate-700 mb-1 font-bold">كلمة السر</label>
                            <input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl font-bold outline-none text-slate-900">
                        </div>
                        <button onclick="registerNewShop()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl shadow transition">ابدأ التجربة المجانية ➔</button>
                    </div>
                </div>
            `;
        }

        function registerNewShop(){
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            
            if(!name || !phone || !pass){ alert('يرجى استكمال جميع البيانات!'); return; }
            
            let cleanSlug = name.replace(/\s+/g, '-').replace(/[^\w\u0600-\u06FF\-]/g, '') + '-' + Math.floor(100 + Math.random() * 900);

            globalDB.shops[cleanSlug] = { 
                id: cleanSlug, name, phone, pass,
                createdAt: Date.now(),
                paidUntil: null,
                products: [
                    { id: 'p1', cat: 'مشويات', name: 'كيلو كباب ضاني', price: 1100 },
                    { id: 'p2', cat: 'مشويات', name: 'كيلو ريش طاجي', price: 1000 },
                    { id: 'p3', cat: 'وجبات', name: 'وجبة كبدة مشوية', price: 120 },
                    { id: 'p4', cat: 'ساندوتشات', name: 'ساندوتش سجق', price: 40 },
                    { id: 'p5', cat: 'طواجن', name: 'طبق سجق بلدي', price: 100 }
                ],
                orders: []
            };
            saveDB(); 
            currentShopId = cleanSlug; 
            localStorage.setItem('tablia_logged_shop_id', cleanSlug); 
            setPage('builder');
        }

        function renderAIMenuWizard(){
            return `
                <div class="max-w-xl mx-auto px-4 py-6 pb-28 space-y-5 text-xs">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center shadow-xs">
                        <span class="text-emerald-600 font-bold">المنيو بالذكاء الاصطناعي 🤖</span>
                        <button onclick="setPage('builder')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl font-bold">لوحة التحكم</button>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-5 text-center shadow-xl">
                        <h1 class="text-base font-black text-slate-900">ارفع صورة المنيو أو ملف PDF أو Excel[span_0](start_span)[span_0](end_span)</h1>
                        <label class="border-2 border-dashed border-slate-300 bg-slate-50 p-8 rounded-3xl flex flex-col items-center justify-center gap-3 cursor-pointer">
                            <span class="font-black text-slate-900 text-sm">اختر ملف المنيو[span_1](start_span)[span_1](end_span)</span>
                            <input type="file" onchange="alert('تم رفع وتحليل المنيو بنجاح!'); setPage('builder');" class="hidden">
                        </label>
                    </div>
                </div>
            `;
        }

        function renderBuilder(){
            const shop = globalDB.shops[currentShopId];
            if(!shop){ setPage('auth'); return ''; }
            const customLink = location.origin + location.pathname + `?view=store&shop=${shop.id}`;

            return `
                <div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-5 text-xs">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <h1 class="font-black text-slate-900 text-sm">إدارة مطعم: ${shop.name}</h1>
                        <button onclick="currentShopId=null; localStorage.removeItem('tablia_logged_shop_id'); setPage('auth');" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-xl font-bold">خروج</button>
                    </div>

                    <div class="bg-white p-6 rounded-3xl space-y-3 border border-emerald-200 text-center shadow-2xl">
                        <h2 class="font-black text-emerald-600 text-sm">🔗 رابط منيو مطعمك المميز</h2>
                        <input readonly value="${customLink}" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-emerald-700 font-mono text-center text-xs select-all">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="navigator.clipboard.writeText('${customLink}'); alert('تم النسخ!');" class="bg-amber-400 text-slate-950 font-black py-3 rounded-xl">نسخ الرابط</button>
                            <a href="?view=store&shop=${shop.id}" target="_blank" class="bg-emerald-600 text-white font-black py-3 rounded-xl flex items-center justify-center">معاينة المنيو ➔</a>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-200 space-y-3 shadow-xl">
                        <h2 class="font-black text-slate-900 text-sm">➕ إضافة صنف جديد</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <select id="new_p_cat" class="bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold text-slate-900">
                                <option value="مشويات">مشويات</option>
                                <option value="وجبات">وجبات</option>
                                <option value="ساندوتشات">ساندوتشات</option>
                                <option value="طواجن">طواجن</option>
                            </select>
                            <input id="new_p_name" placeholder="اسم الصنف..." class="bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold text-slate-900">
                            <input id="new_p_price" type="number" placeholder="السعر" class="bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold text-slate-900">
                        </div>
                        <button onclick="addNewProduct('${shop.id}')" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl shadow">إضافة الصنف ✓</button>
                    </div>

                    <div class="bg-white p-5 rounded-3xl space-y-4 border border-slate-200 shadow-xl">
                        <h2 class="font-black text-slate-900 text-sm">📦 الأصناف المسجلة (${(shop.products||[]).length})</h2>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${(shop.products||[]).map((item, idx) => `
                                <div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center border border-slate-200">
                                    <div>
                                        <span class="font-black text-slate-900">${item.name} (${item.cat})</span>
                                        <span class="text-emerald-600 block">${item.price} ج.م</span>
                                    </div>
                                    <button onclick="deleteProduct('${shop.id}', ${idx})" class="text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function addNewProduct(shopId){
            const shop = globalDB.shops[shopId];
            const cat = document.getElementById('new_p_cat').value;
            const name = document.getElementById('new_p_name').value.trim();
            const price = Number(document.getElementById('new_p_price').value);
            if(!name || !price) { alert('أدخل الاسم والسعر!'); return; }
            if(!shop.products) shop.products = [];
            shop.products.push({ id: 'p_' + Date.now(), cat, name, price });
            saveDB();
            alert('تمت الإضافة!');
            render();
        }

        function deleteProduct(shopId, idx){
            globalDB.shops[shopId].products.splice(idx, 1);
            saveDB();
            render();
        }

        function renderOrders(){
            const shop = globalDB.shops[currentShopId];
            if(!shop) return '';
            if(!shop.orders) shop.orders = [];
            return `
                <div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-4 text-xs">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center">
                        <h1 class="font-black text-slate-900 text-sm">🔔 الطلبات (${shop.orders.length})</h1>
                    </div>
                    <div class="space-y-3">
                        ${shop.orders.length === 0 ? `<div class="bg-white p-12 text-center text-slate-400 rounded-3xl border border-slate-200">لا توجد طلبات جديدة..</div>` : shop.orders.map((ord, i) => `
                            <div class="bg-white p-4 rounded-3xl space-y-3 border border-slate-200 shadow-xs">
                                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                                    <div>
                                        <span class="font-black text-slate-900 text-sm">${ord.customer_name}</span>
                                        <span class="text-emerald-600 font-bold block text-[11px]">${ord.phone} - ${ord.address}</span>
                                    </div>
                                    <span class="text-emerald-600 font-black text-sm">${ord.total} ج.م</span>
                                </div>
                                <button onclick="globalDB.shops['${currentShopId}'].orders.splice(${i},1); saveDB(); render();" class="w-full bg-red-50 text-red-600 py-2 rounded-xl font-bold">حذف الطلب</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderQRPrint(){ 
            return `<div class="max-w-3xl mx-auto px-4 py-6 pb-28 text-xs"><div class="bg-white p-6 rounded-3xl text-center font-bold">طباعة QR للطاولات متاحة</div></div>`; 
        }

        function renderStorefront(){
            const shopId = targetShopSlug || Object.keys(globalDB.shops)[0];
            const shop = globalDB.shops[shopId];
            if(!shop) return `<div class="min-h-screen flex items-center justify-center text-slate-700 p-6 text-center font-bold">عذراً، هذا المنيو غير موجود أو الرابط غير صحيح.</div>`;

            const categories = ['مشويات', 'وجبات', 'ساندوتشات', 'طواجن'];
            const filteredProducts = (shop.products || []).filter(p => {
                if(appState.selectedCategory === 'المفضلة') return appState.favorites.includes(p.name);
                return p.cat === appState.selectedCategory && (appState.searchQuery === '' || p.name.includes(appState.searchQuery));
            });

            const cartCount = Object.values(appState.cart).reduce((a, b) => a + b, 0);
            const cartSubtotal = Object.entries(appState.cart).reduce((sum, [name, qty]) => {
                const item = (shop.products || []).find(p => p.name === name);
                return sum + (item ? item.price * qty : 0);
            }, 0);

            const cartTotal = cartSubtotal > 0 ? cartSubtotal + 252 + 329.28 : 0;

            if(appState.checkoutStep === 'details') {
                return `
                    <div class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center">
                        <div class="bg-white w-full max-w-lg rounded-t-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4 text-xs">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                                <h2 class="font-black text-slate-900 text-sm">بيانات الطلب[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)</h2>
                                <button onclick="appState.checkoutStep='cart'; render();" class="font-bold text-slate-700">✕</button>
                            </div>
                            <div class="space-y-3">
                                <input id="cust_name" placeholder="الاسم[span_4](start_span)[span_4](end_span)" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-bold text-slate-900">
                                <input id="cust_phone" placeholder="الهاتف[span_5](start_span)[span_5](end_span)" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-bold text-slate-900">
                                <input id="cust_address" placeholder="العنوان[span_6](start_span)[span_6](end_span)" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-bold text-slate-900">
                            </div>
                            <button onclick="confirmAndSendOrder('${shop.id}')" class="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg text-sm">تأكيد الطلب · ${cartTotal.toLocaleString()} ج.م[span_7](start_span)[span_7](end_span)</button>
                        </div>
                    </div>
                `;
            }

            if(appState.checkoutStep === 'cart') {
                return `
                    <div class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center">
                        <div class="bg-white w-full max-w-lg rounded-t-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4 text-xs">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                                <h2 class="font-black text-slate-900 text-sm">السلة[span_8](start_span)[span_8](end_span)</h2>
                                <button onclick="appState.checkoutStep='none'; render();" class="font-bold text-slate-700">✕</button>
                            </div>
                            <div class="space-y-2">
                                ${Object.keys(appState.cart).length === 0 ? `<div class="text-center py-6 text-slate-400">السلة فارغة</div>` : Object.entries(appState.cart).map(([name, qty]) => `
                                    <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center border border-slate-200">
                                        <span class="font-black text-slate-900">${name} (${qty})</span>
                                        <button onclick="deleteCartItem('${name}')" class="text-red-500 font-bold">حذف[span_9](start_span)[span_9](end_span)</button>
                                    </div>
                                `).join('')}
                            </div>
                            <button onclick="appState.checkoutStep='details'; render();" class="w-full bg-emerald-600 text-white font-black py-3.5 rounded-2xl shadow">متابعة للتفاصيل[span_10](start_span)[span_10](end_span)</button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="min-h-screen pb-28 bg-[#f8fafc] text-slate-900">
                    <header class="bg-white sticky top-0 z-30 border-b border-slate-200 px-4 py-3 shadow-xs">
                        <div class="max-w-xl mx-auto flex justify-between items-center">
                            <span class="font-black text-base text-slate-900">${shop.name}</span>
                            <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-bold">مفتوح الآن</span>
                        </div>
                    </header>
                    <div class="max-w-xl mx-auto px-4 pt-4 space-y-4">
                        <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                            ${categories.map(c => `
                                <button onclick="appState.selectedCategory='${c}'; render();" class="px-5 py-2.5 rounded-2xl font-black text-xs whitespace-nowrap shadow-xs transition ${appState.selectedCategory===c?'bg-emerald-600 text-white':'bg-white border border-slate-200 text-slate-700'}">${c}</button>
                            `).join('')}
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            ${filteredProducts.length === 0 ? `<div class="col-span-2 text-center py-10 text-slate-400">لا توجد أصناف</div>` : filteredProducts.map(p => `
                                <div class="bg-white border border-slate-200 rounded-3xl p-3 shadow-xs flex flex-col justify-between space-y-3">
                                    <div class="h-24 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 font-bold">مأكولات</div>
                                    <div>
                                        <h3 class="font-black text-xs text-slate-900">${p.name}</h3>
                                        <div class="flex justify-between items-center pt-2">
                                            <span class="font-black text-xs text-slate-900">${p.price} ج.م[span_11](start_span)[span_11](end_span)</span>
                                            <button onclick="addToCart('${p.name}')" class="w-8 h-8 bg-emerald-600 text-white rounded-full font-black">+</button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ${cartCount > 0 ? `
                        <div class="fixed bottom-3 left-3 right-3 max-w-xl mx-auto z-30">
                            <button onclick="appState.checkoutStep='cart'; render();" class="w-full bg-emerald-600 text-white py-4 px-5 rounded-3xl shadow-xl flex justify-between font-black text-sm">
                                <span>السلة · ${cartCount}[span_12](start_span)[span_12](end_span)</span>
                                <span>${cartTotal.toLocaleString()} ج.م[span_13](start_span)[span_13](end_span)</span>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addToCart(name){
            if(!appState.cart[name]) appState.cart[name] = 1;
            else appState.cart[name]++;
            render();
        }

        function deleteCartItem(name){ delete appState.cart[name]; render(); }

        function confirmAndSendOrder(shopId){
            const name = document.getElementById('cust_name').value.trim();
            const phone = document.getElementById('cust_phone').value.trim();
            const address = document.getElementById('cust_address').value.trim();
            if(!name || !phone || !address){ alert('أدخل الاسم والهاتف والعنوان!'); return; }

            const shop = globalDB.shops[shopId];
            if(!shop.orders) shop.orders = [];
            shop.orders.unshift({
                customer_name: name, phone, address,
                items: Object.entries(appState.cart).map(([n, q]) => ({ name: n, qty: q })),
                total: 2000
            });
            appState.cart = {};
            appState.checkoutStep = 'none';
            saveDB();
            alert('🎉 تم إرسال الطلب بنجاح!');
            render();
        }

        render();
    </script>
</body>
</html>
