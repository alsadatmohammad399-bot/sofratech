<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablia OS | المنصة السحابية الموحدة للمطاعم والكاشير</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #030712; color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="antialiased min-h-screen selection:bg-amber-500 selection:text-slate-950">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        // ================= 1. إعدادات السحاب (Firebase Cloud) =================
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };

        let cloudDB = null;
        try {
            firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) { console.error("Cloud error:", e); }

        const MASTER_SCHEMA = {
            restaurant: {
                name: 'مشويات الحاتي الفاخرة',
                slug: 'elhaty-grill',
                phone: '201015861991',
                logo: '🔥',
                template_id: 'foodera-modern',
                layout: 'foodera', 
                theme: { primary: '#ea580c', bg: '#030712' },
                tablesCount: 20,
                pin: '1234'
            },
            categories: [
                { id: 'cat_1', name: 'المشويات الرئيسية', icon: '🥩' },
                { id: 'cat_2', name: 'السندوتشات والطواجن', icon: '🥙' },
                { id: 'cat_3', name: 'المقبلات والمشروبات', icon: '🥤' }
            ],
            menu_items: [
                { id: 'itm_1', category_id: 'cat_1', name: 'كيلو كباب وكفتة ضاني', description: 'لحم بلدي مشوي على الفحم يقدم مع الأرز والصلصة', price: 680, image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&q=60', is_available: true, tags: ['الأكثر مبيعاً'] },
                { id: 'itm_2', category_id: 'cat_1', name: 'نصف فرخة شيش طاووق', description: 'صدور دجاج متبلة بالخلطة الخاصة', price: 195, image: 'https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=500&q=60', is_available: true, tags: ['مميز'] },
                { id: 'itm_3', category_id: 'cat_2', name: 'سندوتش كبدة إسكندراني', description: 'كبدة بلدي طازجة بالفلفل الحار والطحينة', price: 50, image: 'https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=500&q=60', is_available: true, tags: [] },
                { id: 'itm_4', category_id: 'cat_3', name: 'سلطة طحينة بلدي', description: 'طحينة سمسم صافي بالليمون والبهارات', price: 25, image: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500&q=60', is_available: true, tags: [] }
            ],
            orders: []
        };

        const TEMPLATES_CATALOG = [
            { id: 'tablia-classic', name: 'Tablia Classic', category: 'classic', layout: 'classic', desc: 'قوائم سريعة وأنيقة للمطاعم الشعبية', preview: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&q=60' },
            { id: 'foodera-modern', name: 'Foodera Modern', category: 'modern', layout: 'foodera', desc: 'بطاقات عصرية بصور كبيرة وتجربة طلب فخمة', preview: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=60' },
            { id: 'dark-grill', name: 'Dark Grill VIP', category: 'dark', layout: 'dark_grill', desc: 'تصميم ليلي فاخر للستيك والبرجر والمشويات', preview: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=500&q=60' },
            { id: 'verde-table', name: 'Verde Table', category: 'farm', layout: 'verde', desc: 'Farm-to-Table Organic Dining (عضوي وطبيعي)', preview: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500&q=60' },
            { id: 'boardroom-bites', name: 'Boardroom Bites', category: 'catering', layout: 'boardroom', desc: 'Corporate Catering (ضيافة الشركات ورجال الأعمال)', preview: 'https://images.unsplash.com/photo-1555244162-803834f70033?w=500&q=60' },
            { id: 'ember-wok', name: 'Ember Wok', category: 'asian', layout: 'wok', desc: 'Premium Asian Kitchen (مطبخ آسيوي مقلي عالفحم)', preview: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500&q=60' },
            { id: 'modern-japanese', name: 'Modern Japanese', category: 'fine-dining', layout: 'japanese', desc: 'Fine Dining (عشاء ياباني فاخر مينيمال)', preview: 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500&q=60' }
        ];

        let store = JSON.parse(localStorage.getItem('tablia_master_v6')) || MASTER_SCHEMA;

        function syncCloud() {
            localStorage.setItem('tablia_master_v6', JSON.stringify(store));
            if (cloudDB) cloudDB.ref('tablia_master_enterprise_v6').set(store);
        }

        if (cloudDB) {
            cloudDB.ref('tablia_master_enterprise_v6').on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    if (data.orders && store.orders && data.orders.length > store.orders.length) {
                        playBell();
                    }
                    store = data;
                    if (!store.orders) store.orders = [];
                    render();
                } else {
                    syncCloud();
                }
            });
        }

        function playBell() {
            const audio = document.getElementById('cloud-bell');
            if (audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
            if ('vibrate' in navigator) navigator.vibrate([400, 200, 400]);
        }

        // ================= 2. الراوتر والتنقل =================
        const appState = {
            page: 'landing', 
            builderStep: 1,
            activeCat: 'all',
            search: '',
            cart: [],
            cartOpen: false,
            tableNumber: new URLSearchParams(window.location.search).get('t') || null,
            customerName: '',
            customerPhone: '',
            cashierUnlocked: false
        };

        function setPage(p) {
            appState.page = p;
            render();
            window.scrollTo(0, 0);
        }

        function render() {
            const root = document.getElementById('app');
            if (appState.page === 'builder') root.innerHTML = renderBuilder();
            else if (appState.page === 'storefront') root.innerHTML = renderStorefront();
            else if (appState.page === 'cashier') root.innerHTML = renderCashier();
            else if (appState.page === 'dashboard') root.innerHTML = renderDashboard();
            else if (appState.page === 'qr_print') root.innerHTML = renderQRPrint();
            else root.innerHTML = renderLanding();
        }

        function renderNav() {
            return `
                <nav class="sticky top-0 z-50 glass border-b border-white/10 px-4 py-3">
                    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
                        <!-- الشعار واسم النظام -->
                        <div class="flex items-center gap-2.5 cursor-pointer shrink-0" onclick="setPage('landing')">
                            <div class="w-9 h-9 rounded-xl gold-gradient text-slate-950 flex items-center justify-center font-black text-lg shadow-md">ط</div>
                            <div>
                                <span class="font-black text-base tracking-tight text-white">Tablia <span class="text-amber-400">OS</span></span>
                                <span class="block text-[9px] text-slate-400 -mt-1">منصة إدارة المطاعم</span>
                            </div>
                        </div>

                        <!-- الأزرار الرئيسية متجاوبة ومنظمة -->
                        <div class="flex items-center gap-1 bg-slate-900/90 p-1 rounded-xl border border-white/10 text-xs overflow-x-auto hide-scrollbar">
                            <button onclick="setPage('landing')" class="px-2.5 py-1.5 rounded-lg font-bold whitespace-nowrap transition ${appState.page==='landing'?'bg-amber-500 text-slate-950':'text-slate-300 hover:text-white'}">الرئيسية</button>
                            <button onclick="setPage('builder')" class="px-2.5 py-1.5 rounded-lg font-bold whitespace-nowrap transition ${appState.page==='builder'?'bg-amber-500 text-slate-950':'text-slate-300 hover:text-white'}">🛠️ المنشئ</button>
                            <button onclick="setPage('storefront')" class="px-2.5 py-1.5 rounded-lg font-bold whitespace-nowrap transition ${appState.page==='storefront'?'bg-amber-500 text-slate-950':'text-slate-300 hover:text-white'}">📱 المنيو</button>
                            <button onclick="setPage('cashier')" class="px-2.5 py-1.5 rounded-lg font-black whitespace-nowrap text-red-400 transition ${appState.page==='cashier'?'bg-red-500 text-slate-950':'bg-red-500/10 hover:bg-red-500/20'}">🖥️ الكاشير</button>
                            <button onclick="setPage('dashboard')" class="px-2.5 py-1.5 rounded-lg font-bold whitespace-nowrap transition ${appState.page==='dashboard'?'bg-amber-500 text-slate-950':'text-slate-300 hover:text-white'}">📊 الإدارة</button>
                        </div>
                    </div>
                </nav>
            `;
        }

        // ================= 3. صفحة البداية الاحترافية =================
        function renderLanding() {
            return `
                ${renderNav()}
                <div class="max-w-4xl mx-auto px-4 py-12 md:py-20 text-center space-y-6">
                    <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-3.5 py-1.5 rounded-full text-amber-400 text-xs font-bold">
                        <i class="fa-solid fa-bolt"></i> نظام سحابي متكامل للمطاعم والكافيهات وضيافة الشركات
                    </div>
                    <h1 class="text-3xl md:text-5xl font-black text-white leading-tight">
                        أنشئ منيو مطعمك، نظام الـ QR، والكاشير السحابي في <span class="text-amber-500">دقائق معدودة</span>
                    </h1>
                    <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto leading-relaxed">
                        منصة SaaS متكاملة تدعم 7 قوالب عالمية، ربط فوري بين الزبون والمطبخ، وتنبيهات صوتية فورية للكاشير.
                    </p>
                    <div class="flex flex-col sm:flex-row justify-center gap-3 pt-2">
                        <button onclick="setPage('builder')" class="gold-gradient text-slate-950 font-black px-7 py-3.5 rounded-2xl text-xs shadow-xl hover:scale-105 transition">
                            🛠️ ابدأ بناء المطعم الآن
                        </button>
                        <button onclick="setPage('cashier')" class="bg-red-600 hover:bg-red-500 text-white font-black px-7 py-3.5 rounded-2xl text-xs shadow-xl transition border border-red-500/30">
                            🖥️ فتح شاشة الكاشير والمطبخ
                        </button>
                    </div>
                </div>
            `;
        }

        // ================= 4. منشئ المطعم (Builder - 4 خطوات) =================
        function renderBuilder() {
            return `
                ${renderNav()}
                <div class="max-w-4xl mx-auto px-4 py-8 space-y-6">
                    <div class="flex gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-white/10 text-[11px] overflow-x-auto">
                        <button onclick="appState.builderStep=1; render();" class="flex-1 py-2.5 px-3 rounded-xl font-bold whitespace-nowrap ${appState.builderStep===1?'bg-amber-500 text-slate-950':'text-slate-400'}">1. القوالب</button>
                        <button onclick="appState.builderStep=2; render();" class="flex-1 py-2.5 px-3 rounded-xl font-bold whitespace-nowrap ${appState.builderStep===2?'bg-amber-500 text-slate-950':'text-slate-400'}">2. الصندوق السحري</button>
                        <button onclick="appState.builderStep=3; render();" class="flex-1 py-2.5 px-3 rounded-xl font-bold whitespace-nowrap ${appState.builderStep===3?'bg-amber-500 text-slate-950':'text-slate-400'}">3. الهوية</button>
                        <button onclick="appState.builderStep=4; render();" class="flex-1 py-2.5 px-3 rounded-xl font-bold whitespace-nowrap ${appState.builderStep===4?'bg-amber-500 text-slate-950':'text-slate-400'}">4. النشر والـ QR</button>
                    </div>

                    ${appState.builderStep === 1 ? renderStep1() : ''}
                    ${appState.builderStep === 2 ? renderStep2() : ''}
                    ${appState.builderStep === 3 ? renderStep3() : ''}
                    ${appState.builderStep === 4 ? renderStep4() : ''}
                </div>
            `;
        }

        function renderStep1() {
            return `
                <div class="glass p-5 md:p-6 rounded-3xl border border-white/10 space-y-4 text-xs">
                    <h2 class="text-sm font-black text-white">الخطوة 1: بيانات المطعم واختيار القالب (7 قوالب متوفرة)</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-400 font-bold mb-1">اسم المطعم / المشروع</label>
                            <input type="text" id="r_name" value="${store.restaurant.name}" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 font-bold mb-1">رقم واتساب الطلبات</label>
                            <input type="text" id="r_phone" value="${store.restaurant.phone}" class="w-full bg-slate-950 border border-white/10 p-3 text-white font-bold outline-none focus:border-amber-500" dir="ltr">
                        </div>
                    </div>
                    <div class="space-y-2 pt-2">
                        <label class="block text-slate-400 font-bold">اختر القالب البصري للمنيو:</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${TEMPLATES_CATALOG.map(t => `
                                <div onclick="store.restaurant.template_id='${t.id}'; store.restaurant.layout='${t.layout}'; syncCloud(); render();" class="cursor-pointer border-2 rounded-2xl overflow-hidden p-2.5 transition ${store.restaurant.template_id===t.id?'border-amber-500 bg-amber-500/10 shadow-md':'border-white/10 bg-slate-950'}">
                                    <img src="${t.preview}" class="w-full h-24 object-cover rounded-xl mb-2">
                                    <h4 class="font-black text-white text-xs">${t.name}</h4>
                                    <p class="text-[9px] text-slate-400 mt-0.5 line-clamp-1">${t.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <button onclick="saveStep1();" class="gold-gradient text-slate-950 font-black px-6 py-3 rounded-xl w-full sm:w-auto">حفظ والانتقال للصندوق السحري ➔</button>
                </div>
            `;
        }

        function saveStep1() {
            store.restaurant.name = document.getElementById('r_name').value.trim();
            store.restaurant.phone = document.getElementById('r_phone').value.trim();
            syncCloud();
            appState.builderStep = 2;
            render();
        }

        function renderStep2() {
            return `
                <div class="glass p-5 md:p-6 rounded-3xl border border-white/10 space-y-5 text-xs">
                    <div class="flex justify-between items-center">
                        <h2 class="text-sm font-black text-white">الخطوة 2: الصندوق السحري والإدارة اليدوية</h2>
                        <span class="text-amber-400 font-bold">${store.menu_items.length} صنف</span>
                    </div>

                    <!-- الصندوق السحري للنصوص -->
                    <div class="bg-gradient-to-r from-amber-500/10 to-orange-500/10 border border-amber-500/30 p-4 rounded-2xl space-y-2.5">
                        <div class="flex items-center gap-2">
                            <span class="text-lg">🪄</span>
                            <div>
                                <h3 class="font-black text-amber-400 text-xs">الصندوق السحري للنصوص</h3>
                                <p class="text-[10px] text-slate-300">الصق نص المنيو هنا (مثال: برجر دجاج 150، كوكاكولا 25)</p>
                            </div>
                        </div>
                        <textarea id="magic_box" rows="3" placeholder="الصق أو اكتب المنيو هنا..." class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white text-xs outline-none focus:border-amber-500"></textarea>
                        <button onclick="parseMagicText()" class="w-full gold-gradient text-slate-950 font-black py-2.5 rounded-xl shadow">✨ توليد الأصناف تلقائياً</button>
                    </div>

                    <!-- الإضافة اليدوية -->
                    <div class="bg-slate-950 p-4 rounded-2xl border border-white/10 space-y-3">
                        <h3 class="font-bold text-amber-400 text-xs">+ إضافة صنف يدوي</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                            <input type="text" id="new_name" placeholder="اسم الوجبة" class="bg-slate-900 border border-white/10 p-2.5 rounded-xl text-white font-bold text-xs">
                            <input type="number" id="new_price" placeholder="السعر (ج.م)" class="bg-slate-900 border border-white/10 p-2.5 text-amber-400 font-bold text-xs">
                            <select id="new_cat" class="bg-slate-900 border border-white/10 p-2.5 rounded-xl text-white text-xs">
                                ${store.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                            </select>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <input type="text" id="new_desc" placeholder="وصف المكونات..." class="bg-slate-900 border border-white/10 p-2.5 rounded-xl text-white text-xs">
                            <input type="text" id="new_img" placeholder="رابط صورة الوجبة (URL)" value="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500&q=60" class="bg-slate-900 border border-white/10 p-2.5 text-white text-xs" dir="ltr">
                        </div>
                        <button onclick="addNewItem()" class="gold-gradient text-slate-950 font-black px-5 py-2 rounded-xl text-xs">إضافة صنف</button>
                    </div>

                    <!-- الأصناف الحالية -->
                    <div class="space-y-2">
                        <h3 class="font-bold text-slate-300">أصناف المنيو الحالية (${store.menu_items.length}):</h3>
                        ${store.menu_items.map((item, idx) => `
                            <div class="bg-slate-950 p-2.5 rounded-xl flex justify-between items-center border border-white/5">
                                <div class="flex items-center gap-2.5">
                                    <img src="${item.image}" class="w-10 h-10 rounded-lg object-cover">
                                    <div>
                                        <h4 class="font-bold text-white text-xs">${item.name}</h4>
                                        <span class="text-amber-400 text-[11px]">${item.price} ج.م</span>
                                    </div>
                                </div>
                                <button onclick="store.menu_items.splice(${idx},1); syncCloud(); render();" class="text-red-400 bg-red-500/10 px-2.5 py-1 rounded-lg text-[11px] font-bold"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex justify-between pt-2">
                        <button onclick="appState.builderStep=1; render();" class="bg-slate-800 px-5 py-2.5 rounded-xl font-bold">السابق</button>
                        <button onclick="appState.builderStep=3; render();" class="gold-gradient text-slate-950 font-black px-5 py-2.5 rounded-xl">التالي: الهوية ➔</button>
                    </div>
                </div>
            `;
        }

        function parseMagicText() {
            const text = document.getElementById('magic_box').value.trim();
            if (!text) { alert('⚠️ يرجى لصق نص المنيو أولاً!'); return; }
            const lines = text.split(/,|\n/);
            let added = 0;
            lines.forEach(line => {
                if (!line.trim()) return;
                const matchPrice = line.match(/\d+/);
                if (matchPrice) {
                    const price = Number(matchPrice[0]);
                    const name = line.replace(matchPrice[0], '').replace(/جنيه|جـ|ج/g, '').trim();
                    if (name) {
                        store.menu_items.push({
                            id: 'itm_' + Date.now() + Math.random().toString(36).substr(2,3),
                            category_id: store.categories[0].id,
                            name: name,
                            description: 'مستخرج أوتوماتيكياً عبر الصندوق السحري',
                            price: price,
                            image: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500&q=60',
                            is_available: true,
                            tags: ['جديد']
                        });
                        added++;
                    }
                }
            });
            if (added > 0) {
                syncCloud();
                document.getElementById('magic_box').value = '';
                render();
                alert(`✅ تم توليد ${added} صنف بنجاح!`);
            } else {
                alert('⚠️ لم يتم التعرف على أسعار. تأكد من كتابة الرقم بجانب اسم الوجبة.');
            }
        }

        function addNewItem() {
            const name = document.getElementById('new_name').value.trim();
            const price = Number(document.getElementById('new_price').value);
            const catId = document.getElementById('new_cat').value;
            const desc = document.getElementById('new_desc').value.trim();
            const img = document.getElementById('new_img').value.trim() || 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500&q=60';

            if (!name || !price) { alert('أدخل الاسم والسعر!'); return; }
            store.menu_items.push({
                id: 'itm_' + Date.now(),
                category_id: catId,
                name,
                description: desc,
                price,
                image: img,
                is_available: true,
                tags: ['جديد']

        function addToCart(id) {

            render();
        }

        function submitOrder() {
            const name = document.getElementById('cust_name').value.trim();
            const phone = document.getElementById('cust_phone').value.trim();
            if (!name || !phone) { alert('أدخل الاسم ورقم الهاتف!'); return; }

            const total = appState.cart.reduce((s,i)=>s+(i.price*i.qty),0);
            const newOrd = {
                id: 'ORD-' + Math.floor(1000 + Math.random()*9000),
                table_number: appState.tableNumber ? Number(appState.tableNumber) : null,
                customer_name: name,
                phone: phone,
                items_json: JSON.parse(JSON.stringify(appState.cart)),
                total: total,
                status: 'new',
                created_at: 'الآن'
            };

            if (!store.orders) store.orders = [];
            store.orders.unshift(newOrd);
            syncCloud();

            appState.cart = [];
            appState.cartOpen = false;
            render();
            alert('✅ تم إرسال طلبك للكاشير والمطبخ بنجاح!');

                            <div class="bg-white text-slate-950 p-3 rounded-2xl text-center space-y-1 shadow">
                                <div class="font-black text-xs">طاولة ${num}</div>
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(menuUrl+num)}" class="w-24 h-24 mx-auto">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('view') === 'menu') appState.page = 'storefront';

        render();
    </script>
</body>
</html>
