<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرتك | Tablia OS - المنصة التجارية الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased min-h-screen bg-[#0b0f19] text-slate-100 selection:bg-red-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        let globalDB = { shops: {} };
        try {
            const raw = localStorage.getItem('tablia_saas_v2200');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        function syncCloud() {
            try {
                localStorage.setItem('tablia_saas_v2200', JSON.stringify(globalDB));
                if (cloudDB) cloudDB.ref('tablia_saas_enterprise_v2200').set(globalDB).catch(() => {});
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_saas_enterprise_v2200').on('value', (snap) => {
                const data = snap.val();
                if (data && data.shops) {
                    globalDB = data;
                    try { localStorage.setItem('tablia_saas_v2200', JSON.stringify(globalDB)); } catch(e){}
                    checkExpirations();
                    render();
                }
            });
        }

        function checkExpirations() {
            let changed = false;
            const now = Date.now();
            Object.keys(globalDB.shops || {}).forEach(id => {
                const s = globalDB.shops[id];
                if (s.status === 'active' && s.expiresAt && now > s.expiresAt) {
                    s.status = 'expired';
                    changed = true;
                }
            });
            if(changed) syncCloud();
        }
        checkExpirations();

        function playBell(){
            try {
                const a = document.getElementById('cloud-bell');
                if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
                if('vibrate' in navigator) navigator.vibrate([400, 200, 400]);
            } catch(e){}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isAdminMode = urlParams.get('admin') === 'true'; 
        const isCustomerMode = urlParams.get('view') === 'store'; 
        const targetShopSlug = urlParams.get('shop');
        
        let currentShopId = localStorage.getItem('tablia_logged_shop_id') || null;

        const appState = { 
            page: isAdminMode ? 'admin_panel' : (isCustomerMode ? 'storefront' : (currentShopId ? 'builder' : 'landing')), 
            authMode: 'register', 
            cart: [],
            searchQuery: '',
            appliedDiscount: 0,
            deliveryType: 'delivery',
            checkoutStep: 'cart'
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isAdminMode) {
                    content = renderAdminDashboard();
                } else if(isCustomerMode) {
                    content = renderStorefront();
                } else if(appState.page === 'landing') {
                    content = renderLandingPage();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentShopId || !globalDB.shops?.[currentShopId]) { 
                        currentShopId = null; 
                        localStorage.removeItem('tablia_logged_shop_id');
                        appState.page = 'landing'; 
                        content = renderLandingPage(); 
                    } else {
                        const shop = globalDB.shops[currentShopId];
                        if(shop.status === 'pending' || shop.status === 'expired') {
                            content = renderPendingScreen(shop);
                        } else if(appState.page === 'builder') {
                            content = renderBuilder();
                        } else if(appState.page === 'orders') {
                            content = renderOrders();
                        } else if(appState.page === 'design') {
                            content = renderDesignCustomizer();
                        } else if(appState.page === 'qr_print') {
                            content = renderQRPrint();
                        } else {
                            content = renderBuilder();
                        }
                    }
                }
                const bottomNav = (isAdminMode || isCustomerMode || !currentShopId || globalDB.shops[currentShopId]?.status !== 'active') ? '' : renderBottomNav();
                root.innerHTML = content + bottomNav;
            } catch(err) { console.error("Render Error:", err); }
        }

        function renderBottomNav(){
            return `
                <div class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900 border-t border-slate-800 px-1 py-2">
                    <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center text-slate-400">
                        <button onclick="setPage('builder')" class="flex flex-col items-center py-1 ${appState.page==='builder'?'text-red-500 font-black':''}"><i class="fa-solid fa-wand-magic-sparkles text-xs mb-0.5"></i><span class="text-[10px]">المنتجات</span></button>
                        <button onclick="setPage('design')" class="flex flex-col items-center py-1 ${appState.page==='design'?'text-red-500 font-black':''}"><i class="fa-solid fa-palette text-xs mb-0.5 text-sky-400"></i><span class="text-[10px]">القوالب والمظهر</span></button>
                        <button onclick="setPage('orders')" class="flex flex-col items-center py-1 ${appState.page==='orders'?'text-red-500 font-black':''}"><i class="fa-solid fa-bell text-xs mb-0.5 text-amber-400"></i><span class="text-[10px]">الطلبات</span></button>
                        <button onclick="setPage('qr_print')" class="flex flex-col items-center py-1 ${appState.page==='qr_print'?'text-red-500 font-black':''}"><i class="fa-solid fa-qrcode text-xs mb-0.5"></i><span class="text-[10px]">QR</span></button>
                    </div>
                </div>
            `;
        }

        // ================= 1. صفحة الهبوط =================
        function renderLandingPage(){
            return `
                <div class="max-w-xl mx-auto px-4 py-12 space-y-8 text-center">
                    <div class="space-y-3">
                        <span class="bg-red-500/10 text-red-500 font-black px-4 py-1.5 rounded-full text-xs">منصة سفرتك | Tablia OS 🚀</span>
                        <h1 class="text-3xl font-black text-white leading-tight">أنشئ منيو مطعمك أو متجرك باحترافية تشبه المنصات العالمية</h1>
                        <p class="text-slate-400 text-sm">اختر قالبك المفضل، أضف منتجاتك بضغطة زر، واحصل على رابط متجرك الفوري لاستقبال طلبات الزبائن وتنبيهات واتساب.</p>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl text-right">
                        <div class="relative h-36 bg-slate-950">
                            <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800" class="w-full h-full object-cover opacity-75">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent flex items-end p-4">
                                <div class="text-white">
                                    <span class="bg-emerald-500 text-slate-950 font-black px-2.5 py-0.5 rounded text-[10px]">قوالب ذكية متعددة</span>
                                    <h3 class="font-black text-base mt-1">مودرن • كلاسيك داكن • فاشون بوتيك</h3>
                                </div>
                            </div>
                        </div>
                        <div class="p-5 space-y-4 bg-slate-900">
                            <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 font-bold">
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">🎨 تخصيص القوالب والألوان</div>
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">🔍 بحث فوري وتصنيفات</div>
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">📊 إحصائيات وأرباح يومية</div>
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">🔔 تنبيهات واتساب للطلبات</div>
                            </div>
                            <div class="bg-slate-950 border border-amber-500/30 p-3.5 rounded-2xl flex justify-between items-center">
                                <div>
                                    <span class="text-slate-400 text-[11px] block">باقة المحلات الشاملة</span>
                                    <span class="text-amber-400 font-black text-base">600 جنيه فقط / شهرياً</span>
                                </div>
                                <span class="bg-amber-500/20 text-amber-400 px-3 py-1 rounded-xl text-xs font-black">بدون عمولة 🔥</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-3 shadow-xl">
                        <div class="grid grid-cols-1 gap-3">
                            <button onclick="appState.authMode='register'; setPage('auth');" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-2xl shadow-lg text-sm transition">
                                🛒 أنشئ متجرك الجديد الآن
                            </button>
                            <button onclick="appState.authMode='login'; setPage('auth');" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3.5 rounded-2xl text-xs transition">
                                🔑 عندي حساب - تسجيل الدخول
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 2. لوحة تحكم الأدمن =================
        function renderAdminDashboard(){
            const isAuth = sessionStorage.getItem('tablia_admin_auth') === 'true';
            if(!isAuth) {
                return `
                    <div class="max-w-md mx-auto px-4 py-20 space-y-6 text-xs text-center">
                        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-4">
                            <h1 class="text-xl font-black text-white">🔐 لوحة تحكم الإدارة (المالك)</h1>
                            <p class="text-slate-400">أدخل كلمة السر الخاصة بإدارة المنصة:</p>
                            <input id="admin_pass_box" type="password" placeholder="••••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold text-center outline-none">
                            <button onclick="loginAdmin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-xl shadow">دخول للإدارة ✓</button>
                        </div>
                    </div>
                `;
            }

            const shops = globalDB.shops || {};
            const shopIds = Object.keys(shops);

            return `
                <div class="max-w-4xl mx-auto px-4 py-8 space-y-6 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-5 rounded-3xl border border-slate-800">
                        <div>
                            <h1 class="font-black text-white text-base">👑 لوحة التحكم العامة (المالك)</h1>
                            <p class="text-slate-400">موافقة وتفعيل اشتراكات المحلات (600 ج/شهر)</p>
                        </div>
                        <button onclick="sessionStorage.removeItem('tablia_admin_auth'); window.location.href = location.pathname;" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl font-bold">خروج</button>
                    </div>

                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 border border-slate-800">
                        <h2 class="font-black text-white text-sm">المتاجر المسجلة (${shopIds.length})</h2>
                        <div class="space-y-3">
                            ${shopIds.length === 0 ? '<div class="text-slate-500 text-center py-6">لا توجد متاجر مسجلة بعد..</div>' : shopIds.map(id => {
                                const s = shops[id];
                                const expireDate = s.expiresAt ? new Date(s.expiresAt).toLocaleDateString('ar-EG') : 'غير مفعل';
                                return `
                                    <div class="bg-slate-950 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border border-slate-800">
                                        <div>
                                            <span class="font-black text-white text-sm">${s.name}</span>
                                            <span class="text-slate-400 block text-[10px]">${s.phone} | النشاط: ${s.type}</span>
                                            <span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold ${s.status==='active'?'bg-emerald-500/20 text-emerald-400':'bg-amber-500/20 text-amber-400'}">الحالة: ${s.status} (ينتهي في: ${expireDate})</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <button onclick="adminActivateShop('${id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl font-black">تفعيل شهر ✅</button>
                                            <button onclick="adminSuspendShop('${id}')" class="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded-xl font-black">إيقاف ✕</button>
                                            <a href="?view=store&shop=${id}" target="_blank" class="bg-sky-600 text-white px-3 py-2 rounded-xl font-black">معاينة ➔</a>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function loginAdmin(){
            const p = document.getElementById('admin_pass_box').value;
            if(p === '357159'){
                sessionStorage.setItem('tablia_admin_auth', 'true');
                render();
            } else { alert('كلمة السر غير صحيحة!'); }
        }

        function adminActivateShop(shopId){
            if(globalDB.shops[shopId]){
                globalDB.shops[shopId].status = 'active';
                globalDB.shops[shopId].expiresAt = Date.now() + (30 * 24 * 60 * 60 * 1000); 
                syncCloud();
                alert('✨ تم تفعيل المتجر لمدة 30 يوم بنجاح!');
                render();
            }
        }

        function adminSuspendShop(shopId){
            if(globalDB.shops[shopId]){
                globalDB.shops[shopId].status = 'pending';
                globalDB.shops[shopId].expiresAt = null;
                syncCloud();
                alert('⚠️ تم تعليق المتجر.');
                render();
            }
        }

        // ================= 3. شاشة التسجيل =================
        function renderAuthScreen(){
            const isLogin = appState.authMode === 'login';
            return `
                <div class="max-w-md mx-auto px-4 py-10 space-y-6 text-xs">
                    <div class="flex justify-between items-center">
                        <button onclick="setPage('landing')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-right"></i> الرئيسية</button>
                        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                            <button onclick="appState.authMode='register'; render();" class="px-3 py-1.5 rounded-lg font-bold ${!isLogin?'bg-red-600 text-white':''}">حساب جديد</button>
                            <button onclick="appState.authMode='login'; render();" class="px-3 py-1.5 rounded-lg font-bold ${isLogin?'bg-red-600 text-white':''}">تسجيل دخول</button>
                        </div>
                    </div>

                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 shadow-xl border border-slate-800">
                        <h1 class="text-lg font-black text-white text-center">${isLogin ? '🔑 تسجيل الدخول لحسابك' : '🛒 إنشاء متجر جديد (600 ج/شهر)'}</h1>

                        ${!isLogin ? `
                            <div>
                                <label class="block text-slate-300 mb-1 font-bold">نوع نشاطك التجاري</label>
                                <select id="reg_type" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                                    <option value="restaurant">🍽️ مطعم / كافيه</option>
                                    <option value="clothes">👕 محل ملابس وموضة</option>
                                    <option value="shoes">👟 محل أحذية وكوتشيات</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-slate-300 mb-1 font-bold">اسم المحل أو المتجر</label>
                                <input id="reg_name" placeholder="مثال: مطعم الشيف" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                            </div>
                        ` : ''}

                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label>
                            <input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">كلمة السر</label>
                            <input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>

                        <button onclick="${isLogin ? 'loginExistingShop()' : 'registerNewShop()'}" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-xl shadow transition">
                            ${isLogin ? 'دخول للمتجر ➔' : 'إنشاء المتجر الآن ➔'}
                        </button>
                    </div>
                </div>
            `;
        }

        function registerNewShop(){
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            const type = document.getElementById('reg_type').value;
            
            if(!name || !phone || !pass){ alert('يرجى استكمال جميع البيانات!'); return; }
            
            let slug = 'shop-' + phone.replace(/[^0-9]/g, '') + '-' + Math.floor(10 + Math.random() * 90);

            globalDB.shops[slug] = { 
                id: slug, name, phone, pass, type,
                status: 'pending', 
                expiresAt: null,
                address: 'مصر - الإسماعيلية',
                deliveryFee: 15,
                coverImage: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800',
                logoImage: '',
                template: 'modern', // القالب الافتراضي المودرن شبيه بـ MenusBee
                theme: { bg: '#ffffff', primary: '#0f172a' },
                products: [], 
                orders: []
            };
            syncCloud(); 
            currentShopId = slug; 
            localStorage.setItem('tablia_logged_shop_id', slug); 
            render();
        }

        function loginExistingShop(){
            const phone = document.getElementById('reg_phone').value.trim();
            const pass = document.getElementById('reg_pass').value.trim();
            if(!phone || !pass){ alert('يرجى كتابة رقم الموبايل وكلمة السر!'); return; }

            const shops = globalDB.shops || {};
            const foundId = Object.keys(shops).find(id => shops[id].phone === phone && shops[id].pass === pass);

            if(foundId) {
                currentShopId = foundId;
                localStorage.setItem('tablia_logged_shop_id', foundId);
                render();
            } else { alert('بيانات الدخول غير صحيحة!'); }
        }

        function renderPendingScreen(shop){
            return `
                <div class="max-w-md mx-auto px-4 py-16 space-y-6 text-xs text-center">
                    <div class="bg-slate-900 p-8 rounded-3xl border border-amber-500/40 shadow-2xl space-y-5">
                        <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                            <i class="fa-solid fa-hourglass-half"></i>
                        </div>
                        <h1 class="text-xl font-black text-white">حسابك في انتظار تفعيل الاشتراك ⏳</h1>
                        <p class="text-slate-300 leading-relaxed">
                            متجرك <span class="text-amber-400 font-bold">${shop.name}</span> مسجل بنجاح.<br>
                            لتفعيله لمدة 30 يوم، يرجى تحويل <b>600 جنيه</b> فودافون كاش على الرقم:
                        </p>
                        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 select-all font-mono text-amber-400 font-black text-base">
                            01015861991
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-2">
                            <a href="https://wa.me/201015861991?text=${encodeURIComponent('تم تحويل 600 جنيه اشتراك متجر: ' + shop.name)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl flex items-center justify-center gap-1">
                                <i class="fa-brands fa-whatsapp"></i> إرسال التحويل
                            </a>
                            <button onclick="currentShopId=null; localStorage.removeItem('tablia_logged_shop_id'); setPage('landing');" class="bg-slate-800 text-slate-300 font-bold py-3 rounded-xl">خروج</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 4. لوحة تحكم التاجر وإدارة القوالب =================
        function renderBuilder(){
            const shop = globalDB.shops[currentShopId];
            if(!shop){ setPage('landing'); return ''; }

            const totalOrders = (shop.orders || []).length;
            const totalRevenue = (shop.orders || []).reduce((sum, ord) => sum + ord.total, 0);
            const customLink = location.origin + location.pathname + `?view=store&shop=${shop.id}`;

            return `
                <div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-5 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                        <div>
                            <h1 class="font-black text-white text-sm">إدارة متجر: ${shop.name}</h1>
                            <span class="text-emerald-400 font-bold text-[10px]">النشاط مفعل ونشط ✓</span>
                        </div>
                        <button onclick="currentShopId=null; localStorage.removeItem('tablia_logged_shop_id'); setPage('landing');" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-xl font-bold">خروج</button>
                    </div>

                    <!-- إحصائيات الأرباح -->
                    <div class="grid grid-cols-2 gap-3">

        function addNewProductWithImage(shopId){
            const shop = globalDB.shops[shopId];
            const name = document.getElementById('new_p_name').value.trim();
            const price = Number(document.getElementById('new_p_price').value);
            const category = document.getElementById('new_p_cat').value.trim() || 'عام';
            const isBestSeller = document.getElementById('new_p_bestseller').checked;
            const fileInput = document.getElementById('new_p_file');

            if(!name || !price){ alert('يرجى كتابة اسم المنتج والسعر!'); return; }
            const defaultFoodImg = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400';

            if(fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if(!shop.products) shop.products = [];
                    shop.products.push({ id: 'p_' + Date.now(), name, price, category, isBestSeller, image: e.target.result });
                    syncCloud();
                    alert('✅ تمت الإضافة بنجاح!');
                    render();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                if(!shop.products) shop.products = [];
                shop.products.push({ id: 'p_' + Date.now(), name, price, category, isBestSeller, image: defaultFoodImg });
                syncCloud();
                alert('✅ تمت الإضافة بنجاح!');
                render();
            }
        }

                                        <span class="w-5 text-center text-white">${item.qty}</span>
                                        <button onclick="updateCartQty(${idx}, 1)" class="w-6 h-6 bg-slate-900 rounded-lg">+</button>
                                    </div>
                                </div>

                            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">

        function addToCart(prodId){
            const shop = globalDB.shops[targetShopSlug || Object.keys(globalDB.shops)[0]];
            const prod = shop.products.find(p => p.id === prodId);
            if(!prod) return;
            const found = appState.cart.find(c => c.id === prodId);
            if(found) found.qty++; else appState.cart.push({...prod, qty: 1});
            render();
        }

        function updateCartQty(idx, change){
            appState.cart[idx].qty += change;
            if(appState.cart[idx].qty <= 0) appState.cart.splice(idx, 1);
            render();

        function confirmAndSendOrder(shopId){
            const name = document.getElementById('cust_name').value.trim();
            const phone = document.getElementById('cust_phone').value.trim();

            if(!name || !phone){ alert('يرجى كتابة الاسم ورقم الموبايل!'); return; }

            const shop = globalDB.shops[shopId];
            if(!shop.orders) shop.orders = [];
            
            const subtotal = appState.cart.reduce((s,i)=>s+(i.price*i.qty), 0);
            const deliveryFee = appState.deliveryType === 'pickup' ? 0 : (shop.deliveryFee || 15);
            const total = subtotal + deliveryFee;

            const newOrder = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customer_name: name, phone, address,
                items: JSON.parse(JSON.stringify(appState.cart)),
                total
            };

            shop.orders.unshift(newOrder);
            appState.cart = [];
            appState.checkoutStep = 'cart';
            syncCloud();
            playBell();
            alert('🎉 تم إرسال طلبك بنجاح للمتجر!');
            render();
        }

        render();
    </script>
</body>
</html>
