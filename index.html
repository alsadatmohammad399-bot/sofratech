<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablia OS 2030 | المنصة السحابية المتكاملة للمطاعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #030712; color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="antialiased min-h-screen pb-24 selection:bg-amber-500 selection:text-slate-950">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const PLATFORM_OWNER = { walletNumber: '01015861991', monthlyPrice: 600, adminPass: '2030' };

        let globalDB = JSON.parse(localStorage.getItem('tablia_multitenant_2030_v13')) || {
            restaurants: {
                "rest_demo": {
                    id: "rest_demo", ownerName: "محمد الحاتي", name: "مشويات الحاتي الفاخرة", phone: "01015861991", pass: "1234",
                    template_id: "foodera-modern", layout: "foodera", theme: { primary: "#ea580c", bg: "#030712" }, tablesCount: 20,
                    subscription: { isActive: true, expiresAt: Date.now() + 30*24*60*60*1000 },
                    categories: [{ id: 'cat_1', name: 'المشويات', icon: '🥩' }, { id: 'cat_2', name: 'السندوتشات', icon: '🥙' }],
                    menu_items: [{ id: 'itm_1', category_id: 'cat_1', name: 'كيلو كباب وكفتة', description: 'لحم بلدي مشوي عالفحم', price: 680, image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500', is_available: true, tags: [] }],
                    orders: []
                }
            }
        };

        const TEMPLATES_CATALOG = [
            { id: 'foodera-modern', name: 'Foodera Modern App', layout: 'foodera', desc: 'تصميم برجر وعصري ببانر تسويقي وبطاقات شبكية فخمة', preview: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500', themeBg: '#030712', primary: '#ea580c' },
            { id: 'pizza-deli', name: 'Pizza Deli Style', layout: 'pizza', desc: 'تصميم بيتزا فخم ببانر علوي أحمر وبطاقات عريضة', preview: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500', themeBg: '#1a0505', primary: '#dc2626' },
            { id: 'dark-grill', name: 'Dark Grill VIP', layout: 'dark_grill', desc: 'تصميم ليلي فاخر للستيك والبرجر بالأسود والذهبي', preview: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=500', themeBg: '#09090b', primary: '#f59e0b' },
            { id: 'verde-table', name: 'Verde Organic', layout: 'verde', desc: 'تصميم عضوي وطبيعي مستوحى من المزارع', preview: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500', themeBg: '#05160a', primary: '#10b981' },
            { id: 'boardroom-bites', name: 'Boardroom Catering', layout: 'boardroom', desc: 'تصميم مؤسسي لضيافة الشركات وباقات الاجتماعات', preview: 'https://images.unsplash.com/photo-1555244162-803834f70033?w=500', themeBg: '#0f172a', primary: '#3b82f6' },
            { id: 'ember-wok', name: 'Ember Wok Kitchen', layout: 'wok', desc: 'تصميم آسيوي حيوي وساخن للمشويات الآسيوية', preview: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500', themeBg: '#180303', primary: '#ef4444' },
            { id: 'modern-japanese', name: 'Japanese Zen Fine Dining', layout: 'japanese', desc: 'تصميم ياباني مينيمال راقٍ وهادئ', preview: 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500', themeBg: '#0a0a0c', primary: '#e2e8f0' }
        ];

        function syncCloud() {
            try {
                localStorage.setItem('tablia_multitenant_2030_v13', JSON.stringify(globalDB));
            } catch (e) {}
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'tablia_multitenant_2030_v13') {
                try {
                    globalDB = JSON.parse(e.newValue);
                    playBell();
                    render();
                } catch(err){}
            }
        });

        function playBell(){
            try {
                const a=document.getElementById('cloud-bell');
                if(a){ a.currentTime=0; a.play().catch(()=>{}); }
                if('vibrate' in navigator) navigator.vibrate([400,200,400]);
            } catch(e){}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isCustomerMode = urlParams.get('view') === 'menu';
        const targetRestSlug = urlParams.get('rest');
        
        let currentRestId = localStorage.getItem('tablia_logged_rest_id') || null;
        if (currentRestId && (!globalDB.restaurants || !globalDB.restaurants[currentRestId])) {
            localStorage.removeItem('tablia_logged_rest_id');
            currentRestId = null;
        }

        const appState = { 
            page: isCustomerMode ? 'storefront' : (currentRestId ? 'builder' : 'auth'), 
            authTab: 'login', 
            builderStep: 1, 
            activeCat: 'all', 
            search: '', 
            cart: [], 
            cartOpen: false, 
            tableNumber: urlParams.get('t')||null, 
            activeOrderId: localStorage.getItem('tablia_active_order_id')||null, 
            trackerOpen:false, 
            adminUnlocked:false,
            editingItemId: null
        };

        function setPage(p){ appState.page=p; render(); window.scrollTo(0,0); }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isCustomerMode) {
                    content = renderStorefront();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentRestId || !globalDB.restaurants[currentRestId]) {
                        currentRestId = null;
                        localStorage.removeItem('tablia_logged_rest_id');
                        appState.page = 'auth';
                        content = renderAuthScreen();
                    } else if(appState.page === 'builder') {
                        content = renderBuilder();
                    } else if(appState.page === 'cashier') {
                        content = renderCashier();
                    } else if(appState.page === 'dashboard') {
                        content = renderDashboard();
                    } else if(appState.page === 'qr_print') {
                        content = renderQRPrint();
                    } else {
                        content = renderBuilder();
                    }
                }
                
                const bottomBar = (isCustomerMode || !currentRestId || !globalDB.restaurants[currentRestId]) ? '' : renderBottomNav();
                root.innerHTML = content + bottomBar;
            } catch(err) {
                console.error("Render error:", err);
                root.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6 text-center bg-slate-950 text-white"><div class="glass p-6 rounded-3xl space-y-4 max-w-sm"><h2 class="text-amber-400 font-black text-base">تم حماية التطبيق</h2><p class="text-xs text-slate-400">حدث خطأ مؤقت وتم تجاوزه بنجاح.</p><button onclick="localStorage.clear(); location.reload();" class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs">إعادة ضبط التشغيل</button></div></div>`;
            }
        }

        function renderNav(){
            const rest = currentRestId ? globalDB.restaurants[currentRestId] : null;
            return `<nav class="sticky top-0 z-50 glass border-b border-white/10 px-4 py-3"><div class="max-w-4xl mx-auto flex justify-between items-center"><div class="flex gap-2 items-center cursor-pointer" onclick="setPage(currentRestId?'builder':'auth')"><div class="w-9 h-9 rounded-xl gold-gradient text-slate-950 flex items-center justify-center font-black">ط</div><span class="font-black text-white">Tablia <span class="text-amber-400">2030</span></span></div>${rest?`<button onclick="currentRestId=null; localStorage.removeItem('tablia_logged_rest_id'); setPage('auth');" class="bg-red-500/10 text-red-400 px-3 py-1 rounded-xl text-xs font-bold">خروج</button>`:''}</div></nav>`;
        }

        function renderBottomNav(){
            if(!currentRestId || !globalDB.restaurants[currentRestId]) return '';
            return `<div class="fixed bottom-0 left-0 right-0 z-50 glass border-t border-white/10 px-2 py-2"><div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center"><button onclick="setPage('builder')" class="flex flex-col items-center py-1 ${appState.page==='builder'?'text-amber-400 font-black':'text-slate-400'}"><i class="fa-solid fa-wand-magic-sparkles text-sm"></i><span class="text-[10px]">المنشئ</span></button><button onclick="setPage('cashier')" class="flex flex-col items-center py-1 ${appState.page==='cashier'?'text-red-400 font-black':'text-slate-400'}"><i class="fa-solid fa-cash-register text-sm"></i><span class="text-[10px]">الكاشير</span></button><button onclick="setPage('dashboard')" class="flex flex-col items-center py-1 ${appState.page==='dashboard'?'text-amber-400 font-black':'text-slate-400'}"><i class="fa-solid fa-chart-line text-sm"></i><span class="text-[10px]">الباقات</span></button><button onclick="setPage('qr_print')" class="flex flex-col items-center py-1 ${appState.page==='qr_print'?'text-amber-400 font-black':'text-slate-400'}"><i class="fa-solid fa-qrcode text-sm"></i><span class="text-[10px]">QR</span></button></div></div>`;
        }

        function renderAuthScreen(){
            return `${renderNav()}<div class="max-w-md mx-auto px-4 py-10 space-y-6"><div class="text-center"><h1 class="text-2xl font-black text-white">Tablia OS 2030</h1></div><div class="flex bg-slate-900 p-1 rounded-xl text-xs"><button onclick="appState.authTab='login'; render();" class="flex-1 py-2.5 rounded-lg font-bold ${appState.authTab==='login'?'bg-amber-500 text-slate-950':'text-slate-400'}">دخول</button><button onclick="appState.authTab='register'; render();" class="flex-1 py-2.5 rounded-lg font-bold ${appState.authTab==='register'?'bg-amber-500 text-slate-950':'text-slate-400'}">مطعم جديد</button></div>${appState.authTab==='login'?`<div class="glass p-6 rounded-3xl space-y-4 text-xs"><input id="log_phone" placeholder="رقم الموبايل" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white"><input id="log_pass" type="password" placeholder="كلمة السر" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white"><button onclick="handleLogin()" class="w-full gold-gradient text-slate-950 font-black py-3 rounded-xl">دخول</button></div>`:`<div class="glass p-6 rounded-3xl space-y-4 text-xs"><input id="reg_owner" placeholder="اسمك" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white"><input id="reg_name" placeholder="اسم المطعم" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white"><input id="reg_phone" placeholder="رقم الموبايل" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white"><input id="reg_pass" type="password" placeholder="كلمة السر" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white"><button onclick="handleRegister()" class="w-full gold-gradient text-slate-950 font-black py-3 rounded-xl">إنشاء</button></div>`}</div>`;
        }

        function handleLogin(){
            const phone=document.getElementById('log_phone').value.trim(); const pass=document.getElementById('log_pass').value.trim();
            for(let id in globalDB.restaurants){ if(globalDB.restaurants[id].phone===phone && globalDB.restaurants[id].pass===pass){ currentRestId=id; localStorage.setItem('tablia_logged_rest_id',id); setPage('builder'); return; } }
            alert('بيانات الدخول غير صحيحة');
        }

        function handleRegister(){
            const owner=document.getElementById('reg_owner').value.trim(); const name=document.getElementById('reg_name').value.trim(); const phone=document.getElementById('reg_phone').value.trim(); const pass=document.getElementById('reg_pass').value.trim();
            if(!owner||!name||!phone||!pass){ alert('يرجى استكمال البيانات'); return; }
            const restId='rest_'+Date.now();
            globalDB.restaurants[restId]={ id:restId, ownerName:owner, name:name, phone:phone, pass:pass, template_id:'foodera-modern', layout:'foodera', theme:{primary:'#ea580c', bg:'#030712'}, tablesCount:20, subscription:{isActive:false, expiresAt:null}, categories:[{id:'cat_1', name:'الرئيسية', icon:'🍔'}], menu_items:[], orders:[] };
            syncCloud(); currentRestId=restId; localStorage.setItem('tablia_logged_rest_id',restId); setPage('builder');
        }

        function renderBuilder(){
            const rest=globalDB.restaurants[currentRestId]; 
            if(!rest){ setPage('auth'); return ''; }
            const selectedTpl = TEMPLATES_CATALOG.find(t => t.id === rest.template_id) || TEMPLATES_CATALOG[0];
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-5">
                    <div class="flex gap-1 bg-slate-900 p-1 rounded-xl text-[11px]">
                        <button onclick="appState.builderStep=1; render();" class="flex-1 py-2 rounded-lg ${appState.builderStep===1?'bg-amber-500 text-slate-950 font-black':'text-slate-400'}">1. القالب والحساب</button>
                        <button onclick="appState.builderStep=2; render();" class="flex-1 py-2 rounded-lg ${appState.builderStep===2?'bg-amber-500 text-slate-950 font-black':'text-slate-400'}">2. المنيو والأصناف</button>
                        <button onclick="appState.builderStep=4; render();" class="flex-1 py-2 rounded-lg ${appState.builderStep===4?'bg-amber-500 text-slate-950 font-black':'text-slate-400'}">3. معاينة ومشاركة المنيو</button>
                    </div>
                    ${appState.builderStep===1 ? renderStep1(rest, selectedTpl) : (appState.builderStep===2 ? renderStep2(rest) : renderStep4(rest))}
                </div>
            `;
        }

        function renderStep1(rest, selectedTpl){
            return `
                <div class="glass p-5 rounded-2xl space-y-4 text-xs">
                    <h2 class="font-black text-white text-sm">الخطوة 1: اسم المطعم، اختيار القالب، وتغيير كلمة السر</h2>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-400 font-bold mb-1">اسم المطعم</label>
                            <input id="r_name" value="${rest.name}" class="w-full bg-slate-950 border border-white/10 p-2.5 rounded-xl text-white font-bold">
                        </div>
                        <div>
                            <label class="block text-slate-400 font-bold mb-1">تغيير كلمة السر الجديدة</label>
                            <input id="r_new_pass" type="password" placeholder="أدخل كلمة السر الجديدة" class="w-full bg-slate-950 border border-white/10 p-2.5 rounded-xl text-white font-bold">
                        </div>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="block text-slate-400 font-bold">اختر قالباً من الـ 7 قوالب المتاحة:</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${TEMPLATES_CATALOG.map(t=>`
                                <div onclick="globalDB.restaurants[currentRestId].template_id='${t.id}'; globalDB.restaurants[currentRestId].layout='${t.layout}'; globalDB.restaurants[currentRestId].theme.primary='${t.primary}'; globalDB.restaurants[currentRestId].theme.bg='${t.themeBg}'; syncCloud(); render();" class="border-2 rounded-xl p-2.5 cursor-pointer transition ${rest.template_id===t.id?'border-amber-500 bg-amber-500/10 shadow-lg':'border-white/10 bg-slate-950'}">
                                    <img src="${t.preview}" class="h-20 w-full object-cover rounded-lg mb-2">
                                    <h4 class="font-black text-white text-[11px]">${t.name}</h4>
                                    <p class="text-[9px] text-slate-400 line-clamp-1 mt-0.5">${t.desc}</p>
                                    ${rest.template_id===t.id?`<span class="block mt-1 text-[9px] text-amber-400 font-black">● القالب المحدد حالياً</span>`:''}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="saveStep1()" class="gold-gradient text-slate-950 font-black px-5 py-3 rounded-xl w-full text-xs shadow-xl">حفظ التعديلات والانتقال للمنيو ➔</button>
                </div>
            `;
        }

        function saveStep1(){ 
            const nameInput = document.getElementById('r_name');
            const passInput = document.getElementById('r_new_pass');
            if(nameInput) globalDB.restaurants[currentRestId].name = nameInput.value.trim();
            if(passInput && passInput.value.trim() !== '') {
                globalDB.restaurants[currentRestId].pass = passInput.value.trim();
                alert('تم تحديث كلمة السر بنجاح!');
            }
            syncCloud(); 
            appState.builderStep = 2; 
            render(); 
        }

        function renderStep2(rest){
            return `
                <div class="glass p-5 rounded-2xl space-y-4 text-xs">
                    <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl">
                        <label class="block text-amber-400 font-bold mb-1">أضف أصناف جديدة بسرعة (مثال: برجر 150, بيتزا 200):</label>
                        <textarea id="magic_box" placeholder="برجر 150, بيتزا 200" class="w-full bg-slate-950 border border-white/10 p-2 rounded-lg text-white" rows="2"></textarea>
                        <button onclick="parseMagicText()" class="w-full gold-gradient text-slate-950 font-black py-2 rounded-lg mt-2">توليد الأصناف تلقائياً</button>
                    </div>

                    <div class="space-y-2">
                        <h3 class="font-black text-white">الأصناف الحالية (تعديل أو حذف):</h3>
                        ${rest.menu_items.length === 0 ? '<p class="text-slate-400">لا توجد أصناف مضافة بعد.</p>' : ''}
                        ${rest.menu_items.map((it, i) => `
                            <div class="bg-slate-950 p-3 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border border-white/10">
                                ${appState.editingItemId === it.id ? `
                                    <div class="flex-1 flex gap-2 w-full">
                                        <input id="edit_name_${it.id}" value="${it.name}" class="flex-1 bg-slate-900 border border-white/20 p-1.5 rounded text-white">
                                        <input id="edit_price_${it.id}" type="number" value="${it.price}" class="w-20 bg-slate-900 border border-white/20 p-1.5 rounded text-white">
                                    </div>
                                    <div class="flex gap-1">
                                        <button onclick="saveEditedItem('${it.id}')" class="bg-emerald-600 text-white px-3 py-1 rounded font-bold">حفظ</button>
                                        <button onclick="appState.editingItemId=null; render();" class="bg-slate-800 text-slate-300 px-3 py-1 rounded">إلغاء</button>
                                    </div>
                                ` : `
                                    <div class="flex items-center gap-2">
                                        <img src="${it.image}" class="w-10 h-10 object-cover rounded-lg">
                                        <div>
                                            <span class="font-black text-white">${it.name}</span>
                                            <span class="text-amber-400 font-bold mr-2">${it.price} ج.م</span>
                                        </div>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="appState.editingItemId='${it.id}'; render();" class="bg-sky-500/20 text-sky-400 px-3 py-1.5 rounded-lg font-bold"><i class="fa-solid fa-pen"></i> تعديل</button>
                                        <button onclick="globalDB.restaurants[currentRestId].menu_items.splice(${i},1); syncCloud(); render();" class="bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                `}
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="appState.builderStep=4; render();" class="gold-gradient text-slate-950 font-black px-4 py-3 rounded-xl w-full">التالي: معاينة المنيو ومشاركته ➔</button>
                </div>
            `;
        }

        function saveEditedItem(id) {
            const rest = globalDB.restaurants[currentRestId];
            const item = rest.menu_items.find(i => i.id === id);
            if(item) {
                const newName = document.getElementById(`edit_name_${id}`).value.trim();
                const newPrice = Number(document.getElementById(`edit_price_${id}`).value);
                if(newName) item.name = newName;
                if(!isNaN(newPrice)) item.price = newPrice;
            }
            appState.editingItemId = null;
            syncCloud();
            render();
        }

        function parseMagicText(){
            const rest=globalDB.restaurants[currentRestId]; const text=document.getElementById('magic_box').value.trim(); if(!text) return;
            text.split(/,|\n/).forEach(line=>{
                const m=line.match(/\d+/); if(!m) return;
                const price=Number(m[0]); const name=line.replace(m[0],'').replace(/ج/g,'').trim();
                if(name) rest.menu_items.push({ id:'itm_'+Date.now()+Math.random(), category_id:rest.categories[0].id, name, description:'طازج', price, image:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500', is_available:true, tags:[] });
            }); syncCloud(); render();
        }

        // الخطوة الأخيرة: معاينة المنيو بالكامل مع مربعات المشاركة الفورية السريعة
        function renderStep4(rest){
            const isSub=rest.subscription?.isActive; 
            const url=location.origin+location.pathname+`?view=menu&rest=${rest.id}`;
            const selectedTpl = TEMPLATES_CATALOG.find(t => t.id === rest.template_id) || TEMPLATES_CATALOG[0];

            return `
                <div class="glass p-5 rounded-3xl space-y-4 text-xs">
                    <div class="text-center space-y-1">
                        <h2 class="font-black text-white text-sm">🎉 مبروك! المنيو جاهز بالكامل ومعاينة الشاشة أدناه</h2>
                        <p class="text-slate-400 text-[10px]">هذا هو الشكل النهائي الذي سيراه عملاؤك تماماً</p>
                    </div>

                    <!-- معاينة كاملة للمنيو داخل الخطوة الأخيرة -->
                    <div class="p-4 rounded-2xl border-2 border-amber-500/40 space-y-3" style="background:${selectedTpl.themeBg}">
                        <div class="flex items-center gap-3 bg-slate-900/80 p-3 rounded-xl border border-white/10">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg text-white shadow" style="background:${selectedTpl.primary}">🔥</div>
                            <div>
                                <h3 class="font-black text-white text-xs">${rest.name}</h3>
                                <p class="text-[9px] text-emerald-400">● المنيو أونلاين وجاهز للطلبات</p>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <span class="text-[10px] text-amber-400 font-bold">الأصناف المضافة (${rest.menu_items.length}):</span>
                            ${rest.menu_items.length === 0 ? '<p class="text-[10px] text-slate-400">لم تقم بإضافة أصناف بعد، عُد للخطوة 2 لإضافتها.</p>' : ''}
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-60 overflow-y-auto hide-scrollbar">
                                ${rest.menu_items.map(item => `
                                    <div class="glass p-2.5 rounded-xl flex items-center justify-between border border-white/10">
                                        <div class="flex items-center gap-2">
                                            <img src="${item.image}" class="w-10 h-10 object-cover rounded-lg">
                                            <div>
                                                <h4 class="font-black text-white text-[11px]">${item.name}</h4>
                                                <span class="font-bold text-[10px]" style="color:${selectedTpl.primary}">${item.price} ج.م</span>
                                            </div>
                                        </div>
                                        <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-bold">متاح</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- مربع المشاركة السريعة وزر الـ WhatsApp -->
                    <div class="bg-slate-900 p-4 rounded-2xl border border-white/10 space-y-3">
                        <label class="block text-amber-400 font-bold text-xs">🔗 رابط المنيو المباشر (جاهز للإرسال):</label>
                        <div class="flex gap-2">
                            <input readonly value="${url}" class="flex-1 bg-slate-950 border border-white/10 p-2.5 rounded-xl text-white text-[11px] select-all">
                            <button onclick="navigator.clipboard.writeText('${url}'); alert('تم نسخ رابط المنيو بنجاح!');" class="bg-amber-500 text-slate-950 px-4 py-2.5 rounded-xl font-black text-xs">نسخ الرابط</button>
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                            <button onclick="shareViaWhatsApp('${url}', '${rest.name}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl flex items-center justify-center gap-2 text-xs shadow-lg transition">
                                <i class="fa-brands fa-whatsapp text-sm"></i> إرسال المنيو عبر واتساب
                            </button>
                            <button onclick="nativeShare('${url}', '${rest.name}')" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-3 rounded-xl flex items-center justify-center gap-2 text-xs shadow-lg transition">
                                <i class="fa-solid fa-share-nodes text-sm"></i> مشاركة عامة (تطبيقات أخرى)
                            </button>
                        </div>
                    </div>

                    ${!isSub ? `
                        <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl text-center space-y-2">
                            <p class="text-[10px] text-amber-300">ملاحظة: المنيو يعمل بالرابط أعلاه، ولتفعيل استقبال الطلبات وربطه بالكاشير شهرياً (${PLATFORM_OWNER.monthlyPrice} جنيه)، تواصل مع الإدارة:</p>
                            <a href="https://wa.me/2${PLATFORM_OWNER.walletNumber}?text=${encodeURIComponent('تفعيل مطعم '+rest.name+' بمبلغ '+PLATFORM_OWNER.monthlyPrice+' جنيه')}" target="_blank" class="inline-block bg-emerald-600 text-white font-black px-4 py-2 rounded-xl text-xs">تفعيل الحساب (600 جنيه)</a>
                        </div>
                    ` : '<div class="bg-emerald-500/20 text-emerald-400 p-2 rounded-xl text-center font-black">✅ حسابك مفعل ونشط بالكامل</div>'}
                </div>
            `;
        }

        function shareViaWhatsApp(url, restName) {
            const text = encodeURIComponent(`🍽️ تفضل بزيارة منيو مطعم ${restName} واطلب وجبتك المفضلة أونلاين:\n${url}`);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        function nativeShare(url, restName) {
            if (navigator.share) {
                navigator.share({
                    title: restName,
                    text: `اطلب الآن من منيو مطعم ${restName}`,
                    url: url
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url);
                alert('تم نسخ الرابط إلى الحافظة!');
            }
        }

        function renderStorefront(){
            const restId=targetRestSlug||Object.keys(globalDB.restaurants)[0]; const rest=globalDB.restaurants[restId];
            if(!rest) return `<div class="min-h-screen flex items-center justify-center text-white">المطعم غير موجود</div>`;
            if(!rest.subscription?.isActive) return `<div class="min-h-screen flex items-center justify-center bg-slate-950 text-white text-center p-4">المنيو متوقف مؤقتاً بانتظار التفعيل لدى الإدارة</div>`;

            const filtered = rest.menu_items.filter(i => {
                if (!i.is_available) return false;
                const matchCat = appState.activeCat === 'all' || i.category_id === appState.activeCat;
                const matchQ = i.name.toLowerCase().includes(appState.search.toLowerCase());
                return matchCat && matchQ;
            });

            const cartCount=appState.cart.reduce((s,i)=>s+i.qty,0); const cartTotal=appState.cart.reduce((s,i)=>s+(i.price*i.qty),0);
            return `${renderNav()}<div class="min-h-screen pb-32" style="background:${rest.theme.bg}"><div class="max-w-3xl mx-auto px-4 pt-4 space-y-4">${appState.tableNumber?`<div class="bg-amber-500 text-slate-950 text-center py-1 font-black text-xs">طاولة ${appState.tableNumber}</div>`:''}<div class="glass p-4 rounded-3xl flex gap-3 items-center"><div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl text-white" style="background:${rest.theme.primary}">🔥</div><div><h1 class="font-black text-white">${rest.name}</h1><p class="text-[10px] text-emerald-400">● متصل أونلاين</p></div></div><input value="${appState.search}" oninput="appState.search=this.value; render();" placeholder="ابحث عن وجبتك المفضلة..." class="w-full py-3 px-3.5 rounded-xl glass border border-white/10 text-white text-xs outline-none"><div class="flex gap-1 overflow-x-auto hide-scrollbar"><button onclick="appState.activeCat='all'; render();" class="px-3.5 py-1.5 rounded-lg text-xs font-black ${appState.activeCat==='all'?'bg-amber-500 text-slate-950':'bg-white/10'}">الكل</button>${rest.categories.map(c=>`<button onclick="appState.activeCat='${c.id}'; render();" class="px-3.5 py-1.5 rounded-lg text-xs font-black whitespace-nowrap ${appState.activeCat===c.id?'bg-amber-500 text-slate-950':'bg-white/10'}">${c.name}</button>`).join('')}</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${filtered.map(item=>`<div class="rounded-2xl glass border border-white/10 overflow-hidden"><img src="${item.image}" class="h-32 w-full object-cover"><div class="p-3 flex justify-between items-center"><div><h3 class="font-black text-xs text-white">${item.name}</h3><span class="text-amber-400 font-bold text-xs">${item.price} ج.م</span></div><button onclick="addToCart('${item.id}')" class="px-3 py-1.5 text-xs font-black text-white rounded-xl shadow" style="background:${rest.theme.primary}">+ أضف</button></div></div>`).join('')}</div></div>${cartCount>0?`<div class="fixed bottom-5 left-4 right-4 max-w-md mx-auto"><button onclick="appState.cartOpen=true; render();" class="w-full py-3.5 px-5 rounded-2xl gold-gradient text-slate-950 font-black flex justify-between text-xs"><span>إتمام الطلب (${cartCount})</span><span>${cartTotal} ج.م</span></button></div>`:''}${appState.cartOpen?renderCheckoutModal(rest):''}${appState.trackerOpen?renderLiveOrderTracker(rest):''}</div>`;
        }

        function addToCart(id){
            const restId=targetRestSlug||currentRestId||Object.keys(globalDB.restaurants)[0]; const rest=globalDB.restaurants[restId];
            const item=rest.menu_items.find(i=>i.id===id); const f=appState.cart.find(c=>c.id===id);
            if(f) f.qty++; else appState.cart.push({...item, qty:1}); render();
        }
        function renderCheckoutModal(rest){
            return `<div class="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4 text-xs"><div class="glass p-5 rounded-3xl max-w-sm w-full space-y-3"><input id="cust_name" placeholder="اسمك الكريم" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white"><input id="cust_phone" placeholder="رقم الموبايل" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white"><button onclick="submitOrder()" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl">تأكيد وإرسال الطلب</button><button onclick="appState.cartOpen=false; render();" class="w-full bg-slate-800 text-white py-2 rounded-xl">إلغاء</button></div></div>`;
        }
        function submitOrder(){
            const restId=targetRestSlug||Object.keys(globalDB.restaurants)[0]; const rest=globalDB.restaurants[restId];
            const name=document.getElementById('cust_name').value.trim(); const phone=document.getElementById('cust_phone').value.trim();
            if(!name||!phone){ alert('أدخل الاسم ورقم الهاتف!'); return; }
            const total=appState.cart.reduce((s,i)=>s+(i.price*i.qty),0);
            rest.orders.unshift({ id:'ORD-'+Date.now(), customer_name:name, phone, items_json:JSON.parse(JSON.stringify(appState.cart)), total, status:'new', table_number:appState.tableNumber||'دليفري', created_at:new Date().toLocaleTimeString('ar-EG') });
            appState.activeOrderId=rest.orders[0].id; localStorage.setItem('tablia_active_order_id', appState.activeOrderId); appState.cart=[]; appState.cartOpen=false; appState.trackerOpen=true; syncCloud(); render(); playBell();
        }
        function renderLiveOrderTracker(rest){
            const ord=rest.orders.find(o=>o.id===appState.activeOrderId); if(!ord) return '';
            return `<div class="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4 text-xs"><div class="glass p-6 rounded-3xl max-w-sm w-full text-center space-y-3"><h3 class="font-black text-white">طلب رقم #${ord.id}</h3><p class="text-amber-400 font-bold">الحالة: ${ord.status}</p><p class="text-white">${ord.total} ج.م</p><button onclick="appState.trackerOpen=false; render();" class="w-full bg-slate-800 text-white py-2 rounded-xl">إغلاق</button></div></div>`;
        }
        function renderCashier(){
            const rest=globalDB.restaurants[currentRestId]; if(!rest){ setPage('auth'); return ''; }
            return `${renderNav()}<div class="max-w-4xl mx-auto px-4 py-4 space-y-4 text-xs"><h1 class="font-black text-white">شاشة الكاشير - ${rest.name}</h1><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${rest.orders.length===0?`<div class="col-span-2 glass p-10 text-center text-slate-400">لا توجد طلبات نشطة حالياً</div>`:rest.orders.map((ord,i)=>`<div class="glass p-4 rounded-2xl space-y-2 border ${ord.status==='new'?'border-amber-500 animate-pulse':'border-white/10'}"><div class="flex justify-between"><span class="font-black text-white">${ord.customer_name} - ${ord.table_number}</span><span class="text-amber-400 font-black">${ord.total}ج</span></div><div class="text-slate-300">${ord.items_json.map(x=>`${x.qty}x ${x.name}`).join(', ')}</div><div class="grid grid-cols-3 gap-1"><button onclick="globalDB.restaurants[currentRestId].orders[${i}].status='preparing'; syncCloud(); render();" class="bg-sky-600 text-white py-1 rounded font-bold">يحضر</button><button onclick="globalDB.restaurants[currentRestId].orders[${i}].status='ready'; syncCloud(); render();" class="bg-emerald-600 text-white py-1 rounded font-bold">جاهز</button><button onclick="globalDB.restaurants[currentRestId].orders[${i}].status='done'; syncCloud(); render();" class="bg-indigo-600 text-white py-1 rounded font-bold">تم</button></div></div>`).join('')}</div></div>`;
        }
        function renderDashboard(){
            const rest=globalDB.restaurants[currentRestId]; if(!rest){ setPage('auth'); return ''; }
            if(!appState.adminUnlocked) return `${renderNav()}<div class="max-w-md mx-auto py-12 px-4 text-center space-y-4 text-xs"><div class="glass p-6 rounded-3xl space-y-3 border border-amber-500/30"><h2 class="font-black text-amber-400">لوحة الإدمن (تفعيل الباقات - 600 ج)</h2><input id="admin_pin" type="password" placeholder="الرمز السري 2030" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-center text-white"><button onclick="if(document.getElementById('admin_pin').value==='${PLATFORM_OWNER.adminPass}'){appState.adminUnlocked=true;render();}else{alert('الرمز غلط')}" class="w-full gold-gradient text-slate-950 font-black py-3 rounded-xl">دخول الإدارة</button></div></div>`;
            return `${renderNav()}<div class="max-w-4xl mx-auto px-4 py-6 space-y-4 text-xs"><div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl"><h1 class="font-black text-white">إدارة جميع المطاعم (اشتراك 600 ج)</h1><button onclick="appState.adminUnlocked=false; render();" class="text-red-400">قفل</button></div><div class="space-y-3">${Object.values(globalDB.restaurants).map(r=>`<div class="glass p-4 rounded-2xl flex justify-between items-center border ${r.subscription?.isActive?'border-emerald-500/40':'border-amber-500/40'}"><div><h3 class="font-black text-white">${r.name}</h3><p class="text-slate-400 text-[11px]">صاحب المطعم: ${r.ownerName} (${r.phone}) - ${r.subscription?.isActive?'نشط ✅':'متوقف ⏸️'}</p></div><div class="flex gap-2"><button onclick="globalDB.restaurants['${r.id}'].subscription={isActive:true, expiresAt:Date.now()+2592000000}; syncCloud(); render();" class="bg-emerald-600 text-white px-3 py-2 rounded-xl font-bold">تفعيل شهر</button><button onclick="globalDB.restaurants['${r.id}'].subscription={isActive:false}; syncCloud(); render();" class="bg-red-500/20 text-red-400 px-3 py-2 rounded-xl">إيقاف</button></div></div>`).join('')}</div></div>`;
        }
        function renderQRPrint(){
            const rest=globalDB.restaurants[currentRestId]; if(!rest){ setPage('auth'); return ''; }
            const base=location.origin+location.pathname+`?view=menu&rest=${rest.id}&t=`;
            return `${renderNav()}<div class="max-w-3xl mx-auto px-4 py-6 space-y-4 text-xs"><div class="flex justify-between bg-slate-900 p-4 rounded-2xl"><h1 class="font-black text-white">QR للطاولات - ${rest.name}</h1><button onclick="window.print()" class="gold-gradient text-slate-950 px-3 py-2 rounded-xl font-black">اطبع الآن</button></div><div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${Array.from({length:rest.tablesCount},(_,i)=>i+1).map(n=>`<div class="bg-white p-2 rounded-xl text-center"><div class="font-black text-[11px] text-black">طاولة ${n}</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(base+n)}" class="w-20 h-20 mx-auto"></div>`).join('')}</div></div>`;
        }
        
        render();
    </script>
</body>
</html>
