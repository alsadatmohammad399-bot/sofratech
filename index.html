<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرتك | Tablia OS - المنصة التجارية المتكاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased min-h-screen selection:bg-emerald-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        let globalDB = { shops: {} };
        try {
            const raw = localStorage.getItem('tablia_saas_v1020');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        function syncCloud() {
            try {
                localStorage.setItem('tablia_saas_v1020', JSON.stringify(globalDB));
                if (cloudDB) cloudDB.ref('tablia_saas_enterprise_v1020').set(globalDB).catch(() => {});
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_saas_enterprise_v1020').on('value', (snap) => {
                const data = snap.val();
                if (data && data.shops) {
                    globalDB = data;
                    try { localStorage.setItem('tablia_saas_v1000', JSON.stringify(globalDB)); } catch(e){}
                    render();
                }
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isCustomerMode = urlParams.get('view') === 'store'; 
        const targetShopSlug = urlParams.get('shop');
        let currentShopId = localStorage.getItem('tablia_logged_shop_id') || null;

        const appState = { 
            page: isCustomerMode ? 'storefront' : (currentShopId ? 'builder' : 'auth'), 
            cart: {},
            favorites: [],
            selectedCategory: 'مشويات',
            searchQuery: '',
            checkoutStep: 'none',
            orderType: 'توصيل',
            paymentMethod: 'نقداً',
            aiStep: 1,
            uploadedFileName: ''
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        // حساب حالة اشتراك المتجر (7 أيام تجريبي ثم 600 ج شهرياً)
        function getShopSubscriptionStatus(shop) {
            const now = Date.now();
            const createdAt = shop.createdAt || now;
            const trialDays = 7;
            const trialExpires = createdAt + (trialDays * 24 * 60 * 60 * 1000);

            if (now <= trialExpires) {
                const remainingDays = Math.ceil((trialExpires - now) / (1000 * 60 * 60 * 24));
                return { type: 'trial', active: true, message: `تجربة مجانية متبقي (${remainingDays} أيام)` };
            }

            if (shop.paidUntil && now <= shop.paidUntil) {
                const remainingDays = Math.ceil((shop.paidUntil - now) / (1000 * 60 * 60 * 24));
                return { type: 'paid', active: true, message: `اشتراك نشط متبقي (${remainingDays} يوم)` };
            }

            return { type: 'expired', active: false, message: 'انتهت الفترة التجريبية أو الاشتراك الشهري (600 ج)' };
        }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isCustomerMode || targetShopSlug) {
                    content = renderStorefront();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentShopId || !globalDB.shops?.[currentShopId]) { 
                        currentShopId = null; 
                        localStorage.removeItem('tablia_logged_shop_id');
                        appState.page = 'auth'; 
                        content = renderAuthScreen(); 
                    } else {
                        const shop = globalDB.shops[currentShopId];
                        const sub = getShopSubscriptionStatus(shop);

                        if (!sub.active && appState.page !== 'renew') {
                            content = renderSubscriptionExpiredScreen(shop);
                        } else {
                            if(appState.page === 'builder') content = renderBuilder();
                            else if(appState.page === 'ai_menu') content = renderAIMenuWizard();
                            else if(appState.page === 'orders') content = renderOrders();
                            else if(appState.page === 'qr_print') content = renderQRPrint();
                            else content = renderBuilder();
                        }
                    }
                }
                const bottomNav = (isCustomerMode || !currentShopId || !getShopSubscriptionStatus(globalDB.shops[currentShopId]).active) ? '' : renderBottomNav();
                root.innerHTML = content + bottomNav;
            } catch(err) { console.error("Render Error:", err); }
        }

        function renderBottomNav(){
            return `
                <div class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900 border-t border-slate-800 px-1 py-2">
                    <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center text-slate-400">
                        <button onclick="setPage('builder')" class="flex flex-col items-center py-1 ${appState.page==='builder'?'text-emerald-400 font-black':''}"><i class="fa-solid fa-list text-xs mb-0.5"></i><span class="text-[10px]">المنتجات</span></button>
                        <button onclick="setPage('ai_menu')" class="flex flex-col items-center py-1 ${appState.page==='ai_menu'?'text-emerald-400 font-black':''}"><i class="fa-solid fa-wand-magic-sparkles text-xs mb-0.5 text-amber-400"></i><span class="text-[10px]">المنيو الذكي</span></button>
                        <button onclick="setPage('orders')" class="flex flex-col items-center py-1 ${appState.page==='orders'?'text-emerald-400 font-black':''}"><i class="fa-solid fa-bell text-xs mb-0.5 text-emerald-400"></i><span class="text-[10px]">الطلبات</span></button>
                        <button onclick="setPage('qr_print')" class="flex flex-col items-center py-1 ${appState.page==='qr_print'?'text-emerald-400 font-black':''}"><i class="fa-solid fa-qrcode text-xs mb-0.5"></i><span class="text-[10px]">QR</span></button>
                    </div>
                </div>
            `;
        }

        function renderSubscriptionExpiredScreen(shop){
            return `
                <div class="max-w-md mx-auto px-4 py-16 space-y-6 text-xs text-center">
                    <div class="bg-white p-8 rounded-3xl border border-red-200 shadow-2xl space-y-5">
                        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-2xl animate-bounce">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <h1 class="text-xl font-black text-slate-900">⚠️ تنبيه: انتهت نسختك التجريبية!</h1>
                        <p class="text-slate-600 leading-relaxed">
                            عذراً يا <span class="text-slate-900 font-bold">${shop.name}</span>، لقد انتهت الـ 7 أيام التجريبية المجانية.<br>
                            لاستمرار عمل متجرك واستقبال طلبات الزبائن، يرجى دفع الاشتراك الشهري بقيمة <b class="text-red-600">600 جنيه</b> عبر فودافون كاش:
                        </p>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 select-all font-mono text-emerald-600 font-black text-base">
                            01015861991
                        </div>
                        <p class="text-[11px] text-slate-500">بعد التحويل، أرسل سكرين شوت التحويل عبر الواتساب ليقوم المالك بتفعيل حسابك لشهر جديد فوراً!</p>
                        <div class="grid grid-cols-2 gap-2 pt-2">
                            <a href="https://wa.me/201015861991?text=${encodeURIComponent('مرحباً، لقد قمت بتحويل 600 جنيه اشتراك شهر جديد لمتجر: ' + shop.name)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl flex items-center justify-center gap-1 shadow">
                                <i class="fa-brands fa-whatsapp text-sm"></i> إرسال التحويل واتساب
                            </a>
                            <button onclick="currentShopId=null; localStorage.removeItem('tablia_logged_shop_id'); render();" class="bg-slate-100 text-slate-700 font-bold py-3.5 rounded-xl">تسجيل الخروج</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAuthScreen(){
            return `
                <div class="max-w-md mx-auto px-4 py-12 space-y-6 text-xs">
                    <div class="text-center space-y-2">
                        <h1 class="text-2xl font-black text-slate-900">سفرتك | أنشئ متجرك مجاناً 🛒</h1>
                        <p class="text-slate-500">احصل على رابط مميز باسم مطعمك و 7 أيام تجربة مجانية!</p>
                    </div>
                    <div class="bg-white p-6 rounded-3xl space-y-4 shadow-xl border border-slate-200">
                        <div>
                            <label class="block text-slate-700 mb-1 font-bold">اسم المطعم (مثال: البرنس / الشيف)</label>
                            <input id="reg_name" placeholder="البرنس" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl font-bold outline-none text-slate-900">
                        </div>
                        <div>
                            <label class="block text-slate-700 mb-1 font-bold">رقم الموبايل</label>
                            <input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl font-bold outline-none text-slate-900">
                        </div>
                        <div>
                            <label class="block text-slate-700 mb-1 font-bold">كلمة السر</label>
                            <input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl font-bold outline-none text-slate-900">
                        </div>
                        <button onclick="registerNewShop()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl shadow transition">ابدأ التجربة المجانية (7 أيام) ➔</button>
                    </div>
                </div>
            `;
        }

        function registerNewShop(){
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            
            if(!name || !phone || !pass){ alert('يرجى استكمال جميع البيانات!'); return; }
            
            // توليد Slug احترافي برابط اسم المطعم (نظيف وآمن)
            let cleanSlug = name.replace(/\s+/g, '-').replace(/[^\w\u0600-\u06FF\-]/g, '') + '-' + Math.floor(100 + Math.random() * 900);

            globalDB.shops[cleanSlug] = { 
                id: cleanSlug, name, phone, pass,
                status: 'active',
                createdAt: Date.now(),
                paidUntil: null,
                coverImage: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800',
                logoImage: 'https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=300',
                products: [
                    { id: 'p1', cat: 'مشويات', name: 'كيلو كباب ضاني', price: 1100, image: '' },
                    { id: 'p2', cat: 'مشويات', name: 'كيلو ريش طاجي', price: 1000, image: '' },
                    { id: 'p3', cat: 'وجبات', name: 'وجبة كبدة مشوية', price: 120, image: '' },
                    { id: 'p4', cat: 'ساندوتشات', name: 'ساندوتش سجق', price: 40, image: '' },
                    { id: 'p5', cat: 'طواجن', name: 'طبق سجق بلدي', price: 100, image: '' }
                ],
                orders: []
            };
            syncCloud(); 
            currentShopId = cleanSlug; 
            localStorage.setItem('tablia_logged_shop_id', cleanSlug); 
            setPage('builder');
        }

        function renderAIMenuWizard(){
            const shop = globalDB.shops[currentShopId];
            if(!shop) return '';
            return `
                <div class="max-w-xl mx-auto px-4 py-6 pb-28 space-y-5 text-xs">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center shadow-xs">
                        <div class="space-y-1">
                            <span class="text-emerald-600 font-bold">المنيو بالذكاء الاصطناعي 🤖</span>
                            <h2 class="text-slate-900 font-black text-sm">الخطوة ${appState.aiStep} من 6</h2>
                        </div>
                        <button onclick="setPage('builder')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl font-bold">لوحة التحكم</button>
                    </div>
                    <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                        <div class="bg-emerald-600 h-full transition-all duration-300" style="width: ${(appState.aiStep / 6) * 100}%"></div>
                    </div>
                    ${appState.aiStep === 1 ? `
                        <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-5 text-center shadow-xl">
                            <div class="space-y-2">
                                <h1 class="text-base font-black text-slate-900">ارفع صورة المنيو أو ملف PDF أو Excel، ثم راجع الأصناف واحفظها.[span_0](start_span)[span_0](end_span)</h1>
                                <p class="text-slate-500 text-[11px]">صورة أو PDF أو Excel أو CSV · حتى 25 ميغابايت[span_1](start_span)[span_1](end_span)</p>
                            </div>
                            <label class="border-2 border-dashed border-slate-300 hover:border-emerald-600 bg-slate-50 p-8 rounded-3xl flex flex-col items-center justify-center gap-3 cursor-pointer transition">
                                <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl">
                                    <i class="fa-solid fa-file-arrow-up"></i>
                                </div>
                                <span class="font-black text-slate-900 text-sm">ارفع المنيو[span_2](start_span)[span_2](end_span)</span>
                                <input type="file" accept="image/*,.pdf,.xlsx,.csv" onchange="handleAIFileUpload(event)" class="hidden">
                            </label>
                            ${appState.uploadedFileName ? `<div class="bg-emerald-50 border border-emerald-200 text-emerald-700 p-3 rounded-xl font-bold">✓ تم إرفاق الملف: ${appState.uploadedFileName}</div>` : ''}
                            <div class="grid grid-cols-2 gap-2 pt-2">
                                <button onclick="setPage('builder')" class="bg-slate-100 text-slate-700 font-bold py-3.5 rounded-xl">رجوع[span_3](start_span)[span_3](end_span)</button>
                                <button onclick="proceedAIAnalysis()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl shadow">التالي ➔</button>
                            </div>
                        </div>
                    ` : ''}
                    ${appState.aiStep === 2 ? `
                        <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-5 text-center shadow-xl">
                            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-2xl animate-spin">
                                <i class="fa-solid fa-brain"></i>
                            </div>
                            <h1 class="text-base font-black text-slate-900">جاري تحليل المنيو واستخراج الأصناف...</h1>
                        </div>
                    ` : ''}
                    ${appState.aiStep >= 3 ? `
                        <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-4 shadow-xl">
                            <h1 class="font-black text-slate-900 text-sm">✨ تم استخراج الأصناف بنجاح!</h1>
                            <button onclick="appState.aiStep = 1; setPage('builder'); alert('تم حفظ المنيو بنجاح!');" class="w-full bg-emerald-600 text-white font-black py-3.5 rounded-xl shadow">حفظ والذهاب للوحة التحكم ✓</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function handleAIFileUpload(e){ if(e.target.files && e.target.files[0]){ appState.uploadedFileName = e.target.files[0].name; render(); } }
        function proceedAIAnalysis(){ if(!appState.uploadedFileName) { alert('يرجى اختيار ملف المنيو أولاً!'); return; } appState.aiStep = 2; render(); setTimeout(()=>{ appState.aiStep = 3; render(); }, 2000); }

        function renderBuilder(){
            const shop = globalDB.shops[currentShopId];
            if(!shop){ setPage('auth'); return ''; }
            const sub = getShopSubscriptionStatus(shop);
            // بناء الرابط الاحترافي باسم المطعم
            const customLink = location.origin + location.pathname + `?view=store&shop=${shop.id}`;

            return `
                <div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-5 text-xs">
                    <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <span class="font-black text-amber-900 text-sm">حالة الاشتراك: ${sub.message}</span>
                            <p class="text-amber-700 text-[11px]">الاشتراك الشهري للتجديد هو 600 جنيه.</p>
                        </div>
                        <a href="https://wa.me/201015861991?text=${encodeURIComponent('مرحباً، أريد تجديد اشتراك متجري: ' + shop.name)}" target="_blank" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-black shadow-xs flex items-center gap-1">
                            <i class="fa-brands fa-whatsapp"></i> تجديد بـ 600 ج
                        </a>
                    </div>

                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <div>
                            <h1 class="font-black text-slate-900 text-sm">إدارة مطعم: ${shop.name}</h1>
                            <span class="text-emerald-600 font-bold text-[10px]">مفعل ونشط ✓</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="setPage('ai_menu')" class="bg-amber-400 text-slate-950 px-3 py-1.5 rounded-xl font-black">🤖 المنيو الذكي</button>
                            <button onclick="currentShopId=null; localStorage.removeItem('tablia_logged_shop_id'); setPage('auth');" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-xl font-bold">خروج</button>
                        </div>
                    </div>

                    <!-- رابط المطعم المخصص المميز -->
                    <div class="bg-white p-6 rounded-3xl space-y-3 border border-emerald-200 text-center shadow-2xl">
                        <h2 class="font-black text-emerald-600 text-sm">🔗 رابط منيو مطعمك المميز (ابعته للزبائن)</h2>
                        <input readonly value="${customLink}" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-emerald-700 font-mono text-center text-xs select-all">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="navigator.clipboard.writeText('${customLink}'); alert('تم نسخ رابط المطعم!');" class="bg-amber-400 text-slate-950 font-black py-3 rounded-xl">نسخ الرابط</button>
                            <a href="?view=store&shop=${shop.id}" target="_blank" class="bg-emerald-600 text-white font-black py-3 rounded-xl flex items-center justify-center gap-1">معاينة المنيو ➔</a>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-200 space-y-3 shadow-xl">
                        <h2 class="font-black text-slate-900 text-sm">➕ إضافة صنف جديد</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <select id="new_p_cat" class="bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold outline-none text-slate-900">
                                <option value="مشويات">مشويات</option>
                                <option value="وجبات">وجبات</option>
                                <option value="ساندوتشات">ساندوتشات</option>
                                <option value="طواجن">طواجن</option>
                            </select>
                            <input id="new_p_name" placeholder="اسم الصنف..." class="bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold outline-none text-slate-900">
                            <input id="new_p_price" type="number" placeholder="السعر (ج.م)" class="bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold outline-none text-slate-900">
                        </div>
                        <button onclick="addNewProduct('${shop.id}')" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl shadow">إضافة الصنف للقائمة ✓</button>
                    </div>

                    <div class="bg-white p-5 rounded-3xl space-y-4 border border-slate-200 shadow-xl">
                        <h2 class="font-black text-slate-900 text-sm">📦 الأصناف المسجلة (${(shop.products||[]).length})</h2>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${(shop.products||[]).map((item, idx) => `
                                <div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center border border-slate-200">
                                    <div>
                                        <span class="font-black text-slate-900">${item.name} (${item.cat})</span>
                                        <span class="text-emerald-600 block">${item.price} ج.م</span>
                                    </div>
                                    <button onclick="deleteProduct('${shop.id}', ${idx})" class="text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function addNewProduct(shopId){
            const shop = globalDB.shops[shopId];
            const cat = document.getElementById('new_p_cat').value;
            const name = document.getElementById('new_p_name').value.trim();
            const price = Number(document.getElementById('new_p_price').value);
            if(!name || !price) { alert('يرجى كتابة الاسم والسعر!'); return; }
            if(!shop.products) shop.products = [];
            shop.products.push({ id: 'p_' + Date.now(), cat, name, price, image: '' });
            syncCloud();
            alert('✅ تمت الإضافة بنجاح!');
            render();
        }

        function deleteProduct(shopId, idx){
            globalDB.shops[shopId].products.splice(idx, 1);
            syncCloud();
            render();
        }

        function renderOrders(){
            const shop = globalDB.shops[currentShopId];
            if(!shop) return '';
            if(!shop.orders) shop.orders = [];
            return `
                <div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <h1 class="font-black text-slate-900 text-sm">🔔 طلبات العملاء</h1>
                        <span class="bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full">الطلبات: ${shop.orders.length}</span>
                    </div>
                    <div class="space-y-3">
                        ${shop.orders.length === 0 ? `<div class="bg-white p-12 text-center text-slate-400 rounded-3xl border border-slate-200">لا توجد طلبات جديدة..</div>` : shop.orders.map((ord, i) => `
                            <div class="bg-white p-4 rounded-3xl space-y-3 border border-slate-200 shadow-xs">
                                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                                    <div>
                                        <span class="font-black text-slate-900 text-sm">${ord.customer_name}</span>
                                        <span class="text-emerald-600 font-bold block text-[11px]"><i class="fa-solid fa-phone"></i> ${ord.phone}</span>
                                        <span class="text-slate-500 block text-[10px]"><i class="fa-solid fa-location-dot"></i> ${ord.address} (${ord.orderType} - ${ord.paymentMethod})</span>
                                    </div>
                                    <div class="text-left"><span class="text-emerald-600 font-black text-sm">${ord.total} ج.م</span></div>
                                </div>
                                <div class="text-slate-700 text-[11px] bg-slate-50 p-2.5 rounded-xl">
                                    <div>${(ord.items||[]).map(x => `• ${x.qty}x ${x.name} (${x.price * x.qty} ج)`).join('<br>')}</div>
                                    ${ord.notes ? `<div class="mt-1 text-amber-600 font-bold">ملاحظة: ${ord.notes}</div>` : ''}
                                </div>
                                <button onclick="globalDB.shops['${currentShopId}'].orders.splice(${i},1); syncCloud(); render();" class="w-full bg-red-50 text-red-600 py-2 rounded-xl font-bold">حذف الطلب</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderQRPrint(){ 
            const shop = globalDB.shops[currentShopId];
            const base = location.origin + location.pathname + `?view=store&shop=${shop.id}&t=`;
            return `<div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-4 text-xs"><h1 class="font-black text-emerald-600 bg-white p-4 rounded-2xl shadow-xs">طباعة أكواد QR للطاولات</h1><div class="grid grid-cols-2 gap-3">${Array.from({length:10},(_,i)=>i+1).map(n=>`<div class="bg-white p-4 rounded-2xl text-center space-y-2 border border-slate-200 shadow-xs"><div class="font-bold">طاولة ${n}</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(base+'طاولة '+n)}" class="mx-auto rounded bg-white p-1"></div>`).join('')}</div></div>`; 
        }

        // ================= واجهة عرض المنيو للعملاء =================
        function renderStorefront(){
            const shopId = targetShopSlug || Object.keys(globalDB.shops)[0];
            const shop = globalDB.shops[shopId];
            if(!shop) return `<div class="min-h-screen flex items-center justify-center text-slate-700">المتجر غير موجود</div>`;

            const sub = getShopSubscriptionStatus(shop);
            if(!sub.active) {
                return `<div class="min-h-screen flex items-center justify-center text-slate-900 px-4 text-center font-bold">عذراً، هذا المنيو موقوف مؤقتاً لانتهاء اشتراك المطعم.</div>`;
            }

            const categories = ['مشويات', 'وجبات', 'ساندوتشات', 'طواجن'];
            const filteredProducts = (shop.products || []).filter(p => {
                if(appState.selectedCategory === 'المفضلة') return appState.favorites.includes(p.name);
                return p.cat === appState.selectedCategory && (appState.searchQuery === '' || p.name.includes(appState.searchQuery));
            });

            const cartCount = Object.values(appState.cart).reduce((a, b) => a + b, 0);
            const cartSubtotal = Object.entries(appState.cart).reduce((sum, [name, qty]) => {
                const item = (shop.products || []).find(p => p.name === name);
                return sum + (item ? item.price * qty : 0);
            }, 0);

            const serviceFee = cartSubtotal > 0 ? 252 : 0;
            const taxFee = cartSubtotal > 0 ? 329.28 : 0;
            const cartTotal = cartSubtotal > 0 ? cartSubtotal + serviceFee + taxFee : 0;

            if(appState.checkoutStep === 'details') {
                return `
                    <div class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center">
                        <div class="bg-white w-full max-w-lg rounded-t-3xl max-h-[90vh] overflow-y-auto p-5 space-y-5 text-xs animate-slide-up">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                                <h2 class="font-black text-slate-900 text-sm">بيانات الطلب[span_4](start_span)[span_4](end_span)[span_5](start_span)[span_5](end_span)</h2>
                                <button onclick="appState.checkoutStep='cart'; render();" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-700">✕</button>
                            </div>
                            <div class="space-y-2">
                                <label class="font-black text-slate-900 block">نوع الطلب[span_6](start_span)[span_6](end_span)</label>
                                <div class="grid grid-cols-2 gap-2">
                                    ${['توصيل', 'استلام', 'محلي', 'طاولة'].map(t => `
                                        <button onclick="appState.orderType='${t}'; render();" class="py-3 rounded-2xl font-bold border ${appState.orderType===t?'border-emerald-600 bg-emerald-50/50 text-emerald-800 font-black':'border-slate-200 bg-white text-slate-700'}">${t}</button>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="space-y-2">
                                <label class="font-black text-slate-900 block">طريقة الدفع[span_7](start_span)[span_7](end_span)</label>
                                <div class="space-y-2">
                                    <div onclick="appState.paymentMethod='نقداً'; render();" class="p-3.5 rounded-2xl border flex items-center justify-between cursor-pointer ${appState.paymentMethod==='نقداً'?'border-emerald-600 bg-emerald-50/50':'border-slate-200'}">
                                        <span class="font-bold text-slate-900">نقداً[span_8](start_span)[span_8](end_span) 💰</span>
                                    </div>
                                    <div onclick="appState.paymentMethod='فودافون كاش'; render();" class="p-3.5 rounded-2xl border flex items-center justify-between cursor-pointer ${appState.paymentMethod==='فودافون كاش'?'border-emerald-600 bg-emerald-50/50':'border-slate-200'}">
                                        <span class="font-bold text-slate-900">فودافون كاش[span_9](start_span)[span_9](end_span) 📱 (01015861991)</span>
                                    </div>
                                </div>
                            </div>
                            <div class="space-y-3">
                                <input id="cust_name" placeholder="الاسم[span_10](start_span)[span_10](end_span)" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-bold outline-none text-slate-900">
                                <input id="cust_phone" placeholder="الهاتف[span_11](start_span)[span_11](end_span)" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-bold outline-none text-slate-900">
                                <input id="cust_address" placeholder="العنوان[span_12](start_span)[span_12](end_span)" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-bold outline-none text-slate-900">
                                <div class="grid grid-cols-2 gap-2">
                                    <input id="cust_floor" placeholder="الدور[span_13](start_span)[span_13](end_span)" class="bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-bold outline-none text-slate-900">
                                    <input id="cust_apartment" placeholder="الشقة[span_14](start_span)[span_14](end_span)" class="bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-bold outline-none text-slate-900">
                                </div>
                                <textarea id="cust_notes" placeholder="ملاحظة على الطلب[span_15](start_span)[span_15](end_span)" class="w-full h-16 bg-slate-50 border border-slate-200 p-3 rounded-2xl font-bold outline-none text-slate-900"></textarea>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-2xl space-y-2 border border-slate-200 text-slate-700 font-bold">
                                <div class="flex justify-between"><span>المجموع[span_16](start_span)[span_16](end_span)</span><span>${cartSubtotal.toLocaleString()} ج.م</span></div>
                                <div class="flex justify-between"><span>رسوم الخدمة[span_17](start_span)[span_17](end_span)</span><span>${serviceFee.toLocaleString()} ج.م</span></div>
                                <div class="flex justify-between"><span>الضريبة[span_18](start_span)[span_18](end_span)</span><span>${taxFee.toLocaleString()} ج.م</span></div>
                                <div class="flex justify-between text-sm font-black text-slate-900 pt-2 border-t border-slate-200"><span>الإجمالي[span_19](start_span)[span_19](end_span)</span><span class="text-emerald-600">${cartTotal.toLocaleString()} ج.م</span></div>
                            </div>
                            <button onclick="confirmAndSendOrder('${shop.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl shadow-lg text-sm">تأكيد الطلب · ${cartTotal.toLocaleString()} ج.م[span_20](start_span)[span_20](end_span)</button>
                        </div>
                    </div>
                `;
            }

            if(appState.checkoutStep === 'cart') {
                return `
                    <div class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center">
                        <div class="bg-white w-full max-w-lg rounded-t-3xl max-h-[90vh] overflow-y-auto p-5 space-y-5 text-xs animate-slide-up">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                                <h2 class="font-black text-slate-900 text-sm">السلة[span_21](start_span)[span_21](end_span)</h2>
                                <button onclick="appState.checkoutStep='none'; render();" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-700">✕</button>
                            </div>
                            <div class="space-y-3">
                                ${Object.keys(appState.cart).length === 0 ? `<div class="text-center py-8 text-slate-400">السلة فارغة</div>` : Object.entries(appState.cart).map(([name, qty]) => {
                                    const item = (shop.products || []).find(p => p.name === name);
                                    if(!item) return '';
                                    return `
                                        <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center border border-slate-200">
                                            <div class="flex items-center gap-2">
                                                <button onclick="deleteCartItem('${name}')" class="bg-white border border-slate-200 px-3 py-1.5 rounded-xl font-bold text-slate-600 text-[11px]">حذف[span_22](start_span)[span_22](end_span)</button>
                                                <div>
                                                    <span class="font-black text-slate-900 block">${name}</span>
                                                    <span class="text-emerald-600 font-bold">${(item.price * qty).toLocaleString()} ج.م[span_23](start_span)[span_23](end_span)</span>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-2 bg-white border border-slate-200 px-2 py-1 rounded-xl font-bold">
                                                <button onclick="updateCartQty('${name}', 1)">+</button>
                                                <span class="w-5 text-center">${qty}[span_24](start_span)[span_24](end_span)</span>
                                                <button onclick="updateCartQty('${name}', -1)">−</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                            <div class="space-y-2">
                                <h3 class="font-black text-slate-900">يكمل طلبك[span_25](start_span)[span_25](end_span)</h3>
                                <div class="grid grid-cols-3 gap-2">
                                    {(shop.products || []).slice(0, 3).map(p => `
                                        <div onclick="addToCart('${p.name}')" class="bg-slate-50 p-2 rounded-2xl border border-slate-200 text-center cursor-pointer">
                                            <div class="font-black text-[11px] truncate">${p.name}</div>
                                            <div class="text-emerald-600 font-bold">${p.price} ج.م</div>
                                            <span class="inline-block mt-1 bg-emerald-600 text-white w-6 h-6 rounded-full leading-6">+</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-2xl flex justify-between font-black text-sm text-slate-900">
                                <span>الإجمالي[span_26](start_span)[span_26](end_span)</span>
                                <span class="text-emerald-600">${cartSubtotal.toLocaleString()} ج.م[span_27](start_span)[span_27](end_span)</span>
                            </div>
                            <button onclick="appState.checkoutStep='details'; render();" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl shadow-lg text-sm">متابعة للتفاصيل[span_28](start_span)[span_28](end_span)</button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="min-h-screen pb-28 bg-[#f8fafc] text-slate-900">
                    <header class="bg-white sticky top-0 z-30 border-b border-slate-200 px-4 py-3 shadow-xs">
                        <div class="max-w-xl mx-auto flex justify-between items-center">
                            <span class="font-black text-base text-slate-900">${shop.name}</span>
                            <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-bold">مفتوح الآن</span>
                        </div>
                    </header>
                    <div class="max-w-xl mx-auto px-4 pt-4 space-y-4">
                        <div class="flex items-center gap-2">
                            <button onclick="appState.selectedCategory='المفضلة'; render();" class="bg-white border border-slate-200 px-4 py-2.5 rounded-2xl font-bold text-xs shadow-xs flex items-center gap-1">♡ المفضلة[span_29](start_span)[span_29](end_span)</button>
                            <div class="relative flex-1">
                                <input value="${appState.searchQuery}" oninput="appState.searchQuery=this.value; render();" placeholder="ابحث عن صنف..." class="w-full bg-white border border-slate-200 py-2.5 pr-9 pl-3 rounded-2xl text-xs font-bold outline-none shadow-xs">
                                <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-slate-400 text-xs"></i>
                            </div>
                        </div>
                        <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                            ${categories.map(c => `
                                <button onclick="appState.selectedCategory='${c}'; render();" class="px-5 py-2.5 rounded-2xl font-black text-xs whitespace-nowrap shadow-xs transition ${appState.selectedCategory===c?'bg-emerald-600 text-white':'bg-white border border-slate-200 text-slate-700'}">${c}</button>
                            `).join('')}
                        </div>
                        <h2 class="font-black text-base pt-2 text-slate-900">${appState.selectedCategory}</h2>
                        <div class="grid grid-cols-2 gap-3">
                            ${filteredProducts.length === 0 ? `<div class="col-span-2 text-center py-10 text-slate-400">لا توجد أصناف في هذا القسم</div>` : filteredProducts.map(p => {
                                const isFav = appState.favorites.includes(p.name);
                                return `
                                    <div class="bg-white border border-slate-200 rounded-3xl p-3 shadow-xs flex flex-col justify-between space-y-3 relative">
                                        <button onclick="toggleFavorite('${p.name}')" class="absolute top-3 left-3 w-8 h-8 bg-slate-50 rounded-full flex items-center justify-center text-slate-700 shadow-xs">
                                            <i class="fa-${isFav?'solid text-red-500':'regular'} fa-heart text-xs"></i>
                                        </button>
                                        <div class="h-28 bg-emerald-50/50 rounded-2xl flex items-center justify-center text-emerald-600 text-xl font-bold">
                                            <i class="fa-solid fa-utensils opacity-40"></i>
                                        </div>
                                        <div class="space-y-1">
                                            <h3 class="font-black text-xs text-slate-900 truncate">${p.name}</h3>
                                            <div class="flex justify-between items-center pt-1">
                                                <span class="font-black text-xs text-slate-900">${p.price.toLocaleString()} ج.م[span_30](start_span)[span_30](end_span)</span>
                                                <button onclick="addToCart('${p.name}')" class="w-9 h-9 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full flex items-center justify-center text-base font-black shadow-md">+</button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    ${cartCount > 0 ? `
                        <div class="fixed bottom-3 left-3 right-3 max-w-xl mx-auto z-30">
                            <button onclick="appState.checkoutStep='cart'; render();" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 px-5 rounded-3xl shadow-xl flex items-center justify-between font-black text-sm transition">
                                <span>السلة · ${cartCount}[span_31](start_span)[span_31](end_span)</span>
                                <span>${cartTotal.toLocaleString()} ج.م[span_32](start_span)[span_32](end_span)</span>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function toggleFavorite(name){
            if(appState.favorites.includes(name)) appState.favorites = appState.favorites.filter(n => n !== name);
            else appState.favorites.push(name);
            render();
        }

        function addToCart(name){
            if(!appState.cart[name]) appState.cart[name] = 1;
            else appState.cart[name]++;
            render();
        }

        function updateCartQty(name, change){
            if(appState.cart[name]) {
                appState.cart[name] += change;
                if(appState.cart[name] <= 0) delete appState.cart[name];
            }
            render();
        }

        function deleteCartItem(name){ delete appState.cart[name]; render(); }

        function confirmAndSendOrder(shopId){
            const name = document.getElementById('cust_name').value.trim();
            const phone = document.getElementById('cust_phone').value.trim();
            const address = document.getElementById('cust_address').value.trim();
            const floor = document.getElementById('cust_floor').value.trim();
            const apartment = document.getElementById('cust_apartment').value.trim();
            const notes = document.getElementById('cust_notes').value.trim();

            if(!name || !phone || !address){ alert('يرجى كتابة الاسم ورقم الهاتف والعنوان!'); return; }

            const shop = globalDB.shops[shopId];
            if(!shop.orders) shop.orders = [];

            const cartSubtotal = Object.entries(appState.cart).reduce((sum, [itemName, qty]) => {
                const item = (shop.products || []).find(p => p.name === itemName);
                return sum + (item ? item.price * qty : 0);
            }, 0);
            const total = cartSubtotal + 252 + 329.28;

            shop.orders.unshift({
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customer_name: name, phone,
                address: `${address} - دور: ${floor} - شقة: ${apartment}`,
                orderType: appState.orderType,
                paymentMethod: appState.paymentMethod,
                notes,
                items: Object.entries(appState.cart).map(([itemName, qty]) => {
                    const item = shop.products.find(p => p.name === itemName);
                    return { name: itemName, price: item ? item.price : 0, qty };
                }),
                total
            });

            appState.cart = {};
            appState.checkoutStep = 'none';
            syncCloud();
            try { const audio = document.getElementById('cloud-bell'); if(audio) audio.play().catch(()=>{}); } catch(e){}
            alert('🎉 تم إرسال طلبك بنجاح للمتجر وسيتم التواصل معك قريباً!');
            render();
        }

        render();
    </script>
</body>
</html>
