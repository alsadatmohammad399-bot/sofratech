<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سفرتك — منصة المنيو الإلكتروني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6FBF7;--c:#fff;--t:#14201A;--m:#4B5B52;--b:#CFE3D5;--g:#15803D;--l:#DCFCE7;--lt:#14532D;--y:#FACC15;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:800 16px Cairo,system-ui,sans-serif}
h1,h2,h3{margin:0;font-weight:800}h1{font-size:30px;line-height:1.35}h2{font-size:22px}
.w{max-width:560px;margin:auto;padding:14px 16px 130px;display:flex;flex-direction:column;gap:14px}
header{position:sticky;top:0;z-index:20;background:var(--c);border-bottom:1px solid var(--b)}
.hi{max-width:560px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.r{display:flex;gap:8px;align-items:center}.wr{flex-wrap:wrap}.f{flex:1}
.c{background:var(--c);border-radius:24px;padding:16px;box-shadow:0 1px 4px #0002;display:flex;flex-direction:column;gap:8px}
.m{color:var(--m);font-size:14px;font-weight:600}
.b{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:16px;border:1.5px solid var(--b);background:var(--c);color:var(--t);font:800 16px Cairo,sans-serif;padding:0 16px;gap:6px;cursor:pointer;text-decoration:none}
.g{background:var(--g);color:#fff;border-color:var(--g)}.y{background:var(--y);border-color:var(--y);color:#14201A}.lg{background:var(--l);color:var(--lt);border-color:#86EFAC}
.in{min-height:48px;border:1.5px solid var(--b);border-radius:16px;background:var(--c);padding:0 14px;font:700 15px Cairo,sans-serif;color:var(--t);width:100%}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ch{padding:8px 16px;border-radius:99px;background:var(--c);border:1.5px solid var(--b);color:var(--t);font:800 15px Cairo,sans-serif;cursor:pointer}
.ch.sel{background:var(--g);color:#fff;border-color:var(--g)}
.sc{overflow-x:auto;display:flex;gap:8px;padding-bottom:4px}
.ph{height:90px;border-radius:16px;background:var(--l);display:flex;align-items:center;justify-content:center;color:var(--g)}
.it{background:var(--l);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.pl{width:44px;height:44px;border-radius:99px;background:var(--g);color:#fff;border:0;font:800 22px Cairo;cursor:pointer}
.qc{display:flex;align-items:center;gap:6px;align-self:flex-start;background:var(--c);border-radius:99px}
.qc button{width:40px;height:40px;border-radius:99px;background:var(--g);color:#fff;border:0;font:800 18px Cairo;cursor:pointer}
.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;z-index:15;background:var(--c);border-top:1px solid var(--b)}
.bar .b{max-width:528px;margin:auto;min-height:54px;width:100%}
.ov{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.tl{display:flex;justify-content:space-between;gap:8px}
</style></head><body><div id="app"></div><div id="ts" style="display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#14201A;color:#fff;padding:10px 18px;border-radius:99px;z-index:60"></div>
<script>
let IT=[
  ["مشويات","كيلو كباب ضاني بلدي",1150,"مشويات لحوم"],
  ["مشويات","كيلو كفتة مشوية على الفحم",780,"مشويات لحوم"],
  ["مشويات","كيلو ريش ضاني طازجة",1250,"مشويات لحوم"],
  ["مشويات","نصف فرخة مشوية على الفحم",210,"مشويات دجاج"],
  ["مشويات","فرخة كاملة مشوية",400,"مشويات دجاج"],
  ["مشويات","طاجن بامية باللحمة الضاني",250,"طواجن فرن"],
  ["مشويات","طاجن ورق عنب بالكوارع",300,"طواجن فرن"],
  ["مشويات","سلطة طحينة بلدي",30,"مقبلات وسلطات"],
  ["مشويات","شوربة لسان عصفور باللحمة",40,"شوربات"],
  ["مشويات","بطاطس محمرة مقرمشة",35,"مقبلات وسلطات"]
];
const CATS=["مشويات","وجبات","ساندوتشات","طواجن"];
const S={cart:{},ord:[],cat:"مشويات",q:"",step:1,co:0,pay:"نقداً"};
const toast=t=>{const e=document.getElementById("ts");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2500)};
const fm=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+" ج.م";
const cnt=c=>Object.values(c).reduce((a,b)=>a+b,0),sub=c=>Object.entries(c).reduce((a,[i,q])=>a+IT[i][2]*q,0);

function render(){
  const h=location.hash.slice(1)||"landing";
  let html="";
  if(h=="landing"){
    html=`<header><div class="hi"><span style="font-weight:800;font-size:20px">سفرتك</span><button class="b g" onclick="location.hash='#signup'">ابدأ مجاناً</button></div></header>
    <main class="w"><div class="c" style="background:var(--l);text-align:center;padding:30px"><h1>استقبل طلباتك بدون عمولة</h1><p class="m">أنشئ منيو مطعمك الإلكتروني في ثوانٍ وشارك رابطك مع عملائك</p><button class="b g" style="margin:auto" onclick="location.hash='#signup'">جرّب الآن مجاناً</button></div></main>`;
  } else if(h=="signup"){
    html=`<main class="w" style="padding-top:30px"><h1>إنشاء حساب جديد</h1><input class="in" placeholder="اسم المطعم"><input class="in" placeholder="رقم الموبايل"><button class="b g" onclick="location.hash='#setup'">متابعة الإعداد</button></main>`;
  } else if(h=="setup"){
    html=`<main class="w" style="padding-top:30px"><h1>ارفع صورة المنيو أو تخطَّ</h1><p class="m">سيقوم النظام بإضافة الأصناف فوراً وبدون تعقيد.</p><button class="b g" onclick="alert('✓ تم استخراج المنيو كاملاً بنجاح!');location.hash='#dash'">رفع المنيو بالذكاء الاصطناعي</button><button class="b" onclick="location.hash='#dash'">تخطي والدخول لوحة التحكم</button></main>`;
  } else if(h=="dash"){
    html=`<header><div class="hi"><span style="font-weight:800">لوحة التحكم</span><button class="b lg" onclick="location.hash='#store'">فتح المنيو ↗</button></div></header>
    <main class="w"><div class="c"><h2>أهلاً بك في مطعمك</h2><p class="m">الطلبات اليومية: ${S.ord.length}</p><button class="b y" onclick="location.hash='#orders'">متابعة الطلبات</button></div></main>`;
  } else if(h=="store"){
    const n=cnt(S.cart);
    html=`<header><div class="hi"><span style="font-weight:800">المنيو الإلكتروني</span><button class="b" onclick="location.hash='#dash'">اللوحة</button></div></header>
    <main class="w"><div class="sc">${CATS.map(c=>`<button class="ch ${c==S.cat?"sel":""}" onclick="S.cat='${c}';render()">${c}</button>`).join("")}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
      ${IT.map((x,i)=>{const q=S.cart[i]||0;return `<div class="it"><div class="ph">صنف</div><b>${x[1]}</b><b style="color:var(--g)">${fm(x[2])}</b>${q?`<div class="qc"><button onclick="S.cart[i]--;if(!S.cart[i])delete S.cart[i];render()">−</button><b>${q}</b><button onclick="S.cart[i]++;render()">+</button></div>`:`<button class="pl" onclick="S.cart[i]=1;render()">+</button>`}</div>`}).join("")}
    </div></main>${n?`<div class="bar"><button class="b g" onclick="S.co=1;render()">عرض السلة (${n} صنف) - ${fm(sub(S.cart))}</button></div>`:""}`;
  } else if(h=="orders"){
    html=`<header><div class="hi"><span style="font-weight:800">الطلبات</span><button class="b" onclick="location.hash='#dash'">رجوع</button></div></header>
    <main class="w">${S.ord.length?S.ord.map(o=>`<div class="c"><b>طلب #${o.id}</b><span>الإجمالي: ${fm(o.t)}</span><span class="m">الحالة: ${o.s}</span></div>`).join(""):'<div class="c m" style="text-align:center">لا توجد طلبات جديدة بعد</div>'}</main>`;
  }
  
  if(S.co==1){
    const s=sub(S.cart), t=s*1.2;
    html+=`<div class="ov" onclick="if(event.target===this){S.co=0;render()}"><div class="sh">
      <div class="tl"><h2>إتمام الطلب</h2><button class="b" onclick="S.co=0;render()">✕</button></div>
      ${Object.keys(S.cart).map(i=>`<div class="tl"><span>${IT[i][1]} (x${S.cart[i]})</span><span>${fm(IT[i][2]*S.cart[i])}</span></div>`).join("")}
      <hr style="border:0;border-top:1px solid var(--b)">
      <div class="tl"><b>الإجمالي بالخدمة</b><b>${fm(t)}</b></div>
      <input class="in" id="cn" placeholder="اسمك الكريم">
      <input class="in" id="cp" placeholder="رقم الموبايل">
      <button class="b g" onclick="submitOrder(${t})">تأكيد الطلب ✓</button>
    </div></div>`;
  }
  document.getElementById("app").innerHTML=html;
}

function submitOrder(t){
  const name=document.getElementById("cn")?.value||"عميل";
  S.ord.push({id:1000+S.ord.length, t:t, s:"جديد", name:name});
  S.cart={}; S.co=0;
  toast("✓ تم إرسال طلبك بنجاح!");
  location.hash="#dash";
}

window.addEventListener("hashchange",render);
if(!location.hash)location.hash="#landing";
render();
</script></body></html>
