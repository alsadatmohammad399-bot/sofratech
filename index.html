<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablia OS 2030 | المنصة السحابية المتكاملة للمطاعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased min-h-screen bg-[#0b0f19] text-slate-100 selection:bg-red-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        let globalDB = { restaurants: {} };
        try {
            const raw = localStorage.getItem('tablia_multitenant_2030_v75');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        function syncCloud() {
            try {
                localStorage.setItem('tablia_multitenant_2030_v75', JSON.stringify(globalDB));
                if (cloudDB) cloudDB.ref('tablia_multitenant_enterprise_2030_v75').set(globalDB).catch(() => {});
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_multitenant_enterprise_2030_v75').on('value', (snap) => {
                const data = snap.val();
                if (data && data.restaurants) {
                    globalDB = data;
                    try { localStorage.setItem('tablia_multitenant_2030_v75', JSON.stringify(globalDB)); } catch(e){}
                    render();
                }
            });
        }

        function playBell(){
            try {
                const a = document.getElementById('cloud-bell');
                if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
                if('vibrate' in navigator) navigator.vibrate([400, 200, 400]);
            } catch(e){}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isCustomerMode = urlParams.get('view') === 'menu';
        const targetRestSlug = urlParams.get('rest');
        
        let currentRestId = localStorage.getItem('tablia_logged_rest_id') || null;

        const appState = { 
            page: isCustomerMode ? 'storefront' : (currentRestId ? 'builder' : 'auth'), 
            authStep: 'register', // 'register' or 'verify'
            tempRegData: null,
            generatedOtp: null,
            activeCat: 'all', 
            cart: [],
            orderType: urlParams.get('t') ? 'dine-in' : 'delivery',
            tableNumber: urlParams.get('t') || 'طاولة 1'
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isCustomerMode) {
                    content = renderStorefront();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentRestId || !globalDB.restaurants?.[currentRestId]) { 
                        currentRestId = null; 
                        localStorage.removeItem('tablia_logged_rest_id');
                        appState.page = 'auth'; 
                        content = renderAuthScreen(); 
                    } else if(appState.page === 'builder') {
                        content = renderBuilder();
                    } else if(appState.page === 'cashier') {
                        content = renderCashier();
                    } else if(appState.page === 'inventory') {
                        content = renderInventory();
                    } else if(appState.page === 'attendance') {
                        content = renderAttendance();
                    } else if(appState.page === 'dashboard') {
                        content = renderDashboard();
                    } else if(appState.page === 'qr_print') {
                        content = renderQRPrint();
                    } else {
                        content = renderBuilder();
                    }
                }
                const bottomNav = (isCustomerMode || !currentRestId) ? '' : renderBottomNav();
                root.innerHTML = content + bottomNav;
            } catch(err) { console.error("Render Error:", err); }
        }

        function renderBottomNav(){
            return `
                <div class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900 border-t border-slate-800 px-1 py-2">
                    <div class="max-w-md mx-auto grid grid-cols-6 gap-0.5 text-center text-slate-400">
                        <button onclick="setPage('builder')" class="flex flex-col items-center py-1 ${appState.page==='builder'?'text-red-500 font-black':''}"><i class="fa-solid fa-wand-magic-sparkles text-xs mb-0.5"></i><span class="text-[9px]">المنشئ</span></button>
                        <button onclick="setPage('cashier')" class="flex flex-col items-center py-1 ${appState.page==='cashier'?'text-red-500 font-black':''}"><i class="fa-solid fa-bell text-xs mb-0.5 text-amber-400"></i><span class="text-[9px]">الطلبات</span></button>
                        <button onclick="setPage('inventory')" class="flex flex-col items-center py-1 ${appState.page==='inventory'?'text-red-500 font-black':''}"><i class="fa-solid fa-boxes-stacked text-xs mb-0.5"></i><span class="text-[9px]">المخزن</span></button>
                        <button onclick="setPage('attendance')" class="flex flex-col items-center py-1 ${appState.page==='attendance'?'text-red-500 font-black':''}"><i class="fa-solid fa-users-gear text-xs mb-0.5"></i><span class="text-[9px]">الموظفين</span></button>
                        <button onclick="setPage('dashboard')" class="flex flex-col items-center py-1 ${appState.page==='dashboard'?'text-red-500 font-black':''}"><i class="fa-solid fa-chart-line text-xs mb-0.5"></i><span class="text-[9px]">الباقات</span></button>
                        <button onclick="setPage('qr_print')" class="flex flex-col items-center py-1 ${appState.page==='qr_print'?'text-red-500 font-black':''}"><i class="fa-solid fa-qrcode text-xs mb-0.5"></i><span class="text-[9px]">QR</span></button>
                    </div>
                </div>
            `;
        }

        function renderAuthScreen(){
            if(appState.authStep === 'verify') {
                return `
                    <div class="max-w-md mx-auto px-4 py-12 space-y-6 text-xs">
                        <div class="text-center space-y-2">
                            <h1 class="text-2xl font-black text-white">تأكيد رقم الهاتف 📱</h1>
                            <p class="text-slate-400">تم إرسال رسالة SMS برمز التحقق إلى رقمك من خلال منصة <b>سفرتك</b></p>
                        </div>
                        <div class="bg-slate-900 p-6 rounded-3xl space-y-4 shadow-xl border border-slate-800 text-center">
                            <div class="bg-amber-500/10 text-amber-400 p-3 rounded-2xl font-mono text-sm">
                                رمز التحقق التجريبي (OTP): <b>${appState.generatedOtp}</b>
                            </div>
                            <div>
                                <label class="block text-slate-300 mb-1 font-bold">أدخل كود التحقق المكون من 4 أرقام</label>
                                <input id="otp_input" placeholder="0000" maxlength="4" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl text-center text-white font-black text-lg tracking-widest outline-none">
                            </div>
                            <button onclick="verifyOtpAndRegister()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl shadow transition">تأكيد الكود وإنشاء المطعم ✓</button>
                            <button onclick="appState.authStep='register'; render();" class="text-slate-400 hover:text-white">العودة لتعديل البيانات</button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="max-w-md mx-auto px-4 py-12 space-y-6 text-xs">
                    <div class="text-center space-y-2">
                        <h1 class="text-2xl font-black text-white">منصة سفرتك | Tablia OS</h1>
                        <p class="text-slate-400">أنشئ منيو مطعمك باحترافية تامة 🚀</p>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 shadow-xl border border-slate-800">
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">اسم المطعم</label>
                            <input id="reg_name" placeholder="اكتب اسم مطعمك هنا..." class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label>
                            <input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">كلمة السر</label>
                            <input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none">
                        </div>
                        <button onclick="requestSmsOtp()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-xl shadow transition">إرسال كود التحقق SMS ➔</button>
                    </div>
                </div>
            `;
        }

        function requestSmsOtp(){
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            if(!name || !phone || !pass){ alert('يرجى استكمال جميع البيانات!'); return; }
            
            // توليد كود SMS عشوائي من 4 أرقام
            const otp = Math.floor(1000 + Math.random() * 9000).toString();
            appState.generatedOtp = otp;
            appState.tempRegData = { name, phone, pass };
            appState.authStep = 'verify';
            render();
        }

        function verifyOtpAndRegister(){
            const enteredOtp = document.getElementById('otp_input').value.trim();
            if(enteredOtp !== appState.generatedOtp) {
                alert('كود التحقق غير صحيح، يرجى المحاولة مرة أخرى!');
                return;
            }

            const { name, phone, pass } = appState.tempRegData;
            let slug = name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
            if(!slug || slug === '-') slug = 'restaurant-' + Date.now();
            else slug = slug + '-' + Math.floor(100 + Math.random() * 900);

            globalDB.restaurants[slug] = { 
                id: slug, name, phone, pass, tablesCount: 20,
                address: 'القاهرة، مصر',
                coverImage: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=800',
                logoImage: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300',
                theme: { primary: '#163882', accent: '#dc2626' },
                categories: [{ id: 'cat_1', name: 'الرئيسية 🍽️' }],
                menu_items: [], gallery: [], orders: [], employees: []
            };
            syncCloud(); 
            currentRestId = slug; 
            localStorage.setItem('tablia_logged_rest_id', slug); 
            setPage('builder');
        }

        // ================= BUILDER WITH FIXED MAGIC BOX =================
        function renderBuilder(){
            const rest = globalDB.restaurants[currentRestId];
            if(!rest){ setPage('auth'); return ''; }
            const customLink = location.origin + location.pathname + `?view=menu&rest=${rest.id}`;
            return `
                <div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-5 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                        <div>
                            <h1 class="font-black text-white text-sm">لوحة تحكم: ${rest.name}</h1>
                            <span class="text-slate-400 text-[10px]">قاعدة البيانات السحابية نشطة ومتصلة</span>
                        </div>
                        <button onclick="currentRestId=null; localStorage.removeItem('tablia_logged_rest_id'); setPage('auth');" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-xl font-bold">خروج</button>
                    </div>

                    <!-- MAGIC BOX FIXED -->
                    <div class="bg-slate-900 p-5 rounded-3xl border border-amber-500/30 space-y-3 shadow-xl">
                        <div class="flex items-center gap-2">
                            <span class="text-amber-400 text-base">🪄</span>
                            <h2 class="font-black text-amber-400 text-sm">الصندوق السحري لإضافة المنيو دفعة واحدة</h2>
                        </div>
                        <p class="text-slate-400 text-[11px]">اكتب القسم متبوعاً بنقطتين (مثال: السندوتشات:) وتحته الأصناف وكل صنف سعره بجانبه، ثم اضغط توليد:</p>
                        <textarea id="magic_input" placeholder="السندوتشات:&#10;سندوتش كبده 25&#10;سندوتش سجق 30" class="w-full h-32 bg-slate-950 border border-slate-800 p-3 rounded-2xl text-white font-mono text-xs outline-none focus:border-amber-500"></textarea>
                        <button onclick="parseMagicBox('${rest.id}')" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl shadow transition">توليد وإضافة المنيو بالكامل بالسحر ✨</button>
                    </div>

                    <!-- Categories & Items Summary -->
                    <div class="bg-slate-900 p-5 rounded-3xl space-y-4 border border-slate-800">
                        <h2 class="font-black text-white text-sm">📁 الأقسام والأصناف الحالية (${(rest.menu_items||[]).length})</h2>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${(rest.menu_items||[]).map((item, idx) => `
                                <div class="bg-slate-950 p-3 rounded-xl flex justify-between items-center border border-slate-800">
                                    <div>
                                        <span class="font-black text-white">${item.name}</span>
                                        <span class="text-amber-400 block">${item.price} جنيه</span>
                                    </div>
                                    <button onclick="deleteItem('${rest.id}', ${idx})" class="text-red-400 p-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- GALLERY -->
                    <div class="bg-slate-900 p-5 rounded-3xl space-y-3 border border-slate-800">
                        <h2 class="font-black text-amber-400 text-sm">🖼️ معرض الصور (تظهر في آخر المنيو)</h2>
                        <input id="gal_title" placeholder="عنوان الصورة (مثال: صالة المطعم)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-bold outline-none">
                        <input id="gal_url" placeholder="رابط الصورة (URL)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-bold outline-none">
                        <button onclick="addGallery('${rest.id}')" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-3 rounded-xl shadow transition">إضافة الصورة للمعرض ➔</button>
                    </div>

                    <!-- FINAL LINK -->
                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 border border-emerald-500/40 text-center shadow-2xl">
                        <h2 class="font-black text-emerald-400 text-sm">🎉 رابط مطعمك المخصص (بالاسم الإنجليزي)</h2>
                        <input readonly value="${customLink}" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-amber-400 font-mono text-center text-xs select-all">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="navigator.clipboard.writeText('${customLink}'); alert('تم نسخ اللينك بنجاح!');" class="bg-amber-500 text-slate-950 font-black py-3 rounded-xl">نسخ اللينك</button>
                            <a href="?view=menu&rest=${rest.id}" target="_blank" class="bg-emerald-600 text-white font-black py-3 rounded-xl flex items-center justify-center gap-1">فتح المنيو كقالب ➔</a>
                        </div>
                    </div>
                </div>
            `;
        }

        function parseMagicBox(restId){
            const rest = globalDB.restaurants[restId];
            const text = document.getElementById('magic_input').value.trim();
            if(!text) { alert('يرجى كتابة أو لصق المنيو في الصندوق السحري أولاً!'); return; }

            let currentCatId = 'cat_' + Date.now();
            text.split('\n').forEach(line => {
                line = line.trim();
                if(!line) return;
                if(line.includes(':') || line.endsWith('ات') || line.endsWith('ء') || line.length < 15) {
                    const catName = line.replace(':', '').trim();
                    currentCatId = 'cat_' + Date.now() + Math.random();
                    if(!rest.categories.some(c => c.name === catName)) {
                        rest.categories.push({ id: currentCatId, name: catName });
                    }
                } else {
                    const matchPrice = line.match(/\d+/);
                    if(matchPrice) {
                        const price = Number(matchPrice[0]);
                        const name = line.replace(matchPrice[0], '').replace(/جنيه|ج/g, '').trim();
                        rest.menu_items.push({
                            id: 'itm_' + Date.now() + Math.random(),
                            category_id: currentCatId,
                            name: name || 'وجبة مميزة',
                            price: price,
                            description: 'معد بعناية فائقة من أجود المكونات',
                            image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'
                        });
                    }
                }
            });
            document.getElementById('magic_input').value = '';
            syncCloud();
            alert('✨ تم توليد المنيو بنجاح وتمت الإضافة بقاعدة البيانات!');
            render();
        }

        function deleteItem(restId, idx){
            globalDB.restaurants[restId].menu_items.splice(idx, 1);
            syncCloud();
            render();
        }

        function addGallery(restId){
            const rest = globalDB.restaurants[restId];
            const title = document.getElementById('gal_title').value.trim();
            const url = document.getElementById('gal_url').value.trim();
            if(!title || !url) return;
            rest.gallery.push({ id: 'gal_' + Date.now(), title, image: url });
            syncCloud();
            render();
        }

        // ================= CASHIER & ORDERS =================
        function renderCashier(){
            const rest = globalDB.restaurants[currentRestId];
            if(!rest){ setPage('auth'); return ''; }
            if(!rest.orders) rest.orders = [];
            return `
                <div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                        <h1 class="font-black text-white text-sm">🔔 شاشة الكاشير والطلبات الواردة</h1>
                        <span class="bg-amber-500/20 text-amber-400 font-bold px-3 py-1 rounded-full">الطلبات: ${rest.orders.length}</span>
                    </div>
                    <div class="space-y-3">
                        ${rest.orders.length === 0 ? `<div class="bg-slate-900 p-12 text-center text-slate-500 rounded-3xl border border-slate-800">لا توجد طلبات جديدة حالياً..</div>` : rest.orders.map((ord, i) => `
                            <div class="bg-slate-900 p-4 rounded-3xl space-y-3 border border-slate-800">
                                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <div><span class="font-black text-white text-sm">${ord.customer_name}</span><span class="text-slate-400 text-[10px] block">${ord.phone} | ${ord.order_type}</span></div>
                                    <div class="text-left"><span class="text-amber-400 font-black text-sm">${ord.total} جنيه</span></div>
                                </div>
                                <div class="text-slate-300 text-[11px] bg-slate-950 p-2.5 rounded-xl">
                                    <div>${(ord.items||[]).map(x => `• ${x.qty}x ${x.name} (${x.price * x.qty} ج)`).join('<br>')}</div>
                                </div>
                                <button onclick="globalDB.restaurants['${currentRestId}'].orders.splice(${i},1); syncCloud(); render();" class="w-full bg-red-500/20 text-red-400 py-2 rounded-xl font-bold">حذف الطلب</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderInventory(){
            const rest = globalDB.restaurants[currentRestId];
            return `<div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-3 text-xs"><h1 class="font-black text-sm bg-slate-900 p-4 rounded-2xl">المخزن - ${rest.name}</h1>${(rest.menu_items||[]).map(i=>`<div class="bg-slate-900 p-4 rounded-2xl flex justify-between"><span>${i.name}</span><span class="text-amber-400 font-bold">متوفر</span></div>`).join('')}</div>`;
        }
        function renderAttendance(){ return `<div class="max-w-3xl mx-auto px-4 py-6 pb-28 text-center text-xs text-white">إدارة الموظفين والحضور</div>`; }
        function renderDashboard(){ return `<div class="max-w-3xl mx-auto px-4 py-6 pb-28 text-center text-xs text-white">الباقات والاشتراكات</div>`; }
        function renderQRPrint(){ 
            const rest = globalDB.restaurants[currentRestId];
            const base = location.origin + location.pathname + `?view=menu&rest=${rest.id}&t=`;
            return `<div class="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-4 text-xs"><h1 class="font-black text-amber-400 bg-slate-900 p-4 rounded-2xl">طباعة أكواد QR</h1><div class="grid grid-cols-2 gap-3">${Array.from({length:20},(_,i)=>i+1).map(n=>`<div class="bg-slate-900 p-4 rounded-2xl text-center space-y-2"><div class="font-bold">طاولة ${n}</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(base+'طاولة '+n)}" class="mx-auto rounded bg-white p-1"></div>`).join('')}</div></div>`; 
        }

        // ================= STOREFRONT TEMPLATE =================
        function renderStorefront(){
            const restId = targetRestSlug || Object.keys(globalDB.restaurants)[0];
            const rest = globalDB.restaurants[restId];
            if(!rest) return `<div class="min-h-screen flex items-center justify-center text-white">المطعم غير موجود</div>`;

            const cartCount = appState.cart.reduce((s,i)=>s+i.qty, 0);
            const cartTotal = appState.cart.reduce((s,i)=>s+(i.price*i.qty), 0);

            return `
                <div class="min-h-screen bg-[#f8fafc] text-slate-900 pb-28">
                    <!-- Top Bar -->
                    <header class="bg-white sticky top-0 z-50 border-b border-slate-200 px-4 py-3 shadow-xs">
                        <div class="max-w-xl mx-auto flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <img src="${rest.logoImage}" class="w-9 h-9 rounded-full object-cover border">
                                <span class="font-black text-sm text-slate-900">${rest.name}</span>
                            </div>
                            <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-xl text-xs font-bold">
                                <button onclick="appState.orderType='dine-in'; render();" class="px-3 py-1 rounded-lg ${appState.orderType==='dine-in'?'bg-white shadow':''}">🍽️ صالة</button>
                                <button onclick="appState.orderType='delivery'; render();" class="px-3 py-1 rounded-lg ${appState.orderType==='delivery'?'bg-white shadow':''}">🛵 دليفري</button>
                            </div>
                        </div>
                    </header>

                    <!-- Hero Banner -->
                    <div class="relative h-44 w-full bg-slate-900 overflow-hidden">
                        <img src="${rest.coverImage}" class="w-full h-full object-cover opacity-80">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent flex items-end p-4">
                            <div class="text-white">
                                <h1 class="font-black text-lg">${rest.name}</h1>
                                <p class="text-[11px] text-slate-200"><i class="fa-solid fa-location-dot text-amber-400"></i> ${rest.address}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Sticky Category Pills -->
                    <div class="sticky top-[57px] z-40 bg-white border-b border-slate-200 shadow-xs">
                        <div class="max-w-xl mx-auto px-3 py-2.5 flex gap-2 overflow-x-auto hide-scrollbar">
                            <button onclick="appState.activeCat='all'; render();" class="px-4 py-1.5 rounded-full text-xs font-bold shrink-0 ${appState.activeCat==='all'?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">الكل</button>
                            ${(rest.categories||[]).map(c => `
                                <button onclick="appState.activeCat='${c.id}'; render();" class="px-4 py-1.5 rounded-full text-xs font-bold shrink-0 ${appState.activeCat===c.id?'bg-slate-900 text-white':'bg-slate-100 text-slate-600'}">${c.name}</button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="max-w-xl mx-auto px-3 pt-4 space-y-6">
                        <!-- Items List -->
                        ${(rest.categories||[]).filter(cat => appState.activeCat==='all' || appState.activeCat===cat.id).map(cat => {
                            const items = (rest.menu_items||[]).filter(i => i.category_id === cat.id);
                            if(items.length === 0) return '';
                            return `
                                <div class="space-y-2.5">
                                    <h2 class="font-black text-sm text-slate-800 px-1">${cat.name}</h2>
                                    <div class="space-y-3">
                                        ${items.map(item => `
                                            <div onclick="addToCart('${item.id}')" class="bg-white border border-slate-200/80 rounded-2xl p-3.5 flex items-center justify-between gap-3 shadow-xs cursor-pointer active:scale-[0.99] transition">
                                                <div class="flex-1 space-y-1">
                                                    <h3 class="font-black text-sm text-slate-900">${item.name}</h3>
                                                    <p class="text-[11px] text-slate-500 line-clamp-2">${item.description}</p>
                                                    <div class="flex items-center gap-2 pt-1">
                                                        <span class="font-black text-xs text-slate-900">${item.price} جنيه</span>
                                                    </div>
                                                </div>
                                                <div class="relative shrink-0">
                                                    <img src="${item.image}" class="w-20 h-20 rounded-xl object-cover bg-slate-100">
                                                    <span class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs font-black shadow">+</span>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `;
                        }).join('')}

                        <!-- GALLERY AT THE END -->
                        ${rest.gallery && rest.gallery.length > 0 ? `
                            <div class="space-y-3 pt-6 border-t border-slate-200">
                                <h2 class="font-black text-sm text-slate-800 text-center">معرض الصور والأطباق</h2>
                                <div class="grid grid-cols-2 gap-3">
                                    ${rest.gallery.map(g => `
                                        <div class="bg-white border rounded-2xl overflow-hidden shadow-xs">
                                            <img src="${g.image}" class="w-full h-36 object-cover">
                                            <div class="p-2 text-center text-xs font-bold text-slate-700 truncate">${g.title}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Bottom Floating Cart Bar -->
                    ${cartCount > 0 ? `
                        <div class="fixed bottom-3 left-3 right-3 max-w-xl mx-auto z-50">
                            <button onclick="submitOrder('${rest.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 px-5 rounded-2xl shadow-xl flex items-center justify-between font-black text-xs transition">
                                <div class="flex items-center gap-2">
                                    <span class="bg-white/20 px-2 py-0.5 rounded-lg text-xs">${cartCount}</span>
                                    <span>إتمام الطلب (${cartTotal} جنيه)</span>
                                </div>
                                <span class="flex items-center gap-1">أكد الآن <i class="fa-solid fa-arrow-left"></i></span>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addToCart(itemId){
            const rest = globalDB.restaurants[targetRestSlug || Object.keys(globalDB.restaurants)[0]];
            const item = rest.menu_items.find(i => i.id === itemId);
            if(!item) return;
            const found = appState.cart.find(c => c.id === itemId);
            if(found) found.qty++; else appState.cart.push({...item, qty: 1});
            render();
        }

        function submitOrder(restId){
            const rest = globalDB.restaurants[restId];
            if(!rest.orders) rest.orders = [];
            const total = appState.cart.reduce((s,i)=>s+(i.price*i.qty), 0);
            rest.orders.unshift({
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customer_name: 'عميل المنيو',
                phone: '01000000000',
                order_type: appState.orderType === 'dine-in' ? '🍽️ صالة' : '🛵 دليفري',
                items: JSON.parse(JSON.stringify(appState.cart)),
                total: total,
                created_at: new Date().toLocaleTimeString('ar-EG')
            });
            appState.cart = [];
            syncCloud();
            playBell();
            alert('🎉 تم إرسال طلبك بنجاح للمطعم!');
            render();
        }

        render();
    </script>
</body>
</html>
