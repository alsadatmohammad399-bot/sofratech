<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرتك | Sofratech POS & AI Menu Importer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: { brand: { DEFAULT: '#65a30d', dark: '#4d7c0f', light: '#ecfccb' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased min-h-screen bg-slate-50 text-slate-900 selection:bg-lime-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        let globalDB = { shops: {} };
        try {
            const raw = localStorage.getItem('sofratech_v5000');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        function syncCloud() {
            try {
                localStorage.setItem('sofratech_v5000', JSON.stringify(globalDB));
                if (cloudDB) cloudDB.ref('sofratech_enterprise_v5000').set(globalDB).catch(() => {});
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('sofratech_enterprise_v5000').on('value', (snap) => {
                const data = snap.val();
                if (data && data.shops) {
                    globalDB = data;
                    try { localStorage.setItem('sofratech_v5000', JSON.stringify(globalDB)); } catch(e){}
                    checkExpirations();
                    render();
                }
            });
        }

        function checkExpirations() {
            let changed = false;
            const now = Date.now();
            Object.keys(globalDB.shops || {}).forEach(id => {
                const s = globalDB.shops[id];
                if (s.status === 'active' && s.expiresAt && now > s.expiresAt) {
                    s.status = 'expired';
                    changed = true;
                }
            });
            if(changed) syncCloud();
        }
        checkExpirations();

        function playBell(){
            try {
                const a = document.getElementById('cloud-bell');
                if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
                if('vibrate' in navigator) navigator.vibrate([300, 150, 300]);
            } catch(e){}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isAdminMode = urlParams.get('admin') === 'true'; 
        const isCustomerMode = urlParams.get('view') === 'store'; 
        const targetShopSlug = urlParams.get('shop');
        const urlTableNum = urlParams.get('t') || '';
        
        let currentShopId = localStorage.getItem('sofratech_logged_shop_id') || null;

        const appState = { 
            page: isAdminMode ? 'admin_panel' : (isCustomerMode ? 'storefront' : (currentShopId ? 'dashboard' : 'landing')), 
            authMode: 'register',
            darkMode: false,
            viewLayout: 'grid',
            favorites: JSON.parse(localStorage.getItem('sofratech_favs') || '[]'),
            showFavoritesOnly: false,
            menuDrawerOpen: false,
            cart: [],
            searchQuery: '',
            selectedCategory: 'all',
            orderType: urlTableNum ? 'table' : 'delivery',
            paymentMethod: 'cash',
            tableNumber: urlTableNum,
            checkoutStep: 'browse',
            posCart: [],
            posDiscount: 0,
            posPaidAmount: 0,
            posOrderType: 'dinein',
            posDrawerOpen: false,
            posHeldOrders: [],
            posSearch: '',
            posCategory: 'all',
            orderFilterStatus: 'all'
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function toggleFavorite(prodId, e){
            if(e) e.stopPropagation();
            const idx = appState.favorites.indexOf(prodId);
            if(idx > -1) appState.favorites.splice(idx, 1);
            else appState.favorites.push(prodId);
            localStorage.setItem('sofratech_favs', JSON.stringify(appState.favorites));
            render();
        }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isAdminMode) {
                    content = renderAdminDashboard();
                } else if(isCustomerMode) {
                    content = renderStorefront();
                } else if(appState.page === 'landing') {
                    content = renderLandingPage();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentShopId || !globalDB.shops?.[currentShopId]) { 
                        currentShopId = null; 
                        localStorage.removeItem('sofratech_logged_shop_id');
                        appState.page = 'landing'; 
                        content = renderLandingPage(); 
                    } else {
                        const shop = globalDB.shops[currentShopId];
                        if(shop.status === 'pending' || shop.status === 'expired') {
                            content = renderPendingScreen(shop);
                        } else if(appState.page === 'dashboard') {
                            content = renderMerchantDashboard(shop);
                        } else if(appState.page === 'pos') {
                            content = renderPOS(shop);
                        } else if(appState.page === 'items') {
                            content = renderItemsManager(shop);
                        } else if(appState.page === 'ai_import') {
                            content = renderAiImportScreen(shop);
                        } else if(appState.page === 'orders') {
                            content = renderMerchantOrders(shop);
                        } else if(appState.page === 'qr_print') {
                            content = renderQRManager(shop);
                        } else {
                            content = renderMerchantDashboard(shop);
                        }
                    }
                }
                root.innerHTML = content;
            } catch(err) { console.error("Render Error:", err); }
        }

        // ================= 1. صفحة الهبوط =================
        function renderLandingPage(){
            return `
                <div class="min-h-screen bg-[#0b0f19] text-white">
                    <header class="max-w-5xl mx-auto px-4 py-5 flex justify-between items-center border-b border-slate-800">
                        <div class="flex items-center gap-2.5">
                            <div class="w-10 h-10 rounded-2xl bg-lime-600 flex items-center justify-center font-black text-lg text-white">س</div>
                            <div>
                                <span class="font-black text-base block leading-none">سفرتك</span>
                                <span class="text-[10px] text-lime-400 font-bold">Sofratech AI Menu</span>
                            </div>
                        </div>
                        <button onclick="appState.authMode='login'; setPage('auth');" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition">دخول التاجر</button>
                    </header>

                    <div class="max-w-xl mx-auto px-4 py-12 space-y-8 text-center">
                        <div class="space-y-3">
                            <span class="bg-lime-500/10 text-lime-400 border border-lime-500/20 font-black px-4 py-1.5 rounded-full text-xs">رفع صورة المنيو بالذكاء الاصطناعي 🤖✨</span>
                            <h1 class="text-3xl font-black text-white leading-tight">أنشئ منيو مطعمك في ثوانٍ برفع صورة المنيو أو ملف PDF</h1>
                            <p class="text-slate-400 text-sm leading-relaxed">نظام متكامل يضم رفع المنيو بالذكاء الاصطناعي، كاشير POS، وضع ليلي ونهاري، وطلبات واتساب بدون أي عمولة.</p>
                        </div>

                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-2xl text-right">
                            <div class="grid grid-cols-2 gap-2 text-xs text-slate-200 font-bold">
                                <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex items-center gap-2"><i class="fa-solid fa-file-arrow-up text-lime-500"></i> رفع صورة المنيو PDF/Excel</div>
                                <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex items-center gap-2"><i class="fa-solid fa-cash-register text-lime-500"></i> شاشة كاشير POS</div>
                                <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex items-center gap-2"><i class="fa-solid fa-moon text-lime-500"></i> وضع ليلي ونهاري</div>
                                <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex items-center gap-2"><i class="fa-brands fa-whatsapp text-lime-500"></i> تنبيهات واتساب</div>
                            </div>
                            <div class="bg-slate-950 border border-lime-500/30 p-4 rounded-2xl flex justify-between items-center">
                                <div>
                                    <span class="text-slate-400 text-[11px] block">اشتراك الباقة الشاملة</span>
                                    <span class="text-lime-400 font-black text-lg">600 ج.م / شهرياً</span>
                                </div>
                                <span class="bg-lime-500/20 text-lime-400 px-3 py-1.5 rounded-xl text-xs font-black">بدون عمولة 🔥</span>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <button onclick="appState.authMode='register'; setPage('auth');" class="w-full bg-lime-600 hover:bg-lime-500 text-slate-950 font-black py-4 rounded-2xl shadow-lg text-sm transition">
                                ✨ أنشئ متجرك الآن
                            </button>
                            <button onclick="appState.authMode='login'; setPage('auth');" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold py-3.5 rounded-2xl text-xs transition">
                                تسجيل الدخول لحسابك
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 2. تسجيل ودخول =================
        function renderAuthScreen(){
            const isLogin = appState.authMode === 'login';
            return `
                <div class="min-h-screen bg-[#0b0f19] text-white flex items-center justify-center px-4">
                    <div class="max-w-md w-full space-y-6 text-xs">
                        <div class="flex justify-between items-center">
                            <button onclick="setPage('landing')" class="text-slate-400 font-bold"><i class="fa-solid fa-arrow-right ml-1"></i> الرئيسية</button>
                            <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                                <button onclick="appState.authMode='register'; render();" class="px-3.5 py-1.5 rounded-lg font-bold ${!isLogin?'bg-lime-600 text-slate-950':''}">حساب جديد</button>
                                <button onclick="appState.authMode='login'; render();" class="px-3.5 py-1.5 rounded-lg font-bold ${isLogin?'bg-lime-600 text-slate-950':''}">دخول</button>
                            </div>
                        </div>

                        <div class="bg-slate-900 p-6 rounded-3xl space-y-4 shadow-2xl border border-slate-800">
                            <h1 class="text-lg font-black text-white text-center">${isLogin ? '🔑 تسجيل الدخول' : '🚀 حساب محل جديد'}</h1>
                            ${!isLogin ? `
                                <div><label class="block text-slate-300 mb-1 font-bold">اسم المطعم</label><input id="reg_name" placeholder="مثال: مطعم الشيف" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none"></div>
                                <div><label class="block text-slate-300 mb-1 font-bold">العنوان</label><input id="reg_address" placeholder="الإسماعيلية" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none"></div>
                            ` : ''}
                            <div><label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label><input id="reg_phone" type="tel" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none"></div>
                            <div><label class="block text-slate-300 mb-1 font-bold">كلمة السر</label><input id="reg_pass" type="password" placeholder="••••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none"></div>
                            <button onclick="${isLogin ? 'loginExistingShop()' : 'registerNewShop()'}" class="w-full bg-lime-600 text-slate-950 font-black py-3.5 rounded-xl shadow">متابعة ➔</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function registerNewShop(){
            const name = document.getElementById('reg_name').value.trim(); 
            const address = document.getElementById('reg_address').value.trim() || 'مصر';
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            if(!name || !phone || !pass){ alert('يرجى استكمال البيانات!'); return; }
            let slug = 'shop-' + phone.replace(/[^0-9]/g, '') + '-' + Math.floor(10 + Math.random() * 90);
            globalDB.shops[slug] = { id: slug, name, phone, pass, address, status: 'pending', isOpen: true, expiresAt: null, deliveryFee: 20, serviceFeePercent: 0, vatPercent: 0, vodafoneNumber: phone, products: [], orders: [] };
            syncCloud(); currentShopId = slug; localStorage.setItem('sofratech_logged_shop_id', slug); render();
        }

        function loginExistingShop(){
            const phone = document.getElementById('reg_phone').value.trim();
            const pass = document.getElementById('reg_pass').value.trim();
            const foundId = Object.keys(globalDB.shops || {}).find(id => globalDB.shops[id].phone === phone && globalDB.shops[id].pass === pass);
            if(foundId) { currentShopId = foundId; localStorage.setItem('sofratech_logged_shop_id', foundId); render(); } else { alert('بيانات غير صحيحة!'); }
        }

        function renderPendingScreen(shop){
            return `
                <div class="min-h-screen bg-[#0b0f19] text-white flex items-center justify-center px-4 text-xs text-center">
                    <div class="max-w-md w-full bg-slate-900 p-8 rounded-3xl border border-lime-500/40 space-y-5">
                        <div class="w-16 h-16 bg-lime-500/20 text-lime-400 rounded-full flex items-center justify-center mx-auto text-2xl"><i class="fa-solid fa-clock"></i></div>
                        <h1 class="text-xl font-black">حسابك في انتظار التفعيل ⏳</h1>
                        <p class="text-slate-300">تحويل <b>600 ج.م</b> فودافون كاش على الرقم:</p>
                        <div class="bg-slate-950 p-4 rounded-2xl font-mono text-lime-400 font-black text-lg">01015861991</div>
                        <div class="grid grid-cols-2 gap-2">
                            <a href="https://wa.me/201015861991?text=${encodeURIComponent('تفعيل اشتراك: '+shop.name)}" target="_blank" class="bg-lime-600 text-slate-950 font-black py-3 rounded-xl flex items-center justify-center gap-1"><i class="fa-brands fa-whatsapp"></i> إرسال الإيصال</a>
                            <button onclick="currentShopId=null; localStorage.removeItem('sofratech_logged_shop_id'); setPage('landing');" class="bg-slate-800 text-slate-300 font-bold py-3 rounded-xl">خروج</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminDashboard(){
            if(sessionStorage.getItem('tablia_admin_auth') !== 'true') {
                return `<div class="min-h-screen bg-[#0b0f19] flex items-center justify-center px-4"><div class="bg-slate-900 p-8 rounded-3xl text-center space-y-4"><h1 class="text-white font-black">إدارة المنصة</h1><input id="admin_pass_box" type="password" placeholder="••••••" class="bg-slate-950 border p-3 rounded-xl text-white text-center"><button onclick="if(document.getElementById('admin_pass_box').value==='357159'){sessionStorage.setItem('tablia_admin_auth','true');render();}" class="w-full bg-lime-600 text-slate-950 font-black py-3 rounded-xl">دخول</button></div></div>`;
            }
            const shopIds = Object.keys(globalDB.shops || {});
            return `
                <div class="min-h-screen bg-[#0b0f19] text-white p-4">
                    <div class="max-w-4xl mx-auto space-y-6 text-xs">
                        <div class="flex justify-between items-center bg-slate-900 p-5 rounded-3xl">
                            <h1 class="font-black text-base">إدارة المتاجر (${shopIds.length})</h1>
                            <button onclick="sessionStorage.removeItem('tablia_admin_auth');render();" class="text-red-400">خروج</button>
                        </div>
                        <div class="space-y-3">
                            ${shopIds.map(id => {
                                const s = globalDB.shops[id];
                                return `<div class="bg-slate-900 p-4 rounded-2xl flex justify-between items-center"><div><span class="font-black">${s.name}</span><span class="block text-[10px] text-slate-400">${s.phone} | الحالة: ${s.status}</span></div><button onclick="globalDB.shops['${id}'].status='active'; globalDB.shops['${id}'].expiresAt=Date.now()+(30*24*60*60*1000); syncCloud(); render();" class="bg-lime-600 text-slate-950 px-3 py-2 rounded-xl font-black">تفعيل شهر</button></div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 3. هيدر التاجر =================
        function renderMerchantTopBar(shop, title){
            const daysLeft = shop.expiresAt ? Math.max(0, Math.ceil((shop.expiresAt - Date.now()) / (1000 * 60 * 60 * 24))) : 0;
            const newOrdersCount = (shop.orders || []).filter(o => o.status === 'new').length;
            return `
                <div class="bg-amber-50 border-b border-amber-200 px-4 py-1.5 text-center text-[11px] font-bold text-amber-900 flex justify-center items-center gap-2">
                    <span>اشتراكك باقي عليه ${daysLeft} يوم</span>
                    <a href="https://wa.me/201015861991?text=${encodeURIComponent('تجديد اشتراك: '+shop.name)}" target="_blank" class="underline font-black text-lime-700">تجديد</a>
                </div>
                <header class="bg-white sticky top-0 z-40 border-b border-slate-200 px-4 py-3">
                    <div class="max-w-3xl mx-auto flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <button onclick="setPage('dashboard')" class="bg-slate-100 text-slate-800 px-3 py-1.5 rounded-xl font-black text-xs"><i class="fa-solid fa-bars"></i> القائمة</button>
                            <span class="font-black text-sm text-slate-800">${title}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="shop.isOpen = !(shop.isOpen !== false); syncCloud(); render();" class="px-3 py-1.5 rounded-full text-[11px] font-black flex items-center gap-1.5 ${shop.isOpen!==false ? 'bg-lime-100 text-lime-800' : 'bg-red-100 text-red-700'}">
                                <span class="w-2 h-2 rounded-full ${shop.isOpen!==false ? 'bg-lime-600' : 'bg-red-600'}"></span>
                                ${shop.isOpen!==false ? 'مفتوح' : 'مغلق'}
                            </button>
                            <button onclick="setPage('orders')" class="relative w-9 h-9 bg-slate-100 rounded-xl flex items-center justify-center text-slate-700">
                                <i class="fa-regular fa-bell"></i>
                                ${newOrdersCount > 0 ? `<span class="absolute -top-1 -right-1 bg-red-600 text-white w-4 h-4 rounded-full text-[10px] font-black flex items-center justify-center">${newOrdersCount}</span>` : ''}
                            </button>
                        </div>
                    </div>
                </header>
            `;
        }

        // ================= 4. لوحة تحكم التاجر =================
        function renderMerchantDashboard(shop){
            const orders = shop.orders || [];
            const products = shop.products || [];
            const todaySales = orders.reduce((s, o) => s + (o.total || 0), 0);
            const storeUrl = location.origin + location.pathname + `?view=store&shop=${shop.id}`;

            return `
                <div class="min-h-screen bg-slate-50 pb-20 text-slate-900">
                    ${renderMerchantTopBar(shop, 'لوحة التحكم')}

                    <div class="max-w-3xl mx-auto px-4 pt-5 space-y-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h1 class="text-xl font-black text-slate-900">مرحباً، ${shop.name} 👋</h1>
                                <p class="text-xs text-slate-500">أدر منيو متجرك وكاشير البيع بسهولة.</p>
                            </div>
                            <button onclick="currentShopId=null; localStorage.removeItem('sofratech_logged_shop_id'); setPage('landing');" class="text-xs text-red-600 font-bold bg-red-50 px-3 py-1.5 rounded-xl">خروج</button>
                        </div>

                        <!-- بطاقة رفع صورة المنيو بالذكاء الاصطناعي (مطابقة لصورتك تماماً!) -->
                        <div class="bg-gradient-to-r from-lime-600 to-emerald-700 p-5 rounded-3xl text-white shadow-lg flex items-center justify-between gap-4">
                            <div class="space-y-2">
                                <span class="bg-white/20 text-white px-2.5 py-0.5 rounded-full text-[10px] font-black">الخطوة الذكية 🤖</span>
                                <h2 class="font-black text-base">ارفع صورة المنيو أو ملف PDF</h2>
                                <p class="text-xs text-lime-100">ارفع صورة منيو مطعمك القديم وسيقوم النظام باستخراج الأصناف فوراً!</p>
                                <button onclick="setPage('ai_import')" class="bg-white text-slate-950 font-black px-4 py-2.5 rounded-xl text-xs shadow-md">ابدأ رفع المنيو الآن ➔</button>
                            </div>
                            <div class="w-16 h-16 rounded-2xl bg-white/10 flex items-center justify-center text-2xl shrink-0"><i class="fa-solid fa-file-arrow-up"></i></div>
                        </div>

                        <!-- الإحصائيات -->
                        <div class="grid grid-cols-3 gap-2.5">
                            <div class="bg-white p-3.5 rounded-3xl border border-slate-200 text-center">
                                <span class="text-[10px] text-slate-400 font-bold block">الطلبات</span>
                                <span class="text-lg font-black text-slate-900">${orders.length}</span>
                            </div>
                            <div class="bg-white p-3.5 rounded-3xl border border-slate-200 text-center">
                                <span class="text-[10px] text-slate-400 font-bold block">مبيعات اليوم</span>
                                <span class="text-lg font-black text-lime-700">${todaySales} ج</span>
                            </div>
                            <div class="bg-white p-3.5 rounded-3xl border border-slate-200 text-center">
                                <span class="text-[10px] text-slate-400 font-bold block">الأصناف</span>
                                <span class="text-lg font-black text-slate-900">${products.length}</span>
                            </div>
                        </div>

                        <!-- أزرار الإجراءات السريعة -->
                        <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs space-y-2.5">
                            <h2 class="font-black text-sm text-slate-900">إدارة النظام</h2>
                            <div class="grid grid-cols-2 gap-2 text-xs font-black">
                                <button onclick="setPage('pos')" class="bg-amber-400 hover:bg-amber-500 text-slate-950 p-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-xs"><i class="fa-solid fa-cash-register"></i> الكاشير (POS)</button>
                                <button onclick="setPage('items')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 p-3.5 rounded-2xl flex items-center justify-center gap-2"><i class="fa-solid fa-utensils"></i> الأصناف والأسعار</button>
                                <button onclick="setPage('orders')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 p-3.5 rounded-2xl flex items-center justify-center gap-2"><i class="fa-solid fa-receipt"></i> متابعة الطلبات</button>
                                <button onclick="setPage('qr_print')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 p-3.5 rounded-2xl flex items-center justify-center gap-2"><i class="fa-solid fa-qrcode"></i> رموز QR والطاولات</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 5. شاشة "ارفع المنيو" بالذكاء الاصطناعي (مطابقة لصورتك MenusBee) =================
        function renderAiImportScreen(shop){
            return `
                <div class="min-h-screen bg-slate-50 pb-24 text-slate-900">
                    ${renderMerchantTopBar(shop, 'المنيو بالذكاء الاصطناعي')}

                    <div class="max-w-xl mx-auto px-4 pt-6 space-y-5 text-xs">
                        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-xs space-y-5 text-center">
                            <div class="w-14 h-14 bg-lime-100 text-lime-700 rounded-full flex items-center justify-center mx-auto text-xl">
                                <i class="fa-solid fa-file-arrow-up"></i>
                            </div>
                            <div class="space-y-1">
                                <h1 class="text-base font-black text-slate-900">الخطوة 6 من 6: المنيو بالذكاء الاصطناعي</h1>
                                <p class="text-slate-500 text-[11px]">ارفع صورة المنيو أو ملف PDF أو Excel، ثم راجع الأصناف واحفظها مباشرة.</p>
                            </div>

                            <!-- صندوق رفع الملف أو الصورة -->
                            <label class="border-2 border-dashed border-lime-500/50 bg-lime-50/50 hover:bg-lime-50 p-8 rounded-3xl block cursor-pointer transition space-y-2">
                                <i class="fa-solid fa-cloud-arrow-up text-3xl text-lime-600"></i>
                                <span class="font-black text-slate-800 block text-sm">ارفع صورة المنيو أو المستند هنا</span>
                                <span class="text-[10px] text-slate-400 block">صورة أو PDF أو Excel أو CSV • حتى 25 ميغابايت</span>
                                <input type="file" id="menu_upload_file" accept="image/*,.pdf,.xlsx,.csv" onchange="handleAiMenuUpload('${shop.id}')" class="hidden">
                            </label>

                            <div class="pt-2">
                                <button onclick="setPage('dashboard')" class="w-full bg-slate-100 text-slate-700 font-bold py-3 rounded-2xl">رجوع للوحة التحكم</button>
                            </div>
                        </div>

                        <!-- إدخال يدوي بديل -->
                        <div class="bg-white p-5 rounded-3xl border border-slate-200 space-y-3">
                            <h2 class="font-black text-sm text-slate-900">ليس لديك منيو جاهز للرفع؟</h2>
                            <p class="text-[11px] text-slate-500">أضف تصنيفاتك وأصنافها يدوياً باستخدام الصندوق السحري:</p>
                            <textarea id="ai_manual_box" placeholder="وجبة كبدة 70&#10;حواوشي مشكل 45" class="w-full h-20 bg-slate-50 border p-3 rounded-2xl font-mono text-xs outline-none"></textarea>
                            <button onclick="parseAiManualBox('${shop.id}')" class="w-full bg-lime-600 text-white font-black py-3 rounded-xl">إضافة الأصناف للمنيو ✓</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAiMenuUpload(shopId){
            const fileInput = document.getElementById('menu_upload_file');
            if(fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const shop = globalDB.shops[shopId];
                    if(!shop.products) shop.products = [];
                    // محاكاة استخراج الذكاء الاصطناعي للأصناف من الصورة المرفوعة
                    shop.products.push({ id: 'ai_' + Date.now(), name: 'صنف مستخرج من المنيو (1)', price: 90, category: 'قائمة المنيو المرفوع', image: e.target.result });
                    shop.products.push({ id: 'ai2_' + Date.now(), name: 'صنف مستخرج من المنيو (2)', price: 120, category: 'قائمة المنيو المرفوع', image: e.target.result });
                    syncCloud();
                    alert('✨ تم قراءة صورة المنيو بنجاح واستخراج الأصناف وإضافتها للمنيو!');
                    setPage('items');
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function parseAiManualBox(shopId){
            const shop = globalDB.shops[shopId];
            const text = document.getElementById('ai_manual_box').value.trim();
            if(!text) return;
            if(!shop.products) shop.products = [];
            text.split('\n').forEach(line => {
                const match = line.match(/\d+/);
                if(match) {
                    shop.products.push({
                        id: 'p_' + Date.now() + Math.random(),
                        name: line.replace(match[0], '').replace(/جنيهاً|جنيه|ج/g, '').trim() || 'صنف',
                        price: Number(match[0]),
                        category: 'أصناف عامة',
                        image: ''
                    });
                }
            });
            syncCloud();
            alert('✓ تمت إضافة الأصناف بنجاح!');
            setPage('items');
        }

        // ================= 6. إدارة الأصناف والإعدادات =================
        function renderItemsManager(shop){
            const products = shop.products || [];
            return `
                <div class="min-h-screen bg-slate-50 pb-24 text-slate-900">
                    ${renderMerchantTopBar(shop, 'الأصناف والأسعار')}

                    <div class="max-w-3xl mx-auto px-4 pt-5 space-y-4 text-xs">
                        <div class="bg-white p-4 rounded-3xl border border-slate-200 flex justify-between items-center">
                            <div>
                                <span class="font-black text-sm block">رفع صورة المنيو الذكي</span>
                                <span class="text-[11px] text-slate-400">أضف منيو جديد بصورة أو ملف</span>
                            </div>
                            <button onclick="setPage('ai_import')" class="bg-lime-600 text-white font-black px-4 py-2.5 rounded-xl">رفع منيو 🤖</button>
                        </div>

                        <div class="bg-white p-5 rounded-3xl border border-slate-200 space-y-3">
                            <h2 class="font-black text-sm text-slate-900">📋 أصناف المنيو الحالي (${products.length})</h2>
                            <div class="space-y-2">
                                ${products.length === 0 ? '<div class="text-center text-slate-400 py-8">لا توجد أصناف.. اضغط "رفع منيو" أو أضف يدوياً.</div>' : products.map((item, idx) => `
                                    <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center border border-slate-200">
                                        <div class="flex items-center gap-3">
                                            ${item.image ? `<img src="${item.image}" class="w-11 h-11 rounded-xl object-cover">` : `<div class="w-11 h-11 rounded-xl bg-lime-100 text-lime-700 flex items-center justify-center font-black">${item.name.charAt(0)}</div>`}
                                            <div>
                                                <span class="font-black text-slate-900">${item.name}</span>
                                                <span class="text-[10px] bg-white border px-2 py-0.5 rounded-full text-slate-600 mr-1">${item.category || 'عام'}</span>
                                                <span class="text-lime-700 font-black block">${item.price.toLocaleString()} ج.م</span>
                                            </div>
                                        </div>
                                        <button onclick="shop.products.splice(${idx}, 1); syncCloud(); render();" class="text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 7. الكاشير POS =================
        function renderPOS(shop){
            const products = shop.products || [];
            const subtotal = appState.posCart.reduce((s, i) => s + (i.price * i.qty), 0);
            return `
                <div class="min-h-screen bg-slate-50 pb-24 text-slate-900">
                    <header class="bg-white sticky top-0 z-40 border-b px-4 py-3 flex justify-between items-center">
                        <button onclick="setPage('dashboard')" class="bg-slate-100 px-3 py-1.5 rounded-xl font-black text-xs"><i class="fa-solid fa-arrow-right"></i> لوحة التحكم</button>
                        <span class="font-black text-sm">نظام الكاشير (POS)</span>
                    </header>

                    <div class="max-w-3xl mx-auto px-4 pt-4 space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            ${products.map(p => `
                                <div onclick="const f=appState.posCart.find(x=>x.id===p.id); if(f) f.qty++; else appState.posCart.push({...p, qty:1}); render();" class="bg-white p-3 rounded-3xl border border-slate-200 cursor-pointer active:scale-95 transition">
                                    <div class="h-20 bg-slate-100 rounded-2xl flex items-center justify-center font-black text-slate-400 mb-2">${p.image ? `<img src="${p.image}" class="w-full h-full object-cover rounded-2xl">` : p.name.charAt(0)}</div>
                                    <h3 class="font-black text-xs truncate">${p.name}</h3>
                                    <span class="font-black text-xs text-lime-700">${p.price} ج.م</span>
                                </div>
                            `).join('')}
                        </div>

                        ${appState.posCart.length > 0 ? `
                            <div class="fixed bottom-3 left-3 right-3 max-w-3xl mx-auto z-40">
                                <button onclick="shop.orders.unshift({id:'POS-'+Math.floor(1000+Math.random()*9000), customer_name:'صالة الكاشير', phone:shop.phone, address:'محلي', items:JSON.parse(JSON.stringify(appState.posCart)), total:${subtotal}, status:'completed', time:new Date().toLocaleTimeString('ar-EG')}); appState.posCart=[]; syncCloud(); alert('✓ تم إنهاء الفاتورة بنجاح!'); render();" class="w-full bg-lime-600 text-white py-3.5 rounded-2xl font-black text-xs shadow-xl flex justify-between px-5">
                                    <span>إتمام الفاتورة</span>
                                    <span>${subtotal} ج.م</span>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // ================= 8. الطلبات =================
        function renderMerchantOrders(shop){
            const orders = shop.orders || [];
            return `
                <div class="min-h-screen bg-slate-50 pb-24 text-slate-900">
                    ${renderMerchantTopBar(shop, 'الطلبات')}
                    <div class="max-w-3xl mx-auto px-4 pt-4 space-y-3 text-xs">
                        ${orders.length === 0 ? '<div class="text-center text-slate-400 py-12">لا توجد طلبات حالياً..</div>' : orders.map((ord, idx) => `
                            <div class="bg-white p-4 rounded-3xl border border-slate-200 space-y-2">
                                <div class="flex justify-between font-black text-slate-900">
                                    <span>${ord.customer_name} (${ord.phone})</span>
                                    <span class="text-lime-700">${ord.total} ج.م</span>
                                </div>
                                <div class="text-slate-500 font-bold">${ord.address}</div>
                                <div class="bg-slate-50 p-2.5 rounded-xl font-bold">${(ord.items||[]).map(i=>`${i.qty}x ${i.name}`).join('، ')}</div>
                                <div class="flex gap-2 pt-1">
                                    <a href="https://wa.me/20${ord.phone.replace(/^0/, '')}?text=${encodeURIComponent('طلبك جاهز يا ' + ord.customer_name)}" target="_blank" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-black text-center"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
                                    <button onclick="shop.orders.splice(${idx},1); syncCloud(); render();" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl font-bold">حذف</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // ================= 9. طباعة QR =================
        function renderQRManager(shop){
            const storeUrl = location.origin + location.pathname + `?view=store&shop=${shop.id}`;
            return `
                <div class="min-h-screen bg-slate-50 pb-24 text-slate-900">
                    ${renderMerchantTopBar(shop, 'رمز QR للمنيو')}
                    <div class="max-w-xl mx-auto px-4 pt-6 space-y-4 text-xs text-center">
                        <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-3">
                            <h1 class="font-black text-sm">امسح لفتح المنيو</h1>
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(storeUrl)}" class="mx-auto">
                            <input readonly value="${storeUrl}" class="w-full bg-slate-50 border p-3 rounded-xl text-center font-mono text-xs font-bold select-all">
                            <button onclick="navigator.clipboard.writeText('${storeUrl}'); alert('تم النسخ!');" class="w-full bg-lime-600 text-white font-black py-3 rounded-xl">نسخ الرابط</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 10. واجهة الزبون (المنيو الكامل) =================
        function renderStorefront(){
            const shopId = targetShopSlug || Object.keys(globalDB.shops)[0];
            const shop = globalDB.shops[shopId];
            if(!shop) return `<div class="min-h-screen flex items-center justify-center font-bold">المنيو غير موجود</div>`;

            const dm = appState.darkMode;
            const bgMain = dm ? 'bg-[#0b0f0a] text-white' : 'bg-[#f8faf7] text-slate-900';
            const cardStyle = dm ? 'bg-[#151c14] border-[#232e21] text-white' : 'bg-white border-slate-200 text-slate-900';
            const products = shop.products || [];
            const categories = ['all', ...new Set(products.map(p => p.category || 'عام'))];

            const filtered = products.filter(p => {
                if(appState.showFavoritesOnly && !appState.favorites.includes(p.id)) return false;
                const matchQ = p.name.toLowerCase().includes(appState.searchQuery.toLowerCase());
                const matchC = appState.selectedCategory === 'all' || (p.category || 'عام') === appState.selectedCategory;
                return matchQ && matchC;
            });

            const cartCount = appState.cart.reduce((s, i) => s + i.qty, 0);
            const subtotal = appState.cart.reduce((s, i) => s + (i.price * i.qty), 0);

            return `
                <div class="min-h-screen ${bgMain} pb-28 transition-colors">
                    <header class="sticky top-0 z-40 px-4 py-3 border-b ${dm?'bg-[#0b0f0a]/95 border-[#232e21]':'bg-[#f8faf7]/95 border-slate-200'} backdrop-blur">
                        <div class="max-w-xl mx-auto flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-2xl bg-lime-600 text-white font-black flex items-center justify-center">${shop.name.charAt(0)}</div>
                                <div><h1 class="font-black text-sm">${shop.name}</h1><span class="text-[10px] text-lime-600 font-bold">مفتوح الآن ✓</span></div>
                            </div>
                            <button onclick="appState.menuDrawerOpen=true; render();" class="w-9 h-9 rounded-full border flex items-center justify-center"><i class="fa-solid fa-bars text-xs"></i></button>
                        </div>
                    </header>

                    <div class="max-w-xl mx-auto px-4 pt-4 space-y-3">
                        <div class="flex items-center gap-2">
                            <input type="text" oninput="appState.searchQuery=this.value; render();" value="${appState.searchQuery}" placeholder="ابحث في المنيو..." class="w-full border py-2.5 px-4 rounded-full text-xs font-bold outline-none ${dm?'bg-[#151c14] border-[#232e21] text-white':'bg-white border-slate-200 text-slate-900'}">
                            <button onclick="appState.showFavoritesOnly=!appState.showFavoritesOnly; render();" class="px-3.5 py-2.5 rounded-full border text-xs font-black ${appState.showFavoritesOnly?'bg-lime-600 text-white border-lime-600':'bg-white text-slate-700 border-slate-200'}">المفضلة</button>
                        </div>
                        <div class="flex gap-2 overflow-x-auto hide-scrollbar py-1">
                            ${categories.map(c => `<button onclick="appState.selectedCategory='${c}'; appState.showFavoritesOnly=false; render();" class="px-4 py-2 rounded-full text-xs font-black whitespace-nowrap ${appState.selectedCategory===c && !appState.showFavoritesOnly?'bg-lime-600 text-white':'bg-white text-slate-700 border border-slate-200'}">${c==='all'?'الكل':c}</button>`).join('')}
                        </div>
                    </div>

                    <div class="max-w-xl mx-auto px-4 pt-4">
                        <div class="grid grid-cols-2 gap-3">
                            ${filtered.map(prod => {
                                const isFav = appState.favorites.includes(prod.id);
                                return `
                                    <div onclick="const f=appState.cart.find(x=>x.id===prod.id); if(f) f.qty++; else appState.cart.push({...prod, qty:1}); render();" class="p-3 rounded-3xl border ${cardStyle} flex flex-col justify-between cursor-pointer active:scale-95 transition relative">
                                        <button onclick="toggleFavorite('${prod.id}', event)" class="absolute top-3 right-3 z-10 w-7 h-7 rounded-full border flex items-center justify-center text-xs ${isFav?'text-red-500':'text-slate-400'}"><i class="${isFav?'fa-solid':'fa-regular'} fa-heart"></i></button>
                                        <div class="h-28 rounded-2xl bg-lime-50 flex items-center justify-center overflow-hidden mb-2">${prod.image ? `<img src="${prod.image}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-utensils text-lime-600/30 text-2xl"></i>`}</div>
                                        <div><h3 class="font-black text-xs line-clamp-1">${prod.name}</h3><span class="font-black text-xs text-lime-600">${prod.price} ج.م</span></div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    ${cartCount > 0 ? `
                        <div class="fixed bottom-3 left-3 right-3 max-w-xl mx-auto z-40">
                            <button onclick="appState.checkoutStep='cart'; render();" class="w-full bg-lime-600 text-white py-3.5 px-5 rounded-full shadow-xl flex justify-between font-black text-xs">
                                <span>عرض السلة (${cartCount})</span>
                                <span>${subtotal} ج.م</span>
                            </button>
                        </div>
                    ` : ''}

                    <!-- القائمة الجانبية للزبون -->
                    ${appState.menuDrawerOpen ? `
                        <div onclick="appState.menuDrawerOpen=false; render();" class="fixed inset-0 z-50 bg-black/50 flex items-end justify-center">
                            <div onclick="event.stopPropagation()" class="w-full max-w-xl rounded-t-3xl p-5 space-y-3 text-xs font-bold ${dm?'bg-[#151c14] text-white':'bg-white text-slate-900'}">
                                <div class="flex justify-between items-center"><h2 class="font-black text-base">القائمة</h2><button onclick="appState.menuDrawerOpen=false; render();">✕</button></div>
                                <button onclick="appState.darkMode=!appState.darkMode; render();" class="w-full p-3 rounded-2xl border text-right">تغيير المظهر (ليلي / نهاري)</button>
                                <a href="https://wa.me/20${shop.phone.replace(/^0/, '')}" target="_blank" class="w-full p-3 rounded-2xl bg-emerald-50 text-emerald-700 block text-center">تواصل عبر واتساب</a>
                            </div>
                        </div>
                    ` : ''}

                    <!-- سلة المشتريات للزبون -->
                    ${appState.checkoutStep === 'cart' ? `
                        <div class="fixed inset-0 z-50 bg-black/50 flex items-end justify-center">
                            <div class="w-full max-w-xl rounded-t-3xl p-5 space-y-4 text-xs ${dm?'bg-[#151c14] text-white':'bg-white text-slate-900'}">
                                <div class="flex justify-between items-center border-b pb-2"><h2 class="font-black text-base">السلة</h2><button onclick="appState.checkoutStep='browse'; render();">✕</button></div>
                                <div class="space-y-2">${appState.cart.map((i, idx)=>`<div class="flex justify-between items-center border-b pb-2"><span>${i.qty}x ${i.name}</span><span class="text-lime-600 font-black">${i.price*i.qty} ج.م</span></div>`).join('')}</div>
                                <div class="flex justify-between font-black text-sm pt-2"><span>الإجمالي</span><span>${subtotal} ج.م</span></div>
                                <button onclick="const name=prompt('ادخل اسمك الكريم:'); const phone=prompt('ادخل رقم الموبايل:'); if(name && phone){ shop.orders.unshift({id:Math.floor(1000+Math.random()*9000), customer_name:name, phone, address:'توصيل للمنيو', items:JSON.parse(JSON.stringify(appState.cart)), total:${subtotal}, status:'new', time:new Date().toLocaleTimeString('ar-EG')}); appState.cart=[]; appState.checkoutStep='browse'; syncCloud(); alert('✓ تم إرسال طلبك بنجاح!'); render(); }" class="w-full bg-lime-600 text-white font-black py-3 rounded-full">تأكيد الطلب الآن ➔</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
