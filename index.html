<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablia OS 2030 | المنصة السحابية المتكاملة للمطاعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #030712; color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="antialiased min-h-screen pb-24 selection:bg-amber-500 selection:text-slate-950">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        // ================= 1. إعدادات السحاب (Firebase Cloud) =================
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };

        let cloudDB = null;
        try {
            firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) { console.error("Cloud error:", e); }

        // بيانات حسابك لاستقبال الاشتراكات (عدّلها لبياناتك)
        const PLATFORM_OWNER = {
            walletNumber: '01015861991',
            monthlyPrice: 300,
            adminPass: '2030' // الرقم السري لتفعيل الاشتراكات في لوحة الإدارة
        };

        const MASTER_SCHEMA = {
            restaurant: {
                name: 'Ember & Grill House',
                slug: 'ember-grill',
                phone: '201015861991',
                logo: '🔥',
                template_id: 'foodera-modern',
                layout: 'foodera', 
                theme: { primary: '#ea580c', bg: '#030712' },
                tablesCount: 20,
                pin: '1234',
                subscription: {
                    isActive: false, // يبدأ غير مفعل لحين تحويل الـ 300 جنيه
                    expiresAt: null
                }
            },
            categories: [
                { id: 'cat_1', name: 'البرجر والمشويات', icon: '🍔' },
                { id: 'cat_2', name: 'البيتزا الإيطالية', icon: '🍕' },
                { id: 'cat_3', name: 'المقبلات والمشروبات', icon: '🥤' }
            ],
            menu_items: [
                { id: 'itm_1', category_id: 'cat_1', name: 'Classic Ember Burger', description: '100% real beef, grilled to perfection with cheddar cheese', price: 299, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=60', is_available: true, tags: ['BESTSELLER'] },
                { id: 'itm_2', category_id: 'cat_1', name: 'Smoky BBQ Burger', description: 'Double beef patty with smoky BBQ sauce and crispy onion', price: 349, image: 'https://images.unsplash.com/photo-1550547660-d9450f859349?w=500&q=60', is_available: true, tags: ['HOT DEAL'] },
                { id: 'itm_3', category_id: 'cat_2', name: 'Pepperoni Supreme Pizza', description: 'Loaded with premium pepperoni and extra mozzarella', price: 399, image: 'https://images.unsplash.com/photo-1628840042765-356cda07504e?w=500&q=60', is_available: true, tags: ['NEW'] },
                { id: 'itm_4', category_id: 'cat_3', name: 'Crispy French Fries', description: 'Golden crispy potato sticks with special seasoning', price: 99, image: 'https://images.unsplash.com/photo-1576107232684-1279f3908591?w=500&q=60', is_available: true, tags: [] }
            ],
            orders: []
        };

        const TEMPLATES_CATALOG = [
            { id: 'foodera-modern', name: 'Foodera Modern App', layout: 'foodera', desc: 'تصميم برجر وعصري ببانر تسويقي وبطاقات شبكية فخمة', preview: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=60' },
            { id: 'pizza-deli', name: 'Pizza Deli Style', layout: 'pizza', desc: 'تصميم بيتزا فخم ببانر علوي أحمر وبطاقات عريضة', preview: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&q=60' },
            { id: 'dark-grill', name: 'Dark Grill VIP', layout: 'dark_grill', desc: 'تصميم ليلي فاخر للستيك والبرجر بالأسود والذهبي', preview: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=500&q=60' },
            { id: 'verde-table', name: 'Verde Organic', layout: 'verde', desc: 'تصميم عضوي وطبيعي مستوحى من المزارع', preview: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500&q=60' },
            { id: 'boardroom-bites', name: 'Boardroom Catering', layout: 'boardroom', desc: 'تصميم مؤسسي لضيافة الشركات وباقات الاجتماعات', preview: 'https://images.unsplash.com/photo-1555244162-803834f70033?w=500&q=60' },
            { id: 'ember-wok', name: 'Ember Wok Kitchen', layout: 'wok', desc: 'تصميم آسيوي حيوي وساخن للمشويات الآسيوية', preview: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500&q=60' },
            { id: 'modern-japanese', name: 'Japanese Zen Fine Dining', layout: 'japanese', desc: 'تصميم ياباني مينيمال راقٍ وهادئ', preview: 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500&q=60' }
        ];

        let store = JSON.parse(localStorage.getItem('tablia_master_2030_v4')) || MASTER_SCHEMA;
        if (!store.restaurant.subscription) {
            store.restaurant.subscription = { isActive: false, expiresAt: null };
        }

        function checkSubscriptionValid() {
            const sub = store.restaurant.subscription;
            if (!sub || !sub.isActive) return false;
            if (sub.expiresAt && new Date().getTime() > sub.expiresAt) {
                return false;
            }
            return true;
        }

        function syncCloud() {
            localStorage.setItem('tablia_master_2030_v4', JSON.stringify(store));
            if (cloudDB) cloudDB.ref('tablia_master_enterprise_2030_v4').set(store);
        }

        if (cloudDB) {
            cloudDB.ref('tablia_master_enterprise_2030_v4').on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    if (data.orders && store.orders && data.orders.length > store.orders.length) {
                        playBell();
                    }
                    store = data;
                    if (!store.orders) store.orders = [];
                    if (!store.restaurant.subscription) store.restaurant.subscription = { isActive: false, expiresAt: null };
                    render();
                } else {
                    syncCloud();
                }
            });
        }

        function playBell() {
            const audio = document.getElementById('cloud-bell');
            if (audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
            if ('vibrate' in navigator) navigator.vibrate([400, 200, 400]);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isCustomerMode = urlParams.get('view') === 'menu';

        const appState = {
            page: isCustomerMode ? 'storefront' : 'landing',
            builderStep: 1,
            activeCat: 'all',
            search: '',
            cart: [],
            cartOpen: false,
            tableNumber: urlParams.get('t') || null,
            orderType: urlParams.get('t') ? 'table' : 'delivery',
            gpsCoords: null,
            gpsStatus: '',
            activeOrderId: localStorage.getItem('tablia_active_order_id') || null,
            trackerOpen: false,
            driverRating: 0,
            ratingSubmitted: false,
            cashierUnlocked: false
        };

        function setPage(p) {
            appState.page = p;
            render();
            window.scrollTo(0, 0);
        }

        function render() {
            const root = document.getElementById('app');
            let content = '';
            if (appState.page === 'builder') content = renderBuilder();
            else if (appState.page === 'storefront') content = renderStorefront();
            else if (appState.page === 'cashier') content = renderCashier();
            else if (appState.page === 'dashboard') content = renderDashboard();
            else if (appState.page === 'qr_print') content = renderQRPrint();
            else content = renderLanding();

            const bottomBar = isCustomerMode ? '' : renderBottomNav();
            root.innerHTML = content + bottomBar;
        }

        function renderNav() {
            return `
                <nav class="sticky top-0 z-50 glass border-b border-white/10 px-4 py-3">
                    <div class="max-w-4xl mx-auto flex items-center justify-between">
                        <div class="flex items-center gap-2.5 cursor-pointer" onclick="${isCustomerMode ? '' : "setPage('landing')"}">
                            <div class="w-9 h-9 rounded-xl gold-gradient text-slate-950 flex items-center justify-center font-black text-lg shadow-md">ط</div>
                            <div>
                                <span class="font-black text-base tracking-tight text-white">Tablia <span class="text-amber-400">2030</span></span>
                                <span class="block text-[9px] text-slate-400 -mt-1">${isCustomerMode ? store.restaurant.name : 'المنصة السحابية الذكية'}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            ${appState.activeOrderId ? `
                                <button onclick="appState.trackerOpen=true; render();" class="bg-amber-500/20 border border-amber-500/40 text-amber-400 px-3 py-1.5 rounded-xl text-[11px] font-black flex items-center gap-1.5 animate-pulse">
                                    <i class="fa-solid fa-satellite-dish"></i> تتبع طلبي
                                </button>
                            ` : `
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span class="text-[11px] text-emerald-400 font-bold">متصل سحابياً</span>
                            `}
                        </div>
                    </div>
                </nav>
            `;
        }

        function renderBottomNav() {
            return `
                <div class="fixed bottom-0 left-0 right-0 z-50 glass border-t border-white/10 px-2 py-2 bg-slate-950/95 backdrop-blur-lg">
                    <div class="max-w-md mx-auto grid grid-cols-5 gap-1 text-center">
                        <button onclick="setPage('landing')" class="flex flex-col items-center justify-center py-1 rounded-xl transition ${appState.page==='landing'?'text-amber-400 font-black':'text-slate-400 hover:text-white'}">
                            <i class="fa-solid fa-house text-sm mb-0.5"></i>
                            <span class="text-[10px]">الرئيسية</span>
                        </button>
                        <button onclick="setPage('builder')" class="flex flex-col items-center justify-center py-1 rounded-xl transition ${appState.page==='builder'?'text-amber-400 font-black':'text-slate-400 hover:text-white'}">
                            <i class="fa-solid fa-wand-magic-sparkles text-sm mb-0.5"></i>
                            <span class="text-[10px]">المنشئ</span>
                        </button>
                        <button onclick="setPage('storefront')" class="flex flex-col items-center justify-center py-1 rounded-xl transition ${appState.page==='storefront'?'text-amber-400 font-black':'text-slate-400 hover:text-white'}">
                            <i class="fa-solid fa-utensils text-sm mb-0.5"></i>
                            <span class="text-[10px]">المنيو</span>
                        </button>
                        <button onclick="setPage('cashier')" class="flex flex-col items-center justify-center py-1 rounded-xl transition ${appState.page==='cashier'?'text-red-400 font-black':'text-slate-400 hover:text-white'}">
                            <i class="fa-solid fa-cash-register text-sm mb-0.5"></i>
                            <span class="text-[10px]">الكاشير</span>
                        </button>
                        <button onclick="setPage('dashboard')" class="flex flex-col items-center justify-center py-1 rounded-xl transition ${appState.page==='dashboard'?'text-amber-400 font-black':'text-slate-400 hover:text-white'}">
                            <i class="fa-solid fa-chart-line text-sm mb-0.5"></i>
                            <span class="text-[10px]">الإدارة</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLanding() {
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-12 text-center space-y-6">
                    <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-3.5 py-1.5 rounded-full text-amber-400 text-xs font-bold">
                        <i class="fa-solid fa-rocket"></i> الجيل الجديد لإدارة المطاعم 2030
                    </div>
                    <h1 class="text-3xl md:text-5xl font-black text-white leading-tight">
                        صمّم منيو مطعمك مجاناً وانشره بـ <span class="text-amber-500">300 جنيه/شهرياً</span>
                    </h1>
                    <p class="text-slate-400 text-xs md:text-sm max-w-lg mx-auto leading-relaxed">
                        اختر القالب، أضف أصنافك بالذكاء الاصطناعي، عاين التصميم حياً، وانطلق فوراً بدون أي عمولات على مبيعاتك.
                    </p>
                    <div class="flex flex-col sm:flex-row justify-center gap-3 pt-2">
                        <button onclick="setPage('builder')" class="gold-gradient text-slate-950 font-black px-7 py-3.5 rounded-2xl text-xs shadow-xl transition">
                            🛠️ صمم منيو مطعمك الآن
                        </button>
                        <button onclick="setPage('cashier')" class="bg-red-600 hover:bg-red-500 text-white font-black px-7 py-3.5 rounded-2xl text-xs shadow-xl transition">
                            🖥️ فتح شاشة الكاشير والمطبخ
                        </button>
                    </div>
                </div>
            `;
        }

        function renderBuilder() {
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-5">
                    <div class="flex gap-1 bg-slate-900 p-1 rounded-xl border border-white/10 text-[11px] overflow-x-auto">
                        <button onclick="appState.builderStep=1; render();" class="flex-1 py-2 px-2 rounded-lg font-bold whitespace-nowrap ${appState.builderStep===1?'bg-amber-500 text-slate-950':'text-slate-400'}">1. القوالب والتصميم</button>
                        <button onclick="appState.builderStep=2; render();" class="flex-1 py-2 px-2 rounded-lg font-bold whitespace-nowrap ${appState.builderStep===2?'bg-amber-500 text-slate-950':'text-slate-400'}">2. المنيو السحري</button>
                        <button onclick="appState.builderStep=3; render();" class="flex-1 py-2 px-2 rounded-lg font-bold whitespace-nowrap ${appState.builderStep===3?'bg-amber-500 text-slate-950':'text-slate-400'}">3. 📱 المعاينة الحية</button>
                        <button onclick="appState.builderStep=4; render();" class="flex-1 py-2 px-2 rounded-lg font-bold whitespace-nowrap ${appState.builderStep===4?'bg-amber-500 text-slate-950':'text-slate-400'}">4. النشر والاشتراك</button>
                    </div>

                    ${appState.builderStep === 1 ? renderStep1() : ''}
                    ${appState.builderStep === 2 ? renderStep2() : ''}
                    ${appState.builderStep === 3 ? renderStep3Preview() : ''}
                    ${appState.builderStep === 4 ? renderStep4() : ''}
                </div>
            `;
        }

        function renderStep1() {
            return `
                <div class="glass p-5 rounded-2xl border border-white/10 space-y-4 text-xs">
                    <h2 class="text-xs font-black text-white">الخطوة 1: بيانات المطعم واختيار القالب</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-400 font-bold mb-1">اسم المطعم</label>
                            <input type="text" id="r_name" value="${store.restaurant.name}" class="w-full bg-slate-950 border border-white/10 p-2.5 rounded-xl text-white font-bold text-xs outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 font-bold mb-1">رقم واتساب استقبال الطلبات</label>
                            <input type="text" id="r_phone" value="${store.restaurant.phone}" class="w-full bg-slate-950 border border-white/10 p-2.5 rounded-xl text-white font-bold text-xs outline-none" dir="ltr">
                        </div>
                    </div>
                    <div class="space-y-2 pt-1">
                        <label class="block text-slate-400 font-bold">اختر القالب:</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                            ${TEMPLATES_CATALOG.map(t => `
                                <div onclick="store.restaurant.template_id='${t.id}'; store.restaurant.layout='${t.layout}'; syncCloud(); render();" class="cursor-pointer border-2 rounded-xl overflow-hidden p-2 transition ${store.restaurant.template_id===t.id?'border-amber-500 bg-amber-500/10':'border-white/10 bg-slate-950'}">
                                    <img src="${t.preview}" class="w-full h-20 object-cover rounded-lg mb-1.5">
                                    <h4 class="font-black text-white text-[11px]">${t.name}</h4>
                                    <p class="text-[9px] text-slate-400 mt-0.5 line-clamp-1">${t.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <button onclick="saveStep1();" class="gold-gradient text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs">حفظ والانتقال للمنيو ➔</button>
                </div>
            `;
        }

        function saveStep1() {
            store.restaurant.name = document.getElementById('r_name').value.trim();
            store.restaurant.phone = document.getElementById('r_phone').value.trim();
            syncCloud();
            appState.builderStep = 2;
            render();
        }

        function renderStep2() {
            return `
                <div class="glass p-5 rounded-2xl border border-white/10 space-y-4 text-xs">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xs font-black text-white">الخطوة 2: الصندوق السحري للأصناف</h2>
                        <span class="text-amber-400 font-bold">${store.menu_items.length} صنف</span>
                    </div>

                    <div class="bg-gradient-to-r from-amber-500/10 to-orange-500/10 border border-amber-500/30 p-3.5 rounded-xl space-y-2">
                        <h3 class="font-black text-amber-400 text-xs">🪄 الصندوق السحري للنصوص</h3>
                        <textarea id="magic_box" rows="2" placeholder="الصق المنيو هنا (مثال: برجر دجاج 150، بيتزا مارجريتا 180)..." class="w-full bg-slate-950 border border-white/10 p-2.5 rounded-lg text-white text-xs outline-none"></textarea>
                        <button onclick="parseMagicText()" class="w-full gold-gradient text-slate-950 font-black py-2 rounded-lg text-xs">توليد الأصناف تلقائياً</button>
                    </div>

                    <div class="space-y-1.5">
                        <h3 class="font-bold text-slate-300">الأصناف الحالية:</h3>
                        ${store.menu_items.map((item, idx) => `
                            <div class="bg-slate-950 p-2 rounded-xl flex justify-between items-center border border-white/5">
                                <span class="font-bold text-white text-xs">${item.name} - <span class="text-amber-400">${item.price}ج</span></span>
                                <button onclick="store.menu_items.splice(${idx},1); syncCloud(); render();" class="text-red-400 px-2 py-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex justify-between pt-2">
                        <button onclick="appState.builderStep=1; render();" class="bg-slate-800 px-4 py-2 rounded-xl">السابق</button>
                        <button onclick="appState.builderStep=3; render();" class="gold-gradient text-slate-950 font-black px-4 py-2 rounded-xl">التالي: معاينة المنيو ➔</button>
                    </div>
                </div>
            `;
        }

        function parseMagicText() {
            const text = document.getElementById('magic_box').value.trim();
            if (!text) { alert('⚠️ يرجى لصق النص أولاً!'); return; }
            const lines = text.split(/,|\n/);
            let added = 0;
            lines.forEach(line => {
                if (!line.trim()) return;
                const matchPrice = line.match(/\d+/);
                if (matchPrice) {
                    const price = Number(matchPrice[0]);
                    const name = line.replace(matchPrice[0], '').replace(/جنيه|جـ|ج/g, '').trim();
                    if (name) {
                        store.menu_items.push({
                            id: 'itm_' + Date.now() + Math.random().toString(36).substr(2,3),
                            category_id: store.categories[0].id,
                            name: name,
                            description: 'طازج ومعد خصيصاً لك',
                            price: price,
                            image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=60',
                            is_available: true,
                            tags: ['HOT']
                        });
                        added++;
                    }
                }
            });
            if (added > 0) {
                syncCloud();
                document.getElementById('magic_box').value = '';
                render();
                alert(`✅ تم توليد ${added} صنف بنجاح!`);
            } else {
                alert('⚠️ تأكد من كتابة السعر بجانب اسم الوجبة.');
            }
        }

        function renderStep3Preview() {
            const th = store.restaurant.theme;
            const layout = store.restaurant.layout;
            const items = store.menu_items;

            return `
                <div class="glass p-5 rounded-3xl border border-white/10 space-y-4 text-xs">
                    <div class="flex justify-between items-center border-b border-white/10 pb-2">
                        <div>
                            <h2 class="text-sm font-black text-amber-400">📱 المعاينة الحية للمنيو (Live Preview)</h2>
                            <p class="text-[10px] text-slate-400">هكذا سيظهر القالب المختار (${layout}) لعملائك</p>
                        </div>
                        <button onclick="appState.builderStep=4; render();" class="gold-gradient text-slate-950 font-black px-4 py-2 rounded-xl text-xs">التالي: النشر ➔</button>
                    </div>

                    <div class="bg-slate-950 p-4 rounded-3xl border-4 border-slate-800 max-w-sm mx-auto space-y-4 shadow-2xl overflow-hidden">
                        <div class="flex items-center justify-between border-b border-white/10 pb-2">
                            <span class="font-black text-white text-xs">${store.restaurant.name}</span>
                            <span class="text-[9px] text-emerald-400 font-bold">● المعاينة الحية</span>
                        </div>

                                <button onclick="detectUserGPS()" class="w-full py-2.5 px-3 rounded-xl border border-sky-500/40 bg-sky-500/10 text-sky-400 font-black flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-location-crosshairs"></i>
                                    ${appState.gpsCoords ? '✅ تم التقاط موقعك بدقة' : '📍 تحديد موقعي الحالي بالـ GPS'}
                                </button>
                                ${appState.gpsStatus ? `<p class="text-[10px] text-center text-emerald-400 font-bold">${appState.gpsStatus}</p>` : ''}
                                <input type="text" id="cust_address" placeholder="تفاصيل العنوان (الشارع، العمارة، الدور)..." class="w-full bg-slate-950 border border-white/10 p-2.5 rounded-xl text-white text-xs outline-none">
                            </div>
                        ` : `
                            <input type="number" id="cust_table" value="${appState.tableNumber || ''}" placeholder="رقم الطاولة *" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white font-bold text-xs outline-none">
                        `}

                        <div class="flex justify-between items-center pt-2 border-t border-white/10 font-black">
                            <span class="text-slate-400">الإجمالي:</span>
                            <span class="text-amber-400 text-sm">${cartTotal} ج.م</span>
                        </div>

                        <button onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl text-xs shadow-lg">
                            تأكيد وإرسال الطلب للكاشير 🚀
                        </button>
                    </div>
                </div>
            `;
        }

        function detectUserGPS() {
            if (!navigator.geolocation) { alert('الـ GPS غير متاح في متصفحك'); return; }
            appState.gpsStatus = 'جاري التقاط الإحداثيات...';
            render();
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    appState.gpsCoords = { lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6) };
                    appState.gpsStatus = `تم بنجاح (${appState.gpsCoords.lat}, ${appState.gpsCoords.lng})`;
                    render();
                },
                () => { appState.gpsStatus = '⚠️ تعذر تحديد الموقع، اكتب العنوان يدوياً'; render(); },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        function addToCart(id) {
            const item = store.menu_items.find(i => i.id === id);
            const found = appState.cart.find(c => c.id === id);
            if (found) found.qty++;
            else appState.cart.push({ ...item, qty: 1 });
            render();
        }

        function submitOrder() {
            const name = document.getElementById('cust_name').value.trim();
            const phone = document.getElementById('cust_phone').value.trim();
            if (!name || !phone) { alert('أدخل الاسم ورقم الهاتف!'); return; }

            let address = appState.orderType === 'delivery' ? (document.getElementById('cust_address')?.value.trim() || 'موقع محدد عبر GPS') : '';
            let tableNum = appState.orderType === 'table' ? (document.getElementById('cust_table')?.value.trim() || 'صالة') : null;

            const total = appState.cart.reduce((s,i)=>s+(i.price*i.qty),0);
            const orderId = 'ORD-' + Math.floor(1000 + Math.random()*9000);
            const newOrd = {
                id: orderId,
                order_type: appState.orderType,
                table_number: tableNum,
                customer_name: name,
                phone: phone,
                address: address,
                gps: appState.gpsCoords,
                items_json: JSON.parse(JSON.stringify(appState.cart)),
                total: total,
                status: 'new',
                created_at: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})
            };

            if (!store.orders) store.orders = [];
            store.orders.unshift(newOrd);
            syncCloud();

            appState.activeOrderId = orderId;
            localStorage.setItem('tablia_active_order_id', orderId);
            appState.cart = [];
            appState.cartOpen = false;
            appState.trackerOpen = true;
            render();
        }

        function renderLiveOrderTracker() {
            const ord = (store.orders || []).find(o => o.id === appState.activeOrderId);
            if (!ord) { appState.trackerOpen = false; return ''; }

            const steps = [
                { key: 'new', label: 'تم استلام طلبك بنجاح', icon: 'fa-receipt', desc: 'وصل طلبك للكاشير وسيبدأ التحضير' },
                { key: 'preparing', label: 'جاري التحضير بالمطبخ', icon: 'fa-fire-burner', desc: 'الشيف يجهز وجبتك الطازجة الآن' },
                { key: 'ready', label: 'جاهز / في الطريق إليك', icon: 'fa-motorcycle', desc: 'السائق في الطريق لعنوانك' },
                { key: 'done', label: 'تم التسليم بنجاح (بالهناء والشفاء)', icon: 'fa-circle-check', desc: 'شكراً لاختيارك مطعمنا!' }
            ];

            const currentIdx = steps.findIndex(s => s.key === ord.status);
            const isFinished = ord.status === 'done';

            return `
                <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 text-xs">
                    <div class="glass p-6 rounded-3xl max-w-sm w-full space-y-4 border border-amber-500/30 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-white/10 pb-3">
                            <div>
                                <span class="text-[10px] text-amber-400 font-bold">تتبع الطلب الفوري ⚡</span>
                                <h3 class="font-black text-base text-white">طلب رقم #${ord.id}</h3>
                            </div>
                            <button onclick="appState.trackerOpen=false; render();" class="w-8 h-8 rounded-full bg-white/10 text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <div class="space-y-4 py-1">
                            ${steps.map((st, idx) => {
                                const isCompleted = idx <= currentIdx;
                                const isCurrent = idx === currentIdx;
                                return `
                                    <div class="flex items-start gap-3 ${isCompleted ? 'opacity-100' : 'opacity-35'}">
                                        <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${isCurrent ? 'bg-amber-500 text-slate-950 animate-bounce' : (isCompleted ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400')}">
                                            <i class="fa-solid ${st.icon}"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-black text-xs ${isCurrent ? 'text-amber-400' : 'text-white'}">${st.label}</h4>
                                            <p class="text-[10px] text-slate-400">${st.desc}</p>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        ${isFinished ? `
                            <div class="bg-amber-500/10 border border-amber-500/30 p-3.5 rounded-2xl text-center space-y-2">
                                <h4 class="font-black text-amber-400 text-xs">كيف كانت تجربة التوصيل وسرعة السائق؟</h4>
                                ${appState.ratingSubmitted ? `
                                    <p class="text-emerald-400 font-bold text-xs">⭐ شكراً لك! تم إرسال تقييمك بنجاح.</p>
                                ` : `
                                    <div class="flex justify-center gap-2 text-lg text-amber-400 cursor-pointer">
                                        ${[1,2,3,4,5].map(star => `
                                            <i class="fa-${appState.driverRating >= star ? 'solid' : 'regular'} fa-star" onclick="appState.driverRating=${star}; render();"></i>
                                        `).join('')}
                                    </div>
                                    ${appState.driverRating > 0 ? `
                                        <button onclick="appState.ratingSubmitted=true; render();" class="gold-gradient text-slate-950 font-black px-4 py-1.5 rounded-xl text-xs mt-1">إرسال التقييم</button>
                                    ` : ''}
                                `}
                            </div>
                        ` : ''}

                        <div class="bg-slate-950 p-3 rounded-2xl border border-white/10 flex justify-between items-center">
                            <span class="text-slate-400">إجمالي الفاتورة:</span>
                            <span class="font-black text-emerald-400 text-sm">${ord.total} ج.م</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCashier() {
            if (!appState.cashierUnlocked) {
                return `
                    ${renderNav()}
                    <div class="min-h-[70vh] flex items-center justify-center p-4">
                        <div class="glass p-5 rounded-2xl max-w-xs w-full text-center space-y-3 border border-white/10 shadow-xl text-xs">
                            <h2 class="font-black text-amber-400">شاشة الكاشير السحابية</h2>
                            <p class="text-[10px] text-slate-400">أدخل رمز PIN (الافتراضي: 1234)</p>
                            <input type="password" id="c_pin" placeholder="••••" class="w-full bg-slate-950 border border-white/10 p-2.5 rounded-xl text-center text-white font-black text-base outline-none">
                            <button onclick="if(document.getElementById('c_pin').value==='1234'){appState.cashierUnlocked=true;render();}else{alert('رمز غير صحيح');}" class="w-full gold-gradient text-slate-950 font-black py-2 rounded-xl">دخول</button>
                        </div>
                    </div>
                `;
            }

            const orders = store.orders || [];
            return `
                ${renderNav()}
                <div class="max-w-4xl mx-auto px-4 py-4 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-white/10">
                        <h1 class="font-black text-white">🖥️ شاشة الكاشير والمطبخ الحية</h1>
                        <button onclick="appState.cashierUnlocked=false; render();" class="text-red-400 glass px-2.5 py-1 rounded">قفل</button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${orders.length === 0 ? `<div class="col-span-2 glass p-10 rounded-2xl text-center text-slate-400">لا توجد طلبات نشطة حالياً.</div>` : ''}
                        ${orders.map((ord, idx) => `
                            <div class="glass p-4 rounded-2xl space-y-2.5 border ${ord.status==='new'?'border-amber-500 shadow-lg':'border-white/10'}">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <span class="${ord.order_type==='delivery'?'bg-sky-500':'bg-amber-500'} text-slate-950 font-black text-[10px] px-2 py-0.5 rounded-full">
                                            ${ord.order_type==='delivery' ? '🛵 دليفري' : '🍽️ طاولة ' + (ord.table_number || '')}
                                        </span>
                                        <h3 class="font-black text-xs text-white mt-1.5">${ord.customer_name} • ${ord.phone}</h3>
                                        ${ord.address ? `<p class="text-[10px] text-slate-400 mt-0.5">📍 ${ord.address}</p>` : ''}
                                    </div>
                                    <span class="font-black text-amber-400 text-xs">${ord.total} ج.م</span>
                                </div>

                                ${ord.gps ? `
                                    <a href="https://www.google.com/maps?q=${ord.gps.lat},${ord.gps.lng}" target="_blank" class="block w-full text-center py-1.5 rounded-lg bg-sky-500/20 border border-sky-500/40 text-sky-400 font-bold text-[10px]">
                                        🗺️ فتح موقع الزبون الدقيق على الخريطة (GPS)
                                    </a>
                                ` : ''}

                                <div class="bg-slate-950 p-2.5 rounded-xl space-y-1 text-[11px]">
                                    ${ord.items_json.map(i => `<div class="flex justify-between text-slate-300"><span>• ${i.qty}x ${i.name}</span><span class="text-amber-400">${i.price*i.qty}ج</span></div>`).join('')}
                                </div>

                                <div class="grid grid-cols-3 gap-1 pt-1 border-t border-white/10 text-[10px]">
                                    <button onclick="store.orders[${idx}].status='preparing'; syncCloud(); render();" class="py-1.5 rounded bg-sky-600 text-white font-bold">يحضر 👨‍🍳</button>
                                    <button onclick="store.orders[${idx}].status='ready'; syncCloud(); render();" class="py-1.5 rounded bg-emerald-600 text-white font-bold">جاهز 🛵</button>
                                    <button onclick="store.orders[${idx}].status='done'; syncCloud(); render();" class="py-1.5 rounded bg-indigo-600 text-white font-bold">تم ✨</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // ================= 8. الإدارة وتفعيل اشتراك الـ 300 جنيه =================
        function renderDashboard() {
            const isSub = checkSubscriptionValid();
            const expDate = store.restaurant.subscription.expiresAt ? new Date(store.restaurant.subscription.expiresAt).toLocaleDateString('ar-EG') : 'غير مفعل';

            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-white/10">
                        <h1 class="font-black text-white">لوحة الإدارة والإحصائيات</h1>
                        <button onclick="setPage('qr_print')" class="gold-gradient text-slate-950 font-black px-3.5 py-2 rounded-xl">طباعة QR الطاولات</button>
                    </div>

                    <div class="grid grid-cols-3 gap-2.5">
                        <div class="glass p-3.5 rounded-xl border border-white/10 text-center"><div class="text-[10px] text-slate-400">الطلبات</div><div class="text-xl font-black text-amber-400 mt-0.5">${store.orders.length}</div></div>
                        <div class="glass p-4 rounded-xl border border-white/10 text-center"><div class="text-[10px] text-slate-400">المبيعات</div><div class="text-xl font-black text-emerald-400 mt-0.5">${store.orders.reduce((s,o)=>s+o.total,0)} ج</div></div>
                        <div class="glass p-4 rounded-xl border border-white/10 text-center"><div class="text-[10px] text-slate-400">حالة الاشتراك</div><div class="text-sm font-black ${isSub?'text-emerald-400':'text-red-400'} mt-1">${isSub?'نشط ✅':'متوقف ⏸️'}</div></div>
                    </div>

                    <!-- لوحة تحكم مالك المنصة لتفعيل الاشتراك الشهري بعد استلام الـ 300 جنيه -->
                    <div class="glass p-4 rounded-2xl border border-amber-500/30 space-y-3">
                        <div class="flex justify-between items-center border-b border-white/10 pb-2">
                            <h3 class="font-black text-amber-400">🔐 تحكم مالك المنصة (تفعيل اشتراك 300 ج/شهر)</h3>
                            <span class="text-[10px] text-slate-400">ينتهي في: ${expDate}</span>
                        </div>
                        <p class="text-[11px] text-slate-400">بعد استلام الـ 300 جنيه من صاحب المطعم، اضغط لتفعيل المنيو لمدة 30 يوماً:</p>
                        <div class="flex gap-2">
                            <button onclick="toggleRestaurantSub(true)" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 rounded-xl">✅ تفعيل 30 يوم (300 ج)</button>
                            <button onclick="toggleRestaurantSub(false)" class="bg-red-600/20 border border-red-500/40 text-red-400 font-bold px-4 py-2.5 rounded-xl">إيقاف</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleRestaurantSub(activate) {
            const pass = prompt('أدخل رمز الإدارة السري (Admin PIN) لتعديل حالة الاشتراك:');
            if (pass !== PLATFORM_OWNER.adminPass) {
                alert('❌ رمز الإدارة غير صحيح!');
                return;
            }
            if (activate) {
                const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
                store.restaurant.subscription = {
                    isActive: true,
                    expiresAt: new Date().getTime() + thirtyDaysMs
                };
                alert('✅ تم تفعيل اشتراك المطعم بنجاح لمدة 30 يوماً!');
            } else {
                store.restaurant.subscription = {
                    isActive: false,
                    expiresAt: null
                };
                alert('⏸️ تم إيقاف اشتراك المطعم.');
            }
            syncCloud();
            render();
        }

        function renderQRPrint() {
            const menuUrl = window.location.origin + window.location.pathname + '?view=menu&t=';
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-white/10">
                        <h1 class="font-black text-white">طباعة كودات الطاولات</h1>
                        <button onclick="window.print()" class="gold-gradient text-slate-950 font-black px-3.5 py-2 rounded-xl">اطبع الآن</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                        ${Array.from({length: store.restaurant.tablesCount}, (_, i) => i + 1).map(num => `
                            <div class="bg-white text-slate-950 p-2.5 rounded-xl text-center space-y-1 shadow">
                                <div class="font-black text-[11px]">طاولة ${num}</div>
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(menuUrl+num)}" class="w-20 h-20 mx-auto">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
