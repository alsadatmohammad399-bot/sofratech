<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablia OS 2030 | النظام الذكي لإدارة المطاعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #07090e; color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gold-gradient { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
    </style>
</head>
<body class="antialiased min-h-screen pb-28 selection:bg-amber-500 selection:text-slate-950">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        const PLATFORM_OWNER = { walletNumber: '01015861991', monthlyPrice: 600, adminPass: '2030' };

        let globalDB = { restaurants: {} };
        try {
            const raw = localStorage.getItem('tablia_multitenant_2030_v19');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        if (!globalDB || !globalDB.restaurants || typeof globalDB.restaurants !== 'object') {
            globalDB = {
                restaurants: {
                    "rest_demo": {
                        id: "rest_demo", ownerName: "محمد الحاتي", name: "مشويات الحاتي الفاخرة", phone: "01015861991", pass: "1234",
                        template_id: "foodera-modern", layout: "foodera", theme: { primary: "#ea580c", bg: "#07090e" }, tablesCount: 20,
                        subscription: { isActive: true, expiresAt: Date.now() + 30*24*60*60*1000 },
                        categories: [
                            { id: 'cat_1', name: 'المشويات', icon: '🥩' }, 
                            { id: 'cat_2', name: 'السندوتشات', icon: '🥙' }
                        ],
                        menu_items: [
                            { id: 'itm_1', category_id: 'cat_1', name: 'كيلو كباب وكفتة', description: 'لحم بلدي مشوي عالفحم', price: 680, image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500', is_available: true }
                        ],
                        orders: []
                    }
                }
            };
        }

        const TEMPLATES_CATALOG = [
            { id: 'foodera-modern', name: 'عصري فخم (Foodera)', layout: 'foodera', desc: 'تصميم برجر وعصري ببانر تسويقي وبطاقات شبكية فخمة', preview: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500', themeBg: '#07090e', primary: '#ea580c' },
            { id: 'pizza-deli', name: 'بيتزا إيطالي (Pizza Deli)', layout: 'pizza', desc: 'تصميم بيتزا فخم ببانر علوي أحمر وبطاقات عريضة', preview: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500', themeBg: '#1a0505', primary: '#dc2626' },
            { id: 'dark-grill', name: 'ستيك ليلي (Dark VIP)', layout: 'dark_grill', desc: 'تصميم ليلي فاخر للستيك والبرجر بالأسود والذهبي', preview: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=500', themeBg: '#09090b', primary: '#f59e0b' },
            { id: 'verde-table', name: 'أخضر عضوي (Verde)', layout: 'verde', desc: 'تصميم عضوي وطبيعي مستوحى من المزارع والطبيعة', preview: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500', themeBg: '#05160a', primary: '#10b981' }
        ];

        function syncCloud() {
            try {
                localStorage.setItem('tablia_multitenant_2030_v19', JSON.stringify(globalDB));
                if (cloudDB) {
                    cloudDB.ref('tablia_multitenant_enterprise_2030_v19').set(globalDB).catch(() => {});
                }
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_multitenant_enterprise_2030_v19').on('value', (snap) => {
                const data = snap.val();
                if (data && data.restaurants) {
                    globalDB = data;
                    try {
                        localStorage.setItem('tablia_multitenant_2030_v19', JSON.stringify(globalDB));
                    } catch(e){}
                    playBell();
                    render();
                }
            });
        }

        function playBell(){
            try {
                const a = document.getElementById('cloud-bell');
                if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
                if('vibrate' in navigator) navigator.vibrate([400, 200, 400]);
            } catch(e){}
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isCustomerMode = urlParams.get('view') === 'menu';
        const targetRestSlug = urlParams.get('rest');
        
        let currentRestId = localStorage.getItem('tablia_logged_rest_id') || null;
        if (currentRestId && (!globalDB.restaurants || !globalDB.restaurants[currentRestId])) {
            localStorage.removeItem('tablia_logged_rest_id');
            currentRestId = null;
        }

        const appState = { 
            page: isCustomerMode ? 'storefront' : (currentRestId ? 'builder' : 'auth'), 
            authTab: 'login', 
            builderStep: 1, 
            activeCat: 'all', 
            search: '', 
            cart: [], 
            cartOpen: false, 
            tableNumber: urlParams.get('t')||null, 
            activeOrderId: localStorage.getItem('tablia_active_order_id')||null, 
            trackerOpen: false, 
            adminUnlocked: false,
            editingItemId: null
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isCustomerMode) {
                    content = renderStorefront();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) {
                        currentRestId = null;
                        localStorage.removeItem('tablia_logged_rest_id');
                        appState.page = 'auth';
                        content = renderAuthScreen();
                    } else if(appState.page === 'builder') {
                        content = renderBuilder();
                    } else if(appState.page === 'cashier') {
                        content = renderCashier();
                    } else if(appState.page === 'dashboard') {
                        content = renderDashboard();
                    } else if(appState.page === 'qr_print') {
                        content = renderQRPrint();
                    } else {
                        content = renderBuilder();
                    }
                }
                
                const bottomBar = (isCustomerMode || !currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) ? '' : renderBottomNav();
                root.innerHTML = content + bottomBar;
            } catch(err) {
                console.error("Render error:", err);
                root.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6 text-center bg-slate-950 text-white"><div class="glass p-6 rounded-3xl space-y-4 max-w-sm"><h2 class="text-amber-400 font-black text-base">إعادة تشغيل النظام</h2><p class="text-xs text-slate-400">تم تحديث النظام ليعمل بكفاءة عالية وبدون أي أخطاء.</p><button onclick="localStorage.clear(); location.reload();" class="w-full gold-gradient text-slate-950 font-black py-3 rounded-xl text-xs">تحديث وتشغيل فوري</button></div></div>`;
            }
        }

        function renderNav(){
            const rest = (currentRestId && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null;
            return `<nav class="sticky top-0 z-50 glass border-b border-white/10 px-4 py-3"><div class="max-w-4xl mx-auto flex justify-between items-center"><div class="flex gap-2 items-center cursor-pointer" onclick="setPage(currentRestId?'builder':'auth')"><div class="w-10 h-10 rounded-2xl gold-gradient text-slate-950 flex items-center justify-center font-black shadow-lg">ط</div><div><span class="font-black text-white text-sm">Tablia <span class="text-amber-400">OS</span></span></div></div>${rest?`<button onclick="currentRestId=null; localStorage.removeItem('tablia_logged_rest_id'); setPage('auth');" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-500/20 transition">خروج</button>`:''}</div></nav>`;
        }

        function renderBottomNav(){
            if(!currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) return '';
            return `<div class="fixed bottom-0 left-0 right-0 z-50 glass border-t border-white/10 px-2 py-2"><div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center"><button onclick="setPage('builder')" class="flex flex-col items-center py-1.5 rounded-xl transition ${appState.page==='builder'?'text-amber-400 font-black bg-white/5':'text-slate-400 hover:text-white'}"><i class="fa-solid fa-wand-magic-sparkles text-sm mb-0.5"></i><span class="text-[10px]">المنشئ</span></button><button onclick="setPage('cashier')" class="flex flex-col items-center py-1.5 rounded-xl transition ${appState.page==='cashier'?'text-red-400 font-black bg-white/5':'text-slate-400 hover:text-white'}"><i class="fa-solid fa-cash-register text-sm mb-0.5"></i><span class="text-[10px]">الكاشير</span></button><button onclick="setPage('dashboard')" class="flex flex-col items-center py-1.5 rounded-xl transition ${appState.page==='dashboard'?'text-amber-400 font-black bg-white/5':'text-slate-400 hover:text-white'}"><i class="fa-solid fa-chart-line text-sm mb-0.5"></i><span class="text-[10px]">الباقات</span></button><button onclick="setPage('qr_print')" class="flex flex-col items-center py-1.5 rounded-xl transition ${appState.page==='qr_print'?'text-amber-400 font-black bg-white/5':'text-slate-400 hover:text-white'}"><i class="fa-solid fa-qrcode text-sm mb-0.5"></i><span class="text-[10px]">QR</span></button></div></div>`;
        }

        function renderAuthScreen(){
            return `${renderNav()}
            <div class="max-w-md mx-auto px-4 py-12 space-y-6">
                <div class="text-center space-y-2">
                    <h1 class="text-2xl font-black text-white">منصة مطاعم المستقبل</h1>
                    <p class="text-xs text-slate-400">سجل مطعمك وابدأ استقبال الطلبات في ثوانٍ</p>
                </div>
                <div class="flex bg-slate-900 p-1.5 rounded-2xl text-xs border border-white/10">
                    <button onclick="appState.authTab='login'; render();" class="flex-1 py-3 rounded-xl font-bold transition ${appState.authTab==='login'?'gold-gradient text-slate-950 font-black shadow':'text-slate-400 hover:text-white'}">تسجيل دخول</button>
                    <button onclick="appState.authTab='register'; render();" class="flex-1 py-3 rounded-xl font-bold transition ${appState.authTab==='register'?'gold-gradient text-slate-950 font-black shadow':'text-slate-400 hover:text-white'}">مطعم جديد</button>
                </div>
                ${appState.authTab==='login' ? `
                    <div class="glass p-6 rounded-3xl space-y-4 text-xs border border-white/10 shadow-xl">
                        <div>
                            <label class="block text-slate-400 mb-1 font-bold">رقم الموبايل</label>
                            <input id="log_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-white/10 p-3.5 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 font-bold">كلمة السر</label>
                            <input id="log_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-white/10 p-3.5 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                        </div>
                        <button onclick="handleLogin()" class="w-full gold-gradient text-slate-950 font-black py-3.5 rounded-xl shadow-lg hover:opacity-95 transition">دخول لوحة التحكم</button>
                    </div>
                ` : `
                    <div class="glass p-6 rounded-3xl space-y-4 text-xs border border-white/10 shadow-xl">
                        <div>
                            <label class="block text-slate-400 mb-1 font-bold">اسمك الكريم</label>
                            <input id="reg_owner" placeholder="محمد علي" class="w-full bg-slate-950 border border-white/10 p-3.5 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 font-bold">اسم المطعم</label>
                            <input id="reg_name" placeholder="مطعم البرنس" class="w-full bg-slate-950 border border-white/10 p-3.5 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 font-bold">رقم الموبايل</label>
                            <input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-white/10 p-3.5 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 font-bold">كلمة السر</label>
                            <input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-white/10 p-3.5 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                        </div>
                        <button onclick="handleRegister()" class="w-full gold-gradient text-slate-950 font-black py-3.5 rounded-xl shadow-lg hover:opacity-95 transition">إنشاء المطعم الآن</button>
                    </div>
                `}
            </div>`;
        }

        function handleLogin(){
            const phone = document.getElementById('log_phone').value.trim(); 
            const pass = document.getElementById('log_pass').value.trim();
            if(!phone || !pass) { alert('يرجى إدخال رقم الموبايل وكلمة السر'); return; }

            if(cloudDB) {
                cloudDB.ref('tablia_multitenant_enterprise_2030_v19').once('value').then(snap => {
                    const data = snap.val();
                    if(data && data.restaurants) {
                        globalDB = data;
                        localStorage.setItem('tablia_multitenant_2030_v19', JSON.stringify(globalDB));
                    }
                    verifyLoginData(phone, pass);
                }).catch(() => { verifyLoginData(phone, pass); });
            } else {
                verifyLoginData(phone, pass);
            }
        }

        function verifyLoginData(phone, pass) {
            let found = false;
            if(globalDB && globalDB.restaurants) {
                for(let id in globalDB.restaurants){ 
                    if(globalDB.restaurants[id].phone === phone && globalDB.restaurants[id].pass === pass){ 
                        currentRestId = id; 
                        localStorage.setItem('tablia_logged_rest_id', id); 
                        found = true;
                        setPage('builder'); 
                        break;
                    } 
                }
            }
            if(!found) {
                alert('بيانات الدخول غير صحيحة. تأكد من رقم الموبايل وكلمة السر.');
            }
        }

        function handleRegister(){
            const owner = document.getElementById('reg_owner').value.trim(); 
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            if(!owner || !name || !phone || !pass){ alert('يرجى استكمال البيانات'); return; }
            const restId = 'rest_' + Date.now();
            if(!globalDB.restaurants) globalDB.restaurants = {};
            globalDB.restaurants[restId] = { 
                id: restId, ownerName: owner, name: name, phone: phone, pass: pass, 
                template_id: 'foodera-modern', layout: 'foodera', theme: { primary: '#ea580c', bg: '#07090e' }, tablesCount: 20, 
                subscription: { isActive: false, expiresAt: null }, 
                categories: [
                    { id: 'cat_1', name: 'الرئيسية', icon: '🍔' },
                    { id: 'cat_2', name: 'المشويات', icon: '🥩' }
                ], 
                menu_items: [], 
                orders: [] 
            };
            syncCloud(); 
            currentRestId = restId; 
            localStorage.setItem('tablia_logged_rest_id', restId); 
            setPage('builder');
        }

        function renderBuilder(){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null;
            if(!rest){ setPage('auth'); return ''; }
            const selectedTpl = TEMPLATES_CATALOG.find(t => t.id === rest.template_id) || TEMPLATES_CATALOG[0];
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-5">
                    <div class="flex gap-1.5 bg-slate-900 p-1.5 rounded-2xl text-xs border border-white/10">
                        <button onclick="appState.builderStep=1; render();" class="flex-1 py-2.5 rounded-xl transition ${appState.builderStep===1?'gold-gradient text-slate-950 font-black shadow':'text-slate-400 hover:text-white'}">1. القالب والحساب</button>
                        <button onclick="appState.builderStep=2; render();" class="flex-1 py-2.5 rounded-xl transition ${appState.builderStep===2?'gold-gradient text-slate-950 font-black shadow':'text-slate-400 hover:text-white'}">2. المنيو والأقسام</button>
                        <button onclick="appState.builderStep=4; render();" class="flex-1 py-2.5 rounded-xl transition ${appState.builderStep===4?'gold-gradient text-slate-950 font-black shadow':'text-slate-400 hover:text-white'}">3. المعاينة والمشاركة</button>
                    </div>
                    ${appState.builderStep===1 ? renderStep1(rest, selectedTpl) : (appState.builderStep===2 ? renderStep2(rest) : renderStep4(rest))}
                </div>
            `;
        }

        function renderStep1(rest, selectedTpl){
            return `
                <div class="glass p-6 rounded-3xl space-y-5 text-xs border border-white/10 shadow-xl">
                    <h2 class="font-black text-white text-sm">الخطوة 1: تخصيص اسم المطعم، كلمة السر، وقالب العرض</h2>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 font-bold mb-1.5">اسم المطعم</label>
                            <input id="r_name" value="${rest.name || ''}" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 font-bold mb-1.5">تغيير كلمة السر الجديدة</label>
                            <input id="r_new_pass" type="password" placeholder="أدخل كلمة السر الجديدة" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                        </div>
                    </div>
                    
                    <div class="space-y-3">
                        <label class="block text-slate-400 font-bold">اختر القالب الفخم للمنيو:</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${TEMPLATES_CATALOG.map(t=>`
                                <div onclick="if(globalDB.restaurants['${currentRestId}']) { globalDB.restaurants['${currentRestId}'].template_id='${t.id}'; globalDB.restaurants['${currentRestId}'].layout='${t.layout}'; globalDB.restaurants['${currentRestId}'].theme.primary='${t.primary}'; globalDB.restaurants['${currentRestId}'].theme.bg='${t.themeBg}'; syncCloud(); render(); }" class="border-2 rounded-2xl p-3 cursor-pointer transition ${rest.template_id===t.id?'border-amber-500 bg-amber-500/10 shadow-lg':'border-white/10 bg-slate-950 hover:border-white/30'}">
                                    <img src="${t.preview}" class="h-24 w-full object-cover rounded-xl mb-2.5">
                                    <h4 class="font-black text-white text-xs">${t.name}</h4>
                                    <p class="text-[10px] text-slate-400 line-clamp-1 mt-1">${t.desc}</p>
                                    ${rest.template_id===t.id?`<span class="inline-block mt-2 text-[10px] bg-amber-500/20 text-amber-400 px-2.5 py-0.5 rounded-full font-bold">● القالب المختار</span>`:''}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="saveStep1()" class="gold-gradient text-slate-950 font-black px-5 py-3.5 rounded-xl w-full text-xs shadow-xl hover:opacity-95 transition">حفظ والانتقال للمنيو ➔</button>
                </div>
            `;
        }

        function saveStep1(){ 
            const nameInput = document.getElementById('r_name');
            const passInput = document.getElementById('r_new_pass');
            if(nameInput && globalDB.restaurants[currentRestId]) globalDB.restaurants[currentRestId].name = nameInput.value.trim();
            if(passInput && passInput.value.trim() !== '' && globalDB.restaurants[currentRestId]) {
                globalDB.restaurants[currentRestId].pass = passInput.value.trim();
                alert('تم تحديث كلمة السر بنجاح!');
            }
            syncCloud(); 
            appState.builderStep = 2; 
            render(); 
        }

        function renderStep2(rest){
            if(!rest.menu_items) rest.menu_items = [];
            if(!rest.categories) rest.categories = [{id:'cat_1', name:'الرئيسية', icon:'🍔'}];

            return `
                <div class="glass p-6 rounded-3xl space-y-5 text-xs border border-white/10 shadow-xl">
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-white text-sm">إدارة الأقسام والوجبات</h3>
                            <button onclick="addCategoryPrompt()" class="bg-amber-500/20 text-amber-400 font-black px-3 py-1.5 rounded-xl hover:bg-amber-500/30 transition">+ إضافة قسم جديد</button>
                        </div>
                        <div class="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">
                            ${rest.categories.map(c=>`
                                <div class="bg-slate-900 border border-white/10 px-3.5 py-2 rounded-xl flex items-center gap-2 shrink-0">
                                    <span>${c.icon || '📂'}</span>
                                    <span class="font-bold text-white">${c.name}</span>
                                    <button onclick="deleteCategory('${c.id}')" class="text-red-400 hover:text-red-300 ml-1"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl space-y-3">
                        <label class="block text-amber-400 font-black">أضف أصناف وأسعار بسرعة فائقة (مثال: برجر 150, بيتزا 200):</label>

        function addCategoryPrompt(){
            const name = prompt('أدخل اسم القسم الجديد (مثال: المقبلات، المشروبات):');

            const rest = globalDB.restaurants[currentRestId];
            if(!rest.categories) rest.categories = [];
            rest.categories.push({ id: 'cat_' + Date.now(), name: name.trim(), icon: '🍽️' });
            syncCloud();
            render();
        }

        function deleteCategory(catId){
            const rest = globalDB.restaurants[currentRestId];
            if(rest.categories.length <= 1) { alert('يجب أن يكون هناك قسم واحد على الأقل.'); return; }
            rest.categories = rest.categories.filter(c => c.id !== catId);
            syncCloud();
            render();
        }

        function saveEditedItem(id) {
            const rest = globalDB.restaurants[currentRestId];
            if(!rest || !rest.menu_items) return;
            const item = rest.menu_items.find(i => i.id === id);
            if(item) {
                const nameEl = document.getElementById(`edit_name_${id}`);
                const priceEl = document.getElementById(`edit_price_${id}`);
                if(nameEl) item.name = nameEl.value.trim();
                if(priceEl) {
                    const p = Number(priceEl.value);
                    if(!isNaN(p)) item.price = p;
                }
            }
            appState.editingItemId = null;
            syncCloud();
            render();
        }

        function parseMagicText(){
            const rest = globalDB.restaurants[currentRestId];
            if(!rest) return;
            if(!rest.menu_items) rest.menu_items = [];
            if(!rest.categories || rest.categories.length === 0) rest.categories = [{id:'cat_1', name:'الرئيسية', icon:'🍔'}];
            
            const text = document.getElementById('magic_box').value.trim(); 
            if(!text) return;
            text.split(/,|\n/).forEach(line => {
                const m = line.match(/\d+/); if(!m) return;
                const price = Number(m[0]); 
                const name = line.replace(m[0],'').replace(/ج/g,'').replace(/جنيه/g,'').trim();
                if(name) {
                    rest.menu_items.push({ 
                        id: 'itm_' + Date.now() + Math.random(), 
                        category_id: rest.categories[0].id, 
                        name, 
                        description: 'طازج ومعد ببهارات المطعم الخاصة', 
                        price, 
                        image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500', 
                        is_available: true 
                    });
                }
            }); 
            document.getElementById('magic_box').value = '';
            syncCloud(); 
            render();
        }

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                            <button onclick="shareViaWhatsApp('${url}', '${rest.name}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl flex items-center justify-center gap-2 text-xs shadow-lg transition">
                                <i class="fa-brands fa-whatsapp text-sm"></i> إرسال عبر واتساب
                            </button>
                            <button onclick="nativeShare('${url}', '${rest.name}')" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-3 rounded-xl flex items-center justify-center gap-2 text-xs shadow-lg transition">
                                <i class="fa-solid fa-share-nodes text-sm"></i> مشاركة الرابط
                            </button>
                        </div>
                    </div>

                    <div class="p-4 rounded-2xl border border-white/10 space-y-3" style="background:${selectedTpl.themeBg}">
                        <div class="flex items-center gap-3 bg-slate-900/90 p-3 rounded-xl border border-white/10">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg text-white shadow" style="background:${selectedTpl.primary}">🔥</div>
                            <div>
                                <h3 class="font-black text-white text-xs">${rest.name}</h3>
                                <p class="text-[9px] text-emerald-400">● المنيو أونلاين ويعمل بكفاءة</p>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <span class="text-[10px] text-amber-400 font-bold">الأصناف المضافة (${rest.menu_items.length}):</span>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-48 overflow-y-auto hide-scrollbar">
                                ${rest.menu_items.map(item => `

                                        <div class="flex items-center gap-2">
                                            <img src="${item.image}" class="w-10 h-10 object-cover rounded-xl">
                                            <div>
                                                <h4 class="font-black text-white text-[11px]">${item.name}</h4>
                                                <span class="font-bold text-[10px]" style="color:${selectedTpl.primary}">${item.price} ج.م</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    ${!isSub ? `

                            <p class="text-[10px] text-amber-300">لتفعيل استقبال الطلبات الفورية وربطها بالكاشير (${PLATFORM_OWNER.monthlyPrice} ج/شهرياً)، تواصل للإدارة:</p>
                            <a href="https://wa.me/2${PLATFORM_OWNER.walletNumber}?text=${encodeURIComponent('تفعيل مطعم '+rest.name+' بمبلغ '+PLATFORM_OWNER.monthlyPrice+' جنيه')}" target="_blank" class="inline-block bg-emerald-600 text-white font-black px-4 py-2 rounded-xl text-xs">تفعيل الحساب (واتساب)</a>
                        </div>
                    ` : '<div class="bg-emerald-500/20 text-emerald-400 p-2.5 rounded-xl text-center font-black">✅ حسابك مفعل ونشط بالكامل</div>'}
                </div>
            `;

        function shareViaWhatsApp(url, restName) {
            const text = encodeURIComponent(`🍽️ تفضل بزيارة منيو مطعم ${restName} واطلب وجبتك المفضلة أونلاين:\n${url}`);
            window.open(`https://wa.me/?text=${text}`, '_blank');

        function nativeShare(url, restName) {
            if (navigator.share) {
                navigator.share({ title: restName, text: `اطلب الآن من منيو مطعم ${restName}`, url: url }).catch(() => {});
            } else {

            const restId = targetRestSlug || (globalDB && globalDB.restaurants ? Object.keys(globalDB.restaurants)[0] : null);

            if(!rest.subscription?.isActive) return `<div class="min-h-screen flex items-center justify-center bg-slate-950 text-white text-center p-4">المنيو متوقف مؤقتاً بانتظار التفعيل لدى الإدارة</div>`;

            const filtered = rest.menu_items.filter(i => {
                if (!i.is_available) return false;

                        ${appState.tableNumber ? `<div class="bg-amber-500 text-slate-950 text-center py-1.5 font-black text-xs rounded-xl shadow">طاولة رقم ${appState.tableNumber}</div>` : `<div class="bg-slate-900 border border-white/10 text-emerald-400 text-center py-1.5 font-black text-xs rounded-xl">خدمة التوصيل المنزلي والدليفري 🛵</div>`}
                        
                        <div class="glass p-4 rounded-3xl flex gap-3 items-center border border-white/10 shadow-xl">
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl text-white shadow-lg" style="background:${rest.theme?.primary || '#ea580c'}">🔥</div>
                            <div>

                        <div class="flex gap-1.5 overflow-x-auto hide-scrollbar pb-1">
                            <button onclick="appState.activeCat='all'; render();" class="px-4 py-2 rounded-xl text-xs font-black transition ${appState.activeCat==='all'?'gold-gradient text-slate-950 shadow':'glass text-slate-300 border border-white/10'}">الكل</button>

        function addToCart(id){
            const restId = targetRestSlug || currentRestId || (globalDB && globalDB.restaurants ? Object.keys(globalDB.restaurants)[0] : null);
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[restId] : null;
            if(!rest || !rest.menu_items) return;
            const item = rest.menu_items.find(i => i.id === id);
            if(!item) return;
            const f = appState.cart.find(c => c.id === id);
            if(f) f.qty++; else appState.cart.push({...item, qty:1}); 
            render();
        }

        function renderCheckoutModal(rest){
            return `
                <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 text-xs">
                    <div class="glass p-6 rounded-3xl max-w-sm w-full space-y-4 border border-white/10 shadow-2xl">
                        <h3 class="font-black text-white text-sm text-center">تأكيد بيانات الطلب والتوصيل</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-slate-400 mb-1 font-bold">اسمك الكريم</label>
                                <input id="cust_name" placeholder="محمد علي" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-slate-400 mb-1 font-bold">رقم الموبايل</label>

                                <input id="cust_address" placeholder="الشارع، العمارة، الدور" class="w-full bg-slate-950 border border-white/10 p-3 rounded-xl text-white font-bold outline-none focus:border-amber-500">
                            </div>
                        </div>

        function submitOrder(){
            const restId = targetRestSlug || currentRestId || (globalDB && globalDB.restaurants ? Object.keys(globalDB.restaurants)[0] : null);
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[restId] : null;
            if(!rest) return;
            const nameEl = document.getElementById('cust_name');
            const phoneEl = document.getElementById('cust_phone');
            const addressEl = document.getElementById('cust_address');
            
            const name = nameEl ? nameEl.value.trim() : ''; 
            const phone = phoneEl ? phoneEl.value.trim() : '';
            const address = addressEl ? addressEl.value.trim() : 'دليفري عادي';
            
            if(!name || !phone){ alert('أدخل الاسم ورقم الهاتف!'); return; }
            
            if(!rest.orders) rest.orders = [];
            const total = appState.cart.reduce((s,i)=>s+(i.price*i.qty),0);
            
            rest.orders.unshift({ 
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000), 
                customer_name: name, 
                phone, 
                address,
                items_json: JSON.parse(JSON.stringify(appState.cart)), 
                total, 
                status: 'new', 
                table_number: appState.tableNumber || 'دليفري', 
                created_at: new Date().toLocaleTimeString('ar-EG') 
            });
            
            appState.activeOrderId = rest.orders[0].id; 
            localStorage.setItem('tablia_active_order_id', appState.activeOrderId); 
            appState.cart = []; 
            appState.cartOpen = false; 
            appState.trackerOpen = true; 
            syncCloud(); 
            render(); 
            playBell();
        }

            if(!rest || !rest.orders) return '';
            const ord = rest.orders.find(o => o.id === appState.activeOrderId); 
            if(!ord) return '';
            
            let statusText = 'قيد المراجعة والتحضير 🔥';
            if(ord.status === 'preparing') statusText = 'جاري تحضير الوجبات بالمنتجات الطازجة 👨‍🍳';
            if(ord.status === 'delivering') statusText = 'الطلب في الطريق إليك مع الدليفري 🛵';

            return `
                <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 text-xs">

                </div>

            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null; 
            if(!rest){ setPage('auth'); return ''; }
            if(!rest.orders) rest.orders = [];

            return `
                ${renderNav()}
                <div class="max-w-4xl mx-auto px-4 py-6 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-white/10">
                        <h1 class="font-black text-white text-sm">شاشة الكاشير والمتابعة الحية - ${rest.name}</h1>

                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${rest.orders.length === 0 ? `<div class="col-span-2 glass p-12 text-center text-slate-400 rounded-3xl border border-white/10">لا توجد طلبات جديدة حالياً.. تنتظر طلبات العملاء 🚀</div>` : rest.orders.map((ord, i) => `

                                    <div>
                                        <span class="font-black text-white text-sm">${ord.customer_name}</span>
                                        <span class="text-slate-400 text-[10px] block">${ord.phone} | ${ord.table_number}</span>
                                    </div>
                                    <span class="text-amber-400 font-black text-sm">${ord.total} ج.م</span>
                                </div>
                                <div class="text-slate-300 text-[11px] bg-slate-950 p-2.5 rounded-xl border border-white/5">
                                    <p class="font-bold text-amber-300 mb-1">📍 العنوان: ${ord.address || 'بدون عنوان'}</p>
                                    ${ord.items_json ? ord.items_json.map(x => `• ${x.qty}x ${x.name}`).join('<br>') : ''}
                                </div>
                                <div class="grid grid-cols-4 gap-1.5 pt-1">
                                    <button onclick="updateOrderStatus(${i}, 'preparing')" class="bg-sky-600 hover:bg-sky-500 text-white py-2 rounded-xl font-bold transition">تحضير</button>
                                    <button onclick="updateOrderStatus(${i}, 'delivering')" class="bg-amber-600 hover:bg-amber-500 text-white py-2 rounded-xl font-bold transition">دليفري 🛵</button>
                                    <button onclick="updateOrderStatus(${i}, 'done')" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl font-bold transition">تم</button>
                                    <button onclick="deleteOrder(${i})" class="bg-red-500/20 text-red-400 hover:bg-red-500/30 py-2 rounded-xl transition"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function updateOrderStatus(index, status) {
            const rest = globalDB.restaurants[currentRestId];
            if(rest && rest.orders && rest.orders[index]) {
                rest.orders[index].status = status;
                syncCloud();
                render();
            }
        }

        function deleteOrder(index) {
            const rest = globalDB.restaurants[currentRestId];
            if(rest && rest.orders) {
                rest.orders.splice(index, 1);
                syncCloud();
                render();
            }
        }

        function renderDashboard(){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null; 
            if(!rest){ setPage('auth'); return ''; }
            if(!appState.adminUnlocked) return `${renderNav()}<div class="max-w-md mx-auto py-12 px-4 text-center space-y-4 text-xs"><div class="glass p-6 rounded-3xl space-y-3 border border-amber-500/30"><h2 class="font-black text-amber-400 text-sm">لوحة الإدارة (تفعيل الباقات - 600 ج)</h2><input id="admin_pin" type="password" placeholder="الرمز السري 2030" class="w-full bg-slate-950 border border-white/10 p-3.5 rounded-xl text-center text-white outline-none focus:border-amber-500"><button onclick="if(document.getElementById('admin_pin').value==='${PLATFORM_OWNER.adminPass}'){appState.adminUnlocked=true;render();}else{alert('الرمز غلط')}" class="w-full gold-gradient text-slate-950 font-black py-3.5 rounded-xl shadow">دخول الإدارة</button></div></div>`;
            
            return `
                ${renderNav()}
                <div class="max-w-4xl mx-auto px-4 py-6 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-white/10">
                        <h1 class="font-black text-white text-sm">إدارة كافة مطاعم المنصة (الاشتراكات الشهرية)</h1>
                        <button onclick="appState.adminUnlocked=false; render();" class="text-red-400 font-bold hover:underline">قفل الإدارة</button>
                    </div>
                    <div class="space-y-3">
                        ${Object.values(globalDB.restaurants).map(r => `
                            <div class="glass p-4 rounded-2xl flex justify-between items-center border ${r.subscription?.isActive?'border-emerald-500/40':'border-amber-500/40'} shadow">
                                <div>
                                    <h3 class="font-black text-white text-xs">${r.name}</h3>
                                    <p class="text-slate-400 text-[11px] mt-0.5">المالك: ${r.ownerName} (${r.phone}) - الحالة: ${r.subscription?.isActive ? 'نشط ومفعل ✅' : 'غير مفعل ⏸️'}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="globalDB.restaurants['${r.id}'].subscription={isActive:true, expiresAt:Date.now()+2592000000}; syncCloud(); render();" class="bg-emerald-600 text-white px-3 py-2 rounded-xl font-bold hover:bg-emerald-500 transition">تفعيل شهر</button>
                                    <button onclick="globalDB.restaurants['${r.id}'].subscription={isActive:false}; syncCloud(); render();" class="bg-red-500/20 text-red-400 px-3 py-2 rounded-xl hover:bg-red-500/30 transition">إيقاف</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderQRPrint(){
            const rest = (globalDB && globalDB.restaurants) ? globalDB.restaurants[currentRestId] : null; 
            if(!rest){ setPage('auth'); return ''; }
            const base = location.origin + location.pathname + `?view=menu&rest=${rest.id}&t=`;
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-4 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-white/10">
                        <h1 class="font-black text-white text-sm">QR Code الطاولات والدليفري - ${rest.name}</h1>
                        <button onclick="window.print()" class="gold-gradient text-slate-950 px-4 py-2.5 rounded-xl font-black shadow hover:opacity-95 transition">طباعة الـ QR</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        ${Array.from({length: rest.tablesCount || 20}, (_, i) => i + 1).map(n => `
                            <div class="bg-white p-3 rounded-2xl text-center shadow-lg space-y-2">
                                <div class="font-black text-xs text-slate-900">طاولة رقم ${n}</div>
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(base + n)}" class="w-24 h-24 mx-auto rounded-lg">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        render();
    </script>
</body>
</html>
