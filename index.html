<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سُفرة تك | المنيو السحري السريع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #07090e; color: #f1f5f9; }
        .glass-card { background: rgba(18, 24, 38, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .amber-glow { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="antialiased min-h-screen pb-24">
    <div id="app" class="max-w-md mx-auto min-h-screen p-4 space-y-6"></div>

    <script>
        const state = {
            route: 'builder', // builder, menu, success
            restaurantName: 'مطعم السحر الحلال',
            rawText: '',
            menuItems: [
                { name: 'برجر دجاج فاخر', price: 150, desc: 'مستخرج أوتوماتيكياً' },
                { name: 'حواوشي لحم بلدي', price: 120, desc: 'مستخرج أوتوماتيكياً' }
            ],
            cart: []
        };

        function navigate(r) { state.route = r; render(); window.scrollTo(0,0); }

        function render() {
            const app = document.getElementById('app');
            if (state.route === 'builder') app.innerHTML = renderBuilder();
            else if (state.route === 'menu') app.innerHTML = renderMenu();
            else if (state.route === 'success') app.innerHTML = renderSuccess();
        }

        // ================= 1. شاشة المالك (الصندوق السحري للنصوص) =================
        function renderBuilder() {
            return `
                <div class="space-y-6 pt-4">
                    <div class="flex justify-between items-center pb-3 border-b border-white/10">
                        <div class="flex items-center gap-2">
                            <span class="w-9 h-9 rounded-xl amber-glow text-slate-950 flex items-center justify-center font-black">⚡</span>
                            <h1 class="font-black text-base">الصندوق السحري للمنيو</h1>
                        </div>
                        <button onclick="navigate('menu')" class="glass px-3 py-1.5 rounded-xl text-xs font-bold text-amber-400 border border-amber-500/30">معاينة المنيو 📱</button>
                    </div>

                    <div class="glass p-5 rounded-3xl space-y-4 shadow-2xl">
                        <label class="block text-xs font-bold text-slate-300">اسم مطعمك:</label>
                        <input type="text" id="r_name" value="${state.restaurantName}" oninput="state.restaurantName=this.value" class="w-full bg-slate-950 border border-white/10 p-3 rounded-2xl text-xs font-bold text-white outline-none focus:border-amber-500">

                        <div class="space-y-2">
                            <label class="block text-xs font-bold text-amber-400">📝 الصندوق السحري (الصق منيو واتساب أو ورقة هنا):</label>
                            <p class="text-[11px] text-slate-400 leading-relaxed">اكتب أو الصق النص بطريقتك العادية جداً (مثال: شاورما دجاج ١٠٠، بيبسي ٢٠، كريب فاهيتا ١٣٠)</p>
                            <textarea id="magic_box" rows="5" placeholder="اكتب أو الصق المنيو هنا..." class="w-full bg-slate-950 border border-white/10 p-3 rounded-2xl text-xs text-white outline-none focus:border-amber-500 leading-relaxed"></textarea>
                        </div>

                        <button onclick="parseMagicText()" class="w-full amber-glow text-slate-950 font-black py-4 rounded-2xl text-xs shadow-xl transition active:scale-95">
                            ✨ توليد المنيو وتقسيم الأسعار تلقائياً
                        </button>
                    </div>

                    <div class="glass p-5 rounded-3xl space-y-3 shadow-xl">
                        <h3 class="font-black text-xs text-amber-400">الأصناف الحالية المعتمدة (${state.menuItems.length})</h3>
                        <div class="space-y-2">
                            ${state.menuItems.map((m, idx) => `
                                <div class="bg-slate-950 p-3 rounded-2xl flex justify-between items-center border border-white/5 text-xs">
                                    <div>
                                        <p class="font-bold text-white">${m.name}</p>
                                        <span class="text-amber-400">${m.price} ج.م</span>
                                    </div>
                                    <button onclick="state.menuItems.splice(${idx},1); render();" class="text-red-400 bg-red-500/10 px-2.5 py-1 rounded-xl text-[11px]">حذف</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // دالة الذكاء الاصطناعي البسيطة والسريعة لتحليل النصوص والأسعار
        function parseMagicText() {
            const text = document.getElementById('magic_box').value.trim();
            if (!text) { alert('⚠️ يرجى كتابة أو لصق نص المنيو أولاً!'); return; }

            // تقسيم النص حسب الفواصل أو الأسطر
            const lines = text.split(/,|\n/);
            let addedCount = 0;

            lines.forEach(line => {
                if (!line.trim()) return;
                // محاولة استخراج الأرقام (السعر) من النص
                const matchPrice = line.match(/\d+/);
                if (matchPrice) {
                    const price = Number(matchPrice[0]);
                    const name = line.replace(matchPrice[0], '').replace(/جيهنيه|جنيه|جـ|ج/g, '').trim();
                    if (name) {
                        state.menuItems.push({ name: name, price: price, desc: 'صنف مستخرج سحابياً' });
                        addedCount++;
                    }
                }
            });

            if (addedCount > 0) {
                alert(`✅ تم استخراج وتوليد ${addedCount} صنف بأسعارها بنجاح واحترافية!`);
                document.getElementById('magic_box').value = '';
                render();
                navigate('menu');
            } else {
                alert('⚠️ لم يتم التعرف على أسعار بداخل النص. تأكد من كتابة السعر بجانب اسم الوجبة.');
            }
        }

        // ================= 2. واجهة الزبون والمنيو الفخم =================
        function renderMenu() {
            const cartTotal = state.cart.reduce((s,i)=>s+(i.price*i.qty),0);
            const cartCount = state.cart.reduce((s,i)=>s+i.qty,0);

            return `
                <div class="space-y-6 pt-4 pb-20">
                    <div class="glass p-4 rounded-3xl flex justify-between items-center border border-white/10">
                        <div class="flex items-center gap-3">
                            <span class="w-10 h-10 rounded-2xl amber-glow text-slate-950 flex items-center justify-center font-black text-lg">🍽️</span>
                            <div>
                                <h1 class="font-black text-sm text-white">${state.restaurantName}</h1>
                                <p class="text-[10px] text-amber-400">المنيو الرقمي السريع والمباشر</p>
                            </div>
                        </div>
                        <button onclick="navigate('builder')" class="glass px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300">تعديل المنيو ⚙️</button>
                    </div>

                    <div class="grid grid-cols-1 gap-3">
                        ${state.menuItems.map(item => `
                            <div class="glass p-4 rounded-3xl flex justify-between items-center border border-white/10 shadow-xl">
                                <div class="space-y-1">
                                    <h4 class="font-black text-sm text-white">${item.name}</h4>
                                    <p class="text-[11px] text-slate-400">${item.desc}</p>
                                    <span class="font-black text-amber-400 text-xs">${item.price} ج.م</span>
                                </div>
                                <button onclick="addToCart('${item.name}', ${item.price})" class="w-9 h-9 rounded-2xl amber-glow text-slate-950 font-black flex items-center justify-center text-sm shadow-lg active:scale-95">+</button>
                            </div>
                        `).join('')}
                    </div>

                    ${cartCount > 0 ? `
                        <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto z-50">
                            <button onclick="navigate('success')" class="w-full py-4 px-6 rounded-2xl amber-glow text-slate-950 font-black shadow-2xl flex justify-between items-center text-xs">
                                <span>إتمام الطلب السريع (${cartCount} صنف)</span>
                                <span>${cartTotal} ج.م 🚀</span>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addToCart(name, price) {
            const found = state.cart.find(i => i.name === name);
            if (found) found.qty++;
            else state.cart.push({ name, price, qty: 1 });
            render();
        }

        // ================= 3. شاشة النجاح وإرسال الطلب =================
        function renderSuccess() {
            return `
                <div class="min-h-[80vh] flex flex-col items-center justify-center text-center space-y-4">
                    <div class="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-3xl font-black">✓</div>
                    <h2 class="text-xl font-black text-white">تم استلام طلبك بنجاح!</h2>
                    <p class="text-xs text-slate-400 max-w-xs">شكراً لاختيارك ${state.restaurantName}. تم إرسال طلبك للمطبخ وسيتم التواصل معك فوراً.</p>
                    <button onclick="state.cart=[]; navigate('menu');" class="amber-glow text-slate-950 font-black px-6 py-3 rounded-2xl text-xs mt-4">طلب وجبة أخرى</button>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
