<body class="antialiased min-h-screen bg-[#f8faf7] text-slate-900 selection:bg-emerald-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        let globalDB = { shops: {} };
        try {
            const raw = localStorage.getItem('sofratech_v6000');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        function syncCloud() {
            try {
                localStorage.setItem('sofratech_v6000', JSON.stringify(globalDB));
                if (cloudDB) cloudDB.ref('sofratech_enterprise_v6000').set(globalDB).catch(() => {});
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('sofratech_enterprise_v6000').on('value', (snap) => {
                const data = snap.val();
                if (data && data.shops) {
                    globalDB = data;
                    try { localStorage.setItem('sofratech_v6000', JSON.stringify(globalDB)); } catch(e){}
                    render();
                }
            });
        }

        function playBell(){
            try {
                const a = document.getElementById('cloud-bell');
                if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
                if('vibrate' in navigator) navigator.vibrate([300, 150, 300]);
            } catch(e){}
        }

        const DEMO_PRODUCTS = [
            { id: 'd1', name: 'كيلو كباب ضاني', price: 1100, category: 'مشويات', image: '' },
            { id: 'd2', name: 'كيلو كفتة مشوية', price: 750, category: 'مشويات', image: '' },
            { id: 'd3', name: 'نصف فرخة على الفحم', price: 210, category: 'مشويات', image: '' },
            { id: 'd4', name: 'وجبة ميكس جريل', price: 320, category: 'وجبات', image: '' },
            { id: 'd5', name: 'ساندوتش كبدة اسكندراني', price: 45, category: 'ساندوتشات', image: '' },
            { id: 'd6', name: 'ساندوتش سجق بلدي', price: 50, category: 'ساندوتشات', image: '' },
            { id: 'd7', name: 'طاجن ورق عنب بالكوارع', price: 280, category: 'طواجن', image: '' },
            { id: 'd8', name: 'طاجن بامية باللحمة', price: 240, category: 'طواجن', image: '' }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const isAdminMode = urlParams.get('admin') === 'true'; 
        const isCustomerMode = urlParams.get('view') === 'store'; 
        const targetShopSlug = urlParams.get('shop');
        const urlTableNum = urlParams.get('t') || '';
        
        let currentShopId = localStorage.getItem('sofratech_logged_shop_id') || null;

        const appState = { 
            page: isAdminMode ? 'admin_panel' : (isCustomerMode ? 'storefront' : (currentShopId ? 'dashboard' : 'landing')), 
            authMode: 'register',
            landingDark: false,
            billingCycle: 'monthly',
            openFaqIndex: 0,
            demoTitle: 'البرنس للمشويات',
            onboardingStep: 1,
            obData: {
                country: 'مصر',
                lang: 'العربية',
                nameAr: '',
                nameEn: '',
                branches: 'فرع واحد',
                city: 'القاهرة',
                address: '',
                workFrom: '4:00 م',
                workTo: '2:00 ص',
                days: ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'],
                themeColor: 'أخضر',
                themeMode: 'فاتح',
                acceptOrders: true,
                payments: ['نقداً', 'فودافون كاش'],
                bio: '',

                aiStepText: '',
                extractedProducts: []

            merchantDrawerOpen: false,
            merchantLang: 'عربي',
            merchantTheme: 'فاتح',
            storeDark: false,
            storeLayout: 'grid',
            favorites: JSON.parse(localStorage.getItem('sofratech_favs') || '[]'),
            showFavoritesOnly: false,
            storeDrawerOpen: false,
            storeView: 'menu',
            cart: [],
            searchQuery: '',
            selectedCategory: 'مشويات',
            cartDrawerOpen: false,
            detailsDrawerOpen: false,
            orderType: urlTableNum ? 'table' : 'delivery',
            paymentMethod: 'cash',
            tableNumber: urlTableNum,
            posLayout: 'grid',
            posSearch: '',
            posCategory: 'all',
            posCart: [],
            posHeldOrders: [],
            posCloseModalOpen: false,
            posCloseTab: 'cart',
            posOrderType: 'delivery',
            posDriver: '',
            posDeliveryAddr: '',
            posCustomer: '',
            posDiscount: 0,
            posNotes: '',
            posPayment: 'cash',
            posPaid: 0,
            posSelectedTable: 'طاولة 1',
            orderSearch: '',
            orderStatusFilter: 'الكل',
            orderSourceFilter: 'كل المصادر',
            orderTypeFilter: 'كل الأنواع'
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function toggleFav(id, e){
            if(e) e.stopPropagation();
            const i = appState.favorites.indexOf(id);
            if(i > -1) appState.favorites.splice(i, 1); else appState.favorites.push(id);
            localStorage.setItem('sofratech_favs', JSON.stringify(appState.favorites));
            render();
        }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let html = '';
                if(isAdminMode) {
                    html = renderAdminPanel();
                } else if(isCustomerMode || appState.page === 'demo_store') {
                    html = renderStorefront(appState.page === 'demo_store');
                } else if(appState.page === 'landing') {
                    html = renderLandingPage();
                } else if(appState.page === 'auth') {
                    html = renderAuthScreen();
                } else {
                    if(!currentShopId || !globalDB.shops?.[currentShopId]) {
                        currentShopId = null;
                        localStorage.removeItem('sofratech_logged_shop_id');
                        appState.page = 'landing';
                        html = renderLandingPage();
                    } else {
                        const shop = globalDB.shops[currentShopId];
                        if(shop.onboardingComplete === false || appState.page === 'onboarding') {
                            html = renderOnboardingWizard(shop);
                        } else if(appState.page === 'dashboard') {
                            html = renderMerchantDashboard(shop);
                        } else if(appState.page === 'pos') {
                            html = renderPOS(shop);
                        } else if(appState.page === 'orders') {
                            html = renderMerchantOrders(shop);
                        } else if(appState.page === 'qr_share') {
                            html = renderQRShare(shop);
                        } else if(appState.page === 'items') {
                            html = renderItemsPage(shop);
                        } else {
                            html = renderMerchantDashboard(shop);
                        }
                    }
                }
                root.innerHTML = html;
            } catch(e) { console.error(e); }
        }

        // ================= 1. صفحة الهبوط =================
        function renderLandingPage(){
            const dm = appState.landingDark;
            const bg = dm ? 'bg-slate-950 text-white' : 'bg-[#f8faf7] text-slate-900';
            const card = dm ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200/80 text-slate-900';

            const demoProjects = [
                { title: 'مطعم حاتي', img: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500' },
                { title: 'قهوة وسط البلد', img: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500' },
                { title: 'مطبخ ست البيت', img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500' },
                { title: 'سوبر ماركت', img: 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=500' },
                { title: 'خضار وفواكه', img: 'https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=500' },
                { title: 'جزارة الحاج سيد', img: 'https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=500' },
                { title: 'شركات خدمات', img: 'https://images.unsplash.com/photo-1497366216548-37526070297c?w=500' },
                { title: 'مطعم', img: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500' }
            ];

                { title: 'الطلب من الطاولة', desc: 'يمسح العميل QR الطاولة ويطلب فوراً دون انتظار.', bg: 'bg-rose-50 border-rose-200 text-rose-950', icon: 'fa-utensils text-rose-600' },
                { title: 'كاشير لا يتوقف', desc: 'نقطة بيع سريعة تعمل بكفاءة عالية في أوقات الذروة.', bg: 'bg-sky-50 border-sky-200 text-sky-950', icon: 'fa-cash-register text-sky-600' },
                { title: 'مخزون يخصم تلقائياً', desc: 'تتبع الكميات والمكونات مع كل فاتورة مبيعات.', bg: 'bg-amber-50 border-amber-200 text-amber-950', icon: 'fa-boxes-stacked text-amber-600' },
                { title: 'الربح والخسارة', desc: 'تقارير مالية دقيقة لصافي الأرباح والمصروفات.', bg: 'bg-purple-50 border-purple-200 text-purple-950', icon: 'fa-chart-pie text-purple-600' },
                { title: 'صلاحيات ونقدية', desc: 'تحكم كامل في ورديات الكاشير وحركة الخزينة.', bg: 'bg-blue-50 border-blue-200 text-blue-950', icon: 'fa-user-shield text-blue-600' },
                { title: 'عملاء يعودون', desc: 'قاعدة بيانات عملاء وولاء لزيادة تكرار الطلبات.', bg: 'bg-pink-50 border-pink-200 text-pink-950', icon: 'fa-heart text-pink-600' }

                { name: 'احترافية', price: isYearly ? 399 : 499, desc: 'الأكثر طلباً: منيو + كاشير POS + تقارير كاملة', featured: true },
                { name: 'تجارية', price: isYearly ? 1599 : 1999, desc: 'للسلاسل والفروع المتعددة والإدارة المتقدمة', featured: false }
            ];

            const faqs = [
                { q: 'هل أحتاج أدخل المنيو صنف صنف؟', a: 'لا إطلاقاً! ارفع صورة المنيو أو ملف PDF أو Excel، وسيقوم الذكاء الاصطناعي باستخراج الأقسام والأصناف والأسعار في دقائق.' },
                { q: 'هل أحتاج بطاقة ائتمان؟', a: 'لا، يمكنك بدء التجربة المجانية لمدة 7 أيام فوراً بدون أي بطاقة ائتمان أو بيانات بنكية.' },
                { q: 'ماذا يحدث بعد 7 أيام؟', a: 'تختار الباقة المناسبة لنشاطك وتستمر بياناتك ومنيوهاتك كما هي دون أي فقدان أو خصم تلقائي.' },
                { q: 'هل يمكن للعملاء الطلب من المنيو؟', a: 'نعم، يدعم المنيو الطلب من الطاولة، التوصيل للمنزل، والاستلام من الفرع مع الدفع نقداً أو فودافون كاش.' },

                    <section class="max-w-4xl mx-auto px-4 pt-8 pb-10 space-y-6 text-center">

                            <img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=900" alt="QR Menu" class="w-full h-64 sm:h-80 object-cover">
                        </div>
                        <div class="space-y-3 max-w-2xl mx-auto">
                            <h1 class="text-3xl sm:text-4xl font-black leading-tight">استقبل طلباتك من المنيو الإلكتروني بدون عمولة</h1>
                            <p class="text-base sm:text-lg opacity-80 font-bold leading-relaxed">ارفع صورة المنيو والذكاء الاصطناعي هيعملها في دقائق ثم شاركها برمز QR</p>

                    <section class="max-w-4xl mx-auto px-4 py-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="p-6 rounded-3xl border ${card} text-center shadow-xs">
                                <span class="text-2xl sm:text-3xl font-black text-emerald-600 block">7,500+</span>

                            </div>

                                <span class="text-2xl sm:text-3xl font-black text-emerald-600 block">150,000+</span>
                                <span class="text-sm opacity-80 mt-1 block">زيارة للمنيوهات</span>
                            </div>
                        </div>
                    </section>

                    <section class="max-w-5xl mx-auto px-4 py-10 space-y-6">

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">

                                <button onclick="appState.billingCycle='monthly'; render();" class="px-5 py-2 rounded-2xl text-sm font-black transition ${!isYearly?'bg-emerald-600 text-white':'text-slate-700'}">شهري</button>

                        <div class="space-y-3">
                            ${faqs.map((item, idx) => {
                                const isOpen = appState.openFaqIndex === idx;
                                return `
                                    <div class="rounded-3xl border ${card} overflow-hidden">
                                        <button onclick="appState.openFaqIndex = ${isOpen ? -1 : idx}; render();" class="w-full p-5 text-right font-black text-base flex justify-between items-center">
                                            <span>${item.q}</span>
                                            <i class="fa-solid ${isOpen?'fa-chevron-up text-emerald-600':'fa-chevron-down'}"></i>

                                        ${isOpen ? `<div class="px-5 pb-5 text-sm opacity-80 leading-relaxed border-t ${dm?'border-slate-800':'border-slate-100'} pt-3">${item.a}</div>` : ''}

                    const base64Img = e.target.result;
                    appState.obData.aiStage = 'processing';
                    const stages = ['قراءة الصورة والتعرف البصري (OCR)...', 'استخراج الأقسام...', 'تحليل أسماء الأصناف والأسعار...', 'تجهيز المنيو للمراجعة...'];
                    let i = 0;
                    appState.obData.aiStepText = stages[0];
                    render();

                    const timer = setInterval(() => {
                        i++;
                        if(i < stages.length) {
                            appState.obData.aiStepText = stages[i];
                            render();
                        } else {
                            clearInterval(timer);
                            appState.obData.extractedProducts = [
                                { id: 'ai_1', name: 'وجبة مميزة مستخرجة من صورتك (1)', price: 150, category: 'مشويات', image: base64Img },

                                { id: 'ai_3', name: 'ساندوتش خاص', price: 55, category: 'ساندوتشات', image: base64Img },
                                { id: 'ai_4', name: 'طاجن بالفرن', price: 180, category: 'طواجن', image: base64Img },
                                { id: 'ai_5', name: 'مقبلات وسلطة', price: 30, category: 'مقبلات وسلطات', image: base64Img }

                        </div>

                    <div class="max-w-4xl mx-auto px-4 pt-4 space-y-3">

                                    ${c === 'all' ? 'الكل' : c}

                            `).join('')}

                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2">

                                    <button onclick="appState.posOrderType='pickup'; render();" class="py-2.5 rounded-2xl border ${appState.posOrderType==='pickup'?'bg-emerald-50 border-emerald-600 text-emerald-900':'bg-white border-slate-200'}">استلام</button>

                                    ${appState.posCart.map((item, idx) => `

                                            </div>
                                        </div>
                                    `).join('')}
                                </div>

                                <div class="space-y-2 text-xs">
                                    <input oninput="appState.posCustomer=this.value" value="${appState.posCustomer}" placeholder="الاسم أو رقم الهاتف أو رقم الطلب" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-2xl font-bold">
                                    <div class="grid grid-cols-2 gap-2">
                                        <input type="number" oninput="appState.posDiscount=Number(this.value)||0; render();" value="${appState.posDiscount||''}" placeholder="خصم يدوي ج.م" class="bg-slate-50 border border-slate-200 p-3 rounded-2xl font-bold">

                                    <button onclick="appState.posPayment='vodafone'; render();" class="py-3 rounded-2xl border ${appState.posPayment==='vodafone'?'bg-emerald-50 border-emerald-600 text-emerald-900':'bg-white border-slate-200'}">فودافون كاش</button>
                                </div>

                                <div class="space-y-2 text-xs">
                                    <div class="flex gap-2">
                                        <input type="number" oninput="appState.posPaid=Number(this.value)||0; render();" value="${appState.posPaid||''}" placeholder="ما دفعه العميل" class="flex-1 bg-slate-50 border border-slate-200 p-3 rounded-2xl font-bold">

                                        معلق
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addPosItem(id, name, price){
            const f = appState.posCart.find(x => x.id === id);
            if(f) f.qty++; else appState.posCart.push({ id, name, price, qty: 1 });
            render();
        }

        function finishPosSale(shopId, total){
            if(appState.posCart.length === 0) return;
            const shop = globalDB.shops[shopId];
            if(!shop.orders) shop.orders = [];
            shop.orders.unshift({
                id: Math.floor(1000 + Math.random() * 9000),
                source: 'الكاشير',
                type: appState.posOrderType,
                status: 'مؤكد',
                customerName: appState.posCustomer || 'عميل كاشير',
                phone: shop.phone,
                items: JSON.parse(JSON.stringify(appState.posCart)),
                total: total
            });
            appState.posCart = [];
            appState.posDiscount = 0;
            appState.posPaid = 0;
            appState.posCloseModalOpen = false;
            syncCloud();
            alert('✓ تم إنهاء الفاتورة بنجاح!');
            render();
        }

        // ================= 8. صفحة الطلبات للتاجر مع زر تأكيد التحويل =================

                const matchStatus = appState.orderStatusFilter === 'الكل' || o.status === appState.orderStatusFilter;

                            <input type="text" oninput="appState.orderSearch=this.value; render();" value="${appState.orderSearch}" placeholder="رقم الطلب، اسم العميل، رقم الهاتف" class="w-full bg-white border border-slate-200 py-3.5 pr-10 pl-4 rounded-2xl text-sm font-bold outline-none">

                            `).join('')}
                        </div>

                        <div class="flex gap-2 overflow-x-auto hide-scrollbar">
                            ${['كل المصادر', 'الكاشير', 'المنيو'].map(src => `

                                <button onclick="alert('تم تجهيز ملف SVG للتحميل')" class="bg-white border border-slate-200 text-slate-900 py-3 rounded-2xl">SVG</button>
                                <button onclick="window.print()" class="bg-white border border-slate-200 text-slate-900 py-3 rounded-2xl">PDF</button>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-4 shadow-2xs">
                            <div class="flex justify-between items-center">
                                <h2 class="text-base font-black">رموز QR للطاولات</h2>
                                <button onclick="if(!shop.tables) shop.tables=[]; shop.tables.push('طاولة '+(shop.tables.length+1)); syncCloud(); render();" class="bg-emerald-600 text-white px-3.5 py-2 rounded-2xl text-xs font-black">+ إضافة طاولة</button>
                            </div>

                            ${tables.length === 0 ? `
                                <p class="text-center text-slate-400 py-8 text-sm font-black">لا توجد طاولات بعد</p>
                            ` : `
                                <div class="grid grid-cols-2 gap-3">
                                    ${tables.map((t, idx) => `
                                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl text-center space-y-2">
                                            <span class="font-black text-sm block">${t}</span>
                                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(storeUrl + '&t=' + (idx+1))}" class="w-28 h-28 mx-auto">
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminPanel(){
            return renderLandingPage();
        }

        render();
    </script>
</body>
</html>
