        // ================= 2. APP STATE & ROUTER =================
        const state = {
            page: 'builder', // 'landing' | 'builder' | 'storefront' | 'dashboard' (Started on builder as requested)
            builderStep: 1,  // 1 | 2 | 3 | 4
            magicTab: 'vision', // 'vision' | 'paste' | 'manual'
            extractedStaging: [], // For editable AI extraction table
            isExtracting: false,
            uploadedPreviews: [],
            // Storefront state
            activeCat: 'all',
            searchQuery: '',
            cart: [],
            cartOpen: false,
            customerName: '',
            customerPhone: '',
            customerAddress: '',
            orderType: 'delivery'
        };

        function setPage(p) {
            state.page = p;
            if (p === 'storefront') {
                db.restaurant.views = (db.restaurant.views || 0) + 1;
                saveDB();
            }
            render();
            window.scrollTo(0, 0);
        }

        // ================= 3. AI EXTRACTION & PARSER LOGIC =================
        function normalizeArabicNumbers(str) {
            const arabicNums = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return str.replace(/[٠-٩]/g, d => arabicNums.indexOf(d));
        }

        function handleImageUpload(event) {
            const files = Array.from(event.target.files).slice(0, 10);
            if (!files.length) return;
            state.uploadedPreviews = files.map(f => ({ name: f.name, url: URL.createObjectURL(f) }));
            render();
        }

        function runVisionAIExtraction() {
            if (state.uploadedPreviews.length === 0) {
                alert('⚠️ يرجى رفع صورة واحدة على الأقل للمنيو أولاً.');
                return;
            }
            state.isExtracting = true;
            render();

            // Simulating OpenAI GPT-4o Vision OCR API call
            setTimeout(() => {
                state.isExtracting = false;
                state.extractedStaging = [
                    { category: 'المشويات', name: 'طرب ضاني مشوي على الفحم', price: 320, description: 'قطع طرب بلدي متبلة مشوية بعناية' },
                    { category: 'المشويات', name: 'ريش ضاني بتلو', price: 410, description: 'ريش مشوية تقدم مع أرز بالخلطة' },
                    { category: 'طواجن وسندوتشات', name: 'حواوشي إسكندراني بالجبنة', price: 85, description: 'لحم مفروم بلدي مع موتزاريلا وفلفل' },
                    { category: 'المقبلات والمشروبات', name: 'بابا غنوج مشوي', price: 30, description: 'باذنجان مشوي بالطحينة وزيت الزيتون' }
                ];
                render();
            }, 1600);
        }

        function parsePastedMenuText() {
            const rawEl = document.getElementById('paste_textarea');
            if (!rawEl || !rawEl.value.trim()) {
                alert('⚠️ الصق نص المنيو في المربع أولاً.');
                return;
            }
            const normalized = normalizeArabicNumbers(rawEl.value);
            // Split by newlines or commas
            const lines = normalized.split(/\n|,|،/).map(l => l.trim()).filter(Boolean);
            const parsed = [];
            // Prompt Regex: /(.*?)\s+(\d+)\s*(جنيه|EGP|ج)?$/
            const regex = /(.*?)\s*[-:–]?\s*(\d+)\s*(جنيه|جنيهاً|جـ|EGP|ج)?$/i;

            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const name = match[1].replace(/[-:–]+$/, '').trim();
                    const price = parseInt(match[2], 10);
                    let autoCat = 'طواجن وسندوتشات';
                    if (/كباب|كفتة|فراخ|شيش|مشوي|لحم|ستيك|طرب|ريش/.test(name)) autoCat = 'المشويات';
                    else if (/بيبسي|كولا|عصير|سلطة|طحينة|مياه|شاي/.test(name)) autoCat = 'المقبلات والمشروبات';

                    if (name && !isNaN(price)) {
                        parsed.push({ category: autoCat, name, price, description: 'مستخرج تلقائياً' });
                    }
                }
            });

            if (parsed.length === 0) {
                alert('⚠️ لم يتم التعرف على أسعار. تأكد أن كل سطر ينتهي بالسعر مثل: كبدة 50');
                return;
            }
            state.extractedStaging = parsed;
            render();
        }

        function updateStagingRow(idx, field, val) {
            if (field === 'price') val = Number(val) || 0;
            state.extractedStaging[idx][field] = val;
        }

        function removeStagingRow(idx) {
            state.extractedStaging.splice(idx, 1);
            render();
        }

        function confirmAndImportStaging() {
            if (!state.extractedStaging.length) return;
            state.extractedStaging.forEach(item => {
                let cat = db.categories.find(c => c.name === item.category);
                if (!cat) {
                    cat = { id: 'cat_' + Date.now() + Math.random().toString(36).substr(2, 4), name: item.category, order: db.categories.length + 1 };
                    db.categories.push(cat);
                }
                db.menu_items.push({
                    id: 'itm_' + Date.now() + Math.random().toString(36).substr(2, 4),
                    category_id: cat.id,
                    name: item.name,
                    description: item.description || '',
                    price: item.price,
                    image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&q=60',
                    is_available: true,
                    tags: ['جديد AI']

            state.extractedStaging = [];
            state.uploadedPreviews = [];
            saveDB();
            alert('✅ تم اعتماد الأصناف وإضافتها لمنيو مطعمك بنجاح!');
            render();
        }

            return h >= openHour && h < closeHour;

                    <!-- Sticky Cart Bar -->

                    <!-- WhatsApp Checkout Modal -->

                                    <textarea rows="2" oninput="state.customerAddress=this.value" placeholder="العنوان بالتفصيل (أو اكتب استلام من الفرع)..." class="w-full bg-slate-950 border border-white/10 rounded-xl p-3 text-white">${state.customerAddress}</textarea>
                                </div>

                                <div class="flex justify-between items-center pt-2 border-t border-white/10 font-black text-sm">
                                    <span>الإجمالي النهائي</span>
                                    <span class="text-amber-400">${cartTotal} ج.م</span>
                                </div>

                                <button onclick="checkoutViaWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-2xl text-xs shadow-lg flex items-center justify-center gap-2">
                                    <i class="fa-brands fa-whatsapp text-base"></i> تأكيد وإرسال الطلب الآن
                                </button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addCart(itemId) {
            const item = db.menu_items.find(i => i.id === itemId);
            if (!item) return;
            const existing = state.cart.find(c => c.id === itemId);
            if (existing) existing.qty++;
            else state.cart.push({ ...item, qty: 1 });
            render();
        }

        function updateCartQty(idx, delta) {
            state.cart[idx].qty += delta;
            if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
            if (state.cart.length === 0) state.cartOpen = false;
            render();
        }

        function checkoutViaWhatsApp() {
            if (!state.customerName.trim() || !state.customerPhone.trim()) {
                alert('⚠️ يرجى كتابة الاسم ورقم الهاتف.');
                return;
            }
            const total = state.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
            const newOrder = {
                id: orderId,
                customer_name: state.customerName.trim(),
                phone: state.customerPhone.trim(),
                items_json: JSON.parse(JSON.stringify(state.cart)),
                total,
                status: 'new',
                created_at: 'الآن'
            };
            db.orders.unshift(newOrder);
            saveDB();

            const lines = state.cart.map(i => `• ${i.qty}x ${i.name} (${i.price * i.qty} ج.م)`).join('%0A');
            const msg = `*طلب جديد - ${db.restaurant.name}*%0Aرقم الطلب: ${orderId}%0Aالاسم: ${newOrder.customer_name}%0Aالهاتف: ${newOrder.phone}%0Aالعنوان: ${state.customerAddress || 'استلام فرع'}%0A%0A*الطلبات:*%0A${lines}%0A%0A*الإجمالي: ${total} ج.م*`;
            
            state.cart = [];
            state.cartOpen = false;
            render();
            window.open(`https://wa.me/${db.restaurant.phone}?text=${msg}`, '_blank');
        }
