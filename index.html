<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سُفرة تك | المنصة السحابية للمطاعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
    <div id="app"></div>
    <div id="printable-receipt" class="hidden"></div>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358",
            measurementId: "G-HXW0T44XM3"
        };

        let fbDB = null;
        try {
            firebase.initializeApp(firebaseConfig);
            fbDB = firebase.database();
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        const DEFAULT_STORE = {
            restaurant: {
                name: 'مطعم الطاهي البلدي',
                taglet: 'أصل المذاق المصري الأصيل',
                logo: '🍖',
                whatsapp: '201015861991',
                deliveryFee: 15,
                pin: '1234' // كلمة سر الكاشير الافتراضية قابلة للتغيير
            },
            menu: [
                { id: 101, name: 'بيف برجر دبل تشيز', price: 140, desc: 'شريحتين لحم بقرى طازج مع الجبن المذيب', img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&auto=format&fit=crop&q=60' },
                { id: 102, name: 'كباب بتلو مشوي على الفحم', price: 240, desc: 'قطع لحم بتلو طازجة مشوية على الفحم البلدي', img: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&auto=format&fit=crop&q=60' }
            ],
            orders: []
        };

        let store = JSON.parse(JSON.stringify(DEFAULT_STORE));

        // مزامنة سحابية شاملة للمتجر والمنيو والطلبات
        if (fbDB) {
            fbDB.ref('store').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    store = val;
                    if (!store.orders) store.orders = [];
                    if (!store.menu) store.menu = [];
                } else {
                    saveStore();
                }
                render();
            });
        }

        function saveStore() {
            localStorage.setItem('sofratech_full_store', JSON.stringify(store));
            if (fbDB) {
                fbDB.ref('store').set(store);
            }
        }

        const ui = {
            route: 'landing',
            cart: [],
            phone: '',
            customerName: '',
            deliveryMethod: 'branch',
            address: '',
            lastOrder: null,
            cashierUnlocked: false
        };

        function syncRoute() {
            const hash = window.location.hash || '';
            if (hash.includes('#menu')) ui.route = 'menu';
            else if (hash.includes('#builder')) ui.route = 'builder';
            else if (hash.includes('#cashier')) ui.route = 'cashier';
            else if (hash.includes('#track')) ui.route = 'track';
            else ui.route = 'landing';
            render();
        }

        window.addEventListener('hashchange', syncRoute);
        function navigate(h) { window.location.hash = h; }

        function render() {
            const app = document.getElementById('app');
            let content = '';
            if (ui.route === 'landing') content = renderLanding();
            else if (ui.route === 'builder') content = renderBuilder();
            else if (ui.route === 'menu') content = renderMenu();
            else if (ui.route === 'cart') content = renderCart();
            else if (ui.route === 'checkout') content = renderCheckout();
            else if (ui.route === 'track') content = renderTrack();
            else if (ui.route === 'cashier') content = renderCashier();
            app.innerHTML = content;
        }

        function renderLanding() {
            const base = window.location.origin + window.location.pathname;
            return `
                <div class="min-h-screen bg-slate-950 text-white p-6 flex flex-col items-center justify-center text-center space-y-6">
                    <div class="w-20 h-20 rounded-3xl bg-amber-500 text-slate-950 flex items-center justify-center text-4xl font-black shadow-xl">${store.restaurant.logo}</div>
                    <div>
                        <h1 class="text-3xl font-black mb-2">${store.restaurant.name}</h1>
                        <p class="text-slate-400 text-xs">${store.restaurant.taglet}</p>
                    </div>
                    <div class="flex flex-col gap-3 w-full max-w-xs">
                        <button onclick="navigate('#menu')" class="bg-amber-500 text-slate-950 font-black py-4 rounded-2xl text-sm shadow-lg">📱 تصفح المنيو والطلب</button>
                        <button onclick="navigate('#builder')" class="bg-slate-900 border border-slate-800 text-amber-400 font-black py-3.5 rounded-2xl text-xs">⚙️ إعدادات المتجر والمنيو ورقم السر</button>
                        <button onclick="navigate('#cashier')" class="bg-slate-900 border border-slate-800 text-emerald-400 font-black py-3.5 rounded-2xl text-xs">🖥️ شاشة الكاشير السحابية</button>
                    </div>
                </div>
            `;
        }

        function renderBuilder() {
            return `
                <div class="min-h-screen bg-slate-950 text-white p-4 max-w-xl mx-auto space-y-6 pb-20">
                    <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                        <button onclick="navigate('#menu')" class="text-xs bg-slate-900 px-3 py-1.5 rounded-xl">المنيو</button>
                        <h1 class="font-black text-sm text-amber-400">⚙️ إعدادات المتجر والكاشير</h1>
                        <button onclick="navigate('#landing')" class="text-xs bg-slate-900 px-3 py-1.5 rounded-xl">الرئيسية</button>
                    </div>

                    <!-- بيانات المطعم -->
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3 text-xs">
                        <h2 class="font-black text-amber-400 mb-2">بيانات المطعم الأساسية</h2>
                        <label class="block text-slate-400">اسم المطعم</label>
                        <input type="text" id="b_name" value="${store.restaurant.name}" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white font-bold">
                        
                        <label class="block text-slate-400">شعار المطعم (Tagline)</label>
                        <input type="text" id="b_tag" value="${store.restaurant.taglet}" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white font-bold">
                        
                        <label class="block text-slate-400">إيموجي أو لوجو</label>
                        <input type="text" id="b_logo" value="${store.restaurant.logo}" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white font-bold">

                        <label class="block text-slate-400">رقم واتساب استلام الطلبات</label>
                        <input type="text" id="b_wa" value="${store.restaurant.whatsapp}" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white font-bold">

                        <label class="block text-slate-400">رسوم التوصيل (ج.م)</label>
                        <input type="number" id="b_fee" value="${store.restaurant.deliveryFee}" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white font-bold">

                        <label class="block text-emerald-400 font-bold">🔑 كلمة سر شاشة الكاشير (PIN)</label>
                        <input type="text" id="b_pin" value="${store.restaurant.pin}" class="w-full bg-slate-950 border border-emerald-500/50 p-2.5 rounded-xl text-emerald-400 font-black text-center text-lg">

                        <button onclick="saveRestConfig()" class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs mt-2">حفظ إعدادات المتجر</button>
                    </div>

                    <!-- إدارة المنيو -->
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-4 text-xs">
                        <h2 class="font-black text-amber-400">إدارة أصناف المنيو</h2>
                        
                        <div class="space-y-2">
                            ${store.menu.map((item, idx) => `
                                <div class="bg-slate-950 p-3 rounded-xl flex justify-between items-center border border-slate-800">
                                    <div>
                                        <p class="font-bold text-white">${item.name} — <span class="text-amber-400">${item.price} ج.م</span></p>
                                        <p class="text-[10px] text-slate-400">${item.desc}</p>
                                    </div>
                                    <button onclick="deleteMenuItem(${idx})" class="text-red-400 bg-red-500/10 px-2.5 py-1 rounded-lg font-bold">حذف</button>
                                </div>
                            `).join('')}
                        </div>

                        <div class="border-t border-slate-800 pt-3 space-y-2">
                            <p class="font-bold text-slate-300">➕ إضافة صنف جديد للمنيو</p>
                            <input type="text" id="m_name" placeholder="اسم الوجبة (مثلاً: برجر لحم)" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white">
                            <input type="number" id="m_price" placeholder="السعر (ج.م)" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white">
                            <input type="text" id="m_desc" placeholder="وصف وجيز..." class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white">
                            <input type="text" id="m_img" placeholder="رابط صورة الوجبة (URL)" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white">
                            <button onclick="addMenuItem()" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl text-xs">إضافة الصنف للمنيو</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveRestConfig() {
            store.restaurant.name = document.getElementById('b_name').value.trim();
            store.restaurant.taglet = document.getElementById('b_tag').value.trim();
            store.restaurant.logo = document.getElementById('b_logo').value.trim();
            store.restaurant.whatsapp = document.getElementById('b_wa').value.trim();
            store.restaurant.deliveryFee = parseFloat(document.getElementById('b_fee').value) || 0;
            store.restaurant.pin = document.getElementById('b_pin').value.trim() || '1234';
            saveStore();
            alert('✅ تم حفظ إعدادات المتجر وكلمة السر بنجاح!');
        }

        function addMenuItem() {
            const name = document.getElementById('m_name').value.trim();
            const price = parseFloat(document.getElementById('m_price').value);
            const desc = document.getElementById('m_desc').value.trim();
            const img = document.getElementById('m_img').value.trim() || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=60';

            if (!name || isNaN(price)) {
                alert('⚠️ يرجى إدخال اسم الصنف والسعر بشكل صحيح!');
                return;
            }

            store.menu.push({ id: Date.now(), name, price, desc, img });
            saveStore();
            render();
            alert('✅ تم إضافة الصنف للمنيو!');
        }

        function deleteMenuItem(idx) {
            store.menu.splice(idx, 1);
            saveStore();
            render();
        }

        function renderMenu() {
            const count = ui.cart.reduce((s, i) => s + i.qty, 0);
            const total = ui.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const activeOrder = store.orders.find(o => o.phone === ui.phone && o.status !== 'delivered');

            return `
                <div class="min-h-screen bg-slate-950 text-white pb-28">
                    <header class="sticky top-0 bg-slate-950/90 backdrop-blur border-b border-slate-800 p-4 flex justify-between items-center z-30">
                        <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('#landing')">
                            <span class="text-xl">${store.restaurant.logo}</span>
                            <span class="font-black text-sm">${store.restaurant.name}</span>
                        </div>
                        <div class="flex gap-2">
                            ${activeOrder ? `<button onclick="navigate('#track')" class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1.5 rounded-xl border border-emerald-500/30 font-bold animate-pulse">تتبع طلبك</button>` : ''}
                            <button onclick="navigate('#builder')" class="bg-slate-900 border border-slate-800 text-amber-400 px-3 py-1.5 rounded-xl text-xs">الإعدادات</button>
                            <button onclick="ui.route='cart'; render();" class="relative bg-slate-900 px-3 py-1.5 rounded-xl text-xs border border-slate-800">
                                السلة (${count})
                            </button>
                        </div>
                    </header>
                    <div class="p-4 max-w-xl mx-auto space-y-4">
                        ${store.menu.length === 0 ? `<div class="text-center text-slate-500 p-10">لا توجد أصناف في المنيو حالياً. أضفها من قسم الإعدادات.</div>` : ''}
                        ${store.menu.map(item => `
                            <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl flex gap-4 items-center">
                                <img src="${item.img}" class="w-20 h-20 rounded-xl object-cover">
                                <div class="flex-1">
                                    <h3 class="font-black text-sm">${item.name}</h3>
                                    <p class="text-[11px] text-slate-400 mt-0.5">${item.desc}</p>
                                    <div class="flex justify-between items-center mt-2">
                                        <span class="font-bold text-amber-400 text-xs">${item.price} ج.م</span>
                                        <button onclick="addToCart(${item.id})" class="bg-amber-500 text-slate-950 px-3 py-1 rounded-lg text-xs font-black">إضافة +</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    ${count > 0 ? `
                        <div class="fixed bottom-4 left-4 right-4 max-w-lg mx-auto">
                            <button onclick="ui.route='cart'; render();" class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-2xl text-xs shadow-lg flex justify-between px-6">
                                <span>عرض السلة وإتمام الطلب</span>
                                <span>${total} ج.م</span>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addToCart(id) {
            const item = store.menu.find(m => m.id === id);
            const found = ui.cart.find(c => c.id === id);
            if (found) found.qty++;
            else ui.cart.push({ ...item, qty: 1 });
            render();
        }

        function renderCart() {
            return `
                <div class="min-h-screen bg-slate-950 text-white p-4 max-w-lg mx-auto space-y-4">
                    <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                        <button onclick="ui.route='menu'; render();" class="text-xs bg-slate-900 px-3 py-1.5 rounded-xl">المنيو</button>
                        <h1 class="font-black text-sm">سلة المشتريات</h1>
                        <button onclick="ui.cart=[]; render();" class="text-xs text-red-400">مسح</button>
                    </div>
                    <div class="space-y-2">
                        ${ui.cart.map(i => `
                            <div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center text-xs">
                                <span>${i.name} (${i.qty})</span>
                                <span class="text-amber-400">${i.price * i.qty} ج.م</span>
                            </div>
                        `).join('')}
                    </div>
                    ${ui.cart.length > 0 ? `<button onclick="ui.route='checkout'; render();" class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs">متابعة لتأكيد الطلب</button>` : ''}
                </div>
            `;
        }

        function renderCheckout() {
            const subtotal = ui.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const fee = ui.deliveryMethod === 'home' ? store.restaurant.deliveryFee : 0;
            const total = subtotal + fee;

            return `
                <div class="min-h-screen bg-slate-950 text-white p-4 max-w-lg mx-auto space-y-4">
                    <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                        <button onclick="ui.route='cart'; render();" class="text-xs bg-slate-900 px-3 py-1.5 rounded-xl">السلة</button>
                        <h1 class="font-black text-sm">إتمام الطلب</h1>
                        <div></div>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-2xl space-y-3 text-xs">
                        <label class="block text-slate-400">رقم الهاتف *</label>
                        <input type="tel" id="chk_phone" value="${ui.phone}" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white font-bold">
                        <label class="block text-slate-400">الاسم *</label>
                        <input type="text" id="chk_name" value="${ui.customerName}" placeholder="اسمك الكريم" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white font-bold">
                        <div class="grid grid-cols-2 gap-2 pt-2">
                            <button onclick="ui.deliveryMethod='branch'; render();" class="py-2.5 rounded-xl border font-bold ${ui.deliveryMethod==='branch'?'border-amber-500 bg-amber-500/20 text-amber-400':'border-slate-800'}">استلام من الفرع</button>
                            <button onclick="ui.deliveryMethod='home'; render();" class="py-2.5 rounded-xl border font-bold ${ui.deliveryMethod==='home'?'border-amber-500 bg-amber-500/20 text-amber-400':'border-slate-800'}">توصيل دليفري</button>
                        </div>
                        ${ui.deliveryMethod==='home' ? `<textarea id="chk_address" placeholder="العنوان بالتفصيل..." class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white mt-2">${ui.address}</textarea>` : ''}
                    </div>
                    <button onclick="submitOrder()" class="w-full bg-emerald-600 text-white font-black py-3.5 rounded-xl text-xs shadow-lg">تأكيد الطلب وإرسال الواتساب 🚀</button>
                </div>
            `;
        }

        function submitOrder() {
            const phone = document.getElementById('chk_phone').value.trim();
            const name = document.getElementById('chk_name').value.trim();
            const addrEl = document.getElementById('chk_address');
            const address = addrEl ? addrEl.value.trim() : 'استلام من الفرع';

            if (!phone || !name) { alert('⚠️ أدخل الاسم ورقم الهاتف'); return; }
            ui.phone = phone; ui.customerName = name; ui.address = address;

            const subtotal = ui.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const fee = ui.deliveryMethod === 'home' ? store.restaurant.deliveryFee : 0;
            const total = subtotal + fee;

            const orderObj = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customer: name,
                phone: phone,
                address: address,
                items: JSON.parse(JSON.stringify(ui.cart)),
                total: total,
                status: 'pending'
            };

            store.orders.unshift(orderObj);
            saveStore();
            ui.lastOrder = orderObj;
            ui.cart = [];

            const itemsText = orderObj.items.map(i => `- ${i.qty}x ${i.name} (${i.price * i.qty}ج)`).join('%0A');
            const waMsg = `🚨 *طلب جديد إلى ${store.restaurant.name}!*%0A🆔 رقم: ${orderObj.id}%0A👤 العميل: ${name}%0A📞 الهاتف: ${phone}%0A📍 العنوان: ${address}%0A%0A🍽️ *الأصناف:*%0A${itemsText}%0A%0A💰 الإجمالي: ${total} ج.م`;
            window.open(`https://wa.me/${store.restaurant.whatsapp}?text=${waMsg}`, '_blank');

            navigate('#track');
        }

        function renderTrack() {
            const ord = store.orders.find(o => o.phone === ui.phone && o.status !== 'delivered') || ui.lastOrder;
            if (!ord) return `<div class="p-6 text-center text-white">لا توجد طلبات نشطة. <button onclick="navigate('#menu')" class="text-amber-400 underline">المنيو</button></div>`;
            
            const steps = [
                { key: 'pending', label: 'قيد المراجعة ⏳' },
                { key: 'preparing', label: 'جاري التحضير 🔥' },
                { key: 'on_the_way', label: 'مع الدليفري 🛵' },
                { key: 'delivered', label: 'تم التسليم ✅' }
            ];
            const idx = steps.findIndex(s => s.key === ord.status);

            return `
                <div class="min-h-screen bg-slate-950 text-white p-4 max-w-lg mx-auto space-y-4">
                    <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                        <button onclick="navigate('#menu')" class="text-xs bg-slate-900 px-3 py-1.5 rounded-xl">المنيو</button>
                        <h1 class="font-black text-sm">تتبع الطلب (${ord.id})</h1>
                        <div></div>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-2xl space-y-4 text-xs">
                        ${steps.map((st, i) => `
                            <div class="flex items-center gap-3 ${i <= idx ? 'text-amber-400 font-bold' : 'text-slate-600'}">
                                <div class="w-6 h-6 rounded-full border flex items-center justify-center ${i <= idx ? 'border-amber-500 bg-amber-500/20' : 'border-slate-700'}">${i < idx ? '✓' : i+1}</div>
                                <span>${st.label}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCashier() {
            if (!ui.cashierUnlocked) {
                return `
                    <div class="min-h-screen bg-slate-950 text-white p-6 flex items-center justify-center">
                        <div class="bg-slate-900 p-6 rounded-3xl max-w-xs w-full text-center space-y-4 border border-slate-800">
                            <h2 class="font-black text-sm text-amber-400">شاشة الكاشير السحابية</h2>
                            <p class="text-[11px] text-slate-400">أدخل كلمة السر الخاصة بمطعمك (افتراضي: 1234 أو ما حددتها في الإعدادات)</p>
                            <input type="password" id="pin_box" placeholder="كلمة السر (PIN)" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-center text-white tracking-widest font-black text-lg">
                            <button onclick="unlock()" class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs">دخول للكاشير</button>
                            <button onclick="navigate('#landing')" class="text-xs text-slate-500 underline">العودة للرئيسية</button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="min-h-screen bg-slate-950 text-white p-4 max-w-3xl mx-auto space-y-4">
                    <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                        <h1 class="font-black text-amber-400 text-sm">🖥️ كاشير ${store.restaurant.name} (متزامن سحابياً ⚡)</h1>
                        <button onclick="ui.cashierUnlocked=false; render();" class="text-xs text-red-400 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800">قفل</button>
                    </div>
                    <div class="space-y-3">
                        ${store.orders.length === 0 ? `<div class="bg-slate-900 p-10 rounded-2xl text-center text-slate-500 text-xs">لا توجد طلبات حالياً. ستظهر فوراً عند إرسالها من أي هاتف!</div>` : store.orders.map((ord, idx) => `
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col md:flex-row justify-between gap-3 text-xs">
                                <div class="space-y-1">
                                    <div class="flex items-center gap-2">
                                        <span class="font-black text-amber-400">${ord.id}</span>
                                        <span class="bg-slate-800 px-2 py-0.5 rounded text-[10px] text-emerald-400">${ord.status}</span>
                                    </div>
                                    <p class="font-bold">👤 ${ord.customer} — 📞 ${ord.phone}</p>
                                    <p class="text-slate-400">📍 ${ord.address}</p>
                                    <div class="text-slate-300 pt-1">${ord.items.map(i => `<div>• ${i.qty}x ${i.name} (${i.price * i.qty} ج)</div>`).join('')}</div>
                                </div>
                                <div class="flex flex-col justify-between items-end gap-2">
                                    <span class="font-black text-amber-400 text-sm">${ord.total} ج.م</span>
                                    <div class="flex gap-1 flex-wrap">
                                        <button onclick="setStatus(${idx}, 'preparing')" class="bg-blue-600 px-2 py-1 rounded text-[10px] font-bold">تحضير</button>
                                        <button onclick="setStatus(${idx}, 'on_the_way')" class="bg-amber-600 px-2 py-1 rounded text-[10px] font-bold">مع الدليفري</button>
                                        <button onclick="setStatus(${idx}, 'delivered')" class="bg-emerald-600 px-2 py-1 rounded text-[10px] font-bold">تم التسليم</button>
                                    </div>
                                    <button onclick="printRec(${idx})" class="bg-slate-800 px-3 py-1 rounded-lg font-bold">طباعة 🧾</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function unlock() {
            const enteredPin = document.getElementById('pin_box').value.trim();
            if (enteredPin === store.restaurant.pin) {
                ui.cashierUnlocked = true;
                render();
            } else {
                alert('❌ كلمة السر غير صحيحة! كلمة السر الافتراضية هي 1234 أو ما حددتها في الإعدادات.');
            }
        }

        function setStatus(idx, status) {
            store.orders[idx].status = status;
            saveStore();
            render();
        }

        function printRec(idx) {
            const ord = store.orders[idx];
            document.getElementById('printable-receipt').innerHTML = `
                <div style="direction:rtl; padding:15px; font-family:Cairo; max-width:280px; background:#fff; color:#000;">
                    <h3 style="text-align:center; margin:0;">${store.restaurant.logo} ${store.restaurant.name}</h3>
                    <p style="text-align:center; font-size:10px; color:#666;">رقم الطلب: ${ord.id}</p>
                    <hr style="border:1px dashed #ccc;">
                    <p style="font-size:11px;">العميل: ${ord.customer} (${ord.phone})</p>
                    <p style="font-size:11px;">العنوان: ${ord.address}</p>
                    <hr style="border:1px dashed #ccc;">
                    ${ord.items.map(i => `<div style="font-size:11px;">${i.name} x${i.qty} = ${i.price*i.qty}ج</div>`).join('')}
                    <hr style="border:1px dashed #ccc;">
                    <h4 style="margin:0; font-size:13px;">الإجمالي: ${ord.total} ج.م</h4>
                </div>
            `;
            window.print();
        }

        syncRoute();
    </script>
</body>
</html>
