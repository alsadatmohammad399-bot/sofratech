        function checkSubscription(rest) {
            if (!rest || !rest.subscription) return false;
            if (rest.subscription.expiresAt && Date.now() > rest.subscription.expiresAt) {
                rest.subscription.isActive = false;
            }
            return rest.subscription.isActive;
        }

        function syncCloud() {
            try {
                localStorage.setItem('tablia_multitenant_2030_v45', JSON.stringify(globalDB));
                if (cloudDB) {
                    cloudDB.ref('tablia_multitenant_enterprise_2030_v45').set(globalDB).catch(() => {});
                }
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_multitenant_enterprise_2030_v45').on('value', (snap) => {
                const data = snap.val();
                if (data && data.restaurants) {
                    if (currentRestId && data.restaurants[currentRestId]) {
                        const oldRest = globalDB.restaurants[currentRestId];
                        const newRest = data.restaurants[currentRestId];
                        const oldOrdersCount = oldRest && oldRest.orders ? oldRest.orders.length : 0;

                    globalDB = data;
                    try { localStorage.setItem('tablia_multitenant_2030_v45', JSON.stringify(globalDB)); } catch(e){}
                    render();

            const root = document.getElementById('app');

                let content = '';
                if(isSuperAdminMode || appState.page === 'superadmin') {
                    content = renderSuperAdminView();

                    content = renderStorefront();

                    content = renderAuthScreen();

                    if(!currentRestId || !globalDB.restaurants || !globalDB.restaurants[currentRestId]) {
                        currentRestId = null;
                        localStorage.removeItem('tablia_logged_rest_id');

                        content = renderAuthScreen();

                        content = renderBuilder();
                    } else if(appState.page === 'cashier') {
                        content = renderCashier();
                    } else if(appState.page === 'inventory') {
                        content = renderInventory();
                    } else if(appState.page === 'attendance') {
                        content = renderAttendance();
                    } else if(appState.page === 'dashboard') {
                        content = renderDashboard();
                    } else if(appState.page === 'qr_print') {
                        content = renderQRPrint();

                </div>
                <div class="flex bg-slate-900 p-1.5 rounded-2xl text-xs border border-slate-800">
                    <button onclick="appState.authTab='login'; render();" class="flex-1 py-3 rounded-xl font-bold transition ${appState.authTab==='login'?'bg-red-600 text-white font-black shadow':'text-slate-400'}">تسجيل دخول</button>
                    <button onclick="appState.authTab='register'; render();" class="flex-1 py-3 rounded-xl font-bold transition ${appState.authTab==='register'?'bg-red-600 text-white font-black shadow':'text-slate-400'}">مطعم جديد (تجربة مجانية)</button>
                </div>
                ${appState.authTab==='login' ? `
                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 text-xs border border-slate-800 shadow-xl">
                        <div><label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label><input id="log_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600"></div>
                        <div><label class="block text-slate-300 mb-1 font-bold">كلمة السر</label><input id="log_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600"></div>

            const phone = document.getElementById('log_phone').value.trim(); 
            const pass = document.getElementById('log_pass').value.trim();
            if(!phone || !pass) { alert('يرجى إدخال رقم الموبايل وكلمة السر'); return; }
            if(cloudDB) {
                cloudDB.ref('tablia_multitenant_enterprise_2030_v45').once('value').then(snap => {
                    const data = snap.val();
                    if(data && data.restaurants) { globalDB = data; localStorage.setItem('tablia_multitenant_2030_v45', JSON.stringify(globalDB)); }
                    verifyLoginData(phone, pass);
                }).catch(() => verifyLoginData(phone, pass));
            } else verifyLoginData(phone, pass);
        }

        function verifyLoginData(phone, pass) {
            let found = false;
            if(globalDB && globalDB.restaurants) {
                for(let id in globalDB.restaurants){ 
                    if(globalDB.restaurants[id].phone === phone && globalDB.restaurants[id].pass === pass){ 
                        currentRestId = id; localStorage.setItem('tablia_logged_rest_id', id); found = true; setPage('builder'); break;
                    } 
                }
            }
            if(!found) alert('بيانات الدخول غير صحيحة.');
        }

        function handleRegister(){
            const owner = document.getElementById('reg_owner').value.trim(); 
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            if(!owner || !name || !phone || !pass){ alert('يرجى استكمال البيانات'); return; }
            const restId = 'rest_' + Date.now();
            if(!globalDB.restaurants) globalDB.restaurants = {};
            const trialExpiry = Date.now() + (2 * 24 * 60 * 60 * 1000);

            globalDB.restaurants[restId] = { 
                id: restId, ownerName: owner, name: name, phone: phone, pass: pass, 
                tablesCount: 20, deliveryFee: 30, deliveryTime: "30 دقيقة", taxPercent: 0, serviceFee: 0,
                address: 'القاهرة، مصر', wifiName: name + '_Free', wifiPass: '357159357',
                coverImage: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800',
                logoImage: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300',
                social: { facebook: '', instagram: '' },
                popupBanner: { enabled: false, image: '', title: 'عروض خاصة 🔥', subtitle: 'اطلب الآن واستمتع بأقوى الخصومات' },
                theme: { mode: 'light', primary: '#163882', accent: '#dc2626', cardStyle: 'rounded' },
                services: { waiterCall: true, wifiService: true, branchLocation: true, deliveryService: true },
                subscription: { isActive: true, expiresAt: trialExpiry }, 
                categories: [{ id: 'cat_1', name: 'العروض والخصومات', icon: '🔥' }, { id: 'cat_2', name: 'الأطباق الرئيسية', icon: '🍽️' }], 
                menu_items: [], orders: [], employees: []
            };
            syncCloud(); currentRestId = restId; localStorage.setItem('tablia_logged_rest_id', restId); 
            alert('🎉 مبروك! تم تفعيل الفترة التجريبية المجانية لمدة يومين.');
            setPage('builder');
        }

        function applyColorPreset(primary, accent) {
            const rest = globalDB.restaurants[currentRestId];
            if(!rest.theme) rest.theme = {};
            rest.theme.primary = primary;
            rest.theme.accent = accent;
            syncCloud(); render();
        }

        function updateCustomColor() {
            const rest = globalDB.restaurants[currentRestId];
            rest.theme.primary = document.getElementById('t_primary').value;
            rest.theme.accent = document.getElementById('t_accent').value;
            rest.theme.mode = document.getElementById('t_mode').value;
            rest.theme.cardStyle = document.getElementById('t_shape').value;
            syncCloud(); render();
        }

        function handleImageUpload(event, field){
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e){
                globalDB.restaurants[currentRestId][field] = e.target.result;
                syncCloud(); render();
            };
            reader.readAsDataURL(file);
        }

        function handlePopupImageUpload(event){
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e){
                if(!globalDB.restaurants[currentRestId].popupBanner) globalDB.restaurants[currentRestId].popupBanner = {};
                globalDB.restaurants[currentRestId].popupBanner.image = e.target.result;
                syncCloud(); render();
            };
            reader.readAsDataURL(file);
        }

        function saveStep1(){ 
            const r = globalDB.restaurants[currentRestId];
            r.name = document.getElementById('r_name').value.trim();
            r.phone = document.getElementById('r_phone').value.trim();
            r.deliveryFee = Number(document.getElementById('r_delivery').value) || 0;
            r.deliveryTime = document.getElementById('r_deliv_time').value.trim() || '30 دقيقة';
            r.address = document.getElementById('r_address').value.trim();
            r.social = {
                facebook: document.getElementById('r_fb').value.trim(),
                instagram: document.getElementById('r_ig').value.trim()
            };
            r.popupBanner.enabled = document.getElementById('pop_enabled').checked;
            r.popupBanner.title = document.getElementById('pop_title').value.trim();
            r.popupBanner.subtitle = document.getElementById('pop_sub').value.trim();
            syncCloud(); appState.builderStep = 2; render();

                            `).join('')}

                    <!-- Add Single Detailed Item Form -->
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <select id="itm_cat" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold">

                            <input id="itm_desc" placeholder="مكونات ووصف الصنف..." class="sm:col-span-2 bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold">

                        <button onclick="addDetailedItem()" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl shadow hover:bg-emerald-500 transition">حفظ وإضافة الصنف للمنيو ✓</button>

                    <!-- Magic Box -->
                    <div class="bg-emerald-950/20 border border-emerald-900/50 p-4 rounded-2xl space-y-2">

                        <textarea id="magic_box" placeholder="حواوشي سادة 95, حواوشي ميكس سجق 145" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-mono" rows="2"></textarea>

                    </div>

                    <button onclick="appState.builderStep=3; render();" class="bg-amber-500 text-slate-950 font-black px-4 py-3.5 rounded-xl w-full shadow-lg">التالي: نشر اللينك وأكواد QR ➔</button>

        function addDetailedItem(){
            const rest = globalDB.restaurants[currentRestId];
            const catId = document.getElementById('itm_cat').value;
            const name = document.getElementById('itm_name').value.trim();
            const price = Number(document.getElementById('itm_price').value);
            const oldPrice = Number(document.getElementById('itm_old_price').value) || null;
            const desc = document.getElementById('itm_desc').value.trim();
            const isFeatured = document.getElementById('itm_featured').checked;
            const fileInput = document.getElementById('itm_img_file');

            if(!name || !price) { alert('يرجى إدخال اسم الصنف والسعر!'); return; }

            const saveItem = (imgData) => {
                rest.menu_items.push({
                    id: 'itm_' + Date.now(),
                    category_id: catId,
                    name,
                    description: desc || 'معد بعناية فائقة من أجود المكونات الطازجة',
                    price,
                    old_price: oldPrice,
                    image: imgData || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400',
                    is_featured: isFeatured,
                    stock: 50,
                    is_available: true
                });
                syncCloud();
                render();
            };

            if(fileInput && fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = e => saveItem(e.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveItem(null);
            }
        }

        function addCategoryPrompt(){
            const name = prompt('أدخل اسم القسم الجديد (مثال: خصومات، مشويات، بوكسات):');
            if(!name) return;
            const rest = globalDB.restaurants[currentRestId];
            rest.categories.push({ id: 'cat_' + Date.now(), name: name.trim(), icon: '🍽️' });
            syncCloud(); render();
        }

        function deleteCategory(catId){
            const rest = globalDB.restaurants[currentRestId];
            if(rest.categories.length <= 1) { alert('يجب وجود قسم واحد على الأقل.'); return; }
            rest.categories = rest.categories.filter(c => c.id !== catId);
            syncCloud(); render();
        }

        function parseSmartMagicText(){
            const rest = globalDB.restaurants[currentRestId];
            const text = document.getElementById('magic_box').value.trim(); 
            if(!text) return;
            const catId = rest.categories[0]?.id || 'cat_1';
            text.split('\n').forEach(line => {
                line.split(',').forEach(str => {
                    const m = str.match(/\d+/);
                    if(!m) return;
                    const price = Number(m[0]);
                    const name = str.replace(m[0], '').replace(/جنيه|ج/g, '').trim();
                    if(name) {

                    ${appState.addressModalOpen ? `

        function captureDetailedGPS(){
            appState.customerDetails.gpsLocation = 'جاري تحديد موقعك...';
            render();
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    appState.customerDetails.gpsLocation = `GPS (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
                    render();
                }, () => {
                    appState.customerDetails.gpsLocation = 'تعذر تحديد الموقع تلقائياً';
                    render();
                });
            }
        }

        function addToCart(id){
            const restId = targetRestSlug || currentRestId || (globalDB && globalDB.restaurants ? Object.keys(globalDB.restaurants)[0] : null);
            const rest = globalDB.restaurants[restId];
            if(!rest || !checkSubscription(rest)) { alert('المطعم غير مفعل حالياً.'); return; }
            const item = rest.menu_items.find(i => i.id === id);
            if(!item) return;
            const found = appState.cart.find(c => c.id === id);
            if(found) found.qty++; else appState.cart.push({...item, qty: 1});
            render();
        }

        function changeCartQty(idx, delta){
            if(!appState.cart[idx]) return;
            appState.cart[idx].qty += delta;
            if(appState.cart[idx].qty <= 0) appState.cart.splice(idx, 1);
            render();
        }

        function submitCustomerOrder(restId, grandTotal, itemsTotal, deliveryFee){
            const rest = globalDB.restaurants[restId];
            const d = appState.customerDetails;
            if(!d.name.trim() || !d.phone.trim()) { alert('يرجى إدخال الاسم ورقم الموبايل!'); return; }
            if(appState.paymentMethod !== 'cash' && !appState.transferRefInput.trim()) {
                alert('يرجى إدخال رقم المحفظة أو رقم عملية التحويل.'); return;
            }

            let fullAddress = appState.orderType === 'dine-in' ? appState.tableNumber : (appState.orderType === 'pickup' ? 'استلام من الفرع' : '');
            if(appState.orderType === 'delivery') {
                fullAddress = `${d.gpsLocation ? d.gpsLocation + ' | ' : ''}${d.area} - شارع ${d.street} - مبنى ${d.building} - دور ${d.floor} - شقة ${d.apt} ${d.landmark ? '('+d.landmark+')' : ''}`;
            }

            if(!rest.orders) rest.orders = [];
            rest.orders.unshift({
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customer_name: d.name,
                phone: d.phone,
                order_type_label: appState.orderType === 'delivery' ? '🛵 دليفري' : (appState.orderType === 'dine-in' ? '🍽️ صالة' : '🏪 استلام'),
                address: fullAddress,
                items_json: JSON.parse(JSON.stringify(appState.cart)),
                total: grandTotal,
                status: 'new',
                payment_display: appState.paymentMethod === 'cash' ? '💵 كاش' : `📱 تحويل (${appState.transferRefInput})`,
                created_at: new Date().toLocaleTimeString('ar-EG')
            });

            appState.cart = [];
            appState.customerView = 'menu';
            syncCloud();
            playBell();
            alert('🎉 تم إرسال طلبك بنجاح إلى المطعم!');
            render();
        }

        function sendBasketViaWhatsApp(restPhone, grandTotal){
            const d = appState.customerDetails;
            let txt = `🛒 *طلب جديد من المنيو الإلكتروني*\n`;
            txt += `👤 الاسم: ${d.name || 'عميل'}\n📞 الموبايل: ${d.phone || '-'}\n`;
            if(appState.orderType === 'delivery') {
                txt += `📍 العنوان: ${d.area} - ${d.street} (مبنى ${d.building}، دور ${d.floor}، شقة ${d.apt})\n`;
            }
            txt += `\n*الأصناف:*\n` + appState.cart.map(i => `• ${i.qty}x ${i.name} (${i.price * i.qty} جنيه)`).join('\n');
            txt += `\n\n💰 *السعر الكلي:* ${grandTotal} جنيه`;
            window.open(`https://wa.me/2${restPhone}?text=` + encodeURIComponent(txt), '_blank');
        }

        // ================= CASHIER, INVENTORY, ATTENDANCE, DASHBOARD, QR =================

                                    <button onclick="globalDB.restaurants['${currentRestId}'].orders.splice(${i},1); syncCloud(); render();" class="bg-red-500/20 text-red-400 py-2 rounded-xl"><i class="fa-solid fa-trash"></i></button>
                                </div>

        }

        function renderDashboard(){
            const rest = globalDB.restaurants[currentRestId]; 
            if(!rest){ setPage('auth'); return ''; }
            const active = checkSubscription(rest);
            const daysLeft = rest.subscription?.expiresAt ? Math.max(0, Math.ceil((rest.subscription.expiresAt - Date.now()) / (1000*60*60*24))) : 0;
            return `${renderNav()}<div class="max-w-md mx-auto px-4 py-12 text-center space-y-4 text-xs"><div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-3"><h2 class="font-black text-sm">حالة اشتراك (${rest.name})</h2><p class="font-bold text-slate-300">${active ? `مفعل ونشط ✅ (متبقي ${daysLeft} يوم)` : 'انتهت الفترة التجريبية ⏸️'}</p><a href="https://wa.me/2${PLATFORM_OWNER.walletNumber}?text=${encodeURIComponent('تفعيل اشتراك مطعم '+rest.name)}" target="_blank" class="block w-full bg-emerald-600 text-white font-black py-3 rounded-xl">تجديد الاشتراك عبر الواتساب</a></div></div>`;
        }

        function renderQRPrint(){
            const rest = globalDB.restaurants[currentRestId]; 
            if(!rest){ setPage('auth'); return ''; }
            const base = location.origin + location.pathname + `?view=menu&rest=${rest.id}&t=`;
            return `${renderNav()}<div class="max-w-3xl mx-auto px-4 py-6 pb-24 space-y-4 text-xs"><div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800"><h1 class="font-black text-sm text-amber-400">أكواد QR الطاولات</h1><button onclick="window.print()" class="bg-amber-500 text-slate-950 px-4 py-2 rounded-xl font-black">طباعة 🖨️</button></div><div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${Array.from({length: rest.tablesCount || 20}, (_, i) => i + 1).map(n => `<div class="bg-slate-900 p-4 rounded-2xl text-center space-y-2 border border-slate-800"><div class="font-black text-amber-400">${rest.name}</div><div class="font-bold">طاولة ${n}</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(base + 'طاولة ' + n)}" class="w-28 h-28 mx-auto rounded-lg bg-white p-1"></div>`).join('')}</div></div>`;
        }

        render();
    </script>
</body>
</html>
