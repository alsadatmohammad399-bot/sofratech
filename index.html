<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablia OS 2030 | المنصة السحابية المتكاملة للمطاعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="antialiased min-h-screen bg-[#0b0f19] text-slate-100 selection:bg-red-600 selection:text-white">

    <audio id="cloud-bell" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVofMvvbyMBGM1pQNeoG-gMT48Ll5IL4I",
            authDomain: "sofratech-2e033.firebaseapp.com",
            databaseURL: "https://sofratech-2e033-default-rtdb.firebaseio.com",
            projectId: "sofratech-2e033",
            storageBucket: "sofratech-2e033.firebasestorage.app",
            messagingSenderId: "742714705801",
            appId: "1:742714705801:web:ddd019d66fa7435f6f8358"
        };
        
        let cloudDB = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            cloudDB = firebase.database();
        } catch (e) {}

        const PLATFORM_OWNER = { walletNumber: '01015861991', monthlyPrice: 600, adminPass: '357159' };

        let globalDB = { restaurants: {} };
        try {
            const raw = localStorage.getItem('tablia_multitenant_2030_v49');
            if (raw) globalDB = JSON.parse(raw);
        } catch(e) {}

        if (!globalDB || !globalDB.restaurants || typeof globalDB.restaurants !== 'object') {
            globalDB = {
                restaurants: {
                    "kabdet-masr": {
                        id: "kabdet-masr", ownerName: "محمد علي", name: "كبده مصر", phone: "01015861991", pass: "1234",
                        tablesCount: 20, deliveryFee: 30, deliveryTime: "30 دقيقة",
                        address: "30 شارع التحرير، القاهرة", wifiName: "KabdetMasr_Free", wifiPass: "357159",
                        coverImage: "https://images.unsplash.com/photo-1544025162-d76694265947?w=800",
                        logoImage: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300",
                        social: { facebook: "https://facebook.com", instagram: "https://instagram.com" },
                        theme: { mode: 'light', primary: '#163882', accent: '#dc2626', cardStyle: 'rounded' },
                        subscription: { isActive: true, expiresAt: Date.now() + 30*24*60*60*1000 },
                        categories: [
                            { id: 'cat_offers', name: 'العروض', icon: '🔥' },
                            { id: 'cat_main', name: 'السندوتشات', icon: '🥪' }
                        ],
                        menu_items: [
                            { id: 'itm_1', category_id: 'cat_main', name: 'سندوتش كبده إسكندراني', description: 'كبده طازجة بتتبيلة الحريف المميزة', price: 25, old_price: 35, image: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400', is_available: true }
                        ],
                        gallery: [
                            { id: 'gal_1', title: 'سندوتشات الكبده الساخنة', image: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600' }
                        ],
                        orders: [], employees: []
                    }
                }
            };
        }

        const COLOR_PRESETS = [
            { name: 'الأزرق الملكي', primary: '#163882', accent: '#dc2626' },
            { name: 'الأحمر الناري', primary: '#b91c1c', accent: '#f59e0b' },
            { name: 'الأسود والذهبي', primary: '#111827', accent: '#d97706' },
            { name: 'الأخضر الزمردي', primary: '#065f46', accent: '#ea580c' }
        ];

        function checkSubscription(rest) {
            if (!rest || !rest.subscription) return false;
            if (rest.subscription.expiresAt && Date.now() > rest.subscription.expiresAt) rest.subscription.isActive = false;
            return rest.subscription.isActive;
        }

        function syncCloud() {
            try {
                localStorage.setItem('tablia_multitenant_2030_v49', JSON.stringify(globalDB));
                if (cloudDB) cloudDB.ref('tablia_multitenant_enterprise_2030_v49').set(globalDB).catch(() => {});
            } catch (e) {}
        }

        if (cloudDB) {
            cloudDB.ref('tablia_multitenant_enterprise_2030_v49').on('value', (snap) => {
                const data = snap.val();
                if (data && data.restaurants) {
                    globalDB = data;
                    try { localStorage.setItem('tablia_multitenant_2030_v49', JSON.stringify(globalDB)); } catch(e){}
                    render();
                }
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isCustomerMode = urlParams.get('view') === 'menu';
        const targetRestSlug = urlParams.get('rest');
        
        let currentRestId = localStorage.getItem('tablia_logged_rest_id') || null;

        const appState = { 
            page: isCustomerMode ? 'storefront' : (currentRestId ? 'builder' : 'auth'), 
            authTab: 'login', 
            builderStep: 1, 
            activeCat: 'all', 
            search: '',
            searchOpen: false,
            cart: [], 
            customerView: 'menu', 
            orderType: urlParams.get('t') ? 'dine-in' : 'delivery',
            tableNumber: urlParams.get('t') || 'طاولة 1', 
            drawerOpen: false,
            modalType: null,
            addressModalOpen: false,
            paymentMethod: 'cash',
            transferRefInput: '',
            customerDetails: { name: '', phone: '', gpsLocation: '', area: '', street: '', building: '', floor: '', apt: '', landmark: '' }
        };

        function setPage(p){ appState.page = p; render(); window.scrollTo(0,0); }

        function render(){
            const root = document.getElementById('app');
            if(!root) return;
            try {
                let content = '';
                if(isCustomerMode) {
                    content = renderStorefront();
                } else if(appState.page === 'auth') {
                    content = renderAuthScreen();
                } else {
                    if(!currentRestId || !globalDB.restaurants?.[currentRestId]) { 
                        currentRestId = null; 
                        localStorage.removeItem('tablia_logged_rest_id');
                        appState.page = 'auth'; 
                        content = renderAuthScreen(); 
                    } else if(appState.page === 'builder') {
                        content = renderBuilder();
                    } else if(appState.page === 'cashier') {
                        content = renderCashier();
                    } else if(appState.page === 'inventory') {
                        content = renderInventory();
                    } else if(appState.page === 'attendance') {
                        content = renderAttendance();
                    } else if(appState.page === 'dashboard') {
                        content = renderDashboard();
                    } else if(appState.page === 'qr_print') {
                        content = renderQRPrint();
                    } else {
                        content = renderBuilder();
                    }
                }
                const bottomBar = (isCustomerMode || !currentRestId) ? '' : renderBottomNav();
                root.innerHTML = content + bottomBar;
            } catch(err) { console.error("Render Error:", err); }
        }

        function renderNav(){
            const rest = currentRestId ? globalDB.restaurants[currentRestId] : null;
            return `
                <nav class="sticky top-0 z-40 bg-slate-900/95 border-b border-slate-800 px-4 py-3">
                    <div class="max-w-4xl mx-auto flex justify-between items-center">
                        <div class="flex gap-2 items-center cursor-pointer" onclick="setPage(currentRestId?'builder':'auth')">
                            <div class="w-9 h-9 rounded-xl bg-red-600 text-white flex items-center justify-center font-black">ط</div>
                            <span class="font-black text-white text-sm">Tablia OS</span>
                        </div>
                        ${rest ? `<button onclick="currentRestId=null; localStorage.removeItem('tablia_logged_rest_id'); setPage('auth');" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-500/20 transition">خروج</button>` : ''}
                    </div>
                </nav>
            `;
        }

        function renderBottomNav(){
            return `
                <div class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900 border-t border-slate-800 px-1 py-2">
                    <div class="max-w-md mx-auto grid grid-cols-6 gap-0.5 text-center text-slate-400">
                        <button onclick="setPage('builder')" class="flex flex-col items-center py-1 ${appState.page==='builder'?'text-red-500 font-black':''}"><i class="fa-solid fa-wand-magic-sparkles text-xs mb-0.5"></i><span class="text-[9px]">المنشئ</span></button>
                        <button onclick="setPage('cashier')" class="flex flex-col items-center py-1 ${appState.page==='cashier'?'text-red-500 font-black':''}"><i class="fa-solid fa-bell text-xs mb-0.5 text-amber-400"></i><span class="text-[9px]">الطلبات</span></button>
                        <button onclick="setPage('inventory')" class="flex flex-col items-center py-1 ${appState.page==='inventory'?'text-red-500 font-black':''}"><i class="fa-solid fa-boxes-stacked text-xs mb-0.5"></i><span class="text-[9px]">المخزن</span></button>
                        <button onclick="setPage('attendance')" class="flex flex-col items-center py-1 ${appState.page==='attendance'?'text-red-500 font-black':''}"><i class="fa-solid fa-users-gear text-xs mb-0.5"></i><span class="text-[9px]">الموظفين</span></button>
                        <button onclick="setPage('dashboard')" class="flex flex-col items-center py-1 ${appState.page==='dashboard'?'text-red-500 font-black':''}"><i class="fa-solid fa-chart-line text-xs mb-0.5"></i><span class="text-[9px]">الباقات</span></button>
                        <button onclick="setPage('qr_print')" class="flex flex-col items-center py-1 ${appState.page==='qr_print'?'text-red-500 font-black':''}"><i class="fa-solid fa-qrcode text-xs mb-0.5"></i><span class="text-[9px]">QR</span></button>
                    </div>
                </div>
            `;
        }

        function renderAuthScreen(){
            return `
                ${renderNav()}
                <div class="max-w-md mx-auto px-4 py-12 space-y-6">
                    <div class="text-center space-y-2">
                        <h1 class="text-2xl font-black text-white">منصة طبلية | Tablia OS</h1>
                        <p class="text-xs text-slate-400">فترة تجريبية مجانية لمدة يومين 🎁</p>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 text-xs shadow-xl border border-slate-800">
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">اسم المطعم (مثال: كبده مصر)</label>
                            <input id="reg_name" placeholder="كبده مصر" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label>
                            <input id="reg_phone" placeholder="010xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-bold">كلمة السر</label>
                            <input id="reg_pass" type="password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-xl text-white font-bold outline-none focus:border-red-600">
                        </div>
                        <button onclick="handleRegister()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-xl shadow transition">ابدأ التجربة المجانية 🚀</button>
                    </div>
                </div>
            `;
        }

        function handleRegister(){
            const name = document.getElementById('reg_name').value.trim(); 
            const phone = document.getElementById('reg_phone').value.trim(); 
            const pass = document.getElementById('reg_pass').value.trim();
            if(!name || !phone || !pass){ alert('يرجى استكمال جميع البيانات!'); return; }
            
            // تحويل اسم المطعم إلى Slug إنجليزي فريد
            let slug = name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
            if(!slug || slug === '-') slug = 'restaurant-' + Date.now();
            else slug = slug + '-' + Math.floor(100 + Math.random() * 900);

            globalDB.restaurants[slug] = { 
                id: slug, name, phone, pass, tablesCount: 20, deliveryFee: 30, deliveryTime: "30 دقيقة",
                address: 'القاهرة، مصر', wifiName: slug+'_Free', wifiPass: '357159',
                coverImage: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=800',
                logoImage: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300',
                social: { facebook: '', instagram: '' },
                theme: { mode: 'light', primary: '#163882', accent: '#dc2626', cardStyle: 'rounded' },
                subscription: { isActive: true, expiresAt: Date.now() + (2*24*60*60*1000) }, 
                categories: [{ id: 'cat_1', name: 'الأصناف الرئيسية', icon: '🍽️' }], 
                menu_items: [], gallery: [], orders: [], employees: []
            };
            syncCloud(); 
            currentRestId = slug; 
            localStorage.setItem('tablia_logged_rest_id', slug); 
            appState.builderStep = 1;
            setPage('builder');
        }

        // ================= BUILDER =================
        function renderBuilder(){
            const rest = globalDB.restaurants[currentRestId];
            if(!rest){ setPage('auth'); return ''; }
            return `
                ${renderNav()}
                <div class="max-w-3xl mx-auto px-4 py-6 pb-24 space-y-5">
                    <div class="flex gap-1.5 bg-slate-900 p-1.5 rounded-2xl text-xs border border-slate-800">
                        <button onclick="appState.builderStep=1; render();" class="flex-1 py-2.5 rounded-xl transition ${appState.builderStep===1?'bg-red-600 text-white font-black shadow':'text-slate-400'}">1. الهوية والألوان</button>
                        <button onclick="appState.builderStep=2; render();" class="flex-1 py-2.5 rounded-xl transition ${appState.builderStep===2?'bg-red-600 text-white font-black shadow':'text-slate-400'}">2. الأقسام والأصناف والصور</button>
                        <button onclick="appState.builderStep=3; render();" class="flex-1 py-2.5 rounded-xl transition ${appState.builderStep===3?'bg-red-600 text-white font-black shadow':'text-slate-400'}">3. نشر اللينك الخاص</button>
                    </div>
                    ${appState.builderStep===1 ? renderStep1(rest) : (appState.builderStep===2 ? renderStep2(rest) : renderStep3(rest))}
                </div>
            `;
        }

        function renderStep1(rest){
            if(!rest.theme) rest.theme = { mode: 'light', primary: '#163882', accent: '#dc2626', cardStyle: 'rounded' };
            return `
                <div class="bg-slate-900 p-6 rounded-3xl space-y-4 text-xs border border-slate-800 shadow-xl">
                    <h2 class="font-black text-white text-sm">🎨 الهوية البصرية والألوان</h2>
                    <div class="grid grid-cols-2 gap-2">
                        ${COLOR_PRESETS.map(p => `
                            <button onclick="globalDB.restaurants['${currentRestId}'].theme.primary='${p.primary}'; globalDB.restaurants['${currentRestId}'].theme.accent='${p.accent}'; syncCloud(); render();" class="p-3 rounded-xl border border-slate-700 bg-slate-950 flex items-center gap-2 hover:border-white transition">
                                <span class="w-4 h-4 rounded-full" style="background:${p.primary}"></span>
                                <b class="text-white">${p.name}</b>
                            </button>
                        `).join('')}
                    </div>
                    <div>
                        <label class="block text-slate-300 mb-1 font-bold">اسم المطعم</label>
                        <input id="r_name" value="${rest.name}" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-300 mb-1 font-bold">رقم الموبايل</label>
                        <input id="r_phone" value="${rest.phone}" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-bold outline-none">
                    </div>
                    <button onclick="saveStep1Data('${rest.id}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-3.5 rounded-xl w-full transition shadow">حفظ والانتقال للأقسام والأصناف ➔</button>
                </div>
            `;
        }

        function saveStep1Data(restId){
            const rest = globalDB.restaurants[restId];
            rest.name = document.getElementById('r_name').value.trim();
            rest.phone = document.getElementById('r_phone').value.trim();
            syncCloud();
            appState.builderStep = 2;
            render();
        }

        function renderStep2(rest){
            if(!rest.gallery) rest.gallery = [];
            if(!rest.categories) rest.categories = [{id:'cat_1', name:'الرئيسية', icon:'🍽️'}];
            return `
                <div class="bg-slate-900 p-6 rounded-3xl space-y-6 text-xs border border-slate-800 shadow-xl">
                    <!-- Categories -->
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-white text-sm">📁 الأقسام</h3>
                            <button onclick="addNewCategory('${rest.id}')" class="bg-amber-500/20 text-amber-400 px-3 py-1.5 rounded-xl font-bold hover:bg-amber-500/30 transition">+ إضافة قسم</button>
                        </div>
                        <div class="flex gap-2 overflow-x-auto pb-2">
                            ${rest.categories.map(cat => `
                                <div class="bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl flex items-center gap-2 shrink-0">
                                    <span class="font-bold text-white">${cat.name}</span>
                                    <button onclick="deleteCategory('${rest.id}', '${cat.id}')" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Items -->
                    <div class="space-y-3 pt-3 border-t border-slate-800">
                        <h3 class="font-black text-white text-sm">🍔 إضافة أصناف للأقسام</h3>
                        <div class="bg-slate-950 p-4 rounded-2xl space-y-2.5">
                            <select id="itm_cat" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold outline-none">
                                ${rest.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                            </select>
                            <input id="itm_name" placeholder="اسم الوجبة (مثال: سندوتش كبده)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold outline-none">
                            <input id="itm_price" type="number" placeholder="السعر" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold outline-none">
                            <input id="itm_img" placeholder="رابط صورة الوجبة (URL) أو اتركها فارغة" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold outline-none">
                            <button onclick="addNewItem('${rest.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl shadow transition">إضافة الصنف للقائمة ✓</button>
                        </div>
                        <div class="space-y-2 max-h-48 overflow-y-auto">
                            ${(rest.menu_items||[]).map((item, i) => `
                                <div class="bg-slate-950 p-3 rounded-xl flex justify-between items-center border border-slate-800">
                                    <div>
                                        <span class="font-black text-white">${item.name}</span>
                                        <span class="text-amber-400 block">${item.price} جنيه</span>
                                    </div>
                                    <button onclick="deleteItem('${rest.id}', ${i})" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Gallery -->
                    <div class="space-y-3 pt-4 border-t border-slate-800">
                        <h3 class="font-black text-amber-400 text-sm">🖼️ معرض الصور (تظهر مرتبة في آخر المنيو)</h3>
                        <div class="bg-slate-950 p-4 rounded-2xl space-y-2">
                            <input id="gal_title" placeholder="عنوان الصورة (مثال: صالة المطعم)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold outline-none">
                            <input id="gal_url" placeholder="رابط الصورة (URL)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white font-bold outline-none">
                            <button onclick="addNewGallery('${rest.id}')" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl shadow transition">إضافة الصورة للمعرض ➔</button>
                        </div>
                    </div>

                    <button onclick="appState.builderStep=3; render();" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-3.5 rounded-xl w-full shadow transition">التالي: الحصول على اللينك المخصص ➔</button>
                </div>
            `;
        }

        function addNewCategory(restId){
            const name = prompt('اسم القسم الجديد (مثال: سندوتشات، مشروبات):');
            if(!name) return;
            const rest = globalDB.restaurants[restId];
            rest.categories.push({ id: 'cat_' + Date.now(), name: name.trim(), icon: '🍽️' });
            syncCloud();
            render();
        }

        function deleteCategory(restId, catId){
            const rest = globalDB.restaurants[restId];
            if(rest.categories.length <= 1) { alert('يجب وجود قسم واحد على الأقل.'); return; }
            rest.categories = rest.categories.filter(c => c.id !== catId);
            syncCloud();
            render();
        }

        function addNewItem(restId){
            const rest = globalDB.restaurants[restId];
            const catId = document.getElementById('itm_cat').value;
            const name = document.getElementById('itm_name').value.trim();
            const price = Number(document.getElementById('itm_price').value);
            const img = document.getElementById('itm_img').value.trim();

            if(!name || !price) { alert('يرجى إدخال اسم الوجبة والسعر!'); return; }

            rest.menu_items.push({
                id: 'itm_' + Date.now(),
                category_id: catId,
                name,
                price,
                description: 'معد بعناية فائقة من أجود المكونات الطازجة',
                image: img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400',
                is_available: true
            });
            syncCloud();
            render();
        }

        function deleteItem(restId, idx){
            globalDB.restaurants[restId].menu_items.splice(idx, 1);
            syncCloud();
            render();
        }

        function addNewGallery(restId){
            const rest = globalDB.restaurants[restId];
            const title = document.getElementById('gal_title').value.trim();
            const url = document.getElementById('gal_url').value.trim();

            if(!title || !url) { alert('يرجى إدخال عنوان الصورة والرابط!'); return; }

            rest.gallery.push({ id: 'gal_' + Date.now(), title, image: url });
            syncCloud();
            render();
        }

        function renderStep3(rest){
            // الرابط يظهر باسم المطعم الإنجليزي (Slug) تماماً كما طلبت
            const url = location.origin + location.pathname + `?view=menu&rest=${rest.id}`;
            return `
                <div class="bg-slate-900 p-6 rounded-3xl space-y-5 text-xs border border-slate-800 text-center shadow-xl">
                    <h2 class="font-black text-white text-sm">🎉 جاهز! تم تخصيص رابط مطعمك ( ${rest.name} ) بالاسم الإنجليزي</h2>
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                        <input readonly value="${url}" class="w-full bg-slate-900 border border-slate-700 p-3.5 rounded-xl text-amber-400 font-mono text-center text-xs select-all">
                        <button onclick="navigator.clipboard.writeText('${url}'); alert('تم نسخ رابط المطعم بنجاح!');" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl shadow transition">نسخ الرابط المخصص</button>
                    </div>
                    <a href="${url}" target="_blank" class="block w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl shadow-lg transition">فتح المنيو ومعاينة الأصناف والصور الآن ➔</a>
                </div>
            `;
        }

        // ================= CUSTOMER STOREFRONT =================
        function renderStorefront(){
            const restId = targetRestSlug || Object.keys(globalDB.restaurants)[0];
            const rest = globalDB.restaurants[restId];
            if(!rest) return `<div class="min-h-screen flex items-center justify-center text-white">المطعم غير موجود</div>`;

            const theme = rest.theme || { mode: 'light', primary: '#163882', accent: '#dc2626' };
            const isLight = theme.mode === 'light';
            const bgMain = isLight ? 'bg-[#f4f6f9] text-slate-900' : 'bg-[#0b0f19] text-slate-100';
            const cardBg = isLight ? 'bg-white border-slate-200' : 'bg-slate-900 border-slate-800';

            return `
                <div class="min-h-screen ${bgMain} pb-28">
                    <!-- Hero Banner -->
                    <div class="relative h-48 w-full overflow-hidden">
                        <img src="${rest.coverImage}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center text-white p-4 text-center">
                            <img src="${rest.logoImage}" class="w-16 h-16 rounded-full object-cover border-2 border-white mb-1">
                            <h1 class="font-black text-lg">${rest.name}</h1>
                            <p class="text-[10px] text-slate-200">${rest.address}</p>
                        </div>
                    </div>

                    <div class="max-w-2xl mx-auto px-3 pt-4 space-y-6">
                        <!-- Categorized Menu Items -->
                        ${(rest.categories || []).map(cat => {
                            const items = (rest.menu_items || []).filter(i => i.category_id === cat.id);
                            if(items.length === 0) return '';
                            return `
                                <div class="space-y-2">
                                    <h2 class="font-black text-sm px-1 text-amber-500">${cat.icon || '🍽️'} ${cat.name}</h2>
                                    <div class="space-y-3">
                                        ${items.map(item => `
                                            <div class="${cardBg} border rounded-2xl p-3 flex items-center justify-between gap-3 shadow-sm">
                                                <div class="flex-1">
                                                    <h3 class="font-black text-sm">${item.name}</h3>
                                                    <p class="text-[11px] text-slate-500">${item.description}</p>
                                                    <span class="font-black text-xs block mt-1" style="color:${theme.primary}">${item.price} جنيه</span>
                                                </div>
                                                <img src="${item.image}" class="w-20 h-20 rounded-xl object-cover">
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `;
                        }).join('')}

                        <!-- GALLERY SECTION AT THE VERY END -->
                        ${rest.gallery && rest.gallery.length > 0 ? `
                            <div class="space-y-3 pt-6 border-t border-slate-300 dark:border-slate-800">
                                <div class="text-center space-y-1">
                                    <h2 class="font-black text-base uppercase tracking-wider" style="color:${theme.primary}">معرض الصور والأطباق</h2>
                                    <p class="text-[11px] text-slate-500">لقطات حية من مطعمنا</p>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    ${rest.gallery.map(g => `
                                        <div class="${cardBg} border rounded-2xl overflow-hidden shadow-md">
                                            <img src="${g.image}" class="w-full h-36 object-cover">
                                            <div class="p-2 text-center">
                                                <span class="font-black text-xs block truncate">${g.title}</span>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Placeholder functions for dashboard navigation tabs
        function renderCashier(){ return `${renderNav()}<div class="p-10 text-center text-xs text-white">شاشة الطلبات والكاشير</div>`; }
        function renderInventory(){ return `${renderNav()}<div class="p-10 text-center text-xs text-white">إدارة المخزن</div>`; }
        function renderAttendance(){ return `${renderNav()}<div class="p-10 text-center text-xs text-white">إدارة الموظفين</div>`; }
        function renderDashboard(){ return `${renderNav()}<div class="p-10 text-center text-xs text-white">الباقات والاشتراكات</div>`; }
        function renderQRPrint(){ return `${renderNav()}<div class="p-10 text-center text-xs text-white">طباعة أكواد QR</div>`; }

        render();
    </script>
</body>
</html>
