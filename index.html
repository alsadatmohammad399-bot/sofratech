<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سُفرة تك | منصة إدارة المنيو الرقمي ومواقع المطاعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
    <div id="app"></div>
    <div id="printable-receipt" class="hidden"></div>

    <script>
        const DEFAULT_DATA = {
            restaurant: {
                name: 'مطعم الطاهي',
                taglet: 'أصل المذاق المصري',
                logo: '🍽️',
                themeColor: '#d97706',
                style: 'foodie_app',
                whatsapp: '201015861991',
                deliveryFee: 15,
                taxRate: 0,
                pin: '1234',
                discountThreshold: 2000,
                discountCode: 'SAVE10',
                discountPercent: 10
            },
            categories: [
                { id: 'all', name: 'الكل', icon: '🍽️' }
            ],
            menu: [
                {
                    id: 101,
                    name: 'بيف برجر دبل تشيز',
                    cat: 'burgers',
                    price: 140,
                    rating: '4.9',
                    reviews: '1.2k',
                    badge: 'الأكثر طلباً',
                    desc: 'شريحتين لحم بقرى طازج مع الجبن المذيب والصوص الخاص',
                    img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&auto=format&fit=crop&q=60'
                },
                {
                    id: 102,
                    name: 'كباب بتلو مشوي على الفحم',
                    cat: 'grills',
                    price: 240,
                    rating: '4.8',
                    reviews: '850',
                    badge: 'مميز',
                    desc: 'قطع لحم بتلو طازجة مشوية على الفحم البلدي',
                    img: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&auto=format&fit=crop&q=60'
                },
                {
                    id: 103,
                    name: 'بيتزا ببروني إيطالي',
                    cat: 'pizza',
                    price: 145,
                    rating: '4.7',
                    reviews: '620',
                    badge: '',
                    desc: 'عجينة إيطالية رقيقة مع شرائح الببروني وجبن الموتزاريلا',
                    img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&auto=format&fit=crop&q=60'
                },
                {
                    id: 104,
                    name: 'عصير مانجو فريش',
                    cat: 'drinks',
                    price: 45,
                    rating: '5.0',
                    reviews: '410',
                    badge: 'طازج',
                    desc: 'عصير مانجو طبيعي 100% مثلج',
                    img: 'https://images.unsplash.com/photo-1544145945-f90425340c7e?w=500&auto=format&fit=crop&q=60'
                }
            ],
            orders: [],
            serviceAlerts: []
        };

        function loadState() {
            try {
                const saved = localStorage.getItem('sofratech_db_v10');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.restaurant && Array.isArray(parsed.menu)) {
                        return parsed;
                    }
                }
            } catch (e) {
                console.error('LocalStorage parse error, resetting:', e);
                localStorage.removeItem('sofratech_db_v10');
            }
            return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }

        function saveState() {
            localStorage.setItem('sofratech_db_v10', JSON.stringify(db));
        }

        let db = loadState();

        const ui = {
            route: 'landing',
            activeCategory: 'all',
            searchQuery: '',
            cart: [],
            tableParam: null,
            phone: '',
            customerName: '',
            notes: '',
            deliveryMethod: 'branch',
            tableNo: '1',
            address: '',
            gpsCoords: '',
            couponInput: '',
            appliedDiscountPercent: 0,
            paymentMethod: 'cash',
            lastOrder: null,
            cashierUnlocked: false,
            cashierTab: 'orders',
            showImportModal: false,
            importTab: 'templates',
            importStatus: '',
            importProgress: 0,
            importRawText: '',
            importPreviewImages: [],
            parsedMenuDraft: [],
            replaceExistingMenu: false
        };

        function syncRouteFromHash() {
            const hash = window.location.hash || '';
            const cleanHash = hash.split('?')[0];
            const queryPart = hash.includes('?') ? hash.split('?')[1] : '';
            const params = new URLSearchParams(queryPart);
            if (params.get('table')) {
                ui.tableParam = params.get('table');
                ui.tableNo = params.get('table');
            }

            if (cleanHash === '#menu') {
                if (!['menu', 'cart', 'checkout', 'order_success', 'track_order'].includes(ui.route)) {
                    ui.route = 'menu';
                }
            } else if (cleanHash === '#cashier') {
                ui.route = 'cashier';
            } else if (cleanHash === '#builder') {
                ui.route = 'builder';
            } else {
                ui.route = 'landing';
            }
            render();
        }

        window.addEventListener('hashchange', syncRouteFromHash);
        window.addEventListener('storage', (e) => {
            if (e.key === 'sofratech_db_v10') {
                db = loadState();
                render();
            }
        });

        function navigate(hash) {
            window.location.hash = hash;
        }

        function render() {
            const app = document.getElementById('app');
            try {
                let content = '';
                if (ui.route === 'landing') content = renderLanding();
                else if (ui.route === 'builder') content = renderBuilder();
                else if (ui.route === 'menu') content = renderCustomerMenu();
                else if (ui.route === 'cart') content = renderCartPage();
                else if (ui.route === 'checkout') content = renderCheckoutPage();
                else if (ui.route === 'order_success') content = renderOrderSuccess();
                else if (ui.route === 'track_order') content = renderTrackOrder();
                else if (ui.route === 'cashier') content = renderCashier();

                if (ui.showImportModal) {
                    content += renderPaperMenuImportModal();
                }
                app.innerHTML = content;
            } catch (err) {
                console.error('Render error:', err);
                app.innerHTML = `<div style="padding:40px; text-align:center; font-family:Cairo,sans-serif; color:#333;">
                    <h2 style="color:#e11d48; margin-bottom:10px;">عذراً، حدث خطأ مؤقت في العرض</h2>
                    <p style="color:#666; font-size:14px; margin-bottom:20px;">${err.message}</p>
                    <button onclick="localStorage.clear(); window.location.hash=''; window.location.reload();" style="background:#0f172a; color:#fff; padding:12px 24px; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">إعادة ضبط النظام وتشغيل من جديد</button>
                </div>`;
            }
        }

        function renderLanding() {
            const baseUrl = window.location.origin + window.location.pathname;
            return `
                <div class="min-h-screen bg-slate-950 text-white">
                    <nav class="container mx-auto px-6 py-5 flex justify-between items-center border-b border-slate-800">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center text-xl font-black">🍽️</div>
                            <span class="text-2xl font-black">سُفرة <span class="text-amber-500">تك</span></span>
                        </div>
                        <button onclick="navigate('#builder')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-5 py-2.5 rounded-xl font-black text-sm transition">أنشئ موقع مطعمك</button>
                    </nav>

                    <section class="container mx-auto px-6 py-16 text-center max-w-4xl">
                        <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-4 py-1.5 rounded-full text-xs font-bold inline-block mb-5">منصة بناء مواقع المطاعم والمنيو الذكي</span>
                        <h1 class="text-4xl md:text-6xl font-black leading-tight mb-6">امتلك موقع مطعمك الخاص مع <span class="text-amber-500">نظام طلبات وكاشير متكامل</span></h1>
                        <p class="text-slate-400 text-lg mb-10">استخرج منيو مطعمك واضبط الأقسام والأصناف بدقة تامة في ثوانٍ.</p>

                        <div class="flex flex-wrap justify-center gap-4 mb-14">
                            <button onclick="navigate('#builder')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-4 rounded-2xl text-base shadow-xl shadow-amber-500/20 transition">🛠️ تخصيص وبناء المطعم</button>
                            <button onclick="navigate('#menu')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-8 py-4 rounded-2xl text-base border border-slate-700 transition">📱 معاينة رابط الزبون</button>
                            <button onclick="navigate('#cashier')" class="bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold px-8 py-4 rounded-2xl text-base border border-amber-500/30 transition">🖥️ دخول شاشة الكاشير</button>
                        </div>

                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-right max-w-2xl mx-auto">
                            <h3 class="font-black text-amber-400 mb-4 flex items-center gap-2"><i class="fa-solid fa-link"></i> الروابط المستقلة لمطعمك (${db.restaurant.name}):</h3>
                            <div class="space-y-3 text-xs">
                                <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
                                    <div class="overflow-hidden">
                                        <span class="text-emerald-400 font-bold block mb-1">1. رابط الزبون (المنيو والطلب فقط):</span>
                                        <code class="text-slate-300 select-all break-all">${baseUrl}#menu</code>
                                    </div>
                                    <button onclick="copyText('${baseUrl}#menu')" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg font-bold shrink-0">نسخ</button>
                                </div>
                                <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
                                    <div class="overflow-hidden">
                                        <span class="text-amber-400 font-bold block mb-1">2. رابط الكاشير (محمي برمز PIN: ${db.restaurant.pin}):</span>
                                        <code class="text-slate-300 select-all break-all">${baseUrl}#cashier</code>
                                    </div>
                                    <button onclick="copyText('${baseUrl}#cashier')" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg font-bold shrink-0">نسخ</button>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            `;
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt);
            alert('✅ تم نسخ الرابط بنجاح!');
        }

        function renderBuilder() {
            const styles = [
                { id: 'foodie_app', name: 'استايل تطبيق فودي الاحترافي (Foodie App Dark)', desc: 'تصميم مطابق لتطبيقات التوصيل العالمية ببانر فخم وأقسام دائرية' },
                { id: 'luxury', name: 'الاستايل الفاخر (Steakhouse Luxury)', desc: 'تصميم راقٍ بلمسات ذهبية وبانر عروض وتقييمات أطباق' },
                { id: 'warm', name: 'استايل المطاعم الشرقية (Warm Heritage)', desc: 'ألوان دافئة بالبرتقالي والأحمر مع إبراز العروض' },
                { id: 'modern_dark', name: 'الاستايل الليلي العصري (Dark Modern)', desc: 'واجهة داكنة مريحة للعين مثالية للبرجر والوجبات السريعة' }
            ];

            return `
                <div class="min-h-screen bg-slate-100 py-8 px-4 text-slate-900">
                    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl p-6 md:p-8 border border-slate-200">
                        <div class="flex justify-between items-center pb-4 mb-6 border-b border-slate-100">
                            <h2 class="text-xl font-black text-slate-900">🎨 تخصيص هوية واستايل المطعم</h2>
                            <button onclick="navigate('')" class="text-slate-400 hover:text-slate-700 font-bold text-sm">رجوع للرئيسية</button>
                        </div>

                        <div class="mb-6 bg-gradient-to-l from-amber-500/15 via-orange-500/10 to-amber-50 border border-amber-300 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                            <div>
                                <span class="bg-amber-500 text-slate-950 text-[10px] font-black px-2.5 py-0.5 rounded-full">استيراد ذكي ⚡</span>
                                <h3 class="font-black text-sm text-slate-900 mt-1">إضافة المنيو واستيراد الأصناف</h3>
                                <p class="text-xs text-slate-600">اختر من القوالب الجاهزة أو ارفع صور المنيو وأدخل أطباقك بكل سهولة.</p>
                            </div>
                            <button onclick="openPaperMenuImporter()" class="bg-slate-950 hover:bg-slate-800 text-amber-400 font-black px-4 py-3 rounded-xl text-xs whitespace-nowrap shadow-md flex items-center gap-2 shrink-0">
                                <i class="fa-solid fa-file-arrow-up"></i> نافذة إدارة المنيو
                            </button>
                        </div>

                        <div class="space-y-5">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5">اسم المطعم</label>
                                    <input type="text" id="cfg_name" value="${db.restaurant.name}" class="w-full px-4 py-3 rounded-xl border border-slate-300 font-bold text-sm outline-none focus:border-amber-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5">شعار / أيقونة المطعم</label>
                                    <input type="text" id="cfg_logo" value="${db.restaurant.logo}" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-center text-xl outline-none">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1.5">الوصف التعريفي للمطعم</label>
                                <input type="text" id="cfg_tag" value="${db.restaurant.taglet}" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-2">اختر قالب التصميم (Style)</label>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    ${styles.map(st => `
                                        <label class="border-2 rounded-2xl p-3.5 cursor-pointer transition ${db.restaurant.style === st.id ? 'border-amber-500 bg-amber-50/50' : 'border-slate-200 hover:border-slate-300'}">
                                            <div class="flex items-center gap-2 mb-1">
                                                <input type="radio" name="cfg_style" value="${st.id}" ${db.restaurant.style === st.id ? 'checked' : ''} class="accent-amber-500" onchange="previewStyleOnChange('${st.id}')">
                                                <span class="font-black text-xs text-slate-900">${st.name}</span>
                                            </div>
                                            <p class="text-[11px] text-slate-500 pr-5">${st.desc}</p>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5">اللون الأساسي</label>
                                    <input type="color" id="cfg_color" value="${db.restaurant.themeColor}" class="w-full h-11 rounded-xl border border-slate-300 cursor-pointer">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5">رسوم التوصيل (ج.م)</label>
                                    <input type="number" id="cfg_fee" value="${db.restaurant.deliveryFee}" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5">رمز الكاشير (PIN)</label>
                                    <input type="text" id="cfg_pin" value="${db.restaurant.pin}" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold text-sm text-center">
                                </div>
                            </div>

                            <div class="flex gap-3">
                                <button onclick="saveBuilder()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-black py-4 rounded-2xl text-sm shadow-lg transition">حفظ الإعدادات 🚀</button>
                                <button onclick="saveBuilderAndPreview()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-2xl text-sm shadow-lg transition">معاينة رابط الزبون 📱</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function previewStyleOnChange(styleId) {
            db.restaurant.style = styleId;
            saveState();
            render();
        }

        function saveBuilder() {
            db.restaurant.name = document.getElementById('cfg_name').value;
            db.restaurant.logo = document.getElementById('cfg_logo').value;
            db.restaurant.taglet = document.getElementById('cfg_tag').value;
            const checkedStyle = document.querySelector('input[name="cfg_style"]:checked');
            if (checkedStyle) db.restaurant.style = checkedStyle.value;
            db.restaurant.themeColor = document.getElementById('cfg_color').value;
            db.restaurant.deliveryFee = Number(document.getElementById('cfg_fee').value) || 0;
            db.restaurant.pin = document.getElementById('cfg_pin').value || '1234';
            saveState();
            // تم الحفظ في الخلفية بدون ظهور نافذة مزعجة في منتصف الشاشة بناءً على طلبك
        }

        function saveBuilderAndPreview() {
            saveBuilder();
            navigate('#menu');
        }

        function openPaperMenuImporter() {
            ui.showImportModal = true;
            ui.importStatus = '';
            ui.importProgress = 0;
            ui.parsedMenuDraft = [];
            ui.importPreviewImages = [];
            ui.importTab = 'templates';
            render();
        }

        function closePaperMenuImporter() {
            ui.showImportModal = false;
            render();
        }

        function renderPaperMenuImportModal() {
            return `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-6 overflow-y-auto">
                    <div class="bg-slate-900 text-white border border-slate-700 rounded-3xl max-w-2xl w-full p-5 md:p-7 shadow-2xl my-auto max-h-[92vh] overflow-y-auto">
                        <div class="flex justify-between items-center pb-4 mb-5 border-b border-slate-800">
                            <div>
                                <h2 class="text-lg md:text-xl font-black text-amber-400 flex items-center gap-2">
                                    <i class="fa-solid fa-wand-magic-sparkles"></i> استيراد وإدارة المنيو باحتراف
                                </h2>
                                <p class="text-xs text-slate-400 mt-0.5">اختر من القوائم الجاهزة فوراً، أو استخدم إدخال النصوص والرفع</p>
                            </div>
                            <button onclick="closePaperMenuImporter()" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div class="grid grid-cols-3 gap-1.5 bg-slate-950 p-1.5 rounded-2xl mb-5 border border-slate-800">
                            <button onclick="ui.importTab='templates'; render();" class="py-2.5 rounded-xl text-xs font-black transition ${ui.importTab === 'templates' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}">
                                ✨ قوائم جاهزة بضغطة
                            </button>
                            <button onclick="ui.importTab='text'; render();" class="py-2.5 rounded-xl text-xs font-black transition ${ui.importTab === 'text' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}">
                                📝 كتابة أو لصق نص
                            </button>
                            <button onclick="ui.importTab='image'; render();" class="py-2.5 rounded-xl text-xs font-black transition ${ui.importTab === 'image' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}">
                                📸 رفع صور المنيو
                            </button>
                        </div>

                        ${ui.importTab === 'templates' ? `
                            <div class="space-y-3">
                                <p class="text-xs text-slate-300 font-bold mb-2">اختر القائمة الجاهزة المناسبة لمطعمك ليتم تحميلها فوراً:</p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <button onclick="loadPresetMenu('grills')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-amber-500 p-4 rounded-2xl text-right transition flex items-center gap-3">
                                        <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=100" class="w-12 h-12 rounded-xl object-cover">
                                        <div>
                                            <h4 class="font-black text-sm text-amber-400">قائمة المشويات والطواجن</h4>
                                            <p class="text-[11px] text-slate-400 mt-0.5">كباب، كفتة، شيش، طواجن</p>
                                        </div>
                                    </button>

                                    <button onclick="loadPresetMenu('burgers')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-amber-500 p-4 rounded-2xl text-right transition flex items-center gap-3">
                                        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=100" class="w-12 h-12 rounded-xl object-cover">
                                        <div>
                                            <h4 class="font-black text-sm text-amber-400">قائمة البرجر والساندوتشات</h4>
                                            <p class="text-[11px] text-slate-400 mt-0.5">بيف برجر، شاورما، كريزبي</p>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        ` : ui.importTab === 'text' ? `
                            <div class="space-y-3">

        // جلب العنوان تلقائياً بالاسم والشارع عبر Reverse Geocoding
        async function detectGPSLocation() {
            if (!navigator.geolocation) {
                alert('المتصفح لا يدعم تحديد الموقع.');
                return;
            }
            alert('📍جاري تحديد موقعك الجغرافي بدقة...');
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    ui.gpsCoords = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                    ui.address = 'جاري جلب اسم الشارع والمنطقة من الخريطة...';
                    render();
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ar`);
                        const data = await res.json();
                        if (data && data.display_name) {
                            ui.address = data.display_name;
                        } else {
                            ui.address = `إحداثيات GPS: ${ui.gpsCoords}`;
                        }
                    } catch (e) {
                        ui.address = `إحداثيات الموقع: ${ui.gpsCoords}`;
                    }
                    render();
                },
                () => {
                    alert('يرجى السماح للمتصفح بالوصول لموقعك (GPS).');
                }
            );
        }

        function submitFinalOrder() {
            if (!ui.phone.trim()) {
                alert('⚠️ يرجى إدخال رقم الهاتف!');
                return;
            }
            const subtotal = ui.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const deliveryFee = ui.deliveryMethod === 'home' ? db.restaurant.deliveryFee : 0;

            const orderObj = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customer: ui.customerName.trim() || 'عميل',
                phone: ui.phone.trim(),
                deliveryMethod: ui.deliveryMethod,
                address: ui.address || 'استلام من الفرع',
                items: JSON.parse(JSON.stringify(ui.cart)),
                total: subtotal + deliveryFee,
                status: 'pending', // pending, preparing, on_the_way, delivered
                time: 'الآن'
            };

            db.orders.unshift(orderObj);
            saveState();

            ui.lastOrder = orderObj;
            ui.cart = [];
            ui.route = 'order_success';
            render();
        }

        function renderOrderSuccess() {
            const ord = ui.lastOrder;
            return `
                <div class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
                    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-xl space-y-4">
                        <div class="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-4xl mx-auto">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <h2 class="text-2xl font-black">تم إرسال طلبك بنجاح!</h2>
                        <p class="text-xs text-slate-400">رقم الطلب: <span class="font-black text-amber-400">${ord.id}</span></p>

                        <button onclick="ui.route='track_order'; render();" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-2xl text-sm transition">
                            🚚 تتبع حالة الطلب لحظة بلحظة
                        </button>
                        <button onclick="ui.route='menu'; render();" class="w-full bg-slate-800 text-white font-bold py-3 rounded-2xl text-sm">العودة للمنيو</button>
                    </div>
                </div>
            `;
        }

        function renderTrackOrder() {
            const ord = db.orders.find(o => o.phone === ui.phone) || ui.lastOrder;
            if (!ord) {
                return `<div class="min-h-screen bg-slate-950 text-white p-6 text-center"><p>لا توجد طلبات نشطة.</p><button onclick="ui.route='menu';render();" class="mt-4 bg-amber-500 text-slate-950 px-4 py-2 rounded-xl font-bold">العودة</button></div>`;
            }

            const steps = [
                { key: 'pending', label: 'قيد المراجعة ⏳' },
                { key: 'preparing', label: 'جاري التحضير 🔥' },
                { key: 'on_the_way', label: 'خرج مع الدليفري 🛵' },
                { key: 'delivered', label: 'تم التسليم ✅' }
            ];

            const currentIndex = steps.findIndex(s => s.key === ord.status);

            return `
                <div class="min-h-screen bg-slate-950 text-white p-6 max-w-lg mx-auto space-y-6">
                    <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                        <h1 class="font-black text-xl text-amber-400">تتبع الطلب (${ord.id})</h1>
                        <button onclick="ui.route='menu'; render();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">المنيو</button>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-6">
                        <div class="space-y-4">
                            ${steps.map((st, idx) => `
                                <div class="flex items-center gap-4 ${idx <= currentIndex ? 'text-amber-400 font-black' : 'text-slate-600'}">
                                    <div class="w-8 h-8 rounded-full flex items-center justify-center border-2 ${idx <= currentIndex ? 'border-amber-500 bg-amber-500/20 text-amber-400' : 'border-slate-700 bg-slate-950'}">
                                        ${idx < currentIndex ? '✓' : idx + 1}
                                    </div>
                                    <span class="text-sm">${st.label}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2 text-xs">
                            <div class="flex justify-between"><span class="text-slate-400">حالة الطلب الحالية:</span><span class="font-black text-amber-400 uppercase">${ord.status}</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">الإجمالي المطلوب:</span><span class="font-black text-emerald-400">EG ${ord.total.toFixed(2)}</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCashier() {
            if (!ui.cashierUnlocked) {
                return `
                    <div class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
                        <div class="max-w-sm w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">
                            <h2 class="text-xl font-black mb-1">لوحة تحكم الكاشير</h2>
                            <p class="text-xs text-slate-400 mb-6">الرمز السري الافتراضي: 1234</p>
                            <input type="password" id="pin_input" maxlength="6" placeholder="••••" class="w-full bg-slate-950 border border-slate-700 rounded-2xl py-3.5 text-center text-2xl tracking-widest font-black mb-4 outline-none focus:border-amber-500">
                            <button onclick="unlockCashier()" class="w-full bg-amber-500 text-slate-950 font-black py-3.5 rounded-2xl text-sm">دخول النظام</button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="min-h-screen bg-slate-950 text-white flex flex-col md:flex-row">
                    <aside class="w-full md:w-64 bg-slate-900 border-l border-slate-800 p-5 flex flex-col justify-between">
                        <div>
                            <h2 class="font-black text-base text-amber-400 mb-6">${db.restaurant.name} (كاشير)</h2>
                            <nav class="space-y-2 text-xs font-bold">
                                <button onclick="ui.cashierTab='orders'; render();" class="w-full text-right px-4 py-3 rounded-xl bg-amber-500 text-slate-950">📥 الطلبات (${db.orders.length})</button>
                            </nav>
                        </div>
                        <button onclick="ui.cashierUnlocked=false; render();" class="text-red-400 text-xs font-bold">قفل الشاشة</button>
                    </aside>

                    <main class="flex-1 p-6 overflow-y-auto">
                        <h2 class="text-xl font-black mb-6">📥 الطلبات الواردة وتحديث الحالات</h2>
                        <div class="space-y-4">
                            ${db.orders.map((ord, idx) => `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col md:flex-row justify-between gap-4">
                                    <div class="space-y-2">
                                        <div class="flex items-center gap-3">
                                            <span class="font-black text-amber-400">${ord.id}</span>
                                            <span class="bg-slate-800 px-3 py-1 rounded-full text-xs font-bold">${ord.deliveryMethod === 'home' ? 'توصيل للمنزل' : 'استلام من الفرع'}</span>
                                            <span class="text-xs text-emerald-400 font-bold">الحالة: ${ord.status}</span>
                                        </div>
                                        <p class="text-xs font-bold">👤 ${ord.customer} — 📞 ${ord.phone}</p>
                                        <p class="text-xs text-slate-300">📍 ${ord.address}</p>
                                        <div class="text-xs space-y-1 text-slate-400">
                                            ${ord.items.map(i => `<div>• ${i.qty}x ${i.name} — EG ${i.price * i.qty}</div>`).join('')}
                                        </div>
                                    </div>
                                    <div class="flex flex-col justify-between items-end gap-3">
                                        <div class="text-lg font-black text-amber-400">EG ${ord.total.toFixed(2)}</div>
                                        
                                        <!-- أزرار تغيير حالة الدليفري للزبون -->
                                        <div class="flex flex-wrap gap-1.5">
                                            <button onclick="updateOrderStatus(${idx}, 'preparing')" class="bg-blue-600 px-2.5 py-1 rounded-lg text-[10px] font-bold">تحضير 🔥</button>
                                            <button onclick="updateOrderStatus(${idx}, 'on_the_way')" class="bg-amber-600 px-2.5 py-1 rounded-lg text-[10px] font-bold">مع الدليفري 🛵</button>
                                            <button onclick="updateOrderStatus(${idx}, 'delivered')" class="bg-emerald-600 px-2.5 py-1 rounded-lg text-[10px] font-bold">تم التسليم ✅</button>
                                        </div>

                                        <button onclick="printOrderReceipt(${idx})" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                                            <i class="fa-solid fa-print"></i> طباعة الفاتورة 🧾
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </main>
                </div>
            `;
        }

        function updateOrderStatus(idx, status) {
            db.orders[idx].status = status;
            saveState();
            render();
            alert(`✅ تم تحديث حالة الطلب إلى: ${status}`);
        }

        function unlockCashier() {
            const val = document.getElementById('pin_input').value;
            if (val === db.restaurant.pin) {
                ui.cashierUnlocked = true;
                render();
            } else {
                alert('❌ الرمز السري غير صحيح!');
            }
        }

        // طباعة الفاتورة الشاملة باسم المطعم والأسعار
        function printOrderReceipt(idx) {
            const ord = db.orders[idx];
            const receiptHTML = `
                <div style="font-family:Cairo,sans-serif; direction:rtl; padding:20px; max-width:300px; margin:auto; background:#fff; color:#000;">
                    <h2 style="text-align:center; margin-bottom:5px;">🍽️ ${db.restaurant.name}</h2>
                    <p style="text-align:center; font-size:11px; color:#666; margin-bottom:15px;">${db.restaurant.taglet}</p>
                    <hr style="border:1px dashed #ccc; margin:10px 0;">
                    <p style="font-size:12px;"><strong>رقم الطلب:</strong> ${ord.id}</p>
                    <p style="font-size:12px;"><strong>العميل:</strong> ${ord.customer} (${ord.phone})</p>
                    <p style="font-size:12px;"><strong>العنوان:</strong> ${ord.address}</p>
                    <hr style="border:1px dashed #ccc; margin:10px 0;">
                    <table style="width:100%; font-size:12px; border-collapse:collapse;">
                        <thead>
                            <tr style="border-bottom:1px solid #000;">
                                <th style="text-align:right; padding-bottom:5px;">الصنف</th>
                                <th style="text-align:center; padding-bottom:5px;">الكمية</th>
                                <th style="text-align:left; padding-bottom:5px;">السعر</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${ord.items.map(i => `
                                <tr>
                                    <td style="padding:4px 0;">${i.name}</td>
                                    <td style="text-align:center; padding:4px 0;">${i.qty}</td>
                                    <td style="text-align:left; padding:4px 0;">${i.price * i.qty} ج.م</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <hr style="border:1px dashed #ccc; margin:10px 0;">
                    <h3 style="text-align:left; font-size:14px; margin:0;">الإجمالي: EG ${ord.total.toFixed(2)}</h3>
                    <p style="text-align:center; font-size:10px; margin-top:20px; color:#555;">شكراً لتعاملكم معنا ❤️</p>
                </div>
            `;
            const receiptDiv = document.getElementById('printable-receipt');
            receiptDiv.innerHTML = receiptHTML;
            window.print();
        }

        syncRouteFromHash();
    </script>
</body>
</html>
