<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سُفرة تك | منصة إدارة المنيو الرقمي ومواقع المطاعم</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-orange-500 selection:text-white">

    <!-- App Container -->
    <div id="app"></div>

    <!-- JavaScript Application Logic -->
    <script>
        // State Management
        const state = {
            view: 'landing', // landing, builder, storefront, cashier
            // Default restaurant demo data
            restaurant: {
                name: 'برجر هب & مشاوي',
                taglet: 'أطعم وألذ المأكولات السريعة والمشوية',
                logo: '🍔',
                themeColor: '#f97316', // orange-500
                style: 'modern', // modern, classic, minimal
                whatsapp: '201015861991',
                deliveryFee: 15,
                minOrder: 50,
                tableNo: null,
                pin: '1234',
                isOpen: true
            },
            categories: [
                { id: 'all', name: 'الكل', timeSlot: 'all' },
                { id: 'breakfast', name: 'فطور صباحي', timeSlot: 'morning' },
                { id: 'meals', name: 'الوجبات الرئيسية', timeSlot: 'all' },
                { id: 'fastfood', name: 'ساندوتشات وبرجر', timeSlot: 'all' },
                { id: 'drinks', name: 'المشروبات والمنعشات', timeSlot: 'all' }
            ],
            menu: [
                { id: 1, name: 'فول بالزبدة والبيض', cat: 'breakfast', price: 35, desc: 'طبق فول بلدي مع زبدة نيوزيلندي وبيض مقلي', img: '🍳', badge: 'ممتاز للإفطار', timeSlot: 'morning' },
                { id: 2, name: 'فلافل ساخنة (5 قطع)', cat: 'breakfast', price: 15, desc: 'طعمية مقرمشة محشية خلطة سرية', img: '🧆', timeSlot: 'morning' },
                { id: 3, name: 'وجبة مشاوي مشكلة', cat: 'meals', price: 180, desc: 'سيخ كفته، سيخ شيش طاووق، مع ريس وخبز وسلطات', img: '🥩', badge: 'الأكثر طلباً', timeSlot: 'all' },
                { id: 4, name: 'برجر دبل تشيز كلاسيك', cat: 'fastfood', price: 120, desc: 'قطعتين لحم بقرى صافي مع جبنة شيدر مذابة وصوص خاص', img: '🍔', timeSlot: 'all' },
                { id: 5, name: 'ساندوتش زنزر دجاج مقرمش', cat: 'fastfood', price: 95, desc: 'دجاج مقرمش حار مع صوص الثومية والخص', img: '🍗', timeSlot: 'all' },
                { id: 6, name: 'عصير مانجو فريش', cat: 'drinks', price: 40, desc: 'مانجو طبيعي 100% مثلج', img: '🧃', timeSlot: 'all' }
            ],
            cart: [],
            orders: [
                { id: 'ORD-901', type: 'طاولة #4', items: [{name: 'وجبة مشاوي مشكلة', qty: 1, price: 180}], total: 180, status: 'pending', time: 'منذ دقيقتين' },
                { id: 'ORD-902', type: 'توصيل دليفري', items: [{name: 'برجر دبل تشيز', qty: 2, price: 120}], total: 255, status: 'preparing', time: 'منذ 10 دقائق' }
            ],
            serviceAlerts: [],
            activeCategory: 'all'
        };

        // Render Engine
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (state.view === 'landing') {
                app.innerHTML = renderLandingPage();
            } else if (state.view === 'builder') {
                app.innerHTML = renderBuilderPage();
            } else if (state.view === 'storefront') {
                app.innerHTML = renderStorefrontPage();
            } else if (state.view === 'cashier') {
                app.innerHTML = renderCashierPage();
            }
        }

        // 1. Landing Page
        function renderLandingPage() {
            return `
                <div class="min-h-screen bg-slate-900 text-white">
                    <!-- Navbar -->
                    <nav class="container mx-auto px-6 py-4 flex justify-between items-center border-b border-slate-800">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center text-xl font-bold">🍽️</div>
                            <span class="text-2xl font-black tracking-wider">سُفرة <span class="text-orange-500">تك</span></span>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="state.view='builder'; render();" class="bg-orange-500 hover:bg-orange-600 px-5 py-2.5 rounded-xl font-bold transition shadow-lg shadow-orange-500/30">أنشئ مطعمك الآن 🚀</button>
                        </div>
                    </nav>

                    <!-- Hero -->
                    <section class="container mx-auto px-6 py-20 text-center max-w-4xl">
                        <span class="bg-orange-500/10 text-orange-400 text-sm font-bold px-4 py-1.5 rounded-full border border-orange-500/20 inline-block mb-6">المنصة الأولى لإنشاء منيو المطاعم الذكي</span>
                        <h1 class="text-4xl md:text-6xl font-black leading-tight mb-6">حول مطعمك إلى <span class="text-orange-500">العالم الرقمي</span> في أقل من دقيقتين!</h1>
                        <p class="text-slate-400 text-lg mb-10">منيو رقمي متكامل، استقبال طلبات سريعة، لوحة تحكم للكاشير مع تنبيه صوتي، وباركود للطاولات. بدون خبرة برمجية!</p>
                        <div class="flex justify-center gap-4 flex-wrap">
                            <button onclick="state.view='builder'; render();" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-8 py-4 rounded-2xl text-lg shadow-xl shadow-orange-500/30 transition">ابدأ مجاناً الآن</button>
                            <button onclick="state.view='storefront'; state.restaurant.tableNo='4'; render();" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-8 py-4 rounded-2xl text-lg border border-slate-700 transition">شاهد نموذج تجريبي (Demo)</button>
                        </div>
                    </section>
                </div>
            `;
        }

        // 2. Builder Page (Onboarding Wizard)
        function renderBuilderPage() {
            return `
                <div class="min-h-screen bg-slate-100 py-10 px-4">
                    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl p-8 border border-slate-200">
                        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                            <h2 class="text-2xl font-black text-slate-800">🛠️ إعداد وتخصيص مطعمك</h2>
                            <button onclick="state.view='landing'; render();" class="text-slate-400 hover:text-slate-600 font-bold"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>

                        <div class="space-y-6">
                            <div>
                                <label class="block font-bold text-slate-700 mb-2">اسم المطعم</label>
                                <input type="text" id="b_name" value="${state.restaurant.name}" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-orange-500 outline-none font-semibold">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-2">وصف قصير أو شعار</label>
                                <input type="text" id="b_tag" value="${state.restaurant.taglet}" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-orange-500 outline-none">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-2">رمز تعبيري (أيقونة المطعم)</label>
                                    <input type="text" id="b_logo" value="${state.restaurant.logo}" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-center text-2xl outline-none">
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-2">لون الهوية البصرية</label>
                                    <select id="b_color" class="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none font-semibold">
                                        <option value="#f97316" ${state.restaurant.themeColor==='#f97316'?'selected':''}>برتقالي عصري</option>
                                        <option value="#ef4444" ${state.restaurant.themeColor==='#ef4444'?'selected':''}>أحمر مطاعم</option>
                                        <option value="#10b981" ${state.restaurant.themeColor==='#10b981'?'selected':''}>أخضر طبيعي</option>
                                        <option value="#3b82f6" ${state.restaurant.themeColor==='#3b82f6'?'selected':''}>أزرق كافيه</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-2">اختر استايل عرض الموقع</label>
                                <select id="b_style" class="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none font-semibold">
                                    <option value="modern" ${state.restaurant.style==='modern'?'selected':''}>الاستايل العصرى الداكن (Dark Modern)</option>
                                    <option value="classic" ${state.restaurant.style==='classic'?'selected':''}>الاستايل الدافئ (Warm Classic)</option>
                                    <option value="minimal" ${state.restaurant.style==='minimal'?'selected':''}>الاستايل المشرق (Minimal Clean)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-2">رقم الواتساب لاستقبال الطلبات</label>
                                <input type="text" id="b_whatsapp" value="${state.restaurant.whatsapp}" class="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none font-semibold">
                            </div>

                            <button onclick="saveBuilderData()" class="w-full py-4 rounded-xl text-white font-black text-lg shadow-lg transition" style="background-color: ${state.restaurant.themeColor}">إطلاق موقع المطعم الآن 🚀</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveBuilderData() {
            state.restaurant.name = document.getElementById('b_name').value;
            state.restaurant.taglet = document.getElementById('b_tag').value;
            state.restaurant.logo = document.getElementById('b_logo').value;
            state.restaurant.themeColor = document.getElementById('b_color').value;
            state.restaurant.style = document.getElementById('b_style').value;
            state.restaurant.whatsapp = document.getElementById('b_whatsapp').value;
            state.view = 'storefront';
            render();
        }

        // 3. Storefront (Customer Menu)
        function renderStorefrontPage() {
            const filteredMenu = state.activeCategory === 'all' 
                ? state.menu 
                : state.menu.filter(i => i.cat === state.activeCategory);

            return `
                <div class="min-h-screen pb-28" style="background-color: ${state.restaurant.style==='modern'?'#0f172a':'#f8fafc'}; color: ${state.restaurant.style==='modern'?'#f8fafc':'#1e293b'}">
                    <!-- Top Header -->
                    <header class="p-6 text-center border-b border-slate-700/20 relative shadow-sm">
                        <div class="absolute top-4 left-4 flex gap-2">
                            <button onclick="state.view='cashier'; render();" class="bg-slate-800 text-white text-xs px-3 py-2 rounded-xl font-bold shadow"><i class="fa-solid fa-cash-register ml-1"></i> الكاشير</button>
                            <button onclick="state.view='builder'; render();" class="bg-slate-700 text-white text-xs px-3 py-2 rounded-xl font-bold shadow"><i class="fa-solid fa-gear"></i></button>
                        </div>
                        <div class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-3xl shadow-md mb-3" style="background-color: ${state.restaurant.themeColor}20; color: ${state.restaurant.themeColor}">${state.restaurant.logo}</div>
                        <h1 class="text-2xl font-black">${state.restaurant.name}</h1>
                        <p class="text-sm opacity-75 mt-1">${state.restaurant.taglet}</p>
                        
                        ${state.restaurant.tableNo ? `
                            <div class="mt-3 inline-block bg-orange-500/10 text-orange-500 font-bold px-4 py-1.5 rounded-full text-sm border border-orange-500/20">
                                📍 أنت تجلس على الطاولة رقم #${state.restaurant.tableNo}
                            </div>
                        ` : ''}
                    </header>

                    <!-- Table Service Quick Actions -->
                    ${state.restaurant.tableNo ? `
                        <div class="container mx-auto px-4 mt-4">
                            <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-4 flex justify-between items-center">
                                <div>
                                    <h4 class="font-bold text-amber-600 text-sm">تحتاج مساعدة على الطاولة؟</h4>
                                    <p class="text-xs text-slate-500">اطلب الويتر أو الفاتورة بضغطة زر واحدة</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="callWaiter('نداء الويتر للطاولة #${state.restaurant.tableNo}')" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-3 py-2 rounded-xl font-bold shadow">🔔 نداء الويتر</button>
                                    <button onclick="callWaiter('طلب الحساب / الفاتورة للطاولة #${state.restaurant.tableNo}')" class="bg-slate-800 text-white text-xs px-3 py-2 rounded-xl font-bold shadow">🧾 طلب الفاتورة</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Categories Bar -->
                    <div class="container mx-auto px-4 mt-6">
                        <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-2">
                            ${state.categories.map(cat => `
                                <button onclick="state.activeCategory='${cat.id}'; render();" class="px-5 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition ${state.activeCategory === cat.id ? 'text-white shadow-md' : 'bg-slate-200/50 opacity-75'}" style="background-color: ${state.activeCategory === cat.id ? state.restaurant.themeColor : ''}">
                                    ${cat.name}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Menu Grid -->
                    <div class="container mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${filteredMenu.map(item => `
                            <div class="p-4 rounded-2xl border shadow-sm flex items-center gap-4 transition hover:shadow-md" style="background-color: ${state.restaurant.style==='modern'?'#1e293b':'#ffffff'}; border-color: ${state.restaurant.style==='modern'?'#334155':'#e2e8f0'}">
                                <div class="w-20 h-20 rounded-2xl flex items-center justify-center text-3xl bg-slate-100 flex-shrink-0">${item.img}</div>
                                <div class="flex-1">
                                    <div class="flex justify-between items-start">
                                        <h3 class="font-bold text-base">${item.name}</h3>
                                        <span class="font-black text-orange-500">${item.price} ج.م</span>
                                    </div>
                                    <p class="text-xs opacity-70 mt-1 line-clamp-2">${item.desc}</p>
                                    <button onclick="addToCart(${item.id})" class="mt-3 w-full py-2 rounded-xl text-xs font-bold text-white shadow transition" style="background-color: ${state.restaurant.themeColor}">إضافة للسلة 🛒</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Floating Cart Bar -->
                    ${state.cart.length > 0 ? `
                        <div class="fixed bottom-4 left-4 right-4 max-w-lg mx-auto bg-slate-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center border border-slate-700 animate-bounce">
                            <div>
                                <span class="text-xs text-orange-400 font-bold">${state.cart.reduce((a,b)=>a+b.qty,0)} أصناف في السلة</span>
                                <h4 class="font-black text-lg">${state.cart.reduce((a,b)=>a+(b.price*b.qty),0)} ج.م</h4>
                            </div>
                            <button onclick="openCheckoutModal()" class="bg-orange-500 hover:bg-orange-600 px-6 py-3 rounded-xl font-bold text-sm shadow-lg">إتمام الطلب 🚀</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addToCart(id) {
            const item = state.menu.find(i => i.id === id);
            const existing = state.cart.find(i => i.id === id);
            if (existing) {
                existing.qty++;
            } else {
                state.cart.push({...item, qty: 1});
            }
            render();
        }

        function callWaiter(msg) {
            alert('✅ تم إرسال النداء بنجاح إلى الكاشير وسيقوم الويتر بخدمتك فوراً!');
            state.serviceAlerts.push({ text: msg, time: 'الآن' });
        }

        function openCheckoutModal() {
            const total = state.cart.reduce((a,b)=>a+(b.price*b.qty),0);
            const name = prompt('أدخل اسمك الكريم:', 'محمد علي');
            if (!name) return;
            const phone = prompt('رقم الهاتف للتواصل:', '01015861991');
            if (!phone) return;

            const newOrder = {
                id: 'ORD-' + Math.floor(100+Math.random()*900),
                type: state.restaurant.tableNo ? `طاولة #${state.restaurant.tableNo}` : 'توصيل دليفري',
                customer: name,
                phone: phone,
                items: [...state.cart],
                total: total + (state.restaurant.tableNo ? 0 : state.restaurant.deliveryFee),
                status: 'pending',
                time: 'الآن'
            };

            state.orders.unshift(newOrder);
            state.cart = [];
            alert('🎉 تم إرسال طلبك بنجاح! سيظهر عند الكاشير فوراً.');
            render();
        }

        // 4. Cashier & Dashboard
        let cashierTab = 'orders'; // orders, menu, qr, stats

        function renderCashierPage() {
            return `
                <div class="min-h-screen bg-slate-900 text-white flex flex-col md:flex-row">
                    <!-- Sidebar -->
                    <div class="w-full md:w-64 bg-slate-800 p-6 flex flex-col justify-between border-b md:border-b-0 md:border-l border-slate-700">
                        <div>
                            <div class="flex items-center gap-3 mb-8">
                                <span class="text-2xl">🖥️</span>
                                <div>
                                    <h2 class="font-black text-sm">لوحة تحكم الكاشير</h2>
                                    <span class="text-xs text-orange-400">${state.restaurant.name}</span>
                                </div>
                            </div>
                            <nav class="space-y-2">
                                <button onclick="cashierTab='orders'; render();" class="w-full text-right px-4 py-3 rounded-xl font-bold text-sm transition ${cashierTab==='orders'?'bg-orange-500 text-white':'text-slate-400 hover:bg-slate-700'}">📥 الطلبات الواردة (${state.orders.length})</button>
                                <button onclick="cashierTab='menu'; render();" class="w-full text-right px-4 py-3 rounded-xl font-bold text-sm transition ${cashierTab==='menu'?'bg-orange-500 text-white':'text-slate-400 hover:bg-slate-700'}">🍔 إدارة المنيو والأصناف</button>
                                <button onclick="cashierTab='qr'; render();" class="w-full text-right px-4 py-3 rounded-xl font-bold text-sm transition ${cashierTab==='qr'?'bg-orange-500 text-white':'text-slate-400 hover:bg-slate-700'}">📱 باركود الطاولات (QR)</button>
                                <button onclick="cashierTab='stats'; render();" class="w-full text-right px-4 py-3 rounded-xl font-bold text-sm transition ${cashierTab==='stats'?'bg-orange-500 text-white':'text-slate-400 hover:bg-slate-700'}">📊 تقارير المبيعات</button>
                            </nav>
                        </div>
                        <div>
                            <button onclick="state.view='storefront'; render();" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold text-sm transition mb-2">👁️ معاينة المنيو</button>
                            <button onclick="state.view='landing'; render();" class="w-full text-red-400 hover:bg-red-500/10 py-2 rounded-xl font-bold text-xs transition">خروج من النظام</button>
                        </div>
                    </div>

                    <!-- Main Content Area -->
                    <div class="flex-1 p-6 overflow-y-auto">
                        ${cashierTab === 'orders' ? renderCashierOrders() : ''}
                        ${cashierTab === 'menu' ? renderCashierMenu() : ''}
                        ${cashierTab === 'qr' ? renderCashierQR() : ''}
                        ${cashierTab === 'stats' ? renderCashierStats() : ''}
                    </div>
                </div>
            `;
        }

        function renderCashierOrders() {
            return `
                <div>
                    <h2 class="text-xl font-black mb-6">📥 الطلبات الحية والواردة</h2>
                    <div class="space-y-4">
                        ${state.orders.map(order => `
                            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <div class="flex items-center gap-3 mb-2">
                                        <span class="font-black text-orange-400">${order.id}</span>
                                        <span class="bg-slate-700 px-3 py-1 rounded-full text-xs font-bold">${order.type}</span>
                                        <span class="text-xs text-slate-400">${order.time}</span>
                                    </div>
                                    <p class="text-sm font-bold text-slate-200">العميل: ${order.customer || 'زائر'} (${order.phone || 'بدون رقم'})</p>
                                    <ul class="text-xs text-slate-400 mt-2 space-y-1">
                                        ${order.items.map(i => `<li>- ${i.qty}x ${i.name} (${i.price * i.qty} ج.م)</li>`).join('')}
                                    </ul>
                                </div>
                                <div class="text-left w-full md:w-auto">
                                    <div class="text-lg font-black text-orange-400 mb-3">${order.total} ج.م</div>
                                    <div class="flex gap-2">
                                        <button onclick="printReceipt('${order.id}')" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold">🖨️ طباعة</button>
                                        <button onclick="alert('✅ تم قبول الطلب وبدء التحضير!')" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-xl text-xs font-bold">قبول الطلب</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCashierMenu() {
            return `
                <div>
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-black">🍔 إدارة الأصناف والأسعار</h2>
                        <button onclick="addNewDish()" class="bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded-xl text-xs font-bold">➕ إضافة صنف جديد</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${state.menu.map(item => `
                            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <span class="text-3xl">${item.img}</span>
                                    <div>
                                        <h4 class="font-bold">${item.name}</h4>
                                        <span class="text-xs text-orange-400">${item.price} ج.م</span>
                                    </div>
                                </div>
                                <button onclick="deleteDish(${item.id})" class="text-red-400 hover:bg-red-500/10 p-2 rounded-lg text-xs font-bold">حذف</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function addNewDish() {
            const name = prompt('اسم الصنف الجديد:');
            if(!name) return;
            const price = Number(prompt('سعر الصنف (بالجنيه):', '50'));
            state.menu.push({ id: Date.now(), name: name, cat: 'meals', price: price, desc: 'صنف طازج ولذيذ', img: '🍲', timeSlot: 'all' });
            render();
        }

        function deleteDish(id) {
            state.menu = state.menu.filter(i => i.id !== id);
            render();
        }

        function renderCashierQR() {
            return `
                <div>
                    <h2 class="text-xl font-black mb-6">📱 مولد باركود الطاولات (QR Code)</h2>
                    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 max-w-md">
                        <label class="block font-bold text-sm mb-2">أدخل رقم الطاولة</label>
                        <input type="number" id="qr_table_input" value="1" class="w-full bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl mb-4 text-white font-bold outline-none">
                        <button onclick="generateTableQR()" class="w-full bg-orange-500 hover:bg-orange-600 py-3 rounded-xl font-bold text-sm shadow">توليد ورابط الطاولة 🔗</button>
                    </div>
                </div>
            `;
        }

        function generateTableQR() {
            const num = document.getElementById('qr_table_input').value;
            state.restaurant.tableNo = num;
            state.view = 'storefront';
            render();
        }

        function renderCashierStats() {
            return `
                <div>
                    <h2 class="text-xl font-black mb-6">📊 تقارير الأداء والمبيعات</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400">إجمالي مبيعات اليوم</span>
                            <h3 class="text-3xl font-black text-orange-400 mt-2">1,450 ج.م</h3>
                        </div>
                        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400">عدد الطلبات المنفذة</span>
                            <h3 class="text-3xl font-black text-emerald-400 mt-2">24 طلب</h3>
                        </div>
                        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                            <span class="text-xs text-slate-400">الطاولات النشطة الآن</span>
                            <h3 class="text-3xl font-black text-blue-400 mt-2">6 طاولات</h3>
                        </div>
                    </div>
                </div>
            `;
        }

        function printReceipt(id) {
            alert('🖨️ جاري إرسال الفاتورة للطابعة الحرارية (80mm)...');
        }

        // Initialize App
        render();
    </script>
</body>
</html>
